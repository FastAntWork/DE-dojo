id: sql.aggregates
title: "SQL: агрегация и группировка"
track: sql
level: 2
phase: 1
estimated_hours: 5
prereq: [sql.core.select]
job_tags: [sql, postgresql, analytics]

objectives:
  - "Объяснить разницу между WHERE и HAVING через порядок вычисления запроса"
  - "Предсказать, как агрегатные функции обходятся с NULL, и почему COUNT(*) не равен COUNT(колонка)"
  - "Собрать условную агрегацию через FILTER или CASE и выбрать между ними осознанно"
  - "Развернуть итоги по нескольким уровням через GROUPING SETS, ROLLUP или CUBE"

theory:
  read: theory/sql/sql.aggregates.md
  rag_scope: [postgres-docs]

tasks:
  - type: quiz
    file: quizzes/sql.aggregates.yaml
    difficulty: 0.35

  - type: sql
    file: sql/sql.aggregates.yaml
    dataset: shop
    difficulty: 0.4

review_after_days: [1, 4, 12, 30]
