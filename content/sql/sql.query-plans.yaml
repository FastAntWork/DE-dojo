# Задачи к узлу sql.query-plans на большом датасете.
#
# Здесь впервые проверяется не только результат, но и способ его получения:
# max_seq_scans задаёт потолок последовательных сканов в плане. Правильный
# ответ, полученный полным перебором, на проде правильным не является.
#
# Ограничение ставится только там, где индексный доступ действительно
# уместен. Там, где Seq Scan — верный выбор планировщика, ограничения нет:
# требовать индекс всегда означало бы учить неправильному.

dataset: shop-big

tasks:
  - id: plans-orders-by-customer
    title: "Заказы одного клиента"
    prompt: |
      Выведи id и дату заказов клиента с id = 1234, отсортированные по дате
      по возрастанию.
      Колонки: id, created_at. Порядок важен.

      Запрос обязан использовать индекс: последовательный скан недопустим.
    solution: |
      SELECT id, created_at
      FROM orders
      WHERE customer_id = 1234
      ORDER BY created_at
    ordered: true
    max_seq_scans: 0
    hint: |
      На 300 тысячах заказов у одного клиента их единицы — планировщик выберет
      индекс сам, если условие записано прямо по колонке.

  - id: plans-sargable-date
    title: "Заказы за один день"
    prompt: |
      Выведи id заказов, созданных 15 марта 2024 года.
      Колонка: id. Порядок не важен.

      Индекс по created_at должен сработать. Учти: если обернуть колонку в
      функцию, обычный индекс использовать не получится.
    solution: |
      SELECT id
      FROM orders
      WHERE created_at >= TIMESTAMPTZ '2024-03-15'
        AND created_at <  TIMESTAMPTZ '2024-03-16'
    ordered: false
    max_seq_scans: 0
    hint: |
      date(created_at) = '2024-03-15' даст верный ответ, но убьёт индекс:
      условие перестаёт быть sargable. Нужен полуинтервал по самой колонке.

  - id: plans-customers-without-city
    title: "Клиенты без города"
    prompt: |
      Выведи id и имя клиентов, у которых не заполнен город.
      Колонки: id, name. Порядок не важен.

      Таких клиентов немного, поэтому индексный доступ уместен.
    solution: |
      SELECT id, name
      FROM customers
      WHERE city IS NULL
    ordered: false
    max_seq_scans: 0
    hint: "B-tree индексирует и NULL, поэтому IS NULL может пользоваться индексом."

  - id: plans-top-products
    title: "Пятёрка товаров по выручке"
    prompt: |
      Выведи пять товаров с наибольшей выручкой по оплаченным заказам.
      Выручка — сумма quantity * price по позициям.
      Колонки: title, revenue. Порядок важен: по убыванию выручки.

      Здесь последовательный скан — нормальный выбор планировщика,
      посмотри в EXPLAIN почему.
    solution: |
      SELECT p.title,
             sum(oi.quantity * oi.price) AS revenue
      FROM order_items oi
      JOIN orders o   ON o.id = oi.order_id
      JOIN products p ON p.id = oi.product_id
      WHERE o.status = 'paid'
      GROUP BY p.id, p.title
      ORDER BY revenue DESC
      LIMIT 5
    ordered: true
    hint: |
      Агрегат считается по большей части таблицы — читать её целиком дешевле,
      чем ходить по индексу за каждой строкой.

  - id: plans-orders-by-status
    title: "Распределение заказов по статусам"
    prompt: |
      Посчитай количество заказов в каждом статусе.
      Колонки: status, orders. Порядок важен: по убыванию количества.
    solution: |
      SELECT status, count(*) AS orders
      FROM orders
      GROUP BY status
      ORDER BY orders DESC
    ordered: true
    hint: "Индекс тут не поможет: нужны все строки таблицы."
