hints:
  - level: 1
    penalty: 0.1
    text: >-
      Проверка возвращает ПЛОХИЕ строки, а не хорошие. Начни с самых простых:
      дубликаты ключа находятся группировкой с HAVING count(*) > 1, пропуски —
      условием IS NULL, выход за диапазон — сравнением. Проверь каждую вручную
      на чистых данных: она обязана вернуть ноль строк.

  - level: 2
    penalty: 0.2
    text: >-
      Битая ссылка ищется антисоединением: LEFT JOIN на справочник и условие,
      что соответствия не нашлось. Осторожно с NULL в ключе — строка с пустым
      customer_id тоже не найдёт клиента, и одна проверка начнёт ловить два
      разных дефекта. Это допустимо, но лучше разделять.

  - level: 3
    penalty: 0.35
    text: >-
      Устаревание проверяется не по строкам, а по агрегату: сравни
      max(created_at) с now() и верни строку, если разрыв больше допустимого.
      Запрос вида SELECT max(created_at) FROM orders HAVING max(created_at) <
      now() - interval '2 days' вернёт одну строку при проблеме и ноль при
      норме.
