hints:
  - level: 1
    penalty: 0.1
    text: >-
      Посмотри одного клиента целиком, отсортировав по valid_from. Задай себе
      вопрос: если единственное, чему можно верить, — это даты начала версий,
      то чему обязан равняться valid_to каждой версии? Ответ подскажет, какой
      оконной функцией это считается.

  - level: 2
    penalty: 0.2
    text: >-
      Интервал полуоткрытый: [valid_from, valid_to). Значит valid_to
      предыдущей версии равен valid_from следующей РОВНО, без минус одного дня.
      Вычитание дня было бы верно для закрытого интервала — и как раз оно даёт
      разрывы, в которые проваливаются события.

  - level: 3
    penalty: 0.35
    text: >-
      Одним запросом: посчитать lead(valid_from) OVER (PARTITION BY customer_id
      ORDER BY valid_from) в подзапросе, затем UPDATE ... FROM по version_id,
      выставив valid_to в это значение, а is_current — в результат проверки
      «следующей версии нет». Проверь, что обновились все строки, а не только
      часть.
