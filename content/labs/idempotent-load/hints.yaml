# Подсказки не называют причину: они указывают, куда смотреть. Каждая стоит
# баллов, иначе её берут не задумываясь.

hints:
  - level: 1
    penalty: 0.1
    text: >-
      Посмотри текст процедуры целиком: \sf load_day в psql. Затем вызови её
      дважды за один день и сравни витрину до и после второго вызова. Дальше
      задай себе вопрос: что процедура делает с уже существующей строкой за
      этот день — удаляет, обновляет или не замечает?

  - level: 2
    penalty: 0.2
    text: >-
      Идемпотентность и правильность — разные свойства. Процедура, которая при
      повторе не делает НИЧЕГО, идемпотентна и при этом неверна: источник
      дописывает строки задним числом, и они должны попасть в витрину при
      следующем запуске. Проверь оба свойства отдельно.

  - level: 3
    penalty: 0.35
    text: >-
      Рабочих способов три: удалить строки периода и вставить заново в одной
      транзакции; слить по ключу через ON CONFLICT DO UPDATE; подменить секцию
      целиком. Первые два требуют, чтобы граница периода бралась из ПАРАМЕТРА
      процедуры, а не из текущей даты. Второй требует уникального индекса по
      дню.
