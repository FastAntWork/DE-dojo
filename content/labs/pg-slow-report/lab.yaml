# Тип стенда и число вариантов поломки.
#
# shared-postgres — лабе выделяется отдельная БАЗА в уже поднятом экземпляре.
# Свой контейнер PostgreSQL рядом с рабочим стоил бы гигабайт памяти при
# бюджете в десять, а изоляции добавил бы немного: база и так своя, и она
# пересоздаётся при каждом запуске.
#
# compose понадобится для Kafka и ClickHouse, где своё окружение действительно
# необходимо.

stand: shared-postgres
variants: 3
