# Три уровня подсказок. Каждая стоит баллов — иначе она бесплатна, и брать её
# будут не задумываясь.
#
# Подсказки одинаковы для всех вариантов и намеренно не называют причину: они
# указывают, куда смотреть, а вывод человек делает сам. Подсказка, дающая
# готовый ответ, отменяет задачу целиком.

hints:
  - level: 1
    penalty: 0.1
    text: >-
      Начни с EXPLAIN (ANALYZE, BUFFERS) для запроса из брифа. Сравни две вещи:
      сколько строк планировщик ОЖИДАЛ получить и сколько получил на самом деле.
      Расхождение в разы говорит не о том же, о чём их совпадение. И отдельно
      посмотри на строку Buffers у узла, который читает events: план может
      называться индексным и всё равно перебирать всю таблицу.

  - level: 2
    penalty: 0.2
    text: >-
      Посмотри, какие индексы есть на таблице и ПО КАКИМ колонкам:
      \d events в psql или запрос к pg_indexes. Отдельно посмотри строку
      таблицы в pg_stat_user_tables — колонки last_analyze, last_autoanalyze
      и n_dead_tup. Каждая из трёх колонок отвечает на свой вопрос.

  - level: 3
    penalty: 0.35
    text: >-
      Чтобы отчёт читал мало страниц, должны сойтись три условия: индекс
      покрывает колонки фильтра в подходящем порядке (равенство раньше
      диапазона), статистика отражает реальное распределение значений, и в
      таблице нет горы мёртвых строк, через которые приходится продираться к
      живым. Сломано может быть любое — проверь все три, а не первое попавшееся.
