hints:
  - level: 1
    penalty: 0.1
    text: >-
      Выпиши колонки, которые нужны запросу: не только те, что в WHERE, но и
      те, что в SELECT и GROUP BY. Index Only Scan возможен, только когда ВСЕ
      они есть в индексе. Посмотри, чего не хватает в существующих индексах —
      или есть ли они вообще.

  - level: 2
    penalty: 0.2
    text: >-
      Колонки, нужные только для выдачи, не обязаны участвовать в поиске. Для
      них есть INCLUDE: они кладутся в индекс, не увеличивая ключ и не влияя на
      порядок. Ключ при этом строится по обычному правилу — равенство раньше
      диапазона.

  - level: 3
    penalty: 0.35
    text: >-
      Если индекс уже содержит все нужные колонки, а плана всё равно нет — дело
      не в индексе. Index Only Scan пропускает таблицу только там, где карта
      видимости говорит, что страница видна всем транзакциям; при пустой карте
      планировщик считает такой план дороже обычного и отказывается от него.
      Заполняет карту VACUUM. Посмотри в pg_stat_user_tables, когда он
      выполнялся по этой таблице и включена ли на ней автоочистка.
