hints:
  - level: 1
    penalty: 0.1
    text: >-
      Начни с вопроса, ради чего секционирование затевается здесь. Симптомов
      два — долгая чистка истории и медленный месячный отчёт, — и оба про
      время. Значит, ключ секционирования один, и он же определяет, по какому
      признаку данные должны лежать раздельно.

  - level: 2
    penalty: 0.2
    text: >-
      Секционировать существующую таблицу на месте нельзя: PARTITION BY
      задаётся при создании. Значит, создать новую секционированную, завести в
      ней секции на каждый месяц, перенести данные и переименовать. Проверь
      после переноса число строк — это ровно то место, где их теряют.

  - level: 3
    penalty: 0.35
    text: >-
      Границы диапазона задаются включая нижнюю и НЕ включая верхнюю:
      FROM ('2026-02-01') TO ('2026-03-01'). Если в исходной таблице есть
      секция DEFAULT со строками, подходящими под новый диапазон, присоединить
      секцию не выйдет, пока эти строки оттуда не убрать — PostgreSQL обязан
      убедиться, что они не должны были лежать в новой секции.
