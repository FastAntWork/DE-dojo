questions:
  - id: spark-lazy-when-computed
    kind: single
    prompt: |
      ```python
      df = spark.read.parquet(path)
      df = df.filter(F.col("amount") > 0)
      df = df.withColumn("day", F.to_date("created_at"))
      df.write.parquet(out)
      ```
      В какой строке начинается реальное вычисление?
    options:
      - text: "В последней: чтение, фильтр и добавление колонки — трансформации, работу запускает действие write"
        correct: true
      - text: "В первой: read сразу читает файлы"
      - text: "Во второй: filter обязан просмотреть данные"
      - text: "В каждой по очереди, по мере выполнения строк"
    explanation: |
      Трансформации только строят план. Собрав его целиком, Spark оптимизирует
      всё вместе: проталкивает фильтр к чтению, отбрасывает лишние колонки,
      объединяет операции в одну стадию.

  - id: spark-error-location
    kind: single
    prompt: |
      В выражении `filter` допущена ошибка, но трассировка указывает на строку
      с `write` двадцатью строками ниже. Почему?
    options:
      - text: "Из-за ленивости: трансформация только записана в план, а исполняется он при действии — там ошибка и всплывает"
        correct: true
      - text: "Spark всегда указывает последнюю строку файла"
      - text: "Ошибка на самом деле в write"
      - text: "Трассировка повреждена, надо включить подробный режим"
    explanation: |
      Это одно из главных практических следствий ленивости и частая причина
      растерянности новичка. Искать надо не там, куда показывает трассировка, а
      в цепочке трансформаций до действия.

  - id: spark-collect-danger
    kind: single
    prompt: |
      `df.collect()` на датасете в 200 ГБ. Что произойдёт?
    options:
      - text: "Все данные поедут в память драйвера, и приложение упадёт с OutOfMemory — падает именно драйвер"
        correct: true
      - text: "Данные распределятся по исполнителям, всё отработает"
      - text: "Spark автоматически сохранит результат на диск"
      - text: "Вернутся первые 1000 строк"
    explanation: |
      Драйвер — обычный процесс с обычной памятью. Для просмотра есть show(20) и
      take(5), для выгрузки — запись в хранилище. Та же ловушка мягче у
      toPandas().

  - id: spark-driver-role
    kind: single
    prompt: |
      Что делает драйвер?
    options:
      - text: "Исполняет ваш код, строит план, дробит его на задачи и раздаёт исполнителям"
        correct: true
      - text: "Обрабатывает партиции данных наравне с исполнителями"
      - text: "Хранит все данные приложения"
      - text: "Управляет файловой системой кластера"
    explanation: |
      Данные живут у исполнителей, распределённые по партициям. Всё, что
      попадает на драйвер, попадает туда явно — через collect, take, toPandas
      или сбор агрегата.

  - id: spark-recompute
    kind: single
    prompt: |
      ```python
      df = spark.read.parquet(path).filter(...)
      print(df.count())
      print(df.count())
      ```
      Сколько раз будут прочитаны файлы?
    options:
      - text: "Дважды: каждое действие пересчитывает всю цепочку заново"
        correct: true
      - text: "Один раз: Spark кеширует результат автоматически"
      - text: "Один раз, потому что count не требует чтения данных"
      - text: "Ни разу: count берётся из метаданных Parquet"
    explanation: |
      Автоматического кеширования нет. Именно для этого случая существует
      cache(): он имеет смысл ровно тогда, когда датафрейм читается несколько
      раз.

  - id: spark-narrow-vs-wide
    kind: multiple
    prompt: |
      Какие операции являются широкими (требуют shuffle)?
    options:
      - text: "groupBy с агрегацией"
        correct: true
      - text: "join двух больших таблиц"
        correct: true
      - text: "distinct"
        correct: true
      - text: "filter по значению колонки"
    explanation: |
      Узкая трансформация — та, где выходная партиция зависит ровно от одной
      входной: filter, select, withColumn. Широкая требует перераспределения
      данных между узлами, то есть передачи по сети.

  - id: spark-shuffle-cost
    kind: single
    prompt: |
      Почему shuffle — самая дорогая операция в Spark?
    options:
      - text: "Промежуточные данные пишутся на диск, передаются по сети и читаются на другой стороне"
        correct: true
      - text: "Он выполняется на драйвере"
      - text: "Он всегда однопоточный"
      - text: "Он блокирует запись в хранилище"
    explanation: |
      Оптимизация Spark в подавляющем большинстве случаев сводится к тому,
      чтобы shuffle стало меньше или он стал дешевле.

  - id: spark-stage-boundary
    kind: single
    prompt: |
      Что такое стадия (stage) в Spark?
    options:
      - text: "Участок плана между двумя shuffle: внутри стадии данные не перераспределяются между узлами"
        correct: true
      - text: "Один запуск приложения"
      - text: "Обработка одной партиции"
      - text: "Одна трансформация в коде"
    explanation: |
      Поэтому число стадий в интерфейсе — быстрая оценка того, сколько раз
      данные перетасовывались. Обработка одной партиции — это задача (task), а
      не стадия.

  - id: spark-explain-exchange
    kind: single
    prompt: |
      В физическом плане встретился узел `Exchange hashpartitioning(user_id, 200)`.
      Что это значит?
    options:
      - text: "Здесь происходит shuffle: данные перераспределяются по хешу user_id на 200 партиций"
        correct: true
      - text: "Здесь читается файл с 200 партициями"
      - text: "Здесь применяется broadcast маленькой таблицы"
      - text: "Здесь Spark кеширует промежуточный результат"
    explanation: |
      Exchange — прямое указание на обмен данными между узлами. Каждое такое
      слово в плане стоит денег, и с него начинают разбор медленной джобы.

  - id: spark-pushed-filters
    kind: single
    prompt: |
      В плане `FileScan parquet ... PushedFilters: []`, хотя в коде есть
      фильтр по дате. О чём это говорит?
    options:
      - text: "Фильтр не дошёл до чтения — читается больше данных, чем нужно; стоит разобраться, что мешает"
        correct: true
      - text: "Всё в порядке: PushedFilters всегда пуст для Parquet"
      - text: "Фильтр применён дважды"
      - text: "Файлы повреждены"
    explanation: |
      Пустой список означает, что условие применяется уже после чтения. Мешать
      могут UDF в условии, сложные выражения или фильтр по колонке, полученной
      вычислением после чтения.

  - id: spark-read-schema
    kind: single
    prompt: |
      В плане `ReadSchema: struct<id,name,email,phone,...40 колонок>`, а
      запросу нужны две. Что это означает?
    options:
      - text: "Проекция колонок не сработала: читается вся ширина таблицы вместо двух колонок"
        correct: true
      - text: "Это нормально: Parquet всегда читает все колонки"
      - text: "Схема выведена неверно, нужен inferSchema"
      - text: "Так отображается схема файла, а не читаемых данных"
    explanation: |
      Главное преимущество колоночного формата — читать только нужное. Обычная
      причина потери проекции — select('*') где-то в цепочке или обращение ко
      всем колонкам в UDF.

  - id: spark-join-types
    kind: single
    prompt: |
      В плане `BroadcastHashJoin`. Что это значит?
    options:
      - text: "Одна из сторон достаточно мала и разослана целиком всем исполнителям, поэтому shuffle большой таблицы не нужен"
        correct: true
      - text: "Обе таблицы перетасованы по ключу соединения"
      - text: "Соединение выполняется на драйвере"
      - text: "Соединение идёт вложенными циклами"
    explanation: |
      Это самый дешёвый способ соединения, когда он применим. Обе большие
      стороны дают SortMergeJoin с двумя shuffle, а BroadcastNestedLoopJoin
      обычно означает соединение без условия равенства и почти всегда беду.

  - id: spark-aqe
    kind: single
    prompt: |
      Что делает Adaptive Query Execution?
    options:
      - text: "Меняет план по ходу выполнения, опираясь на фактические размеры данных: схлопывает лишние партиции, переключает join на broadcast, разбивает перекошенные партиции"
        correct: true
      - text: "Кеширует планы запросов между приложениями"
      - text: "Автоматически кеширует часто читаемые датафреймы"
      - text: "Подбирает число исполнителей под нагрузку"
    explanation: |
      Из-за AQE план в интерфейсе может отличаться от того, что показал explain
      до запуска. Это не ошибка, а именно адаптация к фактическим данным.

  - id: spark-partition-size
    kind: single
    prompt: |
      Какой ориентир по размеру партиции разумен?
    options:
      - text: "128–256 МБ, а число партиций кратно числу ядер кластера"
        correct: true
      - text: "1–2 МБ: чем мельче, тем лучше параллелизм"
      - text: "10–20 ГБ: меньше партиций — меньше накладных расходов"
      - text: "Ровно одна партиция на исполнителя"
    explanation: |
      Слишком мелкие партиции дают накладные расходы на задачу больше полезной
      работы. Слишком крупные не влезают в память и не дают распараллелить.

  - id: spark-repartition-vs-coalesce
    kind: single
    prompt: |
      Чем `coalesce(10)` отличается от `repartition(10)`?
    options:
      - text: "coalesce уменьшает число партиций без shuffle, склеивая соседние, но распределение может выйти неравномерным; repartition всегда делает shuffle и распределяет ровно"
        correct: true
      - text: "coalesce работает только на RDD"
      - text: "repartition умеет только увеличивать число партиций"
      - text: "Разницы нет, это синонимы"
    explanation: |
      coalesce дешевле, поэтому его берут перед записью. repartition дороже, но
      честнее распределяет — и умеет по колонке.

  - id: spark-coalesce-one-trap
    kind: single
    prompt: |
      Перед записью поставили `coalesce(1)`, чтобы получить один файл. Тяжёлые
      вычисления идут выше по цепочке. Что произойдёт?
    options:
      - text: "Уменьшение числа партиций распространится вверх, и вся обработка сведётся к одному ядру"
        correct: true
      - text: "Обработка останется параллельной, склеятся только выходные файлы"
      - text: "Spark выдаст ошибку о недостаточном параллелизме"
      - text: "Появится shuffle, и всё отработает быстро"
    explanation: |
      Ровно за этим и нужна разница: repartition(1) поставит shuffle и сохранит
      параллелизм до него, а coalesce(1) схлопнет всю цепочку. Классический
      способ случайно сделать джобу однопоточной.

  - id: spark-cache-lazy
    kind: single
    prompt: |
      Когда данные реально окажутся в кеше после вызова `df.cache()`?
    options:
      - text: "После первого действия над df: сам cache только помечает датафрейм"
        correct: true
      - text: "Сразу при вызове cache()"
      - text: "При следующем чтении файла-источника"
      - text: "Только если вызвать persist() явно"
    explanation: |
      cache ленив, как и трансформации. Отсюда частый приём: вызвать count()
      сразу после cache, чтобы материализовать кеш осознанно.

  - id: spark-cache-harm
    kind: single
    prompt: |
      Когда `cache()` делает хуже?
    options:
      - text: "Когда датафрейм используется один раз: кеш занимает память исполнителей и вытесняет данные, нужные для вычислений"
        correct: true
      - text: "Когда датафрейм читается много раз"
      - text: "Когда данные лежат в Parquet"
      - text: "cache никогда не вредит"
    explanation: |
      Кеш живёт в той же памяти, где идут вычисления. Закешированное «на всякий
      случай» — частая причина замедления и OOM у исполнителей. Отсюда и
      unpersist(), когда датафрейм больше не нужен.

  - id: spark-cache-vs-write
    kind: single
    prompt: |
      Цепочка вычислений очень дорогая, результат нужен дальше. Чем запись
      промежутка в хранилище лучше cache?
    options:
      - text: "Кеш при потере исполнителя восстанавливается пересчётом по родословной; записанные данные пересчитывать не придётся"
        correct: true
      - text: "Ничем, cache всегда предпочтительнее"
      - text: "Запись быстрее, чем кеширование в памяти"
      - text: "Кеш нельзя использовать больше одного раза"
    explanation: |
      Отказоустойчивость Spark построена на пересчёте, а не на репликации кеша.
      Если пересчёт стоит дорого, надёжнее разорвать цепочку записью.

  - id: spark-dataframe-vs-rdd
    kind: single
    prompt: |
      Почему DataFrame обычно предпочтительнее RDD?
    options:
      - text: "Операции описаны выражениями, которые Spark понимает и может оптимизировать: протолкнуть фильтр, отбросить колонки, сгенерировать код"
        correct: true
      - text: "RDD не поддерживают распределённую обработку"
      - text: "DataFrame хранит данные в памяти, а RDD на диске"
      - text: "RDD не работают с Parquet"
    explanation: |
      Для RDD ваш код — непрозрачная функция, оптимизировать её нельзя. RDD
      оставляют для редких случаев, где нужен контроль, недоступный через
      выражения.

  - id: spark-python-udf-cost
    kind: single
    prompt: |
      Чем плоха обычная Python-UDF?
    options:
      - text: "Spark не понимает её содержимое и не может оптимизировать, а данные сериализуются из JVM в процесс Python и обратно на каждую строку"
        correct: true
      - text: "Она выполняется на драйвере"
      - text: "Она не поддерживает типы, кроме строк"
      - text: "Она запрещена в production-режиме Spark"
    explanation: |
      Порядок предпочтений: встроенная функция → векторизованная pandas-UDF
      (сериализация пакетами через Arrow) → обычная Python-UDF как последнее
      средство.

  - id: spark-shuffle-partitions-default
    kind: single
    prompt: |
      `spark.sql.shuffle.partitions` по умолчанию равен 200. Чем это плохо на
      небольших данных?
    options:
      - text: "После каждого shuffle появляется 200 крошечных задач, накладные расходы на которые превышают полезную работу"
        correct: true
      - text: "Данные не поместятся в память"
      - text: "Spark откажется выполнять план"
      - text: "Ничем: 200 — универсально хорошее значение"
    explanation: |
      На больших данных те же 200 партиций, наоборот, слишком крупные. Значение
      надо подбирать под объём, а AQE умеет схлопывать лишние партиции сам.

  - id: spark-infer-schema
    kind: single
    prompt: |
      Почему `inferSchema=true` при чтении большого CSV — плохая идея?
    options:
      - text: "Это дополнительный полный проход по файлу только ради определения типов"
        correct: true
      - text: "Типы определяются неверно всегда"
      - text: "Spark не поддерживает эту опцию для CSV"
      - text: "Она включает построчное чтение вместо блочного"
    explanation: |
      Схему лучше задавать явно — это и быстрее, и защищает от того, что при
      следующей выгрузке тип колонки молча изменится. У Parquet схема уже внутри
      файла, и вопрос не стоит.

  - id: spark-count-not-free
    kind: single
    prompt: |
      В пайплайн добавили `logger.info(df.count())` после каждого шага «чтобы
      видеть прогресс». Чем это плохо?
    options:
      - text: "count — действие с полным проходом; каждый такой вызов пересчитывает всю цепочку заново"
        correct: true
      - text: "Ничем: count берётся из метаданных"
      - text: "Логирование замедляет драйвер"
      - text: "count блокирует запись в хранилище"
    explanation: |
      Распространённый способ удвоить или утроить время работы джобы. Если
      считать строки нужно, датафрейм стоит закешировать или собирать метрики
      одним проходом.
