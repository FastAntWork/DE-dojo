questions:
  - id: cte-materialization-barrier
    kind: single
    prompt: |
      В PostgreSQL 16 CTE помечен как MATERIALIZED. Что это меняет?

          WITH big AS MATERIALIZED (SELECT * FROM events)
          SELECT * FROM big WHERE user_id = 42;
    options:
      - text: "CTE вычисляется целиком отдельно, и условие user_id = 42 не проваливается внутрь него"
        correct: true
      - text: "Результат CTE сохраняется во временную таблицу на диске до конца сессии"
      - text: "CTE начинает выполняться параллельно основному запросу"
      - text: "Ничего: ключевое слово оставлено для совместимости с версиями до 12"
    explanation: |
      До PostgreSQL 12 любой CTE был безусловным барьером оптимизации. С 12-й
      версии планировщик по умолчанию может встроить CTE в запрос и протолкнуть
      в него условия. MATERIALIZED возвращает старое поведение принудительно:
      иногда это спасение (CTE переиспользуется несколько раз), а иногда
      причина того, что вместо Index Scan получается полный проход.

  - id: cte-recursive-infinite
    kind: find-error
    prompt: |
      Запрос обхода иерархии сотрудников зацикливается на реальных данных.
      Что чаще всего является причиной?

          WITH RECURSIVE tree AS (
            SELECT id, manager_id FROM employees WHERE manager_id IS NULL
            UNION ALL
            SELECT e.id, e.manager_id
            FROM employees e JOIN tree t ON e.manager_id = t.id
          )
          SELECT * FROM tree;
    options:
      - text: "В данных есть цикл в manager_id, а UNION ALL не отсекает повторы — нужен UNION или отслеживание пути"
        correct: true
      - text: "Отсутствует ORDER BY в рекурсивной части"
      - text: "UNION ALL нельзя использовать в рекурсивном CTE"
      - text: "Якорная часть должна выбирать все строки, а не только корни"
    explanation: |
      Рекурсия останавливается, когда очередной шаг не даёт новых строк. Если в
      данных сотрудник оказался своим же начальником по цепочке, UNION ALL будет
      генерировать строки бесконечно. UNION дедуплицирует и остановится, но
      честнее вести массив пройденных id и обрывать по вхождению.

  - id: cte-correlated-cost
    kind: single
    prompt: |
      Чем коррелированный подзапрос отличается от обычного по стоимости?
    options:
      - text: "Он ссылается на колонки внешнего запроса, поэтому логически вычисляется для каждой строки внешнего результата"
        correct: true
      - text: "Он всегда выполняется ровно один раз и кешируется"
      - text: "Он выполняется до внешнего запроса и материализуется"
      - text: "Разницы в стоимости нет, отличается только синтаксис"
    explanation: |
      Некоррелированный подзапрос не зависит от внешней строки и считается один
      раз. Коррелированный зависит, поэтому в наивном плане это Nested Loop с
      повторным выполнением. Планировщик часто переписывает такие подзапросы в
      соединение или semi-join, но полагаться на это вслепую не стоит — смотри
      EXPLAIN.

  - id: cte-readability-tradeoff
    kind: single
    prompt: |
      Запрос состоит из восьми вложенных подзапросов. Чем помогут CTE?
    options:
      - text: "Каждый шаг получает имя и читается сверху вниз; логика становится проверяемой по частям"
        correct: true
      - text: "Запрос гарантированно станет быстрее"
      - text: "СУБД начнёт кешировать промежуточные результаты между запусками"
      - text: "Исчезнет необходимость в индексах"
    explanation: |
      Выигрыш в читаемости, а не в скорости. Более того, до PostgreSQL 12 CTE
      были барьером оптимизации и делали запросы медленнее — именно поэтому
      вокруг них столько мифов.

  - id: cte-not-materialized
    kind: single
    prompt: |
      Что делает `WITH x AS NOT MATERIALIZED (...)` в PostgreSQL?
    options:
      - text: "Разрешает планировщику встроить CTE в основной запрос, проталкивая в него условия"
        correct: true
      - text: "Запрещает использовать CTE больше одного раза"
      - text: "Сохраняет результат CTE во временную таблицу"
      - text: "Отключает рекурсию"
    explanation: |
      С версии 12 такое встраивание происходит по умолчанию для CTE,
      используемых один раз и без побочных эффектов. MATERIALIZED, наоборот,
      принудительно вычисляет CTE отдельно — иногда это нужно, чтобы дорогой
      шаг не выполнялся повторно.

  - id: cte-multiple-references
    kind: single
    prompt: |
      CTE используется в основном запросе трижды. Что произойдёт?
    options:
      - text: "PostgreSQL вычислит его один раз и материализует: встраивание применяется только к однократно используемым CTE"
        correct: true
      - text: "Он будет вычислен три раза"
      - text: "Запрос не скомпилируется"
      - text: "Результат будет разным при каждом обращении"
    explanation: |
      Это делает CTE удобным способом переиспользовать дорогой промежуточный
      результат в одном запросе — там, где иначе пришлось бы писать временную
      таблицу.

  - id: cte-recursive-structure
    kind: single
    prompt: |
      Из каких двух частей состоит рекурсивный CTE?
    options:
      - text: "Якорной части (стартовые строки) и рекурсивной, объединённых UNION или UNION ALL"
        correct: true
      - text: "Из объявления переменной и цикла WHILE"
      - text: "Из подзапроса и триггера"
      - text: "Из двух независимых SELECT, объединённых JOIN"
    explanation: |
      Рекурсивная часть ссылается на имя самого CTE и выполняется, пока
      возвращает строки. UNION (без ALL) дополнительно отсекает повторы, что
      спасает от зацикливания на графах с циклами.

  - id: cte-recursive-cycle-guard
    kind: single
    prompt: |
      Рекурсивный обход иерархии зациклился на данных с циклической ссылкой.
      Как защититься?
    options:
      - text: "Накапливать путь в массиве и отсекать строки, где узел уже встречался; либо ограничить глубину счётчиком"
        correct: true
      - text: "Добавить LIMIT в конец запроса"
      - text: "Заменить UNION ALL на INNER JOIN"
      - text: "Использовать ORDER BY внутри рекурсивной части"
    explanation: |
      LIMIT снаружи не спасает: рекурсия продолжает порождать строки внутри.
      Массив пройденных узлов — стандартный приём, а ограничение глубины —
      дешёвая страховка сверху.

  - id: cte-recursive-use-cases
    kind: multiple
    prompt: |
      Для чего практически применяют рекурсивные CTE?
    options:
      - text: "Обход иерархий: сотрудники и руководители, категории товаров"
        correct: true
      - text: "Развёртывание графа зависимостей между таблицами или задачами"
        correct: true
      - text: "Генерация ряда дат для календаря без пропусков"
        correct: true
      - text: "Ускорение агрегации по большой таблице"
    explanation: |
      Для генерации рядов в PostgreSQL обычно проще generate_series, но
      рекурсивный CTE — переносимый способ сделать то же в СУБД без неё.

  - id: cte-correlated-subquery-rewrite
    kind: single
    prompt: |
      Коррелированный подзапрос в SELECT выполняется для каждой строки
      результата и тормозит. Как переписать?
    options:
      - text: "Вынести его в соединение с предварительно агрегированным набором — тогда он посчитается один раз для всех строк"
        correct: true
      - text: "Обернуть в CTE — этого достаточно"
      - text: "Добавить DISTINCT"
      - text: "Заменить на EXISTS"
    explanation: |
      Обёртка в CTE сама по себе ничего не меняет: корреляция остаётся.
      Замена на EXISTS уместна, когда нужен факт существования, а не значение.

  - id: cte-lateral
    kind: single
    prompt: |
      Что позволяет LATERAL в подзапросе FROM?
    options:
      - text: "Ссылаться на колонки предыдущих таблиц в FROM — например, взять три последних заказа для каждого клиента"
        correct: true
      - text: "Выполнять подзапрос параллельно"
      - text: "Соединять таблицы без условия"
      - text: "Материализовать подзапрос на диске"
    explanation: |
      Задача «топ-N внутри каждой группы» решается либо LATERAL, либо оконной
      функцией row_number с фильтром. LATERAL выигрывает, когда N мал и по
      ключу есть индекс.

  - id: cte-subquery-in-where
    kind: single
    prompt: |
      Чем `WHERE amount > (SELECT avg(amount) FROM orders)` отличается от
      коррелированного подзапроса?
    options:
      - text: "Он некоррелированный: не зависит от текущей строки и вычисляется один раз"
        correct: true
      - text: "Он вычисляется для каждой строки"
      - text: "Он требует индекса по amount"
      - text: "Он всегда возвращает NULL"
    explanation: |
      Различать эти два вида — базовый навык чтения планов. Коррелированный
      подзапрос виден в плане как повторяющийся узел под Nested Loop.

  - id: cte-scalar-subquery-multiple-rows
    kind: single
    prompt: |
      Скалярный подзапрос в SELECT вернул больше одной строки. Что произойдёт
      в PostgreSQL?
    options:
      - text: "Ошибка выполнения: подзапрос, использованный как значение, обязан вернуть не больше одной строки"
        correct: true
      - text: "Вернётся первая строка"
      - text: "Вернётся NULL"
      - text: "Строки склеятся через запятую"
    explanation: |
      Ошибка здесь — благо: она возникает ровно тогда, когда предположение об
      уникальности перестало выполняться. СУБД, молча берущие первую строку,
      порождают расхождения, которые ищут неделями.

  - id: cte-window-instead-of-selfjoin
    kind: single
    prompt: |
      Нужно к каждой строке добавить значение предыдущего дня. Самосоединение
      или оконная функция?
    options:
      - text: "Оконная функция LAG: один проход вместо второго чтения таблицы и соединения"
        correct: true
      - text: "Самосоединение: оно всегда быстрее"
      - text: "Рекурсивный CTE"
      - text: "Коррелированный подзапрос"
    explanation: |
      Самосоединение по «дате минус один день» ещё и ломается на пропусках:
      если данных за день нет, строка теряется. Оконная функция берёт
      предыдущую имеющуюся строку.

  - id: cte-temp-table-vs-cte
    kind: single
    prompt: |
      Когда временная таблица лучше CTE?
    options:
      - text: "Когда промежуточный результат нужен нескольким запросам, по нему нужен индекс или статистика для планировщика"
        correct: true
      - text: "Всегда: временные таблицы быстрее"
      - text: "Когда запрос содержит рекурсию"
      - text: "Когда результат помещается в память"
    explanation: |
      Ключевое преимущество временной таблицы — возможность выполнить по ней
      ANALYZE и построить индекс. Для CTE планировщик оценивает размер
      приблизительно, и на сложных цепочках это приводит к плохим планам.

  - id: cte-view-vs-cte
    kind: single
    prompt: |
      Чем представление (VIEW) отличается от CTE?
    options:
      - text: "Представление — постоянный объект базы, доступный любым запросам; CTE существует только внутри одного запроса"
        correct: true
      - text: "Представление хранит данные, а CTE нет"
      - text: "CTE можно индексировать, а представление нет"
      - text: "Разницы нет, это синонимы"
    explanation: |
      Данные хранит материализованное представление — отдельная сущность,
      требующая обновления. Обычное представление это сохранённый запрос.

  - id: cte-writable-cte
    kind: single
    prompt: |
      Что делает `WITH deleted AS (DELETE FROM staging RETURNING *)
      INSERT INTO archive SELECT * FROM deleted`?
    options:
      - text: "Переносит строки: удаляет их из staging и вставляет в archive за одну команду"
        correct: true
      - text: "Только удаляет строки, вставка игнорируется"
      - text: "Вызовет ошибку: в CTE допустим только SELECT"
      - text: "Создаёт временную таблицу deleted"
    explanation: |
      Изменяющие данные CTE — сильная возможность PostgreSQL. Важная тонкость:
      все части такого запроса видят один и тот же снимок данных, поэтому
      порядок между ними не определён.

  - id: cte-debug-by-parts
    kind: single
    prompt: |
      Запрос из шести CTE выдаёт неверный результат. Как искать ошибку?
    options:
      - text: "Выполнять CTE по одному, добавляя следующий и сверяя число строк и ключевые значения на каждом шаге"
        correct: true
      - text: "Переписать всё одним запросом без CTE"
      - text: "Добавить DISTINCT в конец"
      - text: "Смотреть только план выполнения"
    explanation: |
      Это и есть главное практическое преимущество CTE перед вложенными
      подзапросами: цепочку можно разбирать по шагам, и на каждом видно, где
      число строк изменилось не так, как ожидалось.

  - id: cte-exists-vs-count
    kind: single
    prompt: |
      Нужно проверить, есть ли у клиента хотя бы один заказ. Что лучше:
      `EXISTS (SELECT 1 FROM orders ...)` или
      `(SELECT count(*) FROM orders ...) > 0`?
    options:
      - text: "EXISTS: он может остановиться на первой найденной строке, а count обязан просмотреть все"
        correct: true
      - text: "count: он точнее"
      - text: "Разницы нет, планировщик приводит их к одному плану"
      - text: "count, потому что EXISTS не использует индексы"
    explanation: |
      На клиенте с десятью тысячами заказов разница заметна сразу. Правило:
      если нужен факт существования, а не количество, спрашивать надо именно
      про существование.

  - id: cte-subquery-select-vs-join
    kind: single
    prompt: |
      Подзапрос в списке выбора возвращает по одному значению на строку.
      Когда его стоит переписать в соединение?
    options:
      - text: "Когда таких подзапросов несколько и они читают одну и ту же таблицу: соединение прочитает её один раз вместо N"
        correct: true
      - text: "Всегда: подзапросы в SELECT запрещены стандартом"
      - text: "Никогда: подзапрос в SELECT всегда эффективнее"
      - text: "Только если подзапрос возвращает NULL"
    explanation: |
      Три подзапроса к одной таблице ради трёх её колонок — распространённый
      шаблон, который планировщик далеко не всегда схлопывает. Одно соединение
      выражает то же намерение честнее.
