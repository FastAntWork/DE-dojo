questions:
  - id: cte-materialization-barrier
    kind: single
    prompt: |
      В PostgreSQL 16 CTE помечен как MATERIALIZED. Что это меняет?

          WITH big AS MATERIALIZED (SELECT * FROM events)
          SELECT * FROM big WHERE user_id = 42;
    options:
      - text: "CTE вычисляется целиком отдельно, и условие user_id = 42 не проваливается внутрь него"
        correct: true
      - text: "Результат CTE сохраняется во временную таблицу на диске до конца сессии"
      - text: "CTE начинает выполняться параллельно основному запросу"
      - text: "Ничего: ключевое слово оставлено для совместимости с версиями до 12"
    explanation: |
      До PostgreSQL 12 любой CTE был безусловным барьером оптимизации. С 12-й
      версии планировщик по умолчанию может встроить CTE в запрос и протолкнуть
      в него условия. MATERIALIZED возвращает старое поведение принудительно:
      иногда это спасение (CTE переиспользуется несколько раз), а иногда
      причина того, что вместо Index Scan получается полный проход.

  - id: cte-recursive-infinite
    kind: find-error
    prompt: |
      Запрос обхода иерархии сотрудников зацикливается на реальных данных.
      Что чаще всего является причиной?

          WITH RECURSIVE tree AS (
            SELECT id, manager_id FROM employees WHERE manager_id IS NULL
            UNION ALL
            SELECT e.id, e.manager_id
            FROM employees e JOIN tree t ON e.manager_id = t.id
          )
          SELECT * FROM tree;
    options:
      - text: "В данных есть цикл в manager_id, а UNION ALL не отсекает повторы — нужен UNION или отслеживание пути"
        correct: true
      - text: "Отсутствует ORDER BY в рекурсивной части"
      - text: "UNION ALL нельзя использовать в рекурсивном CTE"
      - text: "Якорная часть должна выбирать все строки, а не только корни"
    explanation: |
      Рекурсия останавливается, когда очередной шаг не даёт новых строк. Если в
      данных сотрудник оказался своим же начальником по цепочке, UNION ALL будет
      генерировать строки бесконечно. UNION дедуплицирует и остановится, но
      честнее вести массив пройденных id и обрывать по вхождению.

  - id: cte-correlated-cost
    kind: single
    prompt: |
      Чем коррелированный подзапрос отличается от обычного по стоимости?
    options:
      - text: "Он ссылается на колонки внешнего запроса, поэтому логически вычисляется для каждой строки внешнего результата"
        correct: true
      - text: "Он всегда выполняется ровно один раз и кешируется"
      - text: "Он выполняется до внешнего запроса и материализуется"
      - text: "Разницы в стоимости нет, отличается только синтаксис"
    explanation: |
      Некоррелированный подзапрос не зависит от внешней строки и считается один
      раз. Коррелированный зависит, поэтому в наивном плане это Nested Loop с
      повторным выполнением. Планировщик часто переписывает такие подзапросы в
      соединение или semi-join, но полагаться на это вслепую не стоит — смотри
      EXPLAIN.
