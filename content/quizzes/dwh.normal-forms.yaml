questions:
  - id: nf-identify-violation
    kind: find-error
    prompt: |
      Ключ таблицы — пара (order_id, product_id).

          order_id | product_id | quantity | product_name
          ---------+------------+----------+-------------
                 1 |         10 |        2 | Мышь
                 2 |         10 |        1 | Мышь

      Какая нормальная форма нарушена и почему?
    options:
      - text: "2НФ: product_name зависит только от product_id, то есть от части составного ключа"
        correct: true
      - text: "1НФ: в ячейке product_name хранится текст, а не идентификатор"
      - text: "3НФ: product_name транзитивно зависит от order_id через product_id"
      - text: "Ничего не нарушено, повторение названия — это нормально для витрины"
    explanation: |
      2НФ требует, чтобы неключевые атрибуты зависели от ВСЕГО составного ключа.
      quantity зависит от пары — правильно. product_name зависит только от
      product_id, то есть от части ключа, — это и есть нарушение 2НФ. Транзитивной
      зависимости (3НФ) здесь нет: product_name зависит от части ключа напрямую, а
      не через другой неключевой атрибут.

  - id: nf-anomaly-type
    kind: single
    prompt: |
      В таблице «заказы» город клиента хранится в каждой строке заказа. Клиент
      переехал, обновили не все строки. Как называется этот класс проблемы?
    options:
      - text: "Аномалия обновления"
        correct: true
      - text: "Аномалия вставки"
      - text: "Аномалия удаления"
      - text: "Нарушение ссылочной целостности"
    explanation: |
      Аномалия обновления — когда один факт хранится в нескольких местах и правка
      затрагивает не все копии. Аномалия вставки — невозможность записать клиента
      без заказа. Аномалия удаления — потеря сведений о клиенте при удалении его
      единственного заказа. Ссылочная целостность здесь ни при чём: внешние ключи
      не нарушены, данные просто разошлись между собой.

  - id: nf-third-form
    kind: single
    prompt: |
      Таблица сотрудников содержит employee_id (ключ), department_id и
      department_name. Что с ней не так?
    options:
      - text: "Нарушена 3НФ: department_name зависит от employee_id транзитивно, через department_id"
        correct: true
      - text: "Нарушена 2НФ: department_name зависит от части ключа"
      - text: "Нарушена 1НФ: в таблице два поля об одной сущности"
      - text: "Всё в порядке, это классическая схема справочника"
    explanation: |
      Цепочка employee_id → department_id → department_name — транзитивная
      зависимость, её запрещает именно 3НФ. Нарушение 2НФ здесь невозможно в
      принципе: ключ состоит из одной колонки, а 2НФ говорит только о составных
      ключах. Лечится выносом названия отдела в таблицу отделов.

  - id: nf-denormalization-justification
    kind: single
    prompt: |
      Какое обоснование денормализации витрины является достаточным?
    options:
      - text: "Замер: отчёт строится 40 с при четырёх соединениях, после денормализации 1.2 с; данные обновляются раз в сутки, цена перезаписи приемлема"
        correct: true
      - text: "Аналитикам неудобно писать запросы с соединениями"
      - text: "В хранилищах данных нормализация не применяется в принципе"
      - text: "Диск дешёвый, поэтому дублирование данных ничего не стоит"
    explanation: |
      Достаточное обоснование содержит три вещи: измерение до и после,
      альтернативу и названную цену. «Неудобно» — это не измерение. Утверждение,
      что в DWH нормализация не применяется, ложно: ядро хранилища часто
      нормализовано, денормализуются витрины. Стоимость денормализации — не место
      на диске, а перенос нагрузки на запись и потеря целостности, которую теперь
      обеспечивает код загрузки, а не схема.

  - id: nf-first-form-jsonb
    kind: single
    prompt: |
      В колонке типа JSONB лежит массив тегов статьи: ["sql", "dwh", "etl"].
      Формально это нарушает 1НФ. Когда такое решение допустимо?
    options:
      - text: "Когда содержимое используется как единое значение и к элементам не нужно обращаться как к сущностям"
        correct: true
      - text: "Всегда: JSONB — нативный тип PostgreSQL, поэтому 1НФ на него не распространяется"
      - text: "Никогда: 1НФ является обязательным требованием реляционной модели"
      - text: "Только если массив содержит не более десяти элементов"
    explanation: |
      Критерий содержательный, а не технический. Если теги нужны лишь целиком —
      показать у статьи, проверить вхождение — JSONB уместен и обслуживается
      GIN-индексом. Если же по тегам нужно соединяться, вести по ним справочник и
      считать статистику, то это сущности, и им место в отдельной таблице.
      Ссылка на нативность типа обоснованием не является: 1НФ говорит о
      содержимом ячейки, а не о том, каким типом оно реализовано.
