questions:
  - id: nf-identify-violation
    kind: find-error
    prompt: |
      Ключ таблицы — пара (order_id, product_id).

          order_id | product_id | quantity | product_name
          ---------+------------+----------+-------------
                 1 |         10 |        2 | Мышь
                 2 |         10 |        1 | Мышь

      Какая нормальная форма нарушена и почему?
    options:
      - text: "2НФ: product_name зависит только от product_id, то есть от части составного ключа"
        correct: true
      - text: "1НФ: в ячейке product_name хранится текст, а не идентификатор"
      - text: "3НФ: product_name транзитивно зависит от order_id через product_id"
      - text: "Ничего не нарушено, повторение названия — это нормально для витрины"
    explanation: |
      2НФ требует, чтобы неключевые атрибуты зависели от ВСЕГО составного ключа.
      quantity зависит от пары — правильно. product_name зависит только от
      product_id, то есть от части ключа, — это и есть нарушение 2НФ. Транзитивной
      зависимости (3НФ) здесь нет: product_name зависит от части ключа напрямую, а
      не через другой неключевой атрибут.

  - id: nf-anomaly-type
    kind: single
    prompt: |
      В таблице «заказы» город клиента хранится в каждой строке заказа. Клиент
      переехал, обновили не все строки. Как называется этот класс проблемы?
    options:
      - text: "Аномалия обновления"
        correct: true
      - text: "Аномалия вставки"
      - text: "Аномалия удаления"
      - text: "Нарушение ссылочной целостности"
    explanation: |
      Аномалия обновления — когда один факт хранится в нескольких местах и правка
      затрагивает не все копии. Аномалия вставки — невозможность записать клиента
      без заказа. Аномалия удаления — потеря сведений о клиенте при удалении его
      единственного заказа. Ссылочная целостность здесь ни при чём: внешние ключи
      не нарушены, данные просто разошлись между собой.

  - id: nf-third-form
    kind: single
    prompt: |
      Таблица сотрудников содержит employee_id (ключ), department_id и
      department_name. Что с ней не так?
    options:
      - text: "Нарушена 3НФ: department_name зависит от employee_id транзитивно, через department_id"
        correct: true
      - text: "Нарушена 2НФ: department_name зависит от части ключа"
      - text: "Нарушена 1НФ: в таблице два поля об одной сущности"
      - text: "Всё в порядке, это классическая схема справочника"
    explanation: |
      Цепочка employee_id → department_id → department_name — транзитивная
      зависимость, её запрещает именно 3НФ. Нарушение 2НФ здесь невозможно в
      принципе: ключ состоит из одной колонки, а 2НФ говорит только о составных
      ключах. Лечится выносом названия отдела в таблицу отделов.

  - id: nf-denormalization-justification
    kind: single
    prompt: |
      Какое обоснование денормализации витрины является достаточным?
    options:
      - text: "Замер: отчёт строится 40 с при четырёх соединениях, после денормализации 1.2 с; данные обновляются раз в сутки, цена перезаписи приемлема"
        correct: true
      - text: "Аналитикам неудобно писать запросы с соединениями"
      - text: "В хранилищах данных нормализация не применяется в принципе"
      - text: "Диск дешёвый, поэтому дублирование данных ничего не стоит"
    explanation: |
      Достаточное обоснование содержит три вещи: измерение до и после,
      альтернативу и названную цену. «Неудобно» — это не измерение. Утверждение,
      что в DWH нормализация не применяется, ложно: ядро хранилища часто
      нормализовано, денормализуются витрины. Стоимость денормализации — не место
      на диске, а перенос нагрузки на запись и потеря целостности, которую теперь
      обеспечивает код загрузки, а не схема.

  - id: nf-first-form-jsonb
    kind: single
    prompt: |
      В колонке типа JSONB лежит массив тегов статьи: ["sql", "dwh", "etl"].
      Формально это нарушает 1НФ. Когда такое решение допустимо?
    options:
      - text: "Когда содержимое используется как единое значение и к элементам не нужно обращаться как к сущностям"
        correct: true
      - text: "Всегда: JSONB — нативный тип PostgreSQL, поэтому 1НФ на него не распространяется"
      - text: "Никогда: 1НФ является обязательным требованием реляционной модели"
      - text: "Только если массив содержит не более десяти элементов"
    explanation: |
      Критерий содержательный, а не технический. Если теги нужны лишь целиком —
      показать у статьи, проверить вхождение — JSONB уместен и обслуживается
      GIN-индексом. Если же по тегам нужно соединяться, вести по ним справочник и
      считать статистику, то это сущности, и им место в отдельной таблице.
      Ссылка на нативность типа обоснованием не является: 1НФ говорит о
      содержимом ячейки, а не о том, каким типом оно реализовано.

  - id: nf-why-normalize
    kind: single
    prompt: |
      Какую задачу решает нормализация?
    options:
      - text: "Устраняет избыточность, из-за которой один факт хранится в нескольких местах и может разъехаться при изменении"
        correct: true
      - text: "Ускоряет запросы на чтение"
      - text: "Уменьшает число таблиц в схеме"
      - text: "Обеспечивает атомарность транзакций"
    explanation: |
      Скорость чтения нормализация как раз ухудшает: за данными приходится
      ходить по нескольким таблицам. Её выигрыш — в целостности при изменениях,
      поэтому она уместна в OLTP и не всегда уместна в аналитике.

  - id: nf-first-normal-form
    kind: single
    prompt: |
      Что требует первая нормальная форма?
    options:
      - text: "Атомарность значений: в одной ячейке одно значение, а не список через запятую и не структура"
        correct: true
      - text: "Наличие первичного ключа"
      - text: "Отсутствие транзитивных зависимостей"
      - text: "Отсутствие повторяющихся строк"
    explanation: |
      Практическое следствие: колонка `phones` со строкой «+7900..., +7901...»
      нарушает 1НФ, и любой поиск по номеру превращается в разбор строки.

  - id: nf-second-normal-form
    kind: single
    prompt: |
      Что нарушает вторая нормальная форма?
    options:
      - text: "Зависимость неключевого атрибута от ЧАСТИ составного ключа"
        correct: true
      - text: "Зависимость одного неключевого атрибута от другого"
      - text: "Наличие вычисляемых колонок"
      - text: "Отсутствие внешних ключей"
    explanation: |
      Классический пример: в таблице (заказ, товар) название товара зависит
      только от товара, а не от пары. При составном ключе из одной колонки
      вопрос 2НФ не возникает вовсе.

  - id: nf-third-vs-bcnf
    kind: single
    prompt: |
      Чем нормальная форма Бойса-Кодда строже третьей?
    options:
      - text: "Она требует, чтобы левая часть КАЖДОЙ функциональной зависимости была надключом, включая зависимости между кандидатами в ключи"
        correct: true
      - text: "Она запрещает составные ключи"
      - text: "Она требует отсутствия NULL"
      - text: "Она запрещает внешние ключи"
    explanation: |
      Разница проявляется редко — в таблицах с несколькими перекрывающимися
      ключами-кандидатами. Знать формулировку полезно, но на практике 3НФ
      обычно достаточно.

  - id: nf-update-anomaly
    kind: single
    prompt: |
      Название компании хранится в каждой строке таблицы сотрудников. Компания
      переименовалась. Какая это аномалия?
    options:
      - text: "Аномалия обновления: изменить нужно много строк, и при частичном обновлении данные станут противоречивыми"
        correct: true
      - text: "Аномалия вставки"
      - text: "Аномалия удаления"
      - text: "Нарушение первой нормальной формы"
    explanation: |
      Три аномалии стоит уметь различать: вставка — нельзя записать компанию
      без сотрудника; удаление — увольнение последнего сотрудника стирает
      сведения о компании; обновление — разъехавшиеся копии.

  - id: nf-delete-anomaly
    kind: single
    prompt: |
      Удаление последнего сотрудника компании стирает и сведения о самой
      компании. Как это называется и как лечится?
    options:
      - text: "Аномалия удаления; лечится вынесением компаний в отдельную таблицу"
        correct: true
      - text: "Аномалия вставки; лечится добавлением NULL-значений"
      - text: "Нарушение 1НФ; лечится разбиением колонки"
      - text: "Это нормальное поведение внешних ключей"
    explanation: |
      Все три аномалии — симптомы одного: в таблице смешаны сведения о двух
      разных сущностях. Разделение таблиц устраняет их разом.

  - id: nf-denormalize-when
    kind: single
    prompt: |
      Когда денормализация оправдана?
    options:
      - text: "Когда данные меняются редко или не меняются вовсе, а читаются часто: в аналитическом хранилище это норма"
        correct: true
      - text: "Когда таблица содержит меньше миллиона строк"
      - text: "Когда не хватает места на диске"
      - text: "Когда в схеме нет внешних ключей"
    explanation: |
      Опасность денормализации ровно в изменениях: продублированное значение
      надо обновлять везде. Если строки исторические и не меняются, этой
      опасности нет.

  - id: nf-oltp-vs-olap-normalization
    kind: single
    prompt: |
      Почему в OLTP нормализуют, а в аналитическом хранилище часто нет?
    options:
      - text: "В OLTP главная опасность — противоречивость при частых изменениях; в аналитике данные почти не меняются, зато важна простота и скорость чтения"
        correct: true
      - text: "В аналитике нет первичных ключей"
      - text: "Аналитические СУБД не поддерживают соединения"
      - text: "Нормализация невозможна в колоночных хранилищах"
    explanation: |
      Это не «нормализация хорошая, денормализация плохая», а разные задачи с
      разными компромиссами. Уметь объяснить оба — и есть содержание вопроса.

  - id: nf-functional-dependency
    kind: single
    prompt: |
      Что означает запись «A → B» (B функционально зависит от A)?
    options:
      - text: "Каждому значению A соответствует ровно одно значение B"
        correct: true
      - text: "B вычисляется из A формулой"
      - text: "A является внешним ключом на таблицу с B"
      - text: "A и B всегда изменяются вместе"
    explanation: |
      Из функциональных зависимостей и выводятся нормальные формы. Определение
      стоит знать точно: оно не про вычисление, а про однозначность
      соответствия в данных.

  - id: nf-jsonb-and-1nf
    kind: single
    prompt: |
      Колонку типа jsonb со структурой внутри считают нарушением 1НФ. Значит
      ли это, что jsonb использовать нельзя?
    options:
      - text: "Нет: это осознанный размен ради гибкости, уместный когда структура заранее неизвестна или сильно разрежена"
        correct: true
      - text: "Да: 1НФ обязательна во всех случаях"
      - text: "Нет, потому что jsonb не нарушает 1НФ"
      - text: "Да, но только в аналитических хранилищах"
    explanation: |
      Цена размена: типы, ограничения и понятные планы теряются. Поэтому
      «положим всё в jsonb, потом разберёмся» — плохое решение по умолчанию, а
      не универсальное.

  - id: nf-key-candidate
    kind: single
    prompt: |
      Что такое ключ-кандидат?
    options:
      - text: "Минимальный набор колонок, однозначно определяющий строку; один из кандидатов выбирают первичным ключом"
        correct: true
      - text: "Колонка с автоинкрементом"
      - text: "Любая уникальная колонка, включая избыточные наборы"
      - text: "Внешний ключ на другую таблицу"
    explanation: |
      Минимальность существенна: набор (id, email) однозначно определяет
      строку, но кандидатом не является, потому что id хватает и без email.

  - id: nf-surrogate-vs-natural-key
    kind: single
    prompt: |
      Когда суррогатный ключ предпочтительнее естественного?
    options:
      - text: "Когда естественный ключ может измениться, длинный или составной — суррогат стабилен и дёшев в соединениях"
        correct: true
      - text: "Всегда: естественные ключи устарели"
      - text: "Только в OLTP"
      - text: "Когда в таблице меньше миллиона строк"
    explanation: |
      Довод про изменяемость главный: ИНН, email и номер паспорта меняются, и
      каждое такое изменение пришлось бы протаскивать по всем ссылающимся
      таблицам.

  - id: nf-repeating-columns
    kind: find-error
    prompt: |
      ```
      orders(id, item1, item2, item3, item4)
      ```
      Что здесь не так и как чинить?
    options:
      - text: "Повторяющиеся группы колонок: это нарушение 1НФ, позиции надо вынести в отдельную таблицу со ссылкой на заказ"
        correct: true
      - text: "Не хватает первичного ключа"
      - text: "Нарушена третья нормальная форма"
      - text: "Ничего: так удобнее читать"
    explanation: |
      Симптом узнаваем по нумерованным колонкам. Пятая позиция в заказе
      потребует изменения схемы, а поиск «в каких заказах был товар X» —
      перебора всех четырёх колонок.

  - id: nf-normalize-then-model
    kind: single
    prompt: |
      Как нормальные формы связаны с моделированием хранилища?
    options:
      - text: "Они дают язык, чтобы понимать, что именно теряется при денормализации, и делать этот выбор осознанно"
        correct: true
      - text: "Никак: в хранилищах они не применяются"
      - text: "Хранилище обязано быть в третьей нормальной форме"
      - text: "Звезда — это четвёртая нормальная форма"
    explanation: |
      Data Vault, кстати, ближе к нормализованному подходу, а звезда — к
      денормализованному. Понимание форм позволяет объяснить, почему в одном
      слое хранилища одно, а в другом другое.

  - id: nf-check-3nf
    kind: single
    prompt: |
      Таблица `employees(id, name, dept_id, dept_name)`. Какая форма нарушена?
    options:
      - text: "Третья: dept_name зависит от dept_id, а не от ключа — это транзитивная зависимость"
        correct: true
      - text: "Первая"
      - text: "Вторая"
      - text: "Никакая, таблица корректна"
    explanation: |
      Признак 3НФ, удобный для запоминания: неключевой атрибут не должен
      зависеть от другого неключевого. Здесь через dept_id и возникает цепочка.
