questions:
  - id: star-grain-first
    kind: single
    prompt: |
      Проектируешь витрину продаж. Почему гранулярность выбирают до того, как
      определены измерения и меры?
    options:
      - text: "Она определяет, какие вопросы к витрине вообще можно будет задать: агрегировать из подробного можно, разложить обратно нельзя"
        correct: true
      - text: "От неё зависит выбор между звездой и снежинкой"
      - text: "Без неё нельзя посчитать объём хранилища и заказать железо"
      - text: "Этого требует методология Инмона"
    explanation: |
      Зерно задаёт потолок детализации навсегда. Витрина «по дню и магазину»
      никогда не ответит на вопрос про состав чека — данных просто нет. Обратное
      неверно: из позиций чека агрегат по дню считается в любой момент. Поэтому
      правило — брать самое подробное зерно, которое можешь себе позволить.
      Выбор звезды или снежинки от зерна не зависит, это решение про измерения.

  - id: star-semiadditive
    kind: single
    prompt: |
      В витрине лежит остаток на складе на конец дня. Аналитик суммирует его за
      месяц и получает число в тридцать раз больше реального. Как называется такая
      мера и что с ней делать?
    options:
      - text: "Полуаддитивная: складывать по складам можно, по времени нельзя — берут последнее значение или среднее"
        correct: true
      - text: "Неаддитивная: суммировать её нельзя ни по какому измерению"
      - text: "Аддитивная, аналитик просто забыл поделить на число дней"
      - text: "Вырожденная мера, её нельзя хранить в таблице фактов"
    explanation: |
      Полуаддитивные меры суммируются по одним измерениям и не суммируются по
      другим — обычно по времени. Остатки двух складов сложить осмысленно, остатки
      одного склада за понедельник и вторник — нет. По времени применяют
      «последнее значение» или среднее. Неаддитивные (проценты, коэффициенты) не
      суммируются вообще ни по какому разрезу.

  - id: star-nonadditive-ratio
    kind: single
    prompt: |
      В факте нужна конверсия — доля визитов, закончившихся покупкой. Как её
      правильно хранить?
    options:
      - text: "Хранить числитель и знаменатель отдельными аддитивными мерами, а отношение вычислять при агрегации"
        correct: true
      - text: "Хранить готовый процент, а при агрегации брать среднее"
      - text: "Хранить готовый процент, суммировать его и делить на число строк"
      - text: "Не хранить в факте вовсе, конверсия относится к измерению"
    explanation: |
      Отношение неаддитивно: среднее из процентов не равно проценту от сумм, если
      знаменатели различаются. Правильный приём — хранить визиты и покупки как
      аддитивные меры, а конверсию считать как SUM(покупки)/SUM(визиты) в момент
      запроса. Тогда она верна на любом уровне агрегации.

  - id: star-vs-snowflake
    kind: single
    prompt: |
      Витрина на поколоночном хранилище, измерение товаров на 50 тысяч строк с
      иерархией категория → отдел. Аналитики жалуются на сложность запросов.
      Звезда или снежинка?
    options:
      - text: "Звезда: экономия места незначима, а лишние соединения замедляют каждый запрос и усложняют работу аналитику"
        correct: true
      - text: "Снежинка: нормализация измерений — обязательное требование размерной модели"
      - text: "Снежинка: при поколоночном хранении соединения дешевле, чем сканирование широкой таблицы"
      - text: "Зависит только от объёма таблицы фактов, измерение роли не играет"
    explanation: |
      Снежинка экономит место — аргумент, весомый в девяностые и почти
      несущественный при поколоночном сжатии, тем более на 50 тысячах строк.
      Цена — цепочка соединений в каждом запросе и потеря понятности. Снежинка
      оправдана, когда измерение действительно огромно и его иерархия часто
      меняется. Здесь ни то, ни другое не выполняется.

  - id: star-surrogate-key
    kind: single
    prompt: |
      У клиента есть ИНН — надёжный естественный ключ. Зачем измерению клиентов
      всё равно нужен суррогатный ключ?
    options:
      - text: "Потому что при хранении истории изменений один клиент присутствует несколькими версиями, и ИНН перестаёт быть уникальным"
        correct: true
      - text: "Потому что ИНН является персональными данными и его нельзя хранить в хранилище"
      - text: "Потому что внешние ключи в PostgreSQL работают только с целочисленными колонками"
      - text: "Суррогатный ключ нужен только если естественного ключа нет вовсе"
    explanation: |
      Решающая причина — историчность. Как только измерение начинает хранить
      версии (SCD 2), бизнес-ключ дублируется по строкам, и сослаться на
      конкретную версию можно только суррогатом. Дополнительно суррогат развязывает
      хранилище от решений источника и дешевле в соединениях на миллиардах строк.
      Бизнес-ключ при этом остаётся в измерении обычным атрибутом.
