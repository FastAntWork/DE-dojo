questions:
  - id: star-grain-first
    kind: single
    prompt: |
      Проектируешь витрину продаж. Почему гранулярность выбирают до того, как
      определены измерения и меры?
    options:
      - text: "Она определяет, какие вопросы к витрине вообще можно будет задать: агрегировать из подробного можно, разложить обратно нельзя"
        correct: true
      - text: "От неё зависит выбор между звездой и снежинкой"
      - text: "Без неё нельзя посчитать объём хранилища и заказать железо"
      - text: "Этого требует методология Инмона"
    explanation: |
      Зерно задаёт потолок детализации навсегда. Витрина «по дню и магазину»
      никогда не ответит на вопрос про состав чека — данных просто нет. Обратное
      неверно: из позиций чека агрегат по дню считается в любой момент. Поэтому
      правило — брать самое подробное зерно, которое можешь себе позволить.
      Выбор звезды или снежинки от зерна не зависит, это решение про измерения.

  - id: star-semiadditive
    kind: single
    prompt: |
      В витрине лежит остаток на складе на конец дня. Аналитик суммирует его за
      месяц и получает число в тридцать раз больше реального. Как называется такая
      мера и что с ней делать?
    options:
      - text: "Полуаддитивная: складывать по складам можно, по времени нельзя — берут последнее значение или среднее"
        correct: true
      - text: "Неаддитивная: суммировать её нельзя ни по какому измерению"
      - text: "Аддитивная, аналитик просто забыл поделить на число дней"
      - text: "Вырожденная мера, её нельзя хранить в таблице фактов"
    explanation: |
      Полуаддитивные меры суммируются по одним измерениям и не суммируются по
      другим — обычно по времени. Остатки двух складов сложить осмысленно, остатки
      одного склада за понедельник и вторник — нет. По времени применяют
      «последнее значение» или среднее. Неаддитивные (проценты, коэффициенты) не
      суммируются вообще ни по какому разрезу.

  - id: star-nonadditive-ratio
    kind: single
    prompt: |
      В факте нужна конверсия — доля визитов, закончившихся покупкой. Как её
      правильно хранить?
    options:
      - text: "Хранить числитель и знаменатель отдельными аддитивными мерами, а отношение вычислять при агрегации"
        correct: true
      - text: "Хранить готовый процент, а при агрегации брать среднее"
      - text: "Хранить готовый процент, суммировать его и делить на число строк"
      - text: "Не хранить в факте вовсе, конверсия относится к измерению"
    explanation: |
      Отношение неаддитивно: среднее из процентов не равно проценту от сумм, если
      знаменатели различаются. Правильный приём — хранить визиты и покупки как
      аддитивные меры, а конверсию считать как SUM(покупки)/SUM(визиты) в момент
      запроса. Тогда она верна на любом уровне агрегации.

  - id: star-vs-snowflake
    kind: single
    prompt: |
      Витрина на поколоночном хранилище, измерение товаров на 50 тысяч строк с
      иерархией категория → отдел. Аналитики жалуются на сложность запросов.
      Звезда или снежинка?
    options:
      - text: "Звезда: экономия места незначима, а лишние соединения замедляют каждый запрос и усложняют работу аналитику"
        correct: true
      - text: "Снежинка: нормализация измерений — обязательное требование размерной модели"
      - text: "Снежинка: при поколоночном хранении соединения дешевле, чем сканирование широкой таблицы"
      - text: "Зависит только от объёма таблицы фактов, измерение роли не играет"
    explanation: |
      Снежинка экономит место — аргумент, весомый в девяностые и почти
      несущественный при поколоночном сжатии, тем более на 50 тысячах строк.
      Цена — цепочка соединений в каждом запросе и потеря понятности. Снежинка
      оправдана, когда измерение действительно огромно и его иерархия часто
      меняется. Здесь ни то, ни другое не выполняется.

  - id: star-surrogate-key
    kind: single
    prompt: |
      У клиента есть ИНН — надёжный естественный ключ. Зачем измерению клиентов
      всё равно нужен суррогатный ключ?
    options:
      - text: "Потому что при хранении истории изменений один клиент присутствует несколькими версиями, и ИНН перестаёт быть уникальным"
        correct: true
      - text: "Потому что ИНН является персональными данными и его нельзя хранить в хранилище"
      - text: "Потому что внешние ключи в PostgreSQL работают только с целочисленными колонками"
      - text: "Суррогатный ключ нужен только если естественного ключа нет вовсе"
    explanation: |
      Решающая причина — историчность. Как только измерение начинает хранить
      версии (SCD 2), бизнес-ключ дублируется по строкам, и сослаться на
      конкретную версию можно только суррогатом. Дополнительно суррогат развязывает
      хранилище от решений источника и дешевле в соединениях на миллиардах строк.
      Бизнес-ключ при этом остаётся в измерении обычным атрибутом.

  - id: star-fact-vs-dimension
    kind: single
    prompt: |
      Чем таблица фактов отличается от измерения?
    options:
      - text: "Факт хранит события с числовыми мерами и ссылками на измерения; измерение хранит описания сущностей, по которым режут эти меры"
        correct: true
      - text: "Факт всегда меньше измерения по объёму"
      - text: "Измерение содержит только числовые колонки"
      - text: "Факт не может ссылаться на другие таблицы"
    explanation: |
      Проверочный вопрос при моделировании: «это то, ЧТО произошло, или то, В
      РАЗРЕЗЕ ЧЕГО мы смотрим?» Первое — факт, второе — измерение.

  - id: star-why-denormalized
    kind: single
    prompt: |
      Почему измерения в звезде намеренно денормализованы?
    options:
      - text: "Чтобы аналитический запрос обходился одним соединением вместо цепочки: читаемость и скорость важнее экономии места"
        correct: true
      - text: "Чтобы уменьшить объём хранилища"
      - text: "Чтобы соблюсти третью нормальную форму"
      - text: "Чтобы упростить загрузку данных"
    explanation: |
      Денормализация здесь — осознанный размен: дублирование значений в обмен
      на простые запросы. В OLTP такой размен был бы ошибкой, в аналитике —
      норма.

  - id: star-junk-dimension
    kind: single
    prompt: |
      В факте накопилось десять булевых признаков и флагов. Что с ними делают?
    options:
      - text: "Выносят в «мусорное» измерение — одну таблицу со всеми встречающимися комбинациями"
        correct: true
      - text: "Оставляют в факте: булевы колонки дёшевы"
      - text: "Создают по отдельному измерению на каждый флаг"
      - text: "Кодируют одной строкой через разделитель"
    explanation: |
      Отдельное измерение на каждый флаг раздувает число соединений, а десять
      колонок в факте мешают читать его. Мусорное измерение — компромисс,
      придуманный ровно для этого случая.

  - id: star-degenerate-dimension
    kind: single
    prompt: |
      Номер чека нужен для группировки, но никаких атрибутов у него нет. Как
      поступить?
    options:
      - text: "Оставить его прямо в таблице фактов — это вырожденное измерение, отдельная таблица для него бессмысленна"
        correct: true
      - text: "Создать измерение с единственной колонкой-номером"
      - text: "Удалить: без атрибутов он не нужен"
      - text: "Вынести в мусорное измерение"
    explanation: |
      Отдельная таблица из одного столбца-ключа не добавляет ничего, кроме
      лишнего соединения. Термин стоит знать: его любят спрашивать именно
      потому, что он выглядит контринтуитивно.

  - id: star-factless-fact
    kind: single
    prompt: |
      Нужно учитывать посещения занятий студентами. Числовых мер нет. Что
      делать?
    options:
      - text: "Завести факт без мер: он фиксирует само СОБЫТИЕ, а считают по нему количество строк"
        correct: true
      - text: "Добавить фиктивную колонку со значением 1"
      - text: "Хранить это в измерении студентов"
      - text: "Такую сущность в звезде смоделировать нельзя"
    explanation: |
      Колонка из единиц ничего не добавляет: count(*) считает то же самое.
      Второй классический случай факта без мер — фиксация условий, например
      действовавших акций.

  - id: star-additive-measures
    kind: single
    prompt: |
      Какая мера является полностью аддитивной?
    options:
      - text: "Сумма продажи: её можно складывать по любым измерениям"
        correct: true
      - text: "Остаток на складе"
      - text: "Процент конверсии"
      - text: "Средний чек"
    explanation: |
      Остаток полуаддитивен: складывается по товарам, но не по времени.
      Проценты и средние неаддитивны вовсе — их пересчитывают из аддитивных
      составляющих.

  - id: star-ratio-storage
    kind: single
    prompt: |
      Почему конверсию не хранят в факте готовым числом?
    options:
      - text: "Отношения нельзя складывать: при агрегации нужно суммировать числитель и знаменатель отдельно и делить в конце"
        correct: true
      - text: "Хранение процентов занимает много места"
      - text: "Проценты нельзя хранить в числовых типах"
      - text: "Их всегда пересчитывает BI-инструмент"
    explanation: |
      Среднее из процентов не равно проценту от суммы — типичная ошибка, дающая
      «неверные цифры в отчёте», которые потом долго ищут.

  - id: star-conformed-dimension
    kind: single
    prompt: |
      Что такое согласованное (conformed) измерение?
    options:
      - text: "Одно и то же измерение, используемое несколькими фактами с одинаковым смыслом и ключами — благодаря ему отчёты по разным фактам сходятся"
        correct: true
      - text: "Измерение, прошедшее проверки качества данных"
      - text: "Измерение без истории изменений"
      - text: "Измерение, нормализованное до третьей формы"
    explanation: |
      Отсутствие согласованных измерений — главная причина, по которой у двух
      отделов «разные цифры»: у каждого свой справочник клиентов со своим
      пониманием того, кто активен.

  - id: star-date-dimension
    kind: single
    prompt: |
      Зачем заводить отдельное измерение дат, если дата уже есть в факте?
    options:
      - text: "Чтобы хранить нерасчётные атрибуты: выходные, праздники, рабочие дни, финансовые периоды — их нельзя вывести из самой даты"
        correct: true
      - text: "Чтобы ускорить фильтрацию по дате"
      - text: "Чтобы соблюсти нормальные формы"
      - text: "Чтобы уменьшить размер таблицы фактов"
    explanation: |
      Признак «рабочий день» зависит от страны и от года, а «финансовый
      квартал» — от компании. Вычислить это выражением нельзя, поэтому нужна
      таблица.

  - id: star-fact-size
    kind: single
    prompt: |
      Почему в факте держат ключи измерений, а не их текстовые значения?
    options:
      - text: "Факт — самая большая таблица: целочисленные ключи заметно компактнее и быстрее в соединениях, а описания живут в одном месте"
        correct: true
      - text: "Текстовые значения нельзя индексировать"
      - text: "Так требует третья нормальная форма"
      - text: "Чтобы можно было менять зерно факта"
    explanation: |
      Второй довод не менее важен: если название категории поменялось, править
      его надо в одной строке измерения, а не в миллиарде строк факта.

  - id: star-many-to-many
    kind: single
    prompt: |
      Одна продажа может относиться сразу к нескольким промоакциям. Как
      смоделировать?
    options:
      - text: "Через мостовую таблицу между фактом и измерением; при агрегации по акциям нужно помнить о риске задвоения сумм"
        correct: true
      - text: "Продублировать строку факта на каждую акцию"
      - text: "Хранить список акций строкой через запятую"
      - text: "Игнорировать все акции, кроме первой"
    explanation: |
      Дублирование строк факта ломает зерно и задваивает выручку. Мостовая
      таблица честно выражает связь «многие ко многим», но требует
      весовых коэффициентов или явных оговорок при суммировании.

  - id: star-snowflake-when
    kind: single
    prompt: |
      Когда снежинка оправдана вместо звезды?
    options:
      - text: "Когда измерение огромно и его нормализация даёт существенную экономию, или когда справочник переиспользуется несколькими измерениями"
        correct: true
      - text: "Всегда: нормализация лучше по определению"
      - text: "Когда в хранилище нет поддержки соединений"
      - text: "Когда таблица фактов небольшая"
    explanation: |
      В подавляющем большинстве случаев экономия места несопоставима с потерей
      простоты запросов. Поэтому по умолчанию берут звезду, а снежинку —
      обосновывают.

  - id: star-grain-mixing
    kind: single
    prompt: |
      В одну таблицу фактов положили и строки по позициям чека, и строки по
      чеку целиком. Что произойдёт?
    options:
      - text: "Суммы задвоятся при любой агрегации: строки разного смысла складываются между собой"
        correct: true
      - text: "Ничего, если добавить колонку-признак типа строки"
      - text: "Запросы станут медленнее, но результаты останутся верными"
      - text: "Нарушится третья нормальная форма"
    explanation: |
      Признак типа строки не спасает: любой аналитик, забывший про фильтр по
      нему, получит удвоенную выручку. Разные зёрна — разные таблицы.

  - id: star-fact-types
    kind: single
    prompt: |
      Чем факт-снимок отличается от транзакционного факта?
    options:
      - text: "Транзакционный фиксирует отдельные события, снимок — состояние на момент времени (остатки, балансы) через равные интервалы"
        correct: true
      - text: "Снимок хранит только агрегаты"
      - text: "Транзакционный факт не имеет ключей измерений"
      - text: "Снимок не может иметь мер"
    explanation: |
      Меры в снимках обычно полуаддитивны: остаток можно сложить по складам, но
      не по дням. Третий вид — накопительный снимок для процессов с этапами,
      где строка обновляется по мере прохождения.

  - id: star-surrogate-vs-natural
    kind: single
    prompt: |
      Почему в измерениях со SCD типа 2 факт ссылается на суррогатный ключ, а
      не на естественный?
    options:
      - text: "Естественный ключ соответствует нескольким версиям строки; суррогатный указывает на конкретную версию, действовавшую в момент события"
        correct: true
      - text: "Естественные ключи слишком длинные"
      - text: "Естественные ключи могут содержать NULL"
      - text: "Так требует стандарт SQL"
    explanation: |
      Именно эта связка и делает историю измерений полезной. Ссылка на
      естественный ключ дала бы неоднозначность и, при соединении, задвоение
      фактов на число версий.
