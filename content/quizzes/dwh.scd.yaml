questions:
  - id: scd-choose-type
    kind: single
    prompt: |
      Клиент переехал из Москвы в Казань. Бизнес требует, чтобы отчёт о продажах
      по регионам за прошлый год не изменился после переезда. Какой тип SCD?
    options:
      - text: "Тип 2: старая версия закрывается, новая открывается, факты остаются привязанными к версии на момент покупки"
        correct: true
      - text: "Тип 1: перезаписать город, история продаж хранится в фактах и не пострадает"
      - text: "Тип 3: сохранить предыдущий город в отдельной колонке"
      - text: "Тип 0: город клиента менять нельзя"
    explanation: |
      Требование «прошлые отчёты не меняются» — это ровно определение типа 2.
      Тип 1 затрёт город, и все прошлогодние продажи Иванова внезапно окажутся
      казанскими: факты хранят ссылку на измерение, а не сам город. Тип 3
      сохранит один шаг назад, но привязать конкретную продажу к нужной версии
      не позволит.

  - id: scd-why-surrogate
    kind: single
    prompt: |
      В измерении с SCD 2 у клиента две строки с одним бизнес-ключом. На что
      должна ссылаться таблица фактов?
    options:
      - text: "На суррогатный ключ конкретной версии — только он однозначно указывает, каким клиент был на момент события"
        correct: true
      - text: "На бизнес-ключ клиента, а нужная версия выбирается по дате при запросе"
      - text: "На бизнес-ключ и дату версии составным ключом"
      - text: "На строку с is_current = true, история подтягивается отдельно"
    explanation: |
      Ссылка на версию — весь смысл конструкции. Бизнес-ключ при SCD 2
      перестаёт быть уникальным, поэтому по нему нельзя однозначно
      присоединиться. Выбор версии по дате при каждом запросе работает, но
      перекладывает ответственность на автора запроса: один забудет условие —
      и суммы задвоятся. Именно поэтому измерению нужен суррогатный ключ.

  - id: scd-interval-gap
    kind: find-error
    prompt: |
      Загрузка SCD 2 записала так:

          dim_key | city   | valid_from | valid_to
          --------+--------+------------+-----------
              501 | Москва | 2024-01-01 | 2026-03-15
              502 | Казань | 2026-03-16 | 9999-12-31

      Что здесь сломано?
    options:
      - text: "Разрыв: событие 15 марта не попадёт ни в одну версию и потеряется при соединении"
        correct: true
      - text: "Пересечение: 15 марта принадлежит обеим версиям, и строка задвоится"
      - text: "Ничего: интервалы корректны, так и надо закрывать версии"
      - text: "Отсутствует is_current, без него соединение невозможно"
    explanation: |
      Между 15 и 16 марта дыра. Факт от 15 марта не найдёт версию, и при
      внутреннем соединении строка исчезнет из отчёта — тихо, без ошибки.
      Правило: конец старой версии равен началу новой, а сравнение делается
      полуинтервалом valid_from <= dt < valid_to. Тогда границы стыкуются и
      не пересекаются.

  - id: scd-duplicate-current
    kind: single
    prompt: |
      После повторного запуска загрузки у клиента оказалось две строки с
      is_current = true. Как надёжнее всего не допускать этого впредь?
    options:
      - text: "Частичный уникальный индекс по бизнес-ключу с условием WHERE is_current — тогда второе состояние физически невозможно"
        correct: true
      - text: "Добавить в загрузку проверку количества текущих версий перед вставкой"
      - text: "Сделать загрузку идемпотентной и на этом остановиться"
      - text: "Регулярно запускать сверку, которая находит и чинит такие случаи"
    explanation: |
      Проверка в коде срабатывает, пока о ней помнят, и не спасает от гонки
      двух параллельных загрузок. Ограничение в схеме делает неверное
      состояние невозможным физически — данные просто не запишутся.
      Идемпотентность загрузки нужна тоже, но это второй рубеж, а не первый.
      Сверка постфактум — худший вариант: ошибка уже попала в отчёты.

  - id: scd-type-6-purpose
    kind: single
    prompt: |
      Зачем в типе 6 хранить и историческое значение атрибута, и текущее в
      одной строке?
    options:
      - text: "Чтобы одним запросом отвечать и «как было на момент события», и «в разрезе того, где клиент сейчас»"
        correct: true
      - text: "Чтобы ускорить запросы за счёт отказа от соединения с измерением"
      - text: "Чтобы иметь резервную копию значения на случай ошибки загрузки"
      - text: "Это требование стандарта Кимбалла для всех измерений с историей"
    explanation: |
      Оба вопроса законны, и бизнес задаёт оба: «сколько продано в Москве
      тогда» и «сколько всего купили клиенты, которые сейчас в Казани».
      Тип 2 отвечает только на первый. Тип 6 (1+2+3) хранит рядом обе версии
      значения. Цена — при каждом изменении надо обновлять текущее значение
      во всех исторических строках сущности.
