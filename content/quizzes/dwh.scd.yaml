questions:
  - id: scd-choose-type
    kind: single
    prompt: |
      Клиент переехал из Москвы в Казань. Бизнес требует, чтобы отчёт о продажах
      по регионам за прошлый год не изменился после переезда. Какой тип SCD?
    options:
      - text: "Тип 2: старая версия закрывается, новая открывается, факты остаются привязанными к версии на момент покупки"
        correct: true
      - text: "Тип 1: перезаписать город, история продаж хранится в фактах и не пострадает"
      - text: "Тип 3: сохранить предыдущий город в отдельной колонке"
      - text: "Тип 0: город клиента менять нельзя"
    explanation: |
      Требование «прошлые отчёты не меняются» — это ровно определение типа 2.
      Тип 1 затрёт город, и все прошлогодние продажи Иванова внезапно окажутся
      казанскими: факты хранят ссылку на измерение, а не сам город. Тип 3
      сохранит один шаг назад, но привязать конкретную продажу к нужной версии
      не позволит.

  - id: scd-why-surrogate
    kind: single
    prompt: |
      В измерении с SCD 2 у клиента две строки с одним бизнес-ключом. На что
      должна ссылаться таблица фактов?
    options:
      - text: "На суррогатный ключ конкретной версии — только он однозначно указывает, каким клиент был на момент события"
        correct: true
      - text: "На бизнес-ключ клиента, а нужная версия выбирается по дате при запросе"
      - text: "На бизнес-ключ и дату версии составным ключом"
      - text: "На строку с is_current = true, история подтягивается отдельно"
    explanation: |
      Ссылка на версию — весь смысл конструкции. Бизнес-ключ при SCD 2
      перестаёт быть уникальным, поэтому по нему нельзя однозначно
      присоединиться. Выбор версии по дате при каждом запросе работает, но
      перекладывает ответственность на автора запроса: один забудет условие —
      и суммы задвоятся. Именно поэтому измерению нужен суррогатный ключ.

  - id: scd-interval-gap
    kind: find-error
    prompt: |
      Загрузка SCD 2 записала так:

          dim_key | city   | valid_from | valid_to
          --------+--------+------------+-----------
              501 | Москва | 2024-01-01 | 2026-03-15
              502 | Казань | 2026-03-16 | 9999-12-31

      Что здесь сломано?
    options:
      - text: "Разрыв: событие 15 марта не попадёт ни в одну версию и потеряется при соединении"
        correct: true
      - text: "Пересечение: 15 марта принадлежит обеим версиям, и строка задвоится"
      - text: "Ничего: интервалы корректны, так и надо закрывать версии"
      - text: "Отсутствует is_current, без него соединение невозможно"
    explanation: |
      Между 15 и 16 марта дыра. Факт от 15 марта не найдёт версию, и при
      внутреннем соединении строка исчезнет из отчёта — тихо, без ошибки.
      Правило: конец старой версии равен началу новой, а сравнение делается
      полуинтервалом valid_from <= dt < valid_to. Тогда границы стыкуются и
      не пересекаются.

  - id: scd-duplicate-current
    kind: single
    prompt: |
      После повторного запуска загрузки у клиента оказалось две строки с
      is_current = true. Как надёжнее всего не допускать этого впредь?
    options:
      - text: "Частичный уникальный индекс по бизнес-ключу с условием WHERE is_current — тогда второе состояние физически невозможно"
        correct: true
      - text: "Добавить в загрузку проверку количества текущих версий перед вставкой"
      - text: "Сделать загрузку идемпотентной и на этом остановиться"
      - text: "Регулярно запускать сверку, которая находит и чинит такие случаи"
    explanation: |
      Проверка в коде срабатывает, пока о ней помнят, и не спасает от гонки
      двух параллельных загрузок. Ограничение в схеме делает неверное
      состояние невозможным физически — данные просто не запишутся.
      Идемпотентность загрузки нужна тоже, но это второй рубеж, а не первый.
      Сверка постфактум — худший вариант: ошибка уже попала в отчёты.

  - id: scd-type-6-purpose
    kind: single
    prompt: |
      Зачем в типе 6 хранить и историческое значение атрибута, и текущее в
      одной строке?
    options:
      - text: "Чтобы одним запросом отвечать и «как было на момент события», и «в разрезе того, где клиент сейчас»"
        correct: true
      - text: "Чтобы ускорить запросы за счёт отказа от соединения с измерением"
      - text: "Чтобы иметь резервную копию значения на случай ошибки загрузки"
      - text: "Это требование стандарта Кимбалла для всех измерений с историей"
    explanation: |
      Оба вопроса законны, и бизнес задаёт оба: «сколько продано в Москве
      тогда» и «сколько всего купили клиенты, которые сейчас в Казани».
      Тип 2 отвечает только на первый. Тип 6 (1+2+3) хранит рядом обе версии
      значения. Цена — при каждом изменении надо обновлять текущее значение
      во всех исторических строках сущности.

  - id: scd-type-1-consequence
    kind: single
    prompt: |
      В измерении SCD типа 1 у клиента поменяли город. Что станет с отчётами
      за прошлые месяцы?
    options:
      - text: "Они пересчитаются по новому городу: история не хранится, прошлое переписывается"
        correct: true
      - text: "Останутся прежними: старые факты ссылаются на старую версию"
      - text: "Перестанут строиться до пересчёта витрин"
      - text: "Будут содержать оба города"
    explanation: |
      Это не всегда плохо. Для исправления опечатки в имени тип 1 — правильный
      выбор. Плохо, когда так обращаются с атрибутом, по которому строят
      исторические разрезы.

  - id: scd-type-2-mechanics
    kind: single
    prompt: |
      Что происходит в SCD типа 2 при изменении атрибута?
    options:
      - text: "Текущая версия закрывается датой окончания, добавляется новая строка с новым суррогатным ключом и открытым интервалом"
        correct: true
      - text: "Значение обновляется на месте, старое сохраняется в отдельной колонке"
      - text: "Создаётся новая таблица версий"
      - text: "Старая строка удаляется, новая вставляется"
    explanation: |
      Ключевое — новый суррогатный ключ: именно он позволяет фактам ссылаться
      на конкретную версию. Без него история есть, а привязать к ней события
      нечем.

  - id: scd-type-3-limit
    kind: single
    prompt: |
      В чём ограничение SCD типа 3?
    options:
      - text: "Он хранит только предыдущее значение в отдельной колонке: история глубже одного шага теряется"
        correct: true
      - text: "Он не поддерживает текстовые атрибуты"
      - text: "Он требует пересчёта всех фактов при изменении"
      - text: "Он применим только к измерению дат"
    explanation: |
      Тип 3 уместен в узком случае: когда нужно сравнивать «до и после» одной
      конкретной реорганизации, а полная история избыточна.

  - id: scd-current-flag
    kind: single
    prompt: |
      Зачем в SCD типа 2 колонка-признак текущей версии, если есть интервалы
      действия?
    options:
      - text: "Ради удобства и скорости: фильтр по флагу проще и дешевле, чем сравнение дат, а результат тот же"
        correct: true
      - text: "Без неё нельзя определить актуальную строку"
      - text: "Она обязательна по стандарту Кимбалла"
      - text: "Она заменяет суррогатный ключ"
    explanation: |
      Риск избыточности: флаг и интервалы могут разъехаться при ошибке
      загрузки. Поэтому на них ставят проверку — ровно одна текущая версия на
      естественный ключ.

  - id: scd-open-interval
    kind: single
    prompt: |
      Чем задают конец интервала у текущей версии?
    options:
      - text: "Либо NULL, либо «бесконечной» датой вроде 9999-12-31; главное — единообразие, потому что от него зависят условия соединения"
        correct: true
      - text: "Датой последней загрузки"
      - text: "Текущей датой, обновляемой ежедневно"
      - text: "Конец не задаётся, строка не имеет интервала"
    explanation: |
      Обновляемая текущая дата — плохой вариант: он требует ежедневного
      переписывания строк. У NULL и «бесконечности» разные плюсы: первый
      честнее, второй упрощает условие BETWEEN.

  - id: scd-point-in-time-join
    kind: single
    prompt: |
      Как соединить факт с версией измерения, действовавшей на момент события?
    options:
      - text: "По естественному ключу и попаданию даты факта в интервал действия версии"
        correct: true
      - text: "По суррогатному ключу текущей версии"
      - text: "По естественному ключу с фильтром is_current"
      - text: "По дате загрузки измерения"
    explanation: |
      Если суррогатный ключ версии уже проставлен в факте при загрузке,
      соединение становится обычным по ключу — и это предпочтительнее, потому
      что интервалы не приходится сравнивать в каждом запросе.

  - id: scd-late-arriving-dimension
    kind: single
    prompt: |
      Факт пришёл раньше, чем измерение, на которое он ссылается. Что делать?
    options:
      - text: "Завести заглушку-версию измерения с неизвестными атрибутами и связать факт с ней, а при появлении настоящих данных обогатить"
        correct: true
      - text: "Отбросить факт"
      - text: "Ждать появления измерения, задержав всю загрузку"
      - text: "Связать факт с любой существующей версией"
    explanation: |
      Проблема «опоздавшего измерения» решается заглушками именно потому, что
      терять факты нельзя, а связывать их с произвольной версией — значит
      получить неверные разрезы.

  - id: scd-which-attributes
    kind: single
    prompt: |
      Как решить, вести ли историю по конкретному атрибуту?
    options:
      - text: "По вопросу «нужно ли смотреть отчёты в разрезе этого атрибута так, как было тогда»: если да — тип 2, если нет — тип 1"
        correct: true
      - text: "Вести историю по всем атрибутам всегда"
      - text: "По частоте изменений: часто меняющиеся — тип 2"
      - text: "По типу данных: текстовые — тип 2, числовые — тип 1"
    explanation: |
      История по всем атрибутам подряд раздувает измерение: изменение любого
      технического поля порождает новую версию и, соответственно, новый ключ.

  - id: scd-hybrid-type-6
    kind: single
    prompt: |
      Что даёт гибридный подход (тип 6)?
    options:
      - text: "Возможность смотреть и «как было тогда», и «как есть сейчас»: в строке версии хранится и историческое значение, и текущее"
        correct: true
      - text: "Хранение шести последних версий"
      - text: "Автоматическое удаление старых версий"
      - text: "Сжатие истории измерений"
    explanation: |
      Практическая надобность возникает постоянно: продажи хотят видеть по
      менеджеру, который вёл клиента тогда, и одновременно по тому, кто ведёт
      его сейчас.

  - id: scd-dbt-snapshot
    kind: single
    prompt: |
      Чем dbt snapshot помогает при ведении SCD типа 2?
    options:
      - text: "Он сам отслеживает изменения строк источника и ведёт колонки начала и конца действия версии"
        correct: true
      - text: "Он создаёт суррогатные ключи для фактов"
      - text: "Он ускоряет соединение с измерением"
      - text: "Он проверяет корректность интервалов"
    explanation: |
      Две стратегии: timestamp — доверять колонке времени изменения; check —
      сравнивать перечисленные колонки. Вторая надёжнее, когда источник
      дисциплины по времени изменения не соблюдает.

  - id: scd-check-one-current
    kind: single
    prompt: |
      Какую проверку обязательно ставить на измерение со SCD типа 2?
    options:
      - text: "Ровно одна текущая версия на естественный ключ и отсутствие пересечений интервалов"
        correct: true
      - text: "Уникальность суррогатного ключа — этого достаточно"
      - text: "Отсутствие NULL в атрибутах"
      - text: "Соответствие числа версий числу загрузок"
    explanation: |
      Уникальность суррогатного ключа не поймает главную беду: две открытые
      версии одного клиента задвоят все его факты при соединении.

  - id: scd-storage-growth
    kind: single
    prompt: |
      Измерение со SCD типа 2 растёт быстрее ожидаемого. Что проверить?
    options:
      - text: "Не порождают ли новую версию технические поля вроде времени обновления — тогда версия создаётся при каждой загрузке"
        correct: true
      - text: "Размер суррогатных ключей"
      - text: "Наличие индексов"
      - text: "Тип сжатия таблицы"
    explanation: |
      Классическая ошибка: в набор отслеживаемых колонок попало поле,
      меняющееся всегда. Версий становится столько же, сколько запусков
      загрузки.

  - id: scd-natural-key-stability
    kind: single
    prompt: |
      Почему естественный ключ измерения должен быть стабилен?
    options:
      - text: "Он связывает версии одной сущности между собой: при его смене история разрывается на две несвязанные цепочки"
        correct: true
      - text: "Иначе нельзя построить индекс"
      - text: "Иначе нарушится третья нормальная форма"
      - text: "Иначе суррогатные ключи станут неуникальными"
    explanation: |
      Именно поэтому в качестве естественного ключа берут идентификатор
      источника, а не email или телефон: последние меняются, и после смены
      клиент превратится в двух разных.

  - id: scd-deleted-in-source
    kind: single
    prompt: |
      Строка исчезла из источника. Что должно произойти в измерении со SCD
      типа 2?
    options:
      - text: "Текущая версия закрывается датой, а строка помечается удалённой — физически её не удаляют, иначе старые факты потеряют ссылку"
        correct: true
      - text: "Строка удаляется вместе со всеми версиями"
      - text: "Ничего: исчезновение из источника игнорируется"
      - text: "Все связанные факты удаляются каскадно"
    explanation: |
      Физическое удаление разрушило бы историю: факты прошлых периодов ссылались
      на реально существовавшую тогда сущность. Отдельная сложность — отличить
      удаление от того, что строка просто не попала в выгрузку.

  - id: scd-type-2-cost
    kind: single
    prompt: |
      Какова главная цена SCD типа 2 для аналитика?
    options:
      - text: "Каждый запрос обязан явно выбирать версию — иначе соединение задвоит факты на число версий"
        correct: true
      - text: "Запросы перестают использовать индексы"
      - text: "Измерение нельзя загружать инкрементально"
      - text: "Теряется возможность строить отчёты по текущему состоянию"
    explanation: |
      Именно поэтому для конечных пользователей часто делают представление с
      текущими версиями: тип 2 остаётся под капотом, а типовые запросы не
      требуют осторожности.
