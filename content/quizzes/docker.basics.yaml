questions:
  - id: docker-image-vs-container
    kind: single
    prompt: |
      Чем образ отличается от контейнера?
    options:
      - text: "Образ — неизменяемый шаблон; контейнер — его запущенный экземпляр с тонким записываемым слоем сверху"
        correct: true
      - text: "Образ работает, а контейнер хранится на диске"
      - text: "Образ — это контейнер с данными"
      - text: "Разницы нет, это синонимы"
    explanation: |
      Из записываемого слоя следует главное: всё, что контейнер записал в свою
      файловую систему, исчезает вместе с ним. Это устройство, а не дефект.

  - id: docker-data-lost
    kind: single
    prompt: |
      Postgres запустили как `docker run postgres:16` без томов, поработали,
      затем `docker rm`. Что с данными?
    options:
      - text: "Они исчезли вместе с записываемым слоем контейнера"
        correct: true
      - text: "Сохранились: Docker создаёт том автоматически"
      - text: "Сохранились в кеше образов"
      - text: "Сохранились, но доступны только для чтения"
    explanation: |
      Официальный образ действительно объявляет том, но при явном rm без
      сохранения имени найти его потом трудно. Надёжно — создавать именованный
      том и подключать его явно.

  - id: docker-vs-vm
    kind: single
    prompt: |
      Чем контейнер принципиально отличается от виртуальной машины?
    options:
      - text: "Он использует ядро хоста и изолируется механизмами этого ядра, а не эмулирует оборудование с собственным ядром"
        correct: true
      - text: "Он не может использовать сеть"
      - text: "Он всегда работает от имени root"
      - text: "Он не поддерживает постоянное хранение данных"
    explanation: |
      Отсюда и скорость старта, и малый размер, и невозможность запустить
      контейнер с чужим ядром без прослойки виртуализации — как на Windows и
      macOS.

  - id: docker-layer-cache-order
    kind: find-error
    prompt: |
      ```dockerfile
      FROM python:3.12-slim
      WORKDIR /app
      COPY . .
      RUN pip install -r requirements.txt
      ```
      Почему сборка медленная при каждой правке кода?
    options:
      - text: "COPY всего кода идёт до установки зависимостей: любая правка обесценивает кеш и заставляет ставить пакеты заново"
        correct: true
      - text: "Нужен образ не slim, а полный"
      - text: "pip install должен идти перед WORKDIR"
      - text: "Нужно объединить COPY и RUN в одну инструкцию"
    explanation: |
      Правило одно: сначала то, что меняется редко, потом то, что меняется
      часто. Сначала COPY requirements.txt и установка, и только затем COPY
      остального кода.

  - id: docker-layer-invalidation
    kind: single
    prompt: |
      Что происходит с кешем при изменении одной инструкции в середине
      Dockerfile?
    options:
      - text: "Она и все последующие инструкции пересобираются заново"
        correct: true
      - text: "Пересобирается только эта инструкция"
      - text: "Пересобирается весь образ с самого начала"
      - text: "Кеш не используется вовсе при любом изменении файла"
    explanation: |
      Каждый слой опирается на предыдущий, поэтому изменение в середине делает
      недействительным всё, что ниже. Инструкции до неё берутся из кеша.

  - id: docker-ignore
    kind: single
    prompt: |
      Сборка «висит» несколько минут на этапе передачи контекста. Что
      проверить?
    options:
      - text: ".dockerignore: скорее всего, в контекст попали .git, виртуальные окружения и данные"
        correct: true
      - text: "Скорость сети до реестра образов"
      - text: "Размер базового образа"
      - text: "Число слоёв в Dockerfile"
    explanation: |
      Контекст сборки целиком отправляется демону перед выполнением первой
      инструкции. Каталог с данными на несколько гигабайт превращает быструю
      сборку в многоминутную.

  - id: docker-multistage
    kind: single
    prompt: |
      Что даёт многоступенчатая сборка?
    options:
      - text: "В итоговый образ попадает только результат, без компилятора и исходников: меньше размер и меньше поверхность атаки"
        correct: true
      - text: "Параллельную сборку нескольких образов"
      - text: "Автоматическое обновление зависимостей"
      - text: "Возможность собирать без интернета"
    explanation: |
      Особенно заметно для компилируемых языков: образ с компилятором — сотни
      мегабайт, образ с одним готовым бинарником — единицы.

  - id: docker-cmd-vs-entrypoint
    kind: single
    prompt: |
      Чем ENTRYPOINT отличается от CMD?
    options:
      - text: "ENTRYPOINT задаёт саму программу, CMD — аргументы по умолчанию, которые легко переопределить при запуске"
        correct: true
      - text: "CMD выполняется при сборке, ENTRYPOINT при запуске"
      - text: "ENTRYPOINT можно указать только один раз, CMD — сколько угодно"
      - text: "Разницы нет"
    explanation: |
      Практически это значит: `docker run образ --help` подменит аргументы из
      CMD, но программа из ENTRYPOINT останется той же. Удобно для утилит.

  - id: docker-volume-vs-bind
    kind: single
    prompt: |
      Для данных боевой базы в контейнере что выбрать?
    options:
      - text: "Именованный том: им управляет Docker, он переживает пересоздание контейнера и не зависит от путей на хосте"
        correct: true
      - text: "Монтирование каталога хоста"
      - text: "tmpfs"
      - text: "Записываемый слой контейнера"
    explanation: |
      Монтирование каталога — правильный выбор для разработки: правка кода
      видна сразу. Для данных оно привязывает контейнер к конкретной машине и
      её путям.

  - id: docker-tmpfs
    kind: single
    prompt: |
      Что такое tmpfs-монтирование?
    options:
      - text: "Хранилище в оперативной памяти, исчезающее при остановке контейнера: для временных файлов и секретов"
        correct: true
      - text: "Том, доступный только на чтение"
      - text: "Сетевое хранилище"
      - text: "Кеш слоёв образа"
    explanation: |
      В песочнице ката этого проекта именно так сделан /tmp: запись возможна,
      но с noexec и ограничением размера, и после прогона ничего не остаётся.

  - id: docker-compose-down-v
    kind: single
    prompt: |
      `docker compose down -v` — что делает флаг `-v`?
    options:
      - text: "Удаляет тома вместе с контейнерами, то есть стирает данные"
        correct: true
      - text: "Выводит подробный лог остановки"
      - text: "Проверяет версию compose-файла"
      - text: "Сохраняет тома в резервную копию"
    explanation: |
      Частая причина «данные пропали после перезапуска». Флаг делает ровно то,
      о чём просили, — поэтому его стоит набирать осознанно.

  - id: docker-network-localhost
    kind: find-error
    prompt: |
      ```yaml
      services:
        api:
          environment:
            DATABASE_URL: postgresql://user:pass@localhost:5432/db
        postgres:
          image: postgres:16
      ```
      Приложение не может подключиться. Почему?
    options:
      - text: "localhost внутри контейнера api означает сам этот контейнер; обращаться надо по имени сервиса — postgres"
        correct: true
      - text: "Не указан проброс портов для postgres"
      - text: "Нужно объявить сеть явно"
      - text: "Порт 5432 занят на хосте"
    explanation: |
      Ошибка номер один у начинающих. Контейнеры одной сети compose видят друг
      друга по именам сервисов, и проброс портов для этого не нужен вовсе — он
      нужен только для доступа с хоста.

  - id: docker-port-mapping-order
    kind: single
    prompt: |
      В `-p 8080:80` какой порт чей?
    options:
      - text: "Слева порт хоста, справа порт внутри контейнера"
        correct: true
      - text: "Слева контейнер, справа хост"
      - text: "Оба относятся к контейнеру"
      - text: "Порядок не имеет значения"
    explanation: |
      Мнемоника: снаружи внутрь, как читается слева направо. Перепутанный
      порядок даёт «порт занят» или подключение в пустоту.

  - id: docker-publish-localhost
    kind: single
    prompt: |
      Чем `127.0.0.1:8000:8000` лучше, чем просто `8000:8000`?
    options:
      - text: "Порт публикуется только на локальном интерфейсе, а не во все сети машины — иначе база доступна всем в той же сети Wi-Fi"
        correct: true
      - text: "Так быстрее работает сеть"
      - text: "Так порт не конфликтует с другими контейнерами"
      - text: "Разницы нет"
    explanation: |
      Для локальной разработки правильное поведение по умолчанию. Открытый
      наружу Postgres без пароля в общественной сети — сценарий вполне
      реальный.

  - id: docker-depends-on
    kind: single
    prompt: |
      В compose стоит `depends_on: [postgres]`, но приложение всё равно падает
      на старте с ошибкой подключения. Почему?
    options:
      - text: "depends_on без condition ждёт только запуска контейнера, а не готовности сервиса принимать соединения"
        correct: true
      - text: "depends_on не работает без указания сети"
      - text: "Нужно перечислить сервисы в другом порядке в файле"
      - text: "Приложение обращается по неверному порту"
    explanation: |
      Лечится healthcheck у зависимости и `condition: service_healthy`. Второй
      честный вариант — ретраи подключения в самом приложении, потому что база
      может стать недоступной и после старта.

  - id: docker-compose-build-flag
    kind: single
    prompt: |
      Правку в коде внесли, `docker compose up` выполнили, но поведение
      старое. Что забыли?
    options:
      - text: "--build: без него используется ранее собранный образ"
        correct: true
      - text: "docker compose restart"
      - text: "Удалить тома"
      - text: "Перезапустить демон Docker"
    explanation: |
      Классическая потеря получаса на отладку вчерашней версии. Альтернатива
      для разработки — монтировать код каталогом, тогда пересборка не нужна.

  - id: docker-exit-137
    kind: single
    prompt: |
      Контейнер завершился с кодом 137. Что это значит?
    options:
      - text: "Он был убит: почти всегда из-за нехватки памяти (OOM), реже — принудительным kill -9"
        correct: true
      - text: "Команда не найдена в образе"
      - text: "Ошибка в аргументах docker run"
      - text: "Штатное завершение по SIGTERM"
    explanation: |
      Самый информативный из кодов: он говорит, что программа не сломалась, а
      ей не хватило ресурсов. Лечится лимитом памяти или уменьшением аппетита —
      например, обработкой данных порциями.

  - id: docker-exit-127
    kind: single
    prompt: |
      Код выхода 127. Куда смотреть?
    options:
      - text: "Команда не найдена в образе: опечатка либо программа не установлена в этом базовом образе"
        correct: true
      - text: "Не хватило памяти"
      - text: "Ошибка приложения, читать логи"
      - text: "Контейнер остановлен пользователем"
    explanation: |
      Частый случай при переходе на slim- и alpine-образы: привычной утилиты
      вроде curl или bash там просто нет.

  - id: docker-exits-immediately
    kind: single
    prompt: |
      Контейнер запускается и сразу завершается без ошибок. Почему?
    options:
      - text: "Основной процесс закончил работу: контейнер живёт ровно столько, сколько живёт процесс с PID 1"
        correct: true
      - text: "Не проброшены порты"
      - text: "Не подключён том"
      - text: "Не хватает прав"
    explanation: |
      Отсюда и то, что `docker run образ bash` без -it завершается немедленно:
      bash не получил терминала, читать нечего, процесс закончился.

  - id: docker-latest-tag
    kind: single
    prompt: |
      Почему в CI и в проде не используют тег `latest`?
    options:
      - text: "Это не «последняя версия», а просто тег по умолчанию: он меняется молча, и сборка перестаёт быть воспроизводимой"
        correct: true
      - text: "Он всегда указывает на устаревший образ"
      - text: "Он требует авторизации в реестре"
      - text: "Он не поддерживает многоступенчатые сборки"
    explanation: |
      Сегодня сборка зелёная, завтра тот же коммит красный, потому что за ночь
      обновился базовый образ. Фиксация версии убирает целый класс необъяснимых
      падений.

  - id: docker-secrets-in-layers
    kind: single
    prompt: |
      В Dockerfile скопировали файл с ключом, а следующей строкой его удалили.
      Безопасно ли это?
    options:
      - text: "Нет: слой с файлом остаётся в образе навсегда, и его содержимое можно извлечь"
        correct: true
      - text: "Да, удаление в следующем слое стирает файл из образа"
      - text: "Да, если использовать RUN rm вместо COPY"
      - text: "Да, при сборке с --no-cache"
    explanation: |
      Ровно та же логика, что с секретом в истории git: удаление в следующей
      версии не убирает его из предыдущих. Секреты передают переменными
      окружения или механизмом секретов сборки.

  - id: docker-sock-danger
    kind: single
    prompt: |
      Чем опасно пробросить `/var/run/docker.sock` внутрь контейнера?
    options:
      - text: "Контейнер получает полный контроль над демоном хоста: он может запустить привилегированный контейнер и смонтировать корень хоста"
        correct: true
      - text: "Замедляется работа сети"
      - text: "Перестают работать тома"
      - text: "Ничем: это стандартная практика"
    explanation: |
      В этом проекте песочница ката намеренно не получает сокет, и на это есть
      тест: иначе учебный код пользователя получал бы права на всю машину.

  - id: docker-alpine-tradeoff
    kind: single
    prompt: |
      Чем может обернуться переход на alpine ради размера образа?
    options:
      - text: "Он использует musl вместо glibc: часть пакетов Python приходится собирать из исходников, а поведение иногда отличается"
        correct: true
      - text: "Alpine не поддерживает тома"
      - text: "Alpine работает только с одним процессом"
      - text: "Alpine нельзя использовать в многоступенчатой сборке"
    explanation: |
      Экономия сотни мегабайт иногда оборачивается многократным ростом времени
      сборки и трудноуловимыми различиями в работе. Для Python чаще берут
      slim-вариант на Debian.

  - id: docker-non-root
    kind: single
    prompt: |
      Зачем добавлять `USER appuser` в Dockerfile?
    options:
      - text: "Чтобы процесс не работал от root: при выходе за пределы контейнера ущерб будет заметно меньше"
        correct: true
      - text: "Чтобы уменьшить размер образа"
      - text: "Чтобы ускорить запуск"
      - text: "Чтобы работали тома"
    explanation: |
      Изоляция контейнера слабее, чем у виртуальной машины, и root внутри при
      небрежной настройке близок к root на хосте. Одна строка снимает целый
      класс проблем.
