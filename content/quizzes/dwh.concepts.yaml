questions:
  - id: dwh-columnar-why
    kind: single
    prompt: |
      Аналитический запрос считает сумму по одной колонке из ста, по 50 млн строк.
      Почему поколоночное хранилище справится в разы быстрее построчного?
    options:
      - text: "Оно прочитает с диска только нужную колонку, а построчное вынуждено поднять все сто"
        correct: true
      - text: "Оно всегда держит все данные в оперативной памяти"
      - text: "Оно автоматически создаёт индексы по каждой колонке"
      - text: "Оно выполняет запрос параллельно, а построчное всегда последовательно"
    explanation: |
      Дело в физическом расположении данных, а не в кешах или индексах. Построчное
      хранение кладёт все колонки строки рядом, поэтому чтение одной колонки
      поднимает с диска и остальные 99. Поколоночное кладёт рядом значения одной
      колонки — читается только она. Вторым эффектом однородные значения в колонке
      сжимаются в разы лучше разнородных, и объём чтения падает ещё сильнее.
      Обратная сторона: достать одну строку целиком становится дорого.

  - id: dwh-raw-layer-purpose
    kind: single
    prompt: |
      Зачем хранить сырой слой, если очищенные данные всё равно лежат в ядре, а
      сырьё занимает место и никем не читается напрямую?
    options:
      - text: "Он позволяет пересобрать ядро и витрины заново, когда в логике трансформации найдётся ошибка"
        correct: true
      - text: "Из него быстрее строятся отчёты, потому что нет соединений"
      - text: "Он требуется для соблюдения ACID при загрузке"
      - text: "Он нужен только как резервная копия источника на случай его отказа"
    explanation: |
      Ошибка в трансформации — вопрос времени, а не вероятности. Если сырой слой
      есть, её чинят и перезапускают пересчёт. Если его нет, единственный путь —
      заново выгружать из источника, а источник мог измениться, потерять историю
      или вообще перестать отдавать старые периоды. Резервное копирование —
      побочный эффект, а не цель.

  - id: dwh-inmon-vs-kimball
    kind: single
    prompt: |
      Стартап, три источника данных, отдел продаж требует первую витрину «через
      месяц». Какой подход к проектированию уместнее и почему?
    options:
      - text: "Кимбалл: размерная витрина под конкретный процесс даёт результат за недели"
        correct: true
      - text: "Инмон: сначала нормализованное корпоративное хранилище, иначе модель разъедется"
      - text: "Ни один не подходит, при трёх источниках хранилище не нужно вовсе"
      - text: "Data Vault: он единственный допускает поэтапное расширение"
    explanation: |
      Подход Кимбалла идёт снизу вверх: витрина под конкретный бизнес-процесс
      строится за недели. Инмон требует сначала смоделировать предметную область
      целиком, и первый полезный результат появляется через месяцы — при трёх
      источниках и сроке в месяц это не подходит. Риск Кимбалла известен: если
      измерения в разных витринах определены по-разному, сравнить их не выйдет,
      поэтому общие измерения согласовывают заранее.

  - id: dwh-elt-enabler
    kind: single
    prompt: |
      Что сделало возможным массовый переход от ETL к ELT?
    options:
      - text: "Появление MPP-хранилищ с горизонтальным масштабированием вычислений и удешевление хранения"
        correct: true
      - text: "Появление Python и удобных библиотек для работы с данными"
      - text: "Переход компаний на потоковую обработку вместо пакетной"
      - text: "Требования регуляторов хранить сырые данные"
    explanation: |
      ELT грузит сырьё прямо в хранилище и преобразует его силами самого
      хранилища. Пока вычислительная мощность хранилища была дефицитом, это было
      непозволительно дорого. Ситуацию изменили MPP-системы (Greenplum,
      ClickHouse, Snowflake, BigQuery), масштабирующие вычисления горизонтально,
      и падение цены хранения, сделавшее сырой слой доступным. Именно на ELT
      построен dbt.

  - id: dwh-streaming-when
    kind: single
    prompt: |
      Заказчик говорит: «нужно в реальном времени». Что определяет, действительно
      ли нужна потоковая обработка, а не пакетная?
    options:
      - text: "Становятся ли данные бесполезными при задержке в часы — то есть названная цена опоздания"
        correct: true
      - text: "Объём данных: свыше терабайта в сутки batch не справляется"
      - text: "Наличие Kafka в инфраструктуре компании"
      - text: "Требование бизнеса, оно не обсуждается"
    explanation: |
      Потоковая обработка дороже в разработке и эксплуатации: опоздавшие события,
      оконные агрегаты, семантика доставки, сложность пересчёта при ошибке в
      логике. Она оправдана там, где задержка обесценивает данные — антифрод,
      мониторинг, динамическое ценообразование. «Хотим в реальном времени» без
      названной цены опоздания требованием не является: это пожелание, которое
      надо перевести в число.

  - id: dwh-oltp-vs-olap
    kind: single
    prompt: |
      Чем нагрузка OLAP отличается от OLTP?
    options:
      - text: "OLTP — много коротких операций над отдельными записями; OLAP — редкие запросы, читающие миллионы строк по нескольким колонкам"
        correct: true
      - text: "OLAP работает с меньшими объёмами данных"
      - text: "OLTP не поддерживает транзакции"
      - text: "Разница только в используемом языке запросов"
    explanation: |
      Из этого различия вырастает всё остальное: строковое хранение против
      колоночного, нормализация против звезды, индексы под точечный доступ
      против отсечения партиций.

  - id: dwh-why-separate-warehouse
    kind: single
    prompt: |
      Почему аналитику не строят прямо на боевой базе приложения?
    options:
      - text: "Тяжёлые запросы мешают работе приложения, схема приложения неудобна для анализа, а история в ней обычно не хранится"
        correct: true
      - text: "Боевая база технически не позволяет выполнять SELECT"
      - text: "Из-за требований законодательства"
      - text: "Потому что в ней нет индексов"
    explanation: |
      Три причины разного рода: производительность, удобство модели и наличие
      истории. Третья часто решающая: приложение хранит текущее состояние, а
      аналитике нужно «как было тогда».

  - id: dwh-layers-purpose
    kind: single
    prompt: |
      Зачем нужен слой сырых данных, если можно грузить сразу в витрины?
    options:
      - text: "Он позволяет пересчитать всё заново при обнаружении ошибки в логике преобразования, не обращаясь к источнику повторно"
        correct: true
      - text: "Он ускоряет запросы аналитиков"
      - text: "Он экономит место в хранилище"
      - text: "Он нужен только для соблюдения регламентов"
    explanation: |
      Сырой слой — это страховка от собственных ошибок. Без него исправление
      логики требует новой выгрузки из источника, а источник может уже не
      содержать нужных данных.

  - id: dwh-data-lake-vs-warehouse
    kind: single
    prompt: |
      Чем озеро данных отличается от хранилища?
    options:
      - text: "Озеро хранит данные в исходном виде без обязательной схемы, схема применяется при чтении; хранилище требует схему при записи"
        correct: true
      - text: "Озеро дешевле, но не поддерживает SQL"
      - text: "Озеро хранит только неструктурированные данные"
      - text: "Хранилище работает медленнее озера"
    explanation: |
      Обратная сторона гибкости озера — «болото данных»: без каталога,
      контрактов и владельцев в нём быстро накапливается то, что никто не может
      интерпретировать.

  - id: dwh-lakehouse
    kind: single
    prompt: |
      Что такое LakeHouse?
    options:
      - text: "Попытка совместить дешёвое хранение озера с транзакциями и схемой хранилища — за счёт табличных форматов вроде Iceberg и Delta"
        correct: true
      - text: "Озеро данных, размещённое в облаке"
      - text: "Хранилище с колоночным форматом"
      - text: "Витрина данных для одного отдела"
    explanation: |
      Ключевая технология здесь — именно табличный формат: он добавляет к
      файлам в объектном хранилище атомарные коммиты, эволюцию схемы и
      MERGE INTO.

  - id: dwh-data-mart
    kind: single
    prompt: |
      Что такое витрина данных (data mart)?
    options:
      - text: "Подмножество хранилища, подготовленное под задачи конкретной команды или предметной области"
        correct: true
      - text: "Интерфейс для выгрузки данных пользователями"
      - text: "Резервная копия хранилища"
      - text: "Слой сырых данных"
    explanation: |
      Витрины дают удобство и скорость ценой дублирования. Главный риск —
      расхождение определений: у двух витрин «активный клиент» может считаться
      по-разному, и цифры перестают сходиться.

  - id: dwh-etl-vs-elt
    kind: single
    prompt: |
      В чём практическая разница ETL и ELT?
    options:
      - text: "В ELT сырые данные сначала грузятся в хранилище и преобразуются его же силами, поэтому исходник остаётся доступен для пересчёта"
        correct: true
      - text: "В ELT нет этапа преобразования"
      - text: "ETL применяется только к потоковым данным"
      - text: "Разница только в названии"
    explanation: |
      ELT стал возможен, когда хранилища научились дёшево масштабировать
      вычисления. Именно на нём построен подход dbt: преобразования — это SQL,
      выполняемый самим хранилищем.

  - id: dwh-idempotent-load
    kind: single
    prompt: |
      Почему загрузка в хранилище должна быть идемпотентной?
    options:
      - text: "Потому что повторный запуск неизбежен — ретрай, ручной перезапуск, backfill — и он не должен задваивать данные"
        correct: true
      - text: "Потому что этого требует колоночный формат"
      - text: "Чтобы уменьшить объём хранилища"
      - text: "Это требование только для потоковой загрузки"
    explanation: |
      Практические приёмы те же, что в оркестрации: удаление и вставка периода
      в одной транзакции, подмена партиции, слияние по ключу.

  - id: dwh-grain-definition
    kind: single
    prompt: |
      Что такое зерно (grain) таблицы фактов?
    options:
      - text: "Уровень детализации: что означает одна строка — например, одна позиция чека или один чек целиком"
        correct: true
      - text: "Размер партиции таблицы"
      - text: "Ключ распределения по узлам"
      - text: "Число колонок в таблице"
    explanation: |
      Зерно определяют первым, до колонок и ключей. Смешение зёрен в одной
      таблице — самая дорогая ошибка моделирования: суммы начинают задваиваться
      без видимой причины.

  - id: dwh-history-need
    kind: single
    prompt: |
      Зачем хранилищу история изменений измерений, если источник её не хранит?
    options:
      - text: "Чтобы отчёт за прошлый период можно было пересчитать в тех условиях, которые действовали тогда"
        correct: true
      - text: "Чтобы уменьшить размер таблиц фактов"
      - text: "Чтобы ускорить соединения"
      - text: "Чтобы соблюсти нормальные формы"
    explanation: |
      Без истории вопрос «сколько продали клиентам из Москвы в марте» имеет
      два разных ответа: по нынешнему адресу клиента и по адресу на момент
      покупки — и второй посчитать нечем.

  - id: dwh-batch-vs-stream
    kind: single
    prompt: |
      Когда потоковая загрузка оправдана вместо пакетной?
    options:
      - text: "Когда решение принимается по свежим данным в течение минут — иначе сложность потоковой обработки не окупается"
        correct: true
      - text: "Всегда: потоковая обработка современнее"
      - text: "Когда объём данных превышает терабайт"
      - text: "Когда источник — реляционная база"
    explanation: |
      Потоковая обработка дороже во всём: разработка, отладка, восстановление
      после сбоя, пересчёт истории. Требование «данные должны быть свежими»
      нужно проверять вопросом «что изменится в решении, если они будут за
      вчера».

  - id: dwh-cdc
    kind: single
    prompt: |
      Что такое CDC (Change Data Capture)?
    options:
      - text: "Захват изменений источника — обычно из журнала транзакций — вместо периодической полной выгрузки"
        correct: true
      - text: "Проверка качества данных при загрузке"
      - text: "Сжатие данных при передаче"
      - text: "Кеширование результатов запросов"
    explanation: |
      Главное преимущество — нагрузка на источник почти не растёт, и видны
      удаления, которые полная выгрузка «по updated_at» не показывает вовсе.

  - id: dwh-full-vs-incremental-load
    kind: single
    prompt: |
      Таблица источника содержит 500 млн строк, меняется 0.1% в сутки. Какой
      способ загрузки выбрать?
    options:
      - text: "Инкрементальный по метке изменения или через CDC — полная выгрузка ежедневно тратит ресурсы впустую"
        correct: true
      - text: "Полную выгрузку: она проще и надёжнее"
      - text: "Полную выгрузку раз в час"
      - text: "Загрузку только новых строк по возрастанию первичного ключа"
    explanation: |
      Последний вариант пропустит ОБНОВЛЁННЫЕ строки: у них ключ не меняется.
      Это частая ошибка — путать «новые записи» и «изменившиеся».

  - id: dwh-late-arriving-data
    kind: single
    prompt: |
      Данные за 1 марта пришли 5 марта. Что должно произойти в правильно
      устроенном хранилище?
    options:
      - text: "Строки лягут в период, к которому относятся по бизнес-времени, а витрина за 1 марта будет пересчитана"
        correct: true
      - text: "Строки попадут в 5 марта — по времени загрузки"
      - text: "Строки будут отброшены как устаревшие"
      - text: "Строки попадут в карантин навсегда"
    explanation: |
      Отсюда различение времени события и времени загрузки — две разные
      колонки, обе нужны. И отсюда же требование к инкрементальной загрузке
      иметь окно перекрытия.

  - id: dwh-slowly-changing-link
    kind: single
    prompt: |
      Как связаны зерно таблицы фактов и SCD в измерениях?
    options:
      - text: "Факт ссылается на конкретную ВЕРСИЮ измерения, действовавшую на момент события, — иначе история измерения бесполезна"
        correct: true
      - text: "Никак: это независимые механизмы"
      - text: "SCD применяется только к таблицам фактов"
      - text: "Зерно определяется типом SCD"
    explanation: |
      Технически это означает ссылку на суррогатный ключ версии, а не на
      естественный ключ сущности. Именно ради этого суррогатные ключи в
      измерениях и заводят.
