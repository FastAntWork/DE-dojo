questions:
  - id: dwh-columnar-why
    kind: single
    prompt: |
      Аналитический запрос считает сумму по одной колонке из ста, по 50 млн строк.
      Почему поколоночное хранилище справится в разы быстрее построчного?
    options:
      - text: "Оно прочитает с диска только нужную колонку, а построчное вынуждено поднять все сто"
        correct: true
      - text: "Оно всегда держит все данные в оперативной памяти"
      - text: "Оно автоматически создаёт индексы по каждой колонке"
      - text: "Оно выполняет запрос параллельно, а построчное всегда последовательно"
    explanation: |
      Дело в физическом расположении данных, а не в кешах или индексах. Построчное
      хранение кладёт все колонки строки рядом, поэтому чтение одной колонки
      поднимает с диска и остальные 99. Поколоночное кладёт рядом значения одной
      колонки — читается только она. Вторым эффектом однородные значения в колонке
      сжимаются в разы лучше разнородных, и объём чтения падает ещё сильнее.
      Обратная сторона: достать одну строку целиком становится дорого.

  - id: dwh-raw-layer-purpose
    kind: single
    prompt: |
      Зачем хранить сырой слой, если очищенные данные всё равно лежат в ядре, а
      сырьё занимает место и никем не читается напрямую?
    options:
      - text: "Он позволяет пересобрать ядро и витрины заново, когда в логике трансформации найдётся ошибка"
        correct: true
      - text: "Из него быстрее строятся отчёты, потому что нет соединений"
      - text: "Он требуется для соблюдения ACID при загрузке"
      - text: "Он нужен только как резервная копия источника на случай его отказа"
    explanation: |
      Ошибка в трансформации — вопрос времени, а не вероятности. Если сырой слой
      есть, её чинят и перезапускают пересчёт. Если его нет, единственный путь —
      заново выгружать из источника, а источник мог измениться, потерять историю
      или вообще перестать отдавать старые периоды. Резервное копирование —
      побочный эффект, а не цель.

  - id: dwh-inmon-vs-kimball
    kind: single
    prompt: |
      Стартап, три источника данных, отдел продаж требует первую витрину «через
      месяц». Какой подход к проектированию уместнее и почему?
    options:
      - text: "Кимбалл: размерная витрина под конкретный процесс даёт результат за недели"
        correct: true
      - text: "Инмон: сначала нормализованное корпоративное хранилище, иначе модель разъедется"
      - text: "Ни один не подходит, при трёх источниках хранилище не нужно вовсе"
      - text: "Data Vault: он единственный допускает поэтапное расширение"
    explanation: |
      Подход Кимбалла идёт снизу вверх: витрина под конкретный бизнес-процесс
      строится за недели. Инмон требует сначала смоделировать предметную область
      целиком, и первый полезный результат появляется через месяцы — при трёх
      источниках и сроке в месяц это не подходит. Риск Кимбалла известен: если
      измерения в разных витринах определены по-разному, сравнить их не выйдет,
      поэтому общие измерения согласовывают заранее.

  - id: dwh-elt-enabler
    kind: single
    prompt: |
      Что сделало возможным массовый переход от ETL к ELT?
    options:
      - text: "Появление MPP-хранилищ с горизонтальным масштабированием вычислений и удешевление хранения"
        correct: true
      - text: "Появление Python и удобных библиотек для работы с данными"
      - text: "Переход компаний на потоковую обработку вместо пакетной"
      - text: "Требования регуляторов хранить сырые данные"
    explanation: |
      ELT грузит сырьё прямо в хранилище и преобразует его силами самого
      хранилища. Пока вычислительная мощность хранилища была дефицитом, это было
      непозволительно дорого. Ситуацию изменили MPP-системы (Greenplum,
      ClickHouse, Snowflake, BigQuery), масштабирующие вычисления горизонтально,
      и падение цены хранения, сделавшее сырой слой доступным. Именно на ELT
      построен dbt.

  - id: dwh-streaming-when
    kind: single
    prompt: |
      Заказчик говорит: «нужно в реальном времени». Что определяет, действительно
      ли нужна потоковая обработка, а не пакетная?
    options:
      - text: "Становятся ли данные бесполезными при задержке в часы — то есть названная цена опоздания"
        correct: true
      - text: "Объём данных: свыше терабайта в сутки batch не справляется"
      - text: "Наличие Kafka в инфраструктуре компании"
      - text: "Требование бизнеса, оно не обсуждается"
    explanation: |
      Потоковая обработка дороже в разработке и эксплуатации: опоздавшие события,
      оконные агрегаты, семантика доставки, сложность пересчёта при ошибке в
      логике. Она оправдана там, где задержка обесценивает данные — антифрод,
      мониторинг, динамическое ценообразование. «Хотим в реальном времени» без
      названной цены опоздания требованием не является: это пожелание, которое
      надо перевести в число.
