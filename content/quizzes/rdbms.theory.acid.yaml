questions:
  - id: acid-anomaly-to-level
    kind: single
    prompt: |
      Транзакция дважды читает одну строку и видит разные значения, потому что
      между чтениями другая транзакция её изменила и закоммитила.
      Как называется аномалия и какой уровень изоляции её запрещает?
    options:
      - text: "Неповторяемое чтение; запрещается начиная с Repeatable Read"
        correct: true
      - text: "Грязное чтение; запрещается начиная с Read Committed"
      - text: "Фантомное чтение; запрещается только на Serializable"
      - text: "Потерянное обновление; запрещается на любом уровне"
    explanation: |
      Грязное чтение — это чтение незакоммиченных данных. Фантом — появление новых
      строк, подходящих под условие, а не изменение уже прочитанной. Здесь именно
      неповторяемое чтение. В PostgreSQL Read Committed допускает его, Repeatable
      Read — нет.
    source: "postgres-docs:transaction-iso.html"

  - id: acid-pg-repeatable-read
    kind: single
    prompt: |
      Чем Repeatable Read в PostgreSQL строже требований стандарта SQL?
    options:
      - text: "Он дополнительно запрещает фантомные чтения, хотя стандарт этого не требует"
        correct: true
      - text: "Он запрещает грязную запись, чего стандарт не требует"
      - text: "Он полностью эквивалентен Serializable"
      - text: "Он слабее стандарта: допускает неповторяемое чтение"
    explanation: |
      Благодаря снимку данных на момент старта транзакции PostgreSQL на уровне
      Repeatable Read не показывает и фантомов. Но это ещё не Serializable:
      аномалии сериализации (write skew) остаются, и от них спасает только
      уровень Serializable с его проверкой конфликтов и ошибкой 40001.

  - id: acid-mvcc-readers-writers
    kind: single
    prompt: |
      Почему в PostgreSQL читатель не блокируется писателем?
    options:
      - text: "Писатель создаёт новую версию строки, а читатель продолжает видеть старую версию, подходящую под его снимок"
        correct: true
      - text: "Читатели работают с копией базы в разделяемой памяти"
      - text: "Читатели неявно понижают уровень изоляции до Read Uncommitted"
      - text: "Postgres ставит на чтение разделяемую блокировку, совместимую с блокировкой записи"
    explanation: |
      Это и есть MVCC: UPDATE не меняет строку на месте, а помечает старую версию
      и добавляет новую. Побочный эффект — мёртвые версии, которые нужно убирать
      VACUUM, иначе таблица распухает. Отсюда же берётся и то, что долгая
      транзакция мешает очистке: её снимок всё ещё требует старых версий.
    source: "postgres-docs:mvcc-intro.html"

  - id: acid-letters
    kind: single
    prompt: |
      Что означает буква D в ACID?
    options:
      - text: "Долговечность: зафиксированная транзакция переживёт сбой, потому что изменения записаны в журнал"
        correct: true
      - text: "Детерминированность результата"
      - text: "Изоляцию от других транзакций"
      - text: "Отсутствие дубликатов"
    explanation: |
      Именно журнал предзаписи, а не файлы данных, обеспечивает долговечность:
      к моменту подтверждения коммита изменения гарантированно в журнале, а
      страницы данных могут дописаться позже.

  - id: acid-atomicity-meaning
    kind: single
    prompt: |
      Что гарантирует атомарность?
    options:
      - text: "Транзакция применяется целиком или не применяется вовсе — промежуточного состояния не остаётся"
        correct: true
      - text: "Транзакция выполняется мгновенно"
      - text: "Транзакция не видит изменений других транзакций"
      - text: "Одна транзакция изменяет ровно одну строку"
    explanation: |
      Практическое применение — идемпотентная загрузка через DELETE + INSERT:
      без общей транзакции падение между ними оставляет витрину без периода.

  - id: acid-consistency-meaning
    kind: single
    prompt: |
      Что означает согласованность (C) в ACID?
    options:
      - text: "Транзакция переводит базу из одного корректного состояния в другое, не нарушая объявленных ограничений"
        correct: true
      - text: "Все реплики содержат одинаковые данные"
      - text: "Все транзакции выполняются в одном порядке"
      - text: "Данные не противоречат данным в других системах"
    explanation: |
      Согласованность реплик — совсем другая тема (это C из теоремы CAP, и
      означает она иное). Здесь речь о целостности по ограничениям самой базы.

  - id: acid-dirty-read
    kind: single
    prompt: |
      Что такое грязное чтение?
    options:
      - text: "Чтение изменений транзакции, которая ещё не зафиксирована и может откатиться"
        correct: true
      - text: "Чтение строки, изменённой после начала текущей транзакции"
      - text: "Повторное чтение, вернувшее другой набор строк"
      - text: "Чтение из устаревшей реплики"
    explanation: |
      В PostgreSQL грязное чтение невозможно ни на одном уровне изоляции: даже
      READ UNCOMMITTED ведёт себя как READ COMMITTED. Это следствие MVCC.

  - id: acid-non-repeatable-vs-phantom
    kind: single
    prompt: |
      Чем неповторяющееся чтение отличается от фантомного?
    options:
      - text: "Неповторяющееся — та же строка при повторном чтении имеет другое значение; фантомное — повторный запрос возвращает НОВЫЕ строки, подходящие под условие"
        correct: true
      - text: "Это одно и то же явление"
      - text: "Фантомное чтение возможно только при READ UNCOMMITTED"
      - text: "Неповторяющееся чтение касается только удалённых строк"
    explanation: |
      Различие важно, потому что уровни изоляции защищают от них по-разному:
      REPEATABLE READ по стандарту закрывает первое, но не обязан закрывать
      второе.

  - id: acid-serializable-cost
    kind: single
    prompt: |
      Чем платят за уровень изоляции SERIALIZABLE в PostgreSQL?
    options:
      - text: "Часть транзакций будет отменена с ошибкой сериализации, и приложение обязано уметь их повторять"
        correct: true
      - text: "Транзакции выполняются строго по одной, параллелизм пропадает"
      - text: "Запись становится невозможной"
      - text: "Ничем: это уровень по умолчанию"
    explanation: |
      PostgreSQL реализует его через SSI, а не через блокировки, поэтому
      параллелизм сохраняется. Но код, не готовый к повтору транзакции, на этом
      уровне работать не будет.

  - id: acid-default-level-pg
    kind: single
    prompt: |
      Какой уровень изоляции в PostgreSQL по умолчанию и что он гарантирует?
    options:
      - text: "READ COMMITTED: каждый оператор видит снимок на момент СВОЕГО начала, поэтому два одинаковых запроса в одной транзакции могут дать разный результат"
        correct: true
      - text: "REPEATABLE READ: снимок фиксируется на всю транзакцию"
      - text: "SERIALIZABLE"
      - text: "READ UNCOMMITTED"
    explanation: |
      Это удивляет тех, кто ждёт стабильной картины внутри транзакции. Если
      нужен единый снимок для нескольких запросов — например, для сверки, —
      уровень надо повышать явно.

  - id: acid-lost-update
    kind: find-error
    prompt: |
      ```sql
      -- два процесса выполняют одновременно
      SELECT balance FROM accounts WHERE id = 1;  -- прочитали 100
      -- в приложении: new = 100 - 30
      UPDATE accounts SET balance = 70 WHERE id = 1;
      ```
      Что здесь не так?
    options:
      - text: "Потерянное обновление: второй процесс перезапишет результат первого. Нужно либо UPDATE ... SET balance = balance - 30, либо SELECT FOR UPDATE"
        correct: true
      - text: "Не хватает индекса по id"
      - text: "UPDATE должен идти раньше SELECT"
      - text: "Ничего: READ COMMITTED защищает от этого"
    explanation: |
      Классика. Вычисление нового значения в приложении на основе прочитанного
      — это гонка. Атомарное изменение относительно текущего значения или явная
      блокировка строки решают проблему.

  - id: acid-select-for-update
    kind: single
    prompt: |
      Что делает `SELECT ... FOR UPDATE`?
    options:
      - text: "Блокирует выбранные строки до конца транзакции, не давая другим транзакциям их изменить"
        correct: true
      - text: "Блокирует всю таблицу"
      - text: "Помечает строки для последующего автоматического обновления"
      - text: "Повышает уровень изоляции текущей транзакции"
    explanation: |
      Инструмент против потерянных обновлений, когда новое значение нельзя
      выразить относительно старого. Плата — сериализация доступа к этим
      строкам и риск взаимоблокировок.

  - id: acid-deadlock
    kind: single
    prompt: |
      Два процесса блокируют строки A и B в разном порядке и встают.
      Что произойдёт в PostgreSQL и как это предотвратить?
    options:
      - text: "Сервер обнаружит взаимоблокировку и отменит одну из транзакций; предотвращают согласованным порядком захвата ресурсов"
        correct: true
      - text: "Оба процесса будут ждать вечно"
      - text: "Сервер отменит обе транзакции"
      - text: "Взаимоблокировки в PostgreSQL невозможны"
    explanation: |
      Согласованный порядок — самое надёжное средство: если все обновляют
      строки в порядке возрастания идентификатора, цикла ожидания не возникает
      в принципе.

  - id: acid-mvcc-snapshot
    kind: single
    prompt: |
      Как MVCC позволяет читателям не блокировать писателей?
    options:
      - text: "Каждая транзакция видит свой снимок данных, составленный из подходящих версий строк, — старые версии остаются доступны"
        correct: true
      - text: "Читатели работают с копией базы в памяти"
      - text: "Читатели ставят разделяемые блокировки, а писатели их ждут"
      - text: "Чтение выполняется только с реплики"
    explanation: |
      Цена этого удобства — мёртвые версии строк, которые надо убирать. Отсюда
      VACUUM, распухание таблиц и весь связанный класс проблем эксплуатации.

  - id: acid-long-transaction-harm
    kind: single
    prompt: |
      Чем опасна транзакция, открытая на несколько часов?
    options:
      - text: "Она держит снимок, и VACUUM не может убрать мёртвые строки, которые могут ей понадобиться: таблицы распухают по всей базе"
        correct: true
      - text: "Она блокирует всю таблицу на чтение"
      - text: "Она увеличивает размер журнала WAL пропорционально времени"
      - text: "Ничем, если она только читает"
    explanation: |
      Особенно коварно именно для читающих транзакций: они ничего не блокируют
      в привычном смысле, а вред наносят всей базе. Забытый открытый сеанс в
      psql — типичная причина.

  - id: acid-idle-in-transaction
    kind: single
    prompt: |
      В pg_stat_activity сеанс в состоянии `idle in transaction` уже два часа.
      Что это значит?
    options:
      - text: "Транзакция открыта, но ничего не выполняет: она держит снимок и, возможно, блокировки — типичная забытая транзакция в приложении"
        correct: true
      - text: "Сеанс простаивает без транзакции, это нормально"
      - text: "Запрос выполняется два часа"
      - text: "Сеанс ожидает освобождения блокировки"
    explanation: |
      Отличать от простого idle критично: первое безобидно, второе вредит.
      Против таких сеансов ставят idle_in_transaction_session_timeout.

  - id: acid-cap-vs-acid
    kind: single
    prompt: |
      Как соотносятся ACID и теорема CAP?
    options:
      - text: "ACID — про гарантии транзакций в одной системе, CAP — про компромиссы распределённой системы при разделении сети; буква C означает в них разное"
        correct: true
      - text: "CAP — это расширение ACID на распределённые системы"
      - text: "Это два названия одного набора свойств"
      - text: "ACID применим только к SQL, CAP только к NoSQL"
    explanation: |
      Частая путаница на собеседованиях. Согласованность в ACID — соблюдение
      ограничений целостности; в CAP — то, что все узлы видят одинаковые
      данные.

  - id: acid-transaction-in-etl
    kind: single
    prompt: |
      Загрузка выполняет DELETE за период и INSERT новых данных. Почему они
      обязаны быть в одной транзакции?
    options:
      - text: "Иначе сбой между операциями оставит витрину без данных за период — состояние хуже, чем задвоение, и заметное позже"
        correct: true
      - text: "Иначе PostgreSQL откажется выполнять INSERT"
      - text: "Иначе не сработают индексы"
      - text: "Это не обязательно, если включены ретраи"
    explanation: |
      Ретраи здесь не спасают: между падением и повтором витрину успеют
      прочитать. Атомарность — единственная гарантия, что промежуточного
      состояния не увидит никто.

  - id: acid-read-committed-two-queries
    kind: single
    prompt: |
      В одной транзакции на уровне READ COMMITTED выполнили один и тот же
      `SELECT count(*)` дважды и получили разные числа. Это ошибка?
    options:
      - text: "Нет, это ожидаемое поведение уровня: каждый оператор берёт свой снимок. Для стабильной картины нужен REPEATABLE READ"
        correct: true
      - text: "Да, это признак повреждения данных"
      - text: "Да, count всегда должен быть стабилен внутри транзакции"
      - text: "Нет, но только если между запросами был COMMIT"
    explanation: |
      Практический вывод для сверок: если сравниваются два агрегата, которые
      обязаны сойтись, транзакция должна быть на уровне REPEATABLE READ — иначе
      расхождение окажется мнимым.

  - id: acid-savepoint
    kind: single
    prompt: |
      Для чего нужны точки сохранения (SAVEPOINT)?
    options:
      - text: "Чтобы откатить часть транзакции, не отменяя её целиком — например, продолжить загрузку после ошибки на одной порции"
        correct: true
      - text: "Чтобы зафиксировать часть изменений досрочно"
      - text: "Чтобы ускорить длинную транзакцию"
      - text: "Чтобы разбить транзакцию на несколько независимых"
    explanation: |
      Досрочно зафиксировать часть изменений нельзя — это противоречило бы
      атомарности. Откат к точке сохранения оставляет транзакцию открытой, и
      всё сделанное до неё в силе.
