questions:
  - id: acid-anomaly-to-level
    kind: single
    prompt: |
      Транзакция дважды читает одну строку и видит разные значения, потому что
      между чтениями другая транзакция её изменила и закоммитила.
      Как называется аномалия и какой уровень изоляции её запрещает?
    options:
      - text: "Неповторяемое чтение; запрещается начиная с Repeatable Read"
        correct: true
      - text: "Грязное чтение; запрещается начиная с Read Committed"
      - text: "Фантомное чтение; запрещается только на Serializable"
      - text: "Потерянное обновление; запрещается на любом уровне"
    explanation: |
      Грязное чтение — это чтение незакоммиченных данных. Фантом — появление новых
      строк, подходящих под условие, а не изменение уже прочитанной. Здесь именно
      неповторяемое чтение. В PostgreSQL Read Committed допускает его, Repeatable
      Read — нет.
    source: "postgres-docs:transaction-iso.html"

  - id: acid-pg-repeatable-read
    kind: single
    prompt: |
      Чем Repeatable Read в PostgreSQL строже требований стандарта SQL?
    options:
      - text: "Он дополнительно запрещает фантомные чтения, хотя стандарт этого не требует"
        correct: true
      - text: "Он запрещает грязную запись, чего стандарт не требует"
      - text: "Он полностью эквивалентен Serializable"
      - text: "Он слабее стандарта: допускает неповторяемое чтение"
    explanation: |
      Благодаря снимку данных на момент старта транзакции PostgreSQL на уровне
      Repeatable Read не показывает и фантомов. Но это ещё не Serializable:
      аномалии сериализации (write skew) остаются, и от них спасает только
      уровень Serializable с его проверкой конфликтов и ошибкой 40001.

  - id: acid-mvcc-readers-writers
    kind: single
    prompt: |
      Почему в PostgreSQL читатель не блокируется писателем?
    options:
      - text: "Писатель создаёт новую версию строки, а читатель продолжает видеть старую версию, подходящую под его снимок"
        correct: true
      - text: "Читатели работают с копией базы в разделяемой памяти"
      - text: "Читатели неявно понижают уровень изоляции до Read Uncommitted"
      - text: "Postgres ставит на чтение разделяемую блокировку, совместимую с блокировкой записи"
    explanation: |
      Это и есть MVCC: UPDATE не меняет строку на месте, а помечает старую версию
      и добавляет новую. Побочный эффект — мёртвые версии, которые нужно убирать
      VACUUM, иначе таблица распухает. Отсюда же берётся и то, что долгая
      транзакция мешает очистке: её снимок всё ещё требует старых версий.
    source: "postgres-docs:mvcc-intro.html"
