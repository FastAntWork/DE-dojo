questions:
  - id: part-what-it-is
    kind: single
    prompt: |
      Что представляет собой секционированная таблица в PostgreSQL?
    options:
      - text: "Родительская таблица без данных плюс набор дочерних, каждая со своим диапазоном; для приложения это по-прежнему одна таблица"
        correct: true
      - text: "Одна таблица, разбитая на файлы на диске"
      - text: "Набор таблиц, объединяемых представлением"
      - text: "Таблица, распределённая по нескольким серверам"
    explanation: |
      Распределение по серверам — это шардирование, другая задача.
      Секционирование живёт внутри одного экземпляра и решает вопросы
      обслуживания и отсечения.

  - id: part-real-reasons
    kind: multiple
    prompt: |
      Какие причины секционировать таблицу настоящие?
    options:
      - text: "Дешёвое удаление старых данных: DROP секции вместо многочасового DELETE"
        correct: true
      - text: "Отсечение партиций при запросах по ключу секционирования"
        correct: true
      - text: "Обслуживание по частям: VACUUM и ANALYZE идут по секциям"
        correct: true
      - text: "Таблица занимает больше 100 ГБ"
    explanation: |
      Размер сам по себе не довод: PostgreSQL нормально работает с таблицами в
      сотни миллионов строк при верных индексах. Если данные не удаляются и
      запросы точечные, секционирование добавит только сложности.

  - id: part-delete-vs-drop
    kind: single
    prompt: |
      Почему удаление старых данных — главный довод в пользу секционирования?
    options:
      - text: "DELETE ста миллионов строк — это часы работы, распухание и уборка; DROP или DETACH секции мгновенны"
        correct: true
      - text: "DELETE не работает на больших таблицах"
      - text: "DROP секции освобождает место в оперативной памяти"
      - text: "DELETE блокирует всю таблицу"
    explanation: |
      Для хранилища с политикой хранения данных это решающий аргумент: без
      секций ежемесячная чистка превращается в отдельную инженерную задачу.

  - id: part-key-choice
    kind: single
    prompt: |
      Таблицу секционировали по `region`, а запросы фильтруют только по дате.
      Что получится?
    options:
      - text: "Каждый запрос будет читать все секции: вся сложность есть, выигрыша нет"
        correct: true
      - text: "Отсечение всё равно сработает по статистике"
      - text: "PostgreSQL автоматически пересекционирует таблицу"
      - text: "Запросы ускорятся за счёт меньшего размера каждой секции"
    explanation: |
      Ключ секционирования выбирается по фильтрам запросов, а не по тому, что
      кажется логичным разбиением предметной области.

  - id: part-range-list-hash
    kind: single
    prompt: |
      Когда уместно HASH-секционирование?
    options:
      - text: "Когда естественного ключа нет, а таблицу надо разбить на равные части; отсечение при этом работает только для равенства"
        correct: true
      - text: "Когда данные распределены по времени"
      - text: "Когда значений ключа мало и они известны заранее"
      - text: "Когда нужно удалять старые данные"
    explanation: |
      Второй случай — это RANGE, третий — LIST. HASH не даёт ни отсечения по
      диапазону, ни дешёвого удаления периода, поэтому применяется реже всех.

  - id: part-check-pruning
    kind: single
    prompt: |
      Как убедиться, что отсечение партиций сработало?
    options:
      - text: "Посмотреть план: в нём должны остаться только нужные секции, а не все"
        correct: true
      - text: "Сравнить время выполнения до и после"
      - text: "Проверить размер таблицы"
      - text: "Посмотреть pg_stat_user_tables"
    explanation: |
      Время может обмануть из-за кеша, а план показывает прямо: если в нём
      перечислены все секции, отсечение не сработало и надо разбираться почему.

  - id: part-pruning-fails-function
    kind: find-error
    prompt: |
      ```sql
      -- таблица секционирована по created_at
      SELECT count(*) FROM events WHERE date(created_at) = '2026-03-01';
      ```
      В плане перечислены все секции. Почему?
    options:
      - text: "Функция на ключе секционирования мешает отсечению — нужен диапазон по самой колонке"
        correct: true
      - text: "Не хватает индекса на секциях"
      - text: "Нужен ANALYZE родительской таблицы"
      - text: "count(*) отключает отсечение"
    explanation: |
      Та же природа, что у потери индекса: PostgreSQL сопоставляет границы
      секций со значениями колонки, а не со значениями функции от неё.

  - id: part-runtime-pruning
    kind: single
    prompt: |
      Значение ключа секционирования приходит параметром и неизвестно при
      планировании. Отсечение возможно?
    options:
      - text: "Да, во время выполнения: в плане это видно как Subplans Removed"
        correct: true
      - text: "Нет, отсечение работает только на этапе планирования"
      - text: "Да, но только для HASH-секционирования"
      - text: "Да, если выполнить PREPARE заранее"
    explanation: |
      Полезно знать про два вида отсечения: на этапе планирования и во время
      выполнения. Второе спасает подготовленные запросы и параметризованные
      обращения из приложения.

  - id: part-unique-key
    kind: single
    prompt: |
      Почему в секционированной таблице первичным ключом становится не `id`, а
      пара `(id, created_at)`?
    options:
      - text: "Уникальный индекс обязан включать ключ секционирования: индексы у секций свои, и глобальную уникальность без него не проверить"
        correct: true
      - text: "Так быстрее работает отсечение"
      - text: "Это требование стандарта SQL"
      - text: "Чтобы id не переполнился"
    explanation: |
      Практическое следствие серьёзнее, чем кажется: это меняет модель данных и
      все внешние ключи на эту таблицу, а не только текст DDL.

  - id: part-foreign-key
    kind: single
    prompt: |
      Можно ли сослаться внешним ключом на секционированную таблицу?
    options:
      - text: "Да, начиная с PostgreSQL 12, но целевой ключ должен включать ключ секционирования"
        correct: true
      - text: "Нет, это невозможно в любой версии"
      - text: "Да, без каких-либо ограничений"
      - text: "Только если секций не больше десяти"
    explanation: |
      Ограничение вытекает из того же: уникальность в секционированной таблице
      обеспечивается только вместе с ключом секционирования.

  - id: part-index-inheritance
    kind: single
    prompt: |
      Что произойдёт при создании индекса на родительской секционированной
      таблице?
    options:
      - text: "Он будет создан на всех секциях автоматически и на будущих тоже"
        correct: true
      - text: "Он будет создан только на родителе и не повлияет на запросы"
      - text: "Возникнет ошибка: индексы создаются только на секциях"
      - text: "Он создастся только на секциях, существующих на момент команды"
    explanation: |
      На боевой таблице это блокирует запись во все секции сразу. Приём для
      таких случаев — CREATE INDEX ON ONLY родителе, затем построение
      секционных индексов по одному с CONCURRENTLY и присоединение.

  - id: part-missing-partition
    kind: single
    prompt: |
      В таблицу вставляют строку с датой, для которой нет секции. Что
      произойдёт?
    options:
      - text: "Ошибка вставки — если нет секции по умолчанию"
        correct: true
      - text: "Секция будет создана автоматически"
      - text: "Строка попадёт в ближайшую по диапазону секцию"
      - text: "Строка будет записана в родительскую таблицу"
    explanation: |
      Отсюда обязательное создание секций заранее заданием по расписанию.
      Обнаруживать проблему первого числа месяца в три часа ночи — плохой план.

  - id: part-default-partition-trap
    kind: single
    prompt: |
      В таблице есть секция DEFAULT, и в ней лежат строки за апрель. Что
      мешает присоединить новую апрельскую секцию?
    options:
      - text: "PostgreSQL обязан проверить, что в DEFAULT нет строк, подходящих под новый диапазон; пока они там есть, присоединение не пройдёт"
        correct: true
      - text: "Ничего не мешает, строки переедут автоматически"
      - text: "Нужно сначала выполнить VACUUM"
      - text: "Нужно удалить секцию DEFAULT целиком"
    explanation: |
      Секция по умолчанию — полезная страховка от потери данных и одновременно
      источник этой неприятности. Строки приходится переносить вручную перед
      присоединением.

  - id: part-detach-concurrently
    kind: single
    prompt: |
      Зачем `DETACH PARTITION ... CONCURRENTLY`?
    options:
      - text: "Чтобы не брать исключительную блокировку родительской таблицы — на боевой системе обычный DETACH останавливает работу с ней"
        correct: true
      - text: "Чтобы отсоединение выполнялось в фоне и не занимало сессию"
      - text: "Чтобы данные секции скопировались в архив"
      - text: "Чтобы отсоединить сразу несколько секций"
    explanation: |
      После отсоединения данные остаются в отдельной обычной таблице: их можно
      выгрузить в архив, а потом удалить. Это и есть штатный способ применения
      политики хранения.

  - id: part-attach-check
    kind: single
    prompt: |
      Как сделать присоединение готовой таблицы секцией мгновенным?
    options:
      - text: "Заранее повесить на неё ограничение CHECK, совпадающее с границами секции: тогда проверять строки не потребуется"
        correct: true
      - text: "Выполнить VACUUM FULL перед присоединением"
      - text: "Отключить автоочистку на время операции"
      - text: "Присоединять только пустые таблицы"
    explanation: |
      Без ограничения PostgreSQL обязан просмотреть все строки, чтобы убедиться,
      что они попадают в диапазон. На большой таблице это долгая операция под
      блокировкой.

  - id: part-too-many
    kind: single
    prompt: |
      Таблицу разбили на суточные секции за пять лет — около 1800 штук. Что
      будет заметно?
    options:
      - text: "Вырастет время планирования запросов: планировщик обязан рассмотреть все секции, даже те, что потом отсечёт"
        correct: true
      - text: "Отсечение перестанет работать"
      - text: "Запросы начнут возвращать неполные данные"
      - text: "Ничего: чем мельче секции, тем лучше"
    explanation: |
      Ориентир — десятки и сотни секций. Симптомы перебора: выросшее
      Planning Time, раздутый системный каталог, медленный \\d+.

  - id: part-granularity
    kind: single
    prompt: |
      Как выбрать гранулярность секций?
    options:
      - text: "Достаточно крупно, чтобы секцию имело смысл обслуживать отдельно, и достаточно мелко, чтобы её удаление освобождало заметный объём — обычно месяц"
        correct: true
      - text: "Всегда по суткам: так точнее отсечение"
      - text: "Всегда по годам: так меньше объектов"
      - text: "По числу строк: ровно миллион в каждой"
    explanation: |
      Крайности одинаково плохи: суточные секции за пять лет дают тысячи
      объектов, годовые — не дают ни отсечения, ни осмысленного удаления.

  - id: part-swap-partition
    kind: single
    prompt: |
      Как секционирование помогает сделать загрузку периода идемпотентной?
    options:
      - text: "Новую версию месяца собирают в отдельной таблице, затем в одной транзакции отсоединяют старую секцию и присоединяют новую — читатель видит либо одну, либо другую"
        correct: true
      - text: "Секционирование само по себе делает вставку идемпотентной"
      - text: "Нужно удалять строки периода перед вставкой"
      - text: "Достаточно уникального индекса по ключу секционирования"
    explanation: |
      Это прямой аналог INSERT OVERWRITE PARTITION в мире Hive и Spark:
      атомарная подмена вместо удаления и вставки строк.

  - id: part-vs-sharding
    kind: single
    prompt: |
      Чем секционирование отличается от шардирования?
    options:
      - text: "Секционирование — внутри одного сервера и решает задачи обслуживания и отсечения; шардирование распределяет данные по разным серверам ради масштабирования"
        correct: true
      - text: "Это синонимы"
      - text: "Секционирование применяется к индексам, шардирование к таблицам"
      - text: "Шардирование поддерживается PostgreSQL из коробки"
    explanation: |
      Путать их — частая ошибка. Секционирование не увеличивает суммарную
      мощность: все секции обслуживает один и тот же сервер.

  - id: part-partitionwise-join
    kind: single
    prompt: |
      Две таблицы секционированы по одному ключу и соединяются по нему. Что
      может дать выигрыш?
    options:
      - text: "Посекционное соединение: соответствующие секции соединяются попарно, а не таблицы целиком; включается параметром"
        correct: true
      - text: "Автоматическое слияние секций перед соединением"
      - text: "Отсечение партиций во второй таблице по результатам первой"
      - text: "Ничего: соединение секционированных таблиц всегда медленнее"
    explanation: |
      Возможность существует, но по умолчанию выключена, потому что увеличивает
      время планирования. Включать её стоит осознанно и проверять по планам.

  - id: part-pg-partman
    kind: single
    prompt: |
      Зачем нужно расширение pg_partman?
    options:
      - text: "Оно автоматизирует создание секций заранее и удаление старых по политике хранения"
        correct: true
      - text: "Оно ускоряет отсечение партиций"
      - text: "Оно позволяет секционировать по нескольким ключам сразу"
      - text: "Оно переносит секции на другие серверы"
    explanation: |
      Задача рутинная и одинаковая у всех, поэтому писать собственный велосипед
      на pl/pgsql обычно не стоит.
