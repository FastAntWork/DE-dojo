questions:
  - id: mpp-architecture
    kind: single
    prompt: |
      Как устроен Greenplum?
    options:
      - text: "Координатор строит план и собирает результат, сегменты — по сути отдельные экземпляры PostgreSQL, каждый со своей частью данных и своим диском"
        correct: true
      - text: "Один сервер с несколькими процессами-воркерами на общем диске"
      - text: "Кластер без выделенного координатора: запрос принимает любой узел"
      - text: "Хранилище на объектном хранилище с бессостоянийными вычислителями"
    explanation: |
      «Каждый со своей частью данных» — ключевая деталь: именно из неё следуют и
      дистрибуция, и Motion, и чувствительность к перекосу.

  - id: mpp-slowest-segment
    kind: single
    prompt: |
      На одном из 60 сегментов лежит десятая часть данных таблицы. Как это
      скажется на запросах по ней?
    options:
      - text: "Запрос будет идти столько, сколько нужно этому сегменту, пока остальные 59 простаивают; добавление сегментов не поможет"
        correct: true
      - text: "Замедление составит около 2%, пропорционально доле данных"
      - text: "Greenplum автоматически перераспределит данные при запросе"
      - text: "Скажется только на записи, чтение останется параллельным"
    explanation: |
      Производительность MPP определяется самым медленным сегментом. Это главная
      причина, по которой выбору ключа дистрибуции уделяют столько внимания.

  - id: mpp-distribution-key-purpose
    kind: single
    prompt: |
      Что определяет ключ дистрибуции?
    options:
      - text: "На каком сегменте окажется строка — по хешу значений этих колонок"
        correct: true
      - text: "В каком порядке строки хранятся внутри сегмента"
      - text: "По какому полю таблица делится на партиции"
      - text: "Какие колонки будут проиндексированы"
    explanation: |
      Дистрибуция — про размещение ПО СЕГМЕНТАМ. Деление внутри сегмента — это
      партиционирование, ортогональный механизм.

  - id: mpp-date-as-dist-key
    kind: single
    prompt: |
      Почему дата — плохой ключ дистрибуции для таблицы событий?
    options:
      - text: "Запросы фильтруют по дате, и суточный отчёт исполнится на одном сегменте — параллелизм пропадёт"
        correct: true
      - text: "Дата имеет слишком высокую кардинальность"
      - text: "По датам нельзя вычислить хеш"
      - text: "Даты нельзя использовать в DISTRIBUTED BY"
    explanation: |
      Дата — это ключ ПАРТИЦИОНИРОВАНИЯ, а не дистрибуции. Смешение этих двух
      ролей — самая частая ошибка в теме.

  - id: mpp-dist-key-requirements
    kind: multiple
    prompt: |
      Каким требованиям должен отвечать ключ дистрибуции?
    options:
      - text: "Высокая кардинальность и равномерность значений"
        correct: true
      - text: "Совпадение с ключом частых соединений — тогда соединение локальное"
        correct: true
      - text: "Отсутствие в частых фильтрах равенства"
        correct: true
      - text: "Обязательное наличие индекса по этой колонке"
    explanation: |
      Первые три требования конфликтуют между собой, и выбор всегда компромисс.
      Индекс к дистрибуции отношения не имеет.

  - id: mpp-check-skew
    kind: single
    prompt: |
      Каким запросом проверить перекос данных по сегментам?
    options:
      - text: "SELECT gp_segment_id, count(*) FROM t GROUP BY 1 ORDER BY 2 DESC"
        correct: true
      - text: "SELECT count(*) FROM t"
      - text: "EXPLAIN ANALYZE SELECT * FROM t"
      - text: "SELECT * FROM pg_stat_user_tables WHERE relname = 't'"
    explanation: |
      Системная колонка gp_segment_id показывает, на каком сегменте лежит
      строка. Разброс количеств в разы означает плохой ключ дистрибуции.

  - id: mpp-data-vs-computation-skew
    kind: single
    prompt: |
      Чем перекос вычислений отличается от перекоса данных?
    options:
      - text: "Данные лежат равномерно, но конкретный запрос сгружает работу на один сегмент — например, при группировке по колонке с сильно неравномерными значениями"
        correct: true
      - text: "Это одно и то же, разные названия"
      - text: "Перекос вычислений виден в покое, перекос данных — только при запросе"
      - text: "Перекос вычислений возникает только при записи"
    explanation: |
      Отсюда важный вывод: «таблица распределена равномерно» не означает
      «запросы будут быстрыми». Перекос вычислений проявляется только на
      конкретном запросе.

  - id: mpp-computation-skew-fix
    kind: single
    prompt: |
      Обнаружен перекос вычислений при группировке. Что делать?
    options:
      - text: "Менять запрос: предагрегация, отделение популярных значений — смена ключа дистрибуции здесь не поможет"
        correct: true
      - text: "Сменить ключ дистрибуции таблицы"
      - text: "Добавить сегменты в кластер"
      - text: "Выполнить VACUUM FULL"
    explanation: |
      Данные-то лежат ровно. Проблему создаёт перераспределение под конкретную
      операцию, поэтому лечится она на уровне запроса.

  - id: mpp-redistribute-motion
    kind: single
    prompt: |
      В плане запроса `Redistribute Motion`. Что это значит?
    options:
      - text: "Строки перераспределяются между сегментами по новому ключу — обычно потому, что соединение идёт не по ключу дистрибуции"
        correct: true
      - text: "Таблица целиком рассылается на все сегменты"
      - text: "Результат собирается на координаторе"
      - text: "Данные читаются с диска сегмента"
    explanation: |
      Дорогая операция: перемещается вся таблица. Прямое указание на то, что
      ключ дистрибуции не совпал с ключом соединения.

  - id: mpp-broadcast-motion
    kind: single
    prompt: |
      В плане `Broadcast Motion` для таблицы в 500 млн строк. Что это означает?
    options:
      - text: "Вся таблица рассылается на каждый сегмент — почти наверняка беда, обычно из-за неверной оценки размера"
        correct: true
      - text: "Нормальное поведение для больших таблиц"
      - text: "Таблица перераспределяется по ключу соединения"
      - text: "Результат собирается на координаторе"
    explanation: |
      Broadcast разумен для маленькой стороны, для большой разрушителен. Частая
      причина неверной оценки — не выполненный ANALYZE.

  - id: mpp-gather-motion
    kind: single
    prompt: |
      В плане `Gather Motion`, а под ним 80 млн строк. Чем это плохо?
    options:
      - text: "Все эти строки собираются на координаторе, и он становится узким местом"
        correct: true
      - text: "Ничем: Gather Motion есть почти в каждом плане"
      - text: "Строки будут перераспределены между сегментами дважды"
      - text: "Это означает отсутствие статистики"
    explanation: |
      Сам по себе Gather Motion нормален и стоит в верхушке почти любого плана —
      результат надо кому-то отдать. Беда именно в объёме под ним: агрегировать
      надо было на сегментах.

  - id: mpp-no-motion-ideal
    kind: single
    prompt: |
      Как добиться соединения двух больших таблиц вообще без Motion?
    options:
      - text: "Распределить обе по ключу соединения — тогда каждый сегмент соединяет своё со своим локально"
        correct: true
      - text: "Сделать обе DISTRIBUTED RANDOMLY"
      - text: "Сделать обе DISTRIBUTED REPLICATED"
      - text: "Добавить индексы по ключу соединения"
    explanation: |
      Ради этого ключ дистрибуции и подбирают под типовые соединения. RANDOMLY
      гарантирует Motion при любом соединении, а REPLICATED для больших таблиц
      неприменим.

  - id: mpp-replicated
    kind: single
    prompt: |
      Для чего нужна `DISTRIBUTED REPLICATED`?
    options:
      - text: "Для маленьких справочников: копия на каждом сегменте делает соединение с ними локальным — аналог broadcast join"
        correct: true
      - text: "Для отказоустойчивости: копия данных на случай потери сегмента"
      - text: "Для таблиц с очень высокой кардинальностью ключа"
      - text: "Для таблиц, которые часто обновляются"
    explanation: |
      Отказоустойчивость обеспечивают зеркала сегментов — другой механизм.
      REPLICATED это про исключение Motion при соединении со справочником.

  - id: mpp-randomly
    kind: single
    prompt: |
      Когда уместна `DISTRIBUTED RANDOMLY`?
    options:
      - text: "Когда равномерность важна, а таблица ни с чем не соединяется — иначе любое соединение потребует перемещения"
        correct: true
      - text: "Всегда: случайное распределение исключает перекос"
      - text: "Для таблиц фактов в схеме звезда"
      - text: "Когда неизвестна кардинальность колонок"
    explanation: |
      Случайное распределение действительно исключает перекос данных — но ценой
      гарантированного Motion при каждом соединении.

  - id: mpp-dist-vs-partition
    kind: single
    prompt: |
      Чем дистрибуция отличается от партиционирования?
    options:
      - text: "Дистрибуция раскладывает данные ПО СЕГМЕНТАМ, партиционирование делит их ВНУТРИ сегмента; механизмы ортогональны и используются вместе"
        correct: true
      - text: "Это два названия одного механизма"
      - text: "Партиционирование распределяет данные по сегментам, дистрибуция — по дискам"
      - text: "Дистрибуция применима только к таблицам фактов"
    explanation: |
      Типичная связка: DISTRIBUTED BY (user_id) для равномерности и локальных
      соединений плюс PARTITION BY RANGE (event_date) для отсечения периодов.

  - id: mpp-partition-benefits
    kind: multiple
    prompt: |
      Что даёт партиционирование в Greenplum?
    options:
      - text: "Отсечение ненужных партиций при фильтре по ключу партиционирования"
        correct: true
      - text: "Мгновенное удаление старых данных через DROP PARTITION вместо долгого DELETE"
        correct: true
      - text: "Точечную перезагрузку периода подменой партиции"
        correct: true
      - text: "Равномерное распределение данных по сегментам"
    explanation: |
      Последнее — задача дистрибуции. Подмена партиции, кстати, это тот же
      приём идемпотентной загрузки, что и в оркестрации.

  - id: mpp-too-many-partitions
    kind: single
    prompt: |
      Таблицу разбили на суточные партиции за пять лет — около 1800 партиций.
      Чем это плохо?
    options:
      - text: "Планирование запроса начинает стоить дороже выполнения; ориентир — десятки-сотни партиций, а не тысячи"
        correct: true
      - text: "Greenplum не поддерживает больше 1000 партиций"
      - text: "Партиции перестают отсекаться при фильтре"
      - text: "Данные распределятся неравномерно по сегментам"
    explanation: |
      Каждая партиция — отдельный объект, который планировщик обязан
      рассмотреть. При тысячах партиций накладные расходы съедают выигрыш от
      отсечения.

  - id: mpp-column-orientation
    kind: single
    prompt: |
      Таблица фактов на 2 млрд строк, 60 колонок, запросы берут 3–5 колонок.
      Какое хранение выбрать?
    options:
      - text: "Append-optimized колоночное со сжатием: читаются только нужные колонки, сжатие однотипных значений лучше"
        correct: true
      - text: "Heap: он универсален"
      - text: "Append-optimized строковое"
      - text: "Heap с индексами по всем читаемым колонкам"
    explanation: |
      Правило то же, что для Parquet: колоночное для аналитического чтения
      немногих колонок из многих, строковое для доступа к записи целиком и для
      частых изменений.

  - id: mpp-heap-when
    kind: single
    prompt: |
      Когда всё же нужен heap?
    options:
      - text: "Когда таблица часто меняется: append-optimized плохо переносит UPDATE и DELETE"
        correct: true
      - text: "Когда таблица очень большая"
      - text: "Когда запросы читают мало колонок"
      - text: "Когда нужно сжатие данных"
    explanation: |
      Отсюда стандартный приём: свежая партиция heap, чтобы принимать правки, а
      старые — колоночные и сжатые. Разные партиции одной таблицы могут иметь
      разное хранение.

  - id: mpp-analyze-importance
    kind: single
    prompt: |
      Почему в Greenplum отсутствие ANALYZE опаснее, чем в одиночном
      PostgreSQL?
    options:
      - text: "Планировщик по статистике выбирает тип Motion, и ошибка в оценке размера приводит к рассылке огромной таблицы на все сегменты"
        correct: true
      - text: "Без ANALYZE запросы не выполняются вовсе"
      - text: "ANALYZE перераспределяет данные по сегментам"
      - text: "Без ANALYZE не работает отсечение партиций"
    explanation: |
      Цена ошибки планирования выше: в одиночной базе это неудачный способ
      доступа, в MPP — перемещение терабайта по сети между сегментами.

  - id: mpp-single-value-filter
    kind: single
    prompt: |
      Таблица распределена по `customer_id`. Запрос
      `WHERE customer_id = 12345` по огромной таблице работает медленно.
      Почему?
    options:
      - text: "Все строки этого клиента лежат на одном сегменте, поэтому весь запрос исполняется одним сегментом без параллелизма"
        correct: true
      - text: "Ключ дистрибуции нельзя использовать в WHERE"
      - text: "Требуется Redistribute Motion"
      - text: "Не хватает статистики"
    explanation: |
      Ровно то требование к ключу дистрибуции, которое звучит контринтуитивно:
      колонка частых фильтров равенства — плохой кандидат, потому что убивает
      параллелизм.

  - id: mpp-update-dist-key
    kind: single
    prompt: |
      Почему Greenplum запрещает обновлять колонку ключа дистрибуции?
    options:
      - text: "Изменение значения означало бы переезд строки на другой сегмент"
        correct: true
      - text: "Такие обновления ломают статистику"
      - text: "Это ограничение унаследовано от PostgreSQL"
      - text: "Ключ дистрибуции хранится только на координаторе"
    explanation: |
      Строка физически лежит там, куда её определил хеш ключа. Смена значения
      потребовала бы удаления и вставки на другом сегменте, что и предлагается
      сделать явно.

  - id: mpp-bulk-load
    kind: single
    prompt: |
      Почему массовую загрузку в Greenplum не делают обычными INSERT?
    options:
      - text: "Они идут через координатор, и он становится узким местом; для массовой загрузки данные направляют сразу на сегменты"
        correct: true
      - text: "INSERT не поддерживается в append-optimized таблицах"
      - text: "INSERT нарушает распределение по сегментам"
      - text: "INSERT не работает с партиционированными таблицами"
    explanation: |
      Координатор один, сегментов десятки. Загрузка через него не масштабируется
      — именно поэтому существуют внешние таблицы и параллельная загрузка.

  - id: mpp-vs-clickhouse
    kind: single
    prompt: |
      Чем Greenplum принципиально отличается от ClickHouse?
    options:
      - text: "Greenplum — MPP на базе PostgreSQL с полноценными транзакциями и соединениями; ClickHouse заточен под быстрые агрегации со слабыми соединениями и иной моделью изменений"
        correct: true
      - text: "Greenplum колоночный, ClickHouse строковый"
      - text: "ClickHouse поддерживает партиционирование, Greenplum — нет"
      - text: "Greenplum не поддерживает SQL"
    explanation: |
      Оба умеют колоночное хранение. Различие в назначении: сложная
      аналитическая нагрузка с соединениями против быстрых агрегаций по широким
      таблицам.

  - id: mpp-mirrors
    kind: single
    prompt: |
      Что такое зеркала сегментов?
    options:
      - text: "Реплики сегментов: при потере сегмента его зеркало становится основным"
        correct: true
      - text: "Копии справочных таблиц на всех сегментах"
      - text: "Резервные копии на внешнем хранилище"
      - text: "Дополнительные координаторы для распределения нагрузки"
    explanation: |
      Копии справочников на всех сегментах — это DISTRIBUTED REPLICATED, другой
      механизм и другая задача. Зеркала — про отказоустойчивость.
