questions:
  - id: dq-dimensions
    kind: multiple
    prompt: |
      Какие из перечисленных — измерения качества данных?
    options:
      - text: "Полнота: всё ли доехало"
        correct: true
      - text: "Уникальность: нет ли задвоений"
        correct: true
      - text: "Актуальность: не устарели ли данные"
        correct: true
      - text: "Согласованность: сходятся ли данные между собой"
        correct: true
    explanation: |
      Полный список обычно включает ещё валидность (значения в допустимых
      границах) и точность (соответствие реальности). Классификация полезна тем,
      что превращает расплывчатое «данные плохие» в список конкретных проверок.

  - id: dq-accuracy-limit
    kind: single
    prompt: |
      Какое измерение качества нельзя проверить изнутри системы?
    options:
      - text: "Точность: соответствие данных реальности требует внешнего эталона, которого обычно нет"
        correct: true
      - text: "Полнота"
      - text: "Уникальность"
      - text: "Актуальность"
      - text: "Валидность"
    explanation: |
      Все остальные проверяются запросом к самим данным. Честно назвать это
      ограничение на собеседовании — плюс: оно показывает, что человек понимает
      границы автоматических проверок.

  - id: dq-where-to-check
    kind: single
    prompt: |
      После соединения таблиц в витрине задвоились строки, и заказчик увидел
      завышенную выручку в отчёте. Где должна была стоять проверка?
    options:
      - text: "Сразу после соединения: дефект надо ловить там, где он появляется, а не там, где проявляется"
        correct: true
      - text: "В отчёте, где расхождение стало видно"
      - text: "На источнике перед загрузкой"
      - text: "После публикации витрины, в мониторинге"
    explanation: |
      На источнике данные были в порядке — задвоение породило соединение.
      Проверка в отчёте сработает позже и не укажет на причину.

  - id: dq-freshness-silent
    kind: single
    prompt: |
      Источник перестал присылать данные, пайплайн отрабатывает зелёным.
      Какая проверка это поймает?
    options:
      - text: "Проверка актуальности источника: максимум времени обновления не старше заданного порога"
        correct: true
      - text: "Проверка уникальности ключа"
      - text: "Проверка допустимых значений"
      - text: "Проверка ссылочной целостности"
    explanation: |
      Самый незаметный класс дефектов: ошибок нет, задачи зелёные, данных нет.
      Проверки, смотрящие на содержимое, на пустоте молчат — нужна отдельная
      проверка свежести.

  - id: dq-error-vs-warn
    kind: single
    prompt: |
      Витрина используется для расчёта выплат партнёрам. Проверка суммы
      расходится с источником. Какой режим уместнее?
    options:
      - text: "Останавливать загрузку: неверные выплаты хуже, чем выплаты по вчерашним данным"
        correct: true
      - text: "Предупреждать: остановка витрины остановит бизнес"
      - text: "Ни то ни другое: записать в лог и разобрать утром"
      - text: "Останавливать только если расхождение больше 50%"
    explanation: |
      Вопрос, которым выбирают режим: что будет, если пропустить данные дальше,
      и что будет, если не пропустить. Здесь цена неверных данных — реальные
      деньги, ушедшие не туда.

  - id: dq-warn-when
    kind: single
    prompt: |
      Когда режим «предупреждать» правильнее, чем «останавливать»?
    options:
      - text: "Когда устаревшие данные хуже слегка подозрительных: оперативный дашборд, по которому люди принимают решения в течение дня"
        correct: true
      - text: "Всегда: остановка загрузки — крайняя мера"
      - text: "Когда проверка написана недавно и ей не доверяют"
      - text: "Когда витрину читает внешний потребитель"
    explanation: |
      Остановленная витрина — тоже инцидент, и об этом часто забывают. А вот
      недоверие к новой проверке — повод её доработать, а не понизить до warn
      навсегда.

  - id: dq-warn-noise
    kind: single
    prompt: |
      Предупреждение приходит каждый день полгода, и все к нему привыкли. Что
      делать?
    options:
      - text: "Либо чинить проверку, либо удалять: игнорируемое предупреждение хуже отсутствия проверки, потому что создаёт ощущение контроля"
        correct: true
      - text: "Оставить: лишняя информация не вредит"
      - text: "Перевести в режим error, чтобы наконец заметили"
      - text: "Отправлять его реже, раз в неделю"
    explanation: |
      Перевод в error без разбора остановит загрузку по причине, которую все
      считают ложной. Шум лечится не громкостью, а разбором: почему срабатывает
      и надо ли на это реагировать.

  - id: dq-volume-naive
    kind: find-error
    prompt: |
      ```sql
      -- проверка объёма загрузки
      SELECT count(*) < 0.8 * (
          SELECT count(*) FROM sales WHERE day = current_date - 2
      ) AS anomaly
      FROM sales WHERE day = current_date - 1
      ```
      Почему эта проверка будет давать ложные срабатывания?
    options:
      - text: "Сравнение со вчерашним днём игнорирует недельную сезонность: понедельник против воскресенья всегда даст просадку"
        correct: true
      - text: "count(*) работает слишком медленно"
      - text: "Порог 0.8 слишком строгий, нужно 0.9"
      - text: "Нельзя сравнивать агрегаты в одном запросе"
    explanation: |
      Сравнивать надо с тем же днём недели, и не с одним значением, а с
      медианой за несколько недель — она устойчива к единичному выбросу, в
      отличие от среднего.

  - id: dq-volume-median
    kind: single
    prompt: |
      Почему для базовой линии объёма берут медиану, а не среднее?
    options:
      - text: "Медиана устойчива к единичному выбросу: один аномальный день не сдвинет базовую линию"
        correct: true
      - text: "Медиана считается быстрее"
      - text: "Среднее нельзя посчитать оконной функцией"
      - text: "Разницы нет при достаточном числе наблюдений"
    explanation: |
      Ровно наоборот: один день с задвоением втрое поднимет среднее и сделает
      завтрашнюю проверку слепой. Медиана этого не заметит.

  - id: dq-volume-corridor
    kind: single
    prompt: |
      Проверка объёма ловит только просадку. Что она пропустит?
    options:
      - text: "Резкий рост — обычно признак задвоения при повторной загрузке"
        correct: true
      - text: "Пропуск обязательных полей"
      - text: "Изменение типа колонки"
      - text: "Устаревание данных"
    explanation: |
      Поэтому задают коридор, а не порог снизу. Рост в два раза за сутки почти
      всегда означает, что данные загрузились дважды.

  - id: dq-zero-rows
    kind: single
    prompt: |
      За день приехало ноль строк. Чем эта ситуация отличается от «мало строк»?
    options:
      - text: "Ноль обычно означает, что загрузка не отработала вовсе, и реакция здесь другая — это отказ, а не аномалия объёма"
        correct: true
      - text: "Ничем: это частный случай просадки объёма"
      - text: "Ноль строк всегда нормален для выходных"
      - text: "Ноль строк невозможно отличить от отсутствия проверки"
    explanation: |
      Смешивать их вредно: аномалия объёма — повод посмотреть на данные, а
      нулевая загрузка — повод проверить источник и сам пайплайн.

  - id: dq-dbt-tests-advantage
    kind: single
    prompt: |
      Трансформации уже на dbt. Почему тесты dbt здесь дешевле отдельного
      инструмента проверок?
    options:
      - text: "Они живут рядом с моделью, версионируются тем же коммитом, а dbt build останавливает ветку графа при падении"
        correct: true
      - text: "Они выполняются быстрее любых других проверок"
      - text: "Они умеют проверять то, что недоступно SQL"
      - text: "Они не требуют доступа к базе"
    explanation: |
      Главное преимущество — совместная жизнь с кодом. Проверка, живущая в
      отдельной системе, о которой знают двое, умирает первой при изменении
      модели.

  - id: dq-tool-last
    kind: single
    prompt: |
      С чего начинать построение контроля качества данных?
    options:
      - text: "С ответа на вопросы что проверять, где и с какой реакцией; выбор инструмента — последний шаг"
        correct: true
      - text: "С выбора между Great Expectations и Soda"
      - text: "С настройки оповещений в мессенджере"
      - text: "С покупки платформы наблюдаемости данных"
    explanation: |
      Проверка «сумма позиций равна сумме заказа» — это обычный SELECT,
      возвращающий расхождения. Специальный инструмент для неё не обязателен, а
      вот понимание, где её ставить и что делать при срабатывании, обязательно.

  - id: dq-contract-problem
    kind: single
    prompt: |
      Какую проблему решает контракт данных?
    options:
      - text: "Источник меняется молча: поле переименовали, тип поменяли, добавили новое значение статуса — и потребитель ломается, хотя никто ничего не нарушал"
        correct: true
      - text: "Медленную работу запросов к источнику"
      - text: "Отсутствие прав доступа к таблицам источника"
      - text: "Дублирование данных при загрузке"
    explanation: |
      Ключевое слово — «молча». Команда сервиса не знала, что кто-то читает их
      таблицу. Контракт делает эту зависимость явной и даёт правила её
      изменения.

  - id: dq-contract-content
    kind: multiple
    prompt: |
      Что обычно входит в контракт данных?
    options:
      - text: "Схема: поля, типы, обязательность"
        correct: true
      - text: "Гарантии по частоте обновления и максимальной задержке"
        correct: true
      - text: "Правила изменений: что можно менять свободно, а что требует предупреждения и срока"
        correct: true
      - text: "Владелец, с которым разговаривать, когда сломалось"
        correct: true
    explanation: |
      Все четыре пункта. Ценность контракта не в технике — проверяется он теми
      же средствами, — а в том, что ожидания записаны и у них есть
      ответственный.

  - id: dq-select-star
    kind: single
    prompt: |
      Пайплайн читает источник через `SELECT *`. Чем это опасно с точки зрения
      контракта?
    options:
      - text: "Любое изменение источника меняет форму данных молча; явный список колонок и сверка типов дают внятную ошибку сразу"
        correct: true
      - text: "SELECT * работает медленнее"
      - text: "SELECT * не поддерживается в инкрементальных моделях"
      - text: "Ничем: схема всё равно проверяется при записи"
    explanation: |
      Практический минимум контракта — проверка схемы на входе. Добавленная в
      источнике колонка не должна ничего ломать, а вот исчезнувшая или сменившая
      тип обязана быть замечена немедленно.

  - id: dq-schema-additive
    kind: single
    prompt: |
      Какое изменение источника обычно считают безопасным (не ломающим)?
    options:
      - text: "Добавление новой колонки"
        correct: true
      - text: "Удаление колонки"
      - text: "Изменение типа колонки"
      - text: "Изменение смысла значений при том же типе"
    explanation: |
      Последний вариант самый коварный: схема не изменилась, проверки типов
      молчат, а цифры стали означать другое. Именно поэтому в контракт входит
      семантика, а не только схема.

  - id: dq-check-degradation
    kind: multiple
    prompt: |
      Почему набор проверок деградирует со временем?
    options:
      - text: "Проверка начинает срабатывать ложно, её отключают «на время» и не возвращают"
        correct: true
      - text: "Данные меняются, а проверка нет — она перестаёт что-либо ловить"
        correct: true
      - text: "Новые витрины появляются без проверок вовсе"
        correct: true
      - text: "Предупреждения накапливаются, и их перестают читать"
        correct: true
    explanation: |
      Все четыре механизма работают одновременно. Поэтому важно, чтобы проверки
      жили в одном репозитории с кодом пайплайна и менялись тем же коммитом.

  - id: dq-incident-leaves-check
    kind: single
    prompt: |
      Разобрали инцидент с расхождением в витрине. Что сделать, чтобы он не
      повторился незамеченным?
    options:
      - text: "Добавить проверку, которая поймала бы именно этот дефект — тот же принцип, что регрессионный тест на исправленный баг"
        correct: true
      - text: "Записать инцидент в базу знаний и закрыть"
      - text: "Увеличить частоту запуска пайплайна"
      - text: "Перевести все существующие проверки в режим error"
    explanation: |
      База знаний фиксирует знание, но не мешает повторению. Проверка мешает —
      и, в отличие от памяти людей, не увольняется.

  - id: dq-never-fired-check
    kind: single
    prompt: |
      Проверка не срабатывала ни разу за год. О чём это может говорить?
    options:
      - text: "Возможно, она ничего не проверяет — например, сравнивает пустой результат с пустым; это повод её проверить, а не радоваться"
        correct: true
      - text: "Данные идеальны, проверку можно удалить"
      - text: "Проверка настроена слишком строго"
      - text: "Это нормальное состояние любой проверки"
    explanation: |
      Тихая проверка неотличима от сломанной. Проверять сами проверки полезно
      тем же способом, что и тесты: намеренно испортить данные в тестовой среде
      и убедиться, что она сработала.

  - id: dq-alert-owner
    kind: single
    prompt: |
      Оповещения о проблемах с данными шлют в общий канал, где 200 человек.
      Что с этим не так?
    options:
      - text: "У оповещения нет адресата: когда отвечают все, не отвечает никто"
        correct: true
      - text: "Технически ничего: главное, что оповещение доставлено"
      - text: "Канал не поддерживает форматирование деталей"
      - text: "Оповещений станет слишком много для истории канала"
    explanation: |
      У каждого предупреждения должен быть конкретный ответственный. Это
      организационное требование, но без него техническая часть контроля
      качества не работает.

  - id: dq-consistency-check
    kind: single
    prompt: |
      Какая проверка относится к измерению «согласованность»?
    options:
      - text: "Сумма позиций заказа равна сумме в шапке заказа"
        correct: true
      - text: "Поле order_id не пустое"
      - text: "Статус принимает одно из четырёх допустимых значений"
      - text: "Данные обновлялись не позже двух часов назад"
    explanation: |
      Согласованность — про соответствие данных ДРУГ ДРУГУ. Остальные варианты
      это полнота, валидность и актуальность соответственно.

  - id: dq-reconciliation
    kind: single
    prompt: |
      Как проверить, что при загрузке ничего не потерялось и не задвоилось?
    options:
      - text: "Сверкой: сравнить контрольные суммы или количества строк и агрегаты источника и приёмника за один и тот же период"
        correct: true
      - text: "Проверкой уникальности ключа в приёмнике"
      - text: "Проверкой свежести данных"
      - text: "Проверкой допустимых значений"
    explanation: |
      Уникальность ключа поймает задвоение, но не потерю. Сверка агрегатов между
      источником и приёмником ловит оба случая сразу и потому стоит в конце
      почти любой загрузки.
