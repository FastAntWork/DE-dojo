questions:
  - id: idx-cost-of-index
    kind: single
    prompt: |
      Какова цена существования индекса?
    options:
      - text: "Это вторая копия данных: её надо обновлять при каждой вставке, изменении и удалении, поэтому запись замедляется"
        correct: true
      - text: "Только дисковое место"
        correct: false
      - text: "Никакой: индексы влияют лишь на чтение"
      - text: "Только время на первоначальное построение"
    explanation: |
      Отсюда правило: индексы добавляют по планам запросов, а не «на всякий
      случай». Десяток индексов на таблице почти всегда означает второе.

  - id: idx-btree-default
    kind: single
    prompt: |
      Что умеет B-tree, чего не умеет hash-индекс?
    options:
      - text: "Диапазоны, сортировку и префиксный поиск по строке — hash отвечает только на равенство"
        correct: true
      - text: "Работать с текстовыми колонками"
      - text: "Хранить NULL"
      - text: "Обеспечивать уникальность"
    explanation: |
      Поэтому hash берут редко: B-tree делает всё то же самое и больше, а
      разница в скорости на равенстве невелика.

  - id: idx-gin-usecase
    kind: single
    prompt: |
      В колонке `jsonb` нужно искать записи по значению внутри документа.
      Какой индекс?
    options:
      - text: "GIN — он предназначен для значений с множеством элементов внутри: jsonb, массивы, полнотекстовый поиск"
        correct: true
      - text: "B-tree по всей колонке"
      - text: "BRIN"
      - text: "Hash"
    explanation: |
      GIN отвечает на вопрос «в каких строках встречается этот элемент». Плата
      — более дорогое обновление по сравнению с B-tree.

  - id: idx-brin-condition
    kind: single
    prompt: |
      При каком условии BRIN-индекс полезен?
    options:
      - text: "Когда физический порядок строк коррелирует со значением колонки — например, данные вставляются по времени и по нему же ищутся"
        correct: true
      - text: "Когда таблица небольшая"
      - text: "Когда в колонке мало уникальных значений"
      - text: "Всегда: это универсальная замена B-tree"
    explanation: |
      BRIN хранит минимум и максимум на блок, поэтому крошечен — мегабайты на
      миллиард строк. Но на перемешанных данных диапазоны блоков перекрываются
      и отсекать нечего.

  - id: idx-selectivity-definition
    kind: single
    prompt: |
      Что такое селективность условия?
    options:
      - text: "Доля строк таблицы, которую отбирает условие: чем она ниже, тем полезнее индекс"
        correct: true
      - text: "Число уникальных значений в колонке"
      - text: "Скорость выполнения условия"
      - text: "Доля страниц, попавших в кеш"
    explanation: |
      Именно селективность, а не наличие индекса, определяет, будет ли он
      использован. Условие, отбирающее 90% таблицы, планировщик выполнит полным
      проходом — и будет прав.

  - id: idx-why-seq-scan-better
    kind: single
    prompt: |
      Почему при выборке 40% таблицы Seq Scan быстрее Index Scan?
    options:
      - text: "Index Scan читает строки в случайном порядке, прыгая в таблицу по каждой ссылке; последовательное чтение страниц дешевле"
        correct: true
      - text: "Индекс не помещается в память"
      - text: "Планировщик не умеет использовать индекс при больших выборках"
      - text: "Seq Scan использует параллельные воркеры, а Index Scan нет"
    explanation: |
      Случайный доступ к диску — вот вся причина. Порог зависит от настроек
      стоимости и от того, насколько данные упорядочены физически.

  - id: idx-boolean-column
    kind: single
    prompt: |
      Индекс по колонке `is_active`, где 95% строк активны. Насколько он
      полезен?
    options:
      - text: "Почти бесполезен для поиска активных; для поиска НЕактивных лучше частичный индекс WHERE NOT is_active"
        correct: true
      - text: "Очень полезен: булевы колонки индексируются эффективнее прочих"
      - text: "Бесполезен в любом случае, булевы колонки индексировать нельзя"
      - text: "Полезен только вместе с ANALYZE"
    explanation: |
      Частичный индекс на редкое значение мал и дёшев. Это стандартный приём
      для флагов вроде is_deleted, где интересна именно редкая сторона.

  - id: idx-partial-condition-match
    kind: single
    prompt: |
      Создан частичный индекс `WHERE status = 'active'`. Запрос фильтрует
      `WHERE status IN ('active', 'paused')`. Будет ли индекс использован?
    options:
      - text: "Нет: условие запроса шире условия индекса, планировщик не может гарантировать полноту результата"
        correct: true
      - text: "Да, для части строк"
      - text: "Да, планировщик дополнит результат полным проходом"
      - text: "Да, если выполнить ANALYZE"
    explanation: |
      Частичный индекс применим, только когда условие запроса логически влечёт
      условие индекса. Это его главное ограничение и частая причина
      «индекс есть, а не работает».

  - id: idx-composite-order
    kind: single
    prompt: |
      Запросы фильтруют `WHERE tenant_id = ? AND created_at BETWEEN ? AND ?`.
      Какой порядок колонок в индексе?
    options:
      - text: "(tenant_id, created_at): равенство первым, диапазон последним"
        correct: true
      - text: "(created_at, tenant_id): более селективная колонка первой"
      - text: "Порядок не важен, планировщик разберётся"
      - text: "Нужны два отдельных индекса"
    explanation: |
      При обратном порядке пришлось бы просматривать весь диапазон дат, отбирая
      арендатора уже после. Правило переносится и на другие СУБД.

  - id: idx-left-prefix
    kind: single
    prompt: |
      Есть индекс `(a, b, c)`. Для какого запроса он бесполезен?
    options:
      - text: "WHERE b = ? — без ведущей колонки индекс не применить, как алфавитный указатель для поиска по второй букве"
        correct: true
      - text: "WHERE a = ?"
      - text: "WHERE a = ? AND b = ?"
      - text: "WHERE a = ? AND b = ? AND c = ?"
    explanation: |
      Правило левого префикса. Отсюда же вывод: отдельные индексы (a) и (a, b)
      при наличии (a, b, c) избыточны — они им покрываются.

  - id: idx-redundant
    kind: single
    prompt: |
      На таблице есть индексы `(user_id)`, `(user_id, created_at)` и
      `(user_id, created_at, status)`. Что с этим не так?
    options:
      - text: "Первые два избыточны: третий покрывает их по левому префиксу, а платят за все три все операции записи"
        correct: true
      - text: "Всё в порядке: каждый индекс полезен для своего запроса"
      - text: "Не хватает индекса по (created_at)"
      - text: "Индексы конфликтуют, планировщик не сможет выбрать"
    explanation: |
      Исключение — если по узкому индексу идёт Index Only Scan и его меньший
      размер существенно выигрывает. Но по умолчанию такую тройку сокращают до
      одного индекса.

  - id: idx-include-covering
    kind: single
    prompt: |
      Что делает `INCLUDE (kind)` в определении индекса?
    options:
      - text: "Добавляет колонку в индекс без участия в сортировке — только чтобы её можно было отдать без обращения к таблице"
        correct: true
      - text: "Создаёт отдельный индекс по этой колонке"
      - text: "Добавляет колонку как последнюю в ключе сортировки"
      - text: "Ограничивает индекс строками, где колонка не пуста"
    explanation: |
      Это и делает индекс покрывающим. Разница с добавлением колонки в ключ:
      INCLUDE не увеличивает глубину дерева и не участвует в поиске.

  - id: idx-index-only-scan-vacuum
    kind: single
    prompt: |
      Индекс покрывающий, но в плане `Index Only Scan` с большим числом
      `Heap Fetches`. В чём дело?
    options:
      - text: "Карта видимости не заполнена: её обновляет VACUUM, и без него приходится ходить в таблицу за видимостью строк"
        correct: true
      - text: "Не хватает памяти под индекс"
      - text: "Индекс построен неверно, нужны другие колонки"
      - text: "Нужно выполнить ANALYZE"
    explanation: |
      Один из любимых вопросов на собеседовании. Index Only Scan пропускает
      таблицу, только если страница целиком видна всем транзакциям, — а это
      знает именно карта видимости.

  - id: idx-function-on-column
    kind: find-error
    prompt: |
      ```sql
      -- есть индекс по created_at
      SELECT * FROM events WHERE date(created_at) = '2025-03-01';
      ```
      Индекс не используется. Почему и как чинить?
    options:
      - text: "Функция применена к колонке; переписать диапазоном created_at >= '2025-03-01' AND < '2025-03-02' или создать индекс по выражению"
        correct: true
      - text: "Нужно привести литерал к типу timestamptz"
      - text: "Нужен составной индекс с датой"
      - text: "Нужно выполнить VACUUM"
    explanation: |
      Правило: колонка в условии должна стоять «голой». Индекс хранит значения
      created_at, а не date(created_at) — сопоставить одно с другим планировщик
      не может.

  - id: idx-type-mismatch
    kind: single
    prompt: |
      Колонка `user_id` типа bigint, запрос сравнивает её с текстовым
      литералом. Что произойдёт?
    options:
      - text: "Потребуется приведение типов, и индекс может оказаться неприменим — либо будет ошибка типов"
        correct: true
      - text: "PostgreSQL приведёт типы прозрачно, индекс сработает"
      - text: "Запрос выполнится, но вернёт неверный результат"
      - text: "Индекс сработает после ANALYZE"
    explanation: |
      Строгость PostgreSQL к типам здесь полезна: в СУБД с неявным приведением
      такой запрос молча теряет индекс и превращается в полное сканирование.

  - id: idx-like-leading-wildcard
    kind: single
    prompt: |
      `WHERE name LIKE '%иванов%'` не использует B-tree индекс. Почему и что
      делать?
    options:
      - text: "B-tree упорядочен по началу строки, а начало неизвестно; нужен триграммный индекс pg_trgm"
        correct: true
      - text: "LIKE вообще не поддерживает индексы"
      - text: "Нужно перевести колонку в нижний регистр"
      - text: "Нужно увеличить work_mem"
    explanation: |
      `LIKE 'иванов%'` без ведущего знака B-tree использует прекрасно — это
      префиксный поиск. Проблема именно в неизвестном начале.

  - id: idx-not-used-reasons
    kind: multiple
    prompt: |
      Индекс существует, но не используется. Какие причины реальны?
    options:
      - text: "Выборка слишком велика — планировщик считает полный проход дешевле"
        correct: true
      - text: "Устаревшая статистика: планировщик ошибается в оценке числа строк"
        correct: true
      - text: "На колонке в условии применена функция"
        correct: true
      - text: "Таблица маленькая, и полный проход дешевле любого индекса"
        correct: true
    explanation: |
      Все четыре причины встречаются постоянно. Первая и четвёртая означают,
      что планировщик прав и чинить нечего; вторая и третья — что чинить надо.

  - id: idx-create-concurrently
    kind: single
    prompt: |
      Нужно добавить индекс на боевую таблицу в 500 млн строк. Что
      использовать?
    options:
      - text: "CREATE INDEX CONCURRENTLY: обычный вариант заблокирует запись на всё время построения"
        correct: true
      - text: "Обычный CREATE INDEX в транзакции"
      - text: "REINDEX"
      - text: "CREATE INDEX с параметром IF NOT EXISTS"
    explanation: |
      Плата: строится дольше, требует двух проходов и при сбое оставляет
      невалидный индекс, который надо удалить и создать заново. Проверяется
      через pg_index.indisvalid.

  - id: idx-unused-detection
    kind: single
    prompt: |
      Как найти индексы, которые никем не используются?
    options:
      - text: "pg_stat_user_indexes: idx_scan = 0 за длительный период — кандидат на удаление"
        correct: true
      - text: "pg_stat_activity"
      - text: "EXPLAIN по всем запросам приложения"
      - text: "pg_indexes"
    explanation: |
      Исключение — индексы, поддерживающие уникальность и внешние ключи: их
      idx_scan может быть нулевым, но удалять их нельзя, они обеспечивают
      ограничения.

  - id: idx-foreign-key-no-index
    kind: single
    prompt: |
      PostgreSQL создаёт индекс автоматически для первичного ключа и UNIQUE.
      А для внешнего ключа?
    options:
      - text: "Нет: без ручного индекса удаление строки родителя требует полного прохода по дочерней таблице"
        correct: true
      - text: "Да, создаёт автоматически"
      - text: "Да, но только при указании ON DELETE CASCADE"
      - text: "Не создаёт, и он не нужен"
    explanation: |
      Симптом: удаление одной строки занимает минуты. Причина — проверка
      ссылочной целостности по неиндексированной колонке в большой дочерней
      таблице.

  - id: idx-bloat
    kind: single
    prompt: |
      После массовых обновлений индекс стал заметно больше ожидаемого, запросы
      по нему читают лишние страницы. Что делать?
    options:
      - text: "REINDEX CONCURRENTLY: индекс распух записями на мёртвые строки"
        correct: true
      - text: "ANALYZE"
      - text: "Удалить и создать заново обычным CREATE INDEX"
      - text: "Увеличить shared_buffers"
    explanation: |
      Удаление и создание заново решают ту же задачу, но оставляют таблицу без
      индекса на время построения. CONCURRENTLY этого избегает.

  - id: idx-order-by-no-sort
    kind: single
    prompt: |
      Как избавиться от шага сортировки в плане при `ORDER BY created_at`?
    options:
      - text: "Индекс по created_at может отдавать строки уже упорядоченными, и отдельная сортировка не понадобится"
        correct: true
      - text: "Увеличить work_mem"
      - text: "Добавить LIMIT"
      - text: "Сортировку убрать нельзя, она обязательна"
    explanation: |
      Тот же приём убирает сортировку перед оконными функциями: индекс по
      колонкам PARTITION BY и ORDER BY даёт данные в нужном порядке сразу.

  - id: idx-null-in-btree
    kind: single
    prompt: |
      Может ли PostgreSQL использовать B-tree индекс для условия
      `WHERE deleted_at IS NULL`?
    options:
      - text: "Да: B-tree в PostgreSQL хранит NULL, в отличие от некоторых других СУБД"
        correct: true
      - text: "Нет, NULL в индексы не попадают"
      - text: "Только если создать частичный индекс"
      - text: "Только при использовании GIN"
    explanation: |
      Хотя для колонки, где NULL встречается редко, частичный индекс
      `WHERE deleted_at IS NULL` всё равно будет меньше и дешевле.

  - id: idx-how-many
    kind: single
    prompt: |
      На таблице двенадцать индексов. О чём это скорее всего говорит?
    options:
      - text: "Что их добавляли «на всякий случай», а не по планам запросов: каждая запись обновляет все двенадцать"
        correct: true
      - text: "Что таблица хорошо оптимизирована"
      - text: "Что таблица используется многими приложениями и это нормально"
      - text: "Что нужно увеличить shared_buffers"
    explanation: |
      Нормальное число — единицы. Проверка простая: посмотреть idx_scan по
      каждому и удалить те, которыми никто не пользовался.
