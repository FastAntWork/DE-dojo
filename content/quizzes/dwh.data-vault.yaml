questions:
  - id: dv-hub-content
    kind: find-error
    prompt: |
      Коллега спроектировал хаб клиентов так:

          hub_customer
            customer_hk, customer_bk, name, status, load_date, record_source

      Что здесь неверно?
    options:
      - text: "name и status — описательные атрибуты, они меняются и должны жить в сателлите, а не в хабе"
        correct: true
      - text: "В хабе не должно быть record_source, источник указывается только в сателлите"
      - text: "customer_bk избыточен: при наличии хеш-ключа бизнес-ключ не хранят"
      - text: "Всё верно, это и есть стандартный вид хаба"
    explanation: |
      Хаб отвечает ровно на один вопрос — существует ли такая сущность — и
      обязан быть стабильным. Любой меняющийся атрибут ломает это свойство:
      смена статуса потребовала бы обновления хаба, а обновлений в Data Vault
      не бывает. Описательные атрибуты и их история живут в сателлите.
      record_source и бизнес-ключ в хабе как раз обязательны.

  - id: dv-hash-keys-why
    kind: single
    prompt: |
      Зачем в Data Vault 2.0 отказались от последовательностей в пользу хешей
      от бизнес-ключа?
    options:
      - text: "Хеш вычисляется из самих данных, поэтому сателлиты грузятся параллельно с хабами, не дожидаясь выдачи ключа"
        correct: true
      - text: "Хеш занимает меньше места, чем bigint, и экономит диск"
      - text: "Последовательности не поддерживаются в MPP-базах вроде Greenplum"
      - text: "Хеш защищает персональные данные, поскольку исходный ключ невозможно восстановить"
    explanation: |
      Главная причина — распараллеливание загрузки. С суррогатом сначала надо
      обратиться к хабу за ключом, и загрузки становятся последовательными и
      связанными. Хеш известен сразу из бизнес-ключа. Побочно ключи совпадают
      между системами. Места хеш занимает БОЛЬШЕ, а защитой данных он не
      является: бизнес-ключ хранится рядом в открытом виде.

  - id: dv-hash-normalisation
    kind: single
    prompt: |
      Один источник присылает номер договора как "00123", другой как "123",
      третий как " 123 ". Что произойдёт при построении хеш-ключа и что делать?
    options:
      - text: "Получатся три разных ключа и три разных сущности вместо одной — бизнес-ключ надо нормализовать до хеширования"
        correct: true
      - text: "Ничего страшного: алгоритм хеширования игнорирует пробелы и ведущие нули"
      - text: "Возникнет коллизия хешей, и записи склеятся в одну"
      - text: "Загрузка упадёт с ошибкой нарушения уникальности хаба"
    explanation: |
      Хеш чувствителен к каждому байту, поэтому разные написания одного ключа
      дают разные хеши, и один договор превращается в три несвязанные сущности.
      Ошибка тихая: ничего не падает, данные просто разъезжаются. Нормализация
      бизнес-ключа — обрезка пробелов, приведение регистра, единый формат — это
      обязательный шаг перед хешированием, а не необязательная аккуратность.

  - id: dv-raw-vs-business
    kind: single
    prompt: |
      Источник прислал клиента с отрицательным возрастом. Где эта строка
      окажется в правильно построенном Data Vault?
    options:
      - text: "В Raw Vault как есть; исправление или отбраковка — это правило, и его место в Business Vault"
        correct: true
      - text: "Нигде: некорректные записи отсекаются на этапе staging"
      - text: "В Raw Vault, но с проставленным флагом ошибки в том же сателлите"
      - text: "В отдельной таблице ошибок, вне модели Data Vault"
    explanation: |
      Raw Vault хранит факт: вот что нам сказали, вот когда, вот кто. Никакой
      бизнес-логики там нет по определению. Правила — приведение типов,
      отбраковка, разрешение конфликтов между источниками — живут в Business
      Vault, который пересобирается при изменении правил. Если чистить на
      входе, то при смене правила исходные данные уже потеряны.

  - id: dv-when-not-worth-it
    kind: single
    prompt: |
      Три стабильных источника, требований к аудиту нет, витрина нужна через
      месяц. Команда предлагает Data Vault. Твой ответ?
    options:
      - text: "Не стоит: платим количеством таблиц и сложностью запросов за устойчивость к изменениям, которых здесь не предвидится"
        correct: true
      - text: "Стоит: Data Vault всегда предпочтительнее звезды в корпоративном хранилище"
      - text: "Стоит, потому что переход со звезды на Data Vault позже невозможен"
      - text: "Не стоит, потому что Data Vault не работает при малом числе источников"
    explanation: |
      Data Vault покупает устойчивость к изменению состава источников и полную
      аудируемость. Цена — кратный рост числа таблиц, сложные запросы со
      склейкой сателлитов по датам и высокий порог входа. При трёх стабильных
      источниках и сроке в месяц эта покупка невыгодна. Технических препятствий
      перейти на неё позже нет — и это ещё один аргумент не начинать с неё.
