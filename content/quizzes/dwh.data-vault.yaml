questions:
  - id: dv-hub-content
    kind: find-error
    prompt: |
      Коллега спроектировал хаб клиентов так:

          hub_customer
            customer_hk, customer_bk, name, status, load_date, record_source

      Что здесь неверно?
    options:
      - text: "name и status — описательные атрибуты, они меняются и должны жить в сателлите, а не в хабе"
        correct: true
      - text: "В хабе не должно быть record_source, источник указывается только в сателлите"
      - text: "customer_bk избыточен: при наличии хеш-ключа бизнес-ключ не хранят"
      - text: "Всё верно, это и есть стандартный вид хаба"
    explanation: |
      Хаб отвечает ровно на один вопрос — существует ли такая сущность — и
      обязан быть стабильным. Любой меняющийся атрибут ломает это свойство:
      смена статуса потребовала бы обновления хаба, а обновлений в Data Vault
      не бывает. Описательные атрибуты и их история живут в сателлите.
      record_source и бизнес-ключ в хабе как раз обязательны.

  - id: dv-hash-keys-why
    kind: single
    prompt: |
      Зачем в Data Vault 2.0 отказались от последовательностей в пользу хешей
      от бизнес-ключа?
    options:
      - text: "Хеш вычисляется из самих данных, поэтому сателлиты грузятся параллельно с хабами, не дожидаясь выдачи ключа"
        correct: true
      - text: "Хеш занимает меньше места, чем bigint, и экономит диск"
      - text: "Последовательности не поддерживаются в MPP-базах вроде Greenplum"
      - text: "Хеш защищает персональные данные, поскольку исходный ключ невозможно восстановить"
    explanation: |
      Главная причина — распараллеливание загрузки. С суррогатом сначала надо
      обратиться к хабу за ключом, и загрузки становятся последовательными и
      связанными. Хеш известен сразу из бизнес-ключа. Побочно ключи совпадают
      между системами. Места хеш занимает БОЛЬШЕ, а защитой данных он не
      является: бизнес-ключ хранится рядом в открытом виде.

  - id: dv-hash-normalisation
    kind: single
    prompt: |
      Один источник присылает номер договора как "00123", другой как "123",
      третий как " 123 ". Что произойдёт при построении хеш-ключа и что делать?
    options:
      - text: "Получатся три разных ключа и три разных сущности вместо одной — бизнес-ключ надо нормализовать до хеширования"
        correct: true
      - text: "Ничего страшного: алгоритм хеширования игнорирует пробелы и ведущие нули"
      - text: "Возникнет коллизия хешей, и записи склеятся в одну"
      - text: "Загрузка упадёт с ошибкой нарушения уникальности хаба"
    explanation: |
      Хеш чувствителен к каждому байту, поэтому разные написания одного ключа
      дают разные хеши, и один договор превращается в три несвязанные сущности.
      Ошибка тихая: ничего не падает, данные просто разъезжаются. Нормализация
      бизнес-ключа — обрезка пробелов, приведение регистра, единый формат — это
      обязательный шаг перед хешированием, а не необязательная аккуратность.

  - id: dv-raw-vs-business
    kind: single
    prompt: |
      Источник прислал клиента с отрицательным возрастом. Где эта строка
      окажется в правильно построенном Data Vault?
    options:
      - text: "В Raw Vault как есть; исправление или отбраковка — это правило, и его место в Business Vault"
        correct: true
      - text: "Нигде: некорректные записи отсекаются на этапе staging"
      - text: "В Raw Vault, но с проставленным флагом ошибки в том же сателлите"
      - text: "В отдельной таблице ошибок, вне модели Data Vault"
    explanation: |
      Raw Vault хранит факт: вот что нам сказали, вот когда, вот кто. Никакой
      бизнес-логики там нет по определению. Правила — приведение типов,
      отбраковка, разрешение конфликтов между источниками — живут в Business
      Vault, который пересобирается при изменении правил. Если чистить на
      входе, то при смене правила исходные данные уже потеряны.

  - id: dv-when-not-worth-it
    kind: single
    prompt: |
      Три стабильных источника, требований к аудиту нет, витрина нужна через
      месяц. Команда предлагает Data Vault. Твой ответ?
    options:
      - text: "Не стоит: платим количеством таблиц и сложностью запросов за устойчивость к изменениям, которых здесь не предвидится"
        correct: true
      - text: "Стоит: Data Vault всегда предпочтительнее звезды в корпоративном хранилище"
      - text: "Стоит, потому что переход со звезды на Data Vault позже невозможен"
      - text: "Не стоит, потому что Data Vault не работает при малом числе источников"
    explanation: |
      Data Vault покупает устойчивость к изменению состава источников и полную
      аудируемость. Цена — кратный рост числа таблиц, сложные запросы со
      склейкой сателлитов по датам и высокий порог входа. При трёх стабильных
      источниках и сроке в месяц эта покупка невыгодна. Технических препятствий
      перейти на неё позже нет — и это ещё один аргумент не начинать с неё.

  - id: dv-three-entities
    kind: single
    prompt: |
      Из каких трёх типов сущностей состоит Data Vault?
    options:
      - text: "Хабы (бизнес-ключи), линки (связи между ними), сателлиты (атрибуты и их история)"
        correct: true
      - text: "Факты, измерения и мосты"
      - text: "Источники, стейджинг и витрины"
      - text: "Сырой слой, ядро и витрины"
    explanation: |
      Разделение неслучайно: хаб отвечает за существование сущности, линк — за
      факт связи, сателлит — за то, что менялось. Каждое меняется со своей
      скоростью, поэтому и хранится отдельно.

  - id: dv-link-purpose
    kind: single
    prompt: |
      Что хранит линк?
    options:
      - text: "Факт связи между бизнес-ключами хабов — и ничего больше: атрибуты связи живут в её сателлите"
        correct: true
      - text: "Атрибуты связанных сущностей"
      - text: "Историю изменений сателлитов"
      - text: "Агрегаты по связанным сущностям"
    explanation: |
      Все линки моделируются как «многие ко многим», даже если сегодня связь
      один к одному. Именно эта избыточность и даёт устойчивость к изменению
      требований — главное обещание Data Vault.

  - id: dv-satellite-history
    kind: single
    prompt: |
      Как сателлит хранит историю?
    options:
      - text: "Добавлением новой строки с новой датой загрузки при изменении атрибутов — старые строки не трогают"
        correct: true
      - text: "Обновлением строки на месте"
      - text: "Отдельной таблицей версий"
      - text: "Историю хранит хаб, а не сателлит"
    explanation: |
      Data Vault принципиально append-only: ничего не обновляется и не
      удаляется. Отсюда и полная воспроизводимость, и объём, который приходится
      за неё платить.

  - id: dv-multiple-satellites
    kind: single
    prompt: |
      Зачем у одного хаба несколько сателлитов?
    options:
      - text: "Чтобы разделить атрибуты по источникам и по скорости изменения: часто меняющиеся не порождают версий редко меняющихся"
        correct: true
      - text: "Чтобы обойти ограничение на число колонок"
      - text: "Чтобы ускорить соединения"
      - text: "Так требует третья нормальная форма"
    explanation: |
      Если сложить в один сателлит адрес (меняется раз в год) и статус сессии
      (меняется ежеминутно), таблица будет расти со скоростью самого быстрого
      атрибута.

  - id: dv-append-only-benefit
    kind: single
    prompt: |
      Что даёт принцип «только добавление» в Data Vault?
    options:
      - text: "Загрузка становится идемпотентной и распараллеливаемой, а состояние на любой момент прошлого — воспроизводимым"
        correct: true
      - text: "Экономию места"
      - text: "Ускорение аналитических запросов"
      - text: "Возможность обойтись без проверок качества"
    explanation: |
      Распараллеливаемость — недооценённое преимущество: хабы, линки и
      сателлиты грузятся независимо, потому что ни один не обновляет строки
      другого.

  - id: dv-load-order
    kind: single
    prompt: |
      В каком порядке грузят объекты Data Vault?
    options:
      - text: "Сначала хабы, затем линки и сателлиты — но линки и сателлиты можно грузить параллельно, они не зависят друг от друга"
        correct: true
      - text: "Строго последовательно: хаб, линк, сателлит, по одному"
      - text: "Сначала сателлиты, чтобы знать атрибуты"
      - text: "Порядок не имеет значения"
    explanation: |
      Зависимость только от хабов, потому что и линки, и сателлиты ссылаются на
      их ключи. Это и делает загрузку хорошо распараллеливаемой на больших
      объёмах.

  - id: dv-business-vault
    kind: single
    prompt: |
      Что такое Business Vault?
    options:
      - text: "Надстройка над сырым хранилищем с вычисленными и согласованными сущностями: правила бизнеса живут здесь, а не в сыром слое"
        correct: true
      - text: "Витрины для бизнес-пользователей"
      - text: "Копия хранилища для отдела аналитики"
      - text: "Слой контроля качества данных"
    explanation: |
      Разделение принципиальное: Raw Vault хранит данные как пришли, без
      интерпретации, поэтому при изменении бизнес-правил перестраивают только
      Business Vault, а сырьё остаётся неприкосновенным.

  - id: dv-why-not-report-directly
    kind: single
    prompt: |
      Почему отчёты не строят прямо на Data Vault?
    options:
      - text: "Простой запрос требует соединения хаба, линка и нескольких сателлитов — это неудобно и медленно; для отчётов поверх строят звёзды"
        correct: true
      - text: "Data Vault не поддерживает SQL"
      - text: "В нём нет исторических данных"
      - text: "Он не содержит числовых мер"
    explanation: |
      Data Vault — слой интеграции и хранения истории, а не слой потребления.
      Типовая архитектура: Raw Vault → Business Vault → витрины по Кимбаллу.

  - id: dv-source-system-tracking
    kind: single
    prompt: |
      Зачем в каждой строке Data Vault хранят источник записи?
    options:
      - text: "Чтобы можно было проследить происхождение любого значения и понять, какая система его принесла"
        correct: true
      - text: "Для соблюдения нормальных форм"
      - text: "Для ускорения загрузки"
      - text: "Для разграничения прав доступа"
    explanation: |
      Прослеживаемость — одна из главных причин выбирать Data Vault в
      регулируемых отраслях: на любой вопрос «откуда эта цифра» есть
      технический ответ.

  - id: dv-same-key-two-sources
    kind: single
    prompt: |
      Две системы присылают клиента с одним и тем же бизнес-ключом. Что
      произойдёт в хабе?
    options:
      - text: "Запись в хабе будет одна, а сателлитов — по одному на источник: интеграция происходит по бизнес-ключу"
        correct: true
      - text: "Появятся две записи в хабе"
      - text: "Вторая запись будет отброшена вместе с атрибутами"
      - text: "Атрибуты обеих систем сольются в один сателлит"
    explanation: |
      Это и есть механизм интеграции в Data Vault: общий хаб связывает
      сведения из разных систем, не заставляя решать заранее, чьи атрибуты
      «правильные».

  - id: dv-business-key-choice
    kind: single
    prompt: |
      Что должно быть бизнес-ключом хаба?
    options:
      - text: "Идентификатор, которым сущность опознают в бизнесе и который стабилен во времени и одинаков в разных системах"
        correct: true
      - text: "Первичный ключ из системы-источника"
      - text: "Автоинкрементное число"
      - text: "Хеш всех атрибутов сущности"
    explanation: |
      Внутренний идентификатор источника не годится именно потому, что он свой
      в каждой системе — а интеграция строится на общем ключе. Неверно
      выбранный бизнес-ключ ломает всю модель.

  - id: dv-hash-collision
    kind: single
    prompt: |
      Чем плохи хеш-ключи в Data Vault?
    options:
      - text: "Теоретической вероятностью коллизий и невозможностью прочитать ключ глазами при разборе; зато они вычисляются независимо и параллельно"
        correct: true
      - text: "Они занимают меньше места, чем последовательности"
      - text: "Они требуют централизованного генератора"
      - text: "Они не работают с составными бизнес-ключами"
    explanation: |
      Именно независимость вычисления — их главное преимущество: сателлит можно
      грузить, не дожидаясь, пока хаб выдаст суррогатный номер. Это и делает
      параллельную загрузку возможной.

  - id: dv-pit-table
    kind: single
    prompt: |
      Для чего нужны PIT-таблицы (Point-In-Time)?
    options:
      - text: "Чтобы упростить и ускорить сборку состояния на дату: они заранее сводят ссылки на подходящие версии всех сателлитов"
        correct: true
      - text: "Чтобы хранить историю удалений"
      - text: "Чтобы контролировать качество данных"
      - text: "Чтобы заменить хабы при больших объёмах"
    explanation: |
      Вместе с bridge-таблицами это стандартные вспомогательные структуры Data
      Vault: сама модель удобна для загрузки, но неудобна для чтения, и эти
      таблицы компенсируют второе.

  - id: dv-vs-kimball-choice
    kind: single
    prompt: |
      В каком случае Data Vault оправдан?
    options:
      - text: "Много источников, требования часто меняются, нужна полная прослеживаемость и история — и есть команда, готовая это поддерживать"
        correct: true
      - text: "Всегда: это самый современный подход"
      - text: "Когда источник один и требования стабильны"
      - text: "Когда нужны быстрые отчёты без промежуточных слоёв"
    explanation: |
      Для одного источника и стабильных требований Data Vault — это утроенное
      число таблиц и усложнённая загрузка без выигрыша. Уметь назвать, когда он
      НЕ нужен, ценится не меньше.

  - id: dv-anchor-modeling
    kind: single
    prompt: |
      Что общего у Data Vault и Anchor Modeling?
    options:
      - text: "Оба разделяют сущности, связи и атрибуты, оба append-only и оба рассчитаны на устойчивость к изменению требований"
        correct: true
      - text: "Оба денормализуют данные ради скорости чтения"
      - text: "Оба предназначены для витрин конечных пользователей"
      - text: "Оба отказываются от хранения истории"
    explanation: |
      Anchor Modeling идёт дальше в нормализации — вплоть до отдельной таблицы
      на каждый атрибут. Плата та же и ещё выше: число объектов и сложность
      чтения.
