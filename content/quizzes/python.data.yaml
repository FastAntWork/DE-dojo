questions:
  - id: pydata-read-big-file
    kind: single
    prompt: |
      Нужно обработать лог на 8 ГБ. Что использовать?
    options:
      - text: "Итерацию по файловому объекту: `for line in f` читает построчно, память остаётся постоянной"
        correct: true
      - text: "f.readlines() — так удобнее работать со списком"
      - text: "f.read().split('\\n')"
      - text: "pd.read_csv целиком, pandas сам оптимизирует память"
    explanation: |
      Первые три варианта отличаются только тем, как именно они положат
      процесс. Файловый объект — итератор по строкам, и это самый дешёвый
      способ потоковой обработки.

  - id: pydata-encoding-explicit
    kind: single
    prompt: |
      Почему при открытии файла всегда указывают `encoding`?
    options:
      - text: "Без него берётся системная кодировка: скрипт, работавший на Linux, упадёт на Windows или тихо прочитает кракозябры"
        correct: true
      - text: "Без него файл открывается в двоичном режиме"
      - text: "Это ускоряет чтение"
      - text: "Иначе Python не сможет определить размер файла"
    explanation: |
      Русские выгрузки регулярно приезжают в cp1251. Указать это явно — значит
      знать, что происходит, а не выяснять опытным путём на проде.

  - id: pydata-csv-split
    kind: find-error
    prompt: |
      ```python
      for line in open("orders.csv"):
          parts = line.split(",")
          order_id, name, comment = parts
      ```
      Файл содержит строку `1,Иванов,"Купил 2 шт., доволен"`. Что произойдёт?
    options:
      - text: "Запятая внутри кавычек будет принята за разделитель: получится четыре поля вместо трёх и ошибка распаковки"
        correct: true
      - text: "Всё разберётся верно: Python учитывает кавычки"
      - text: "Строка будет пропущена"
      - text: "Кавычки останутся в значении, но полей будет три"
    explanation: |
      Поэтому CSV разбирают модулем csv, а не строковыми операциями: он знает
      про кавычки, экранирование и переносы строк внутри значений.

  - id: pydata-csv-leading-zeros
    kind: single
    prompt: |
      В CSV колонка `zip_code` содержит значения вида `00123`. Что произойдёт
      при обычном `pd.read_csv`?
    options:
      - text: "Значение станет числом 123: ведущие нули потеряются"
        correct: true
      - text: "Останется строкой, так как начинается с нуля"
      - text: "Появится предупреждение о неоднозначном типе"
      - text: "Значение станет пропуском"
    explanation: |
      Лечится явным `dtype={\"zip_code\": str}`. Та же беда с телефонами,
      артикулами и кодами регионов — всем, что выглядит числом, но им не
      является.

  - id: pydata-na-values
    kind: single
    prompt: |
      В выгрузке пропуски обозначены строкой `NULL`. Что будет по умолчанию?
    options:
      - text: "Строка `NULL` попадёт в данные как обычная строка, и колонка чисел станет колонкой объектов"
        correct: true
      - text: "pandas распознает её как пропуск автоматически"
      - text: "Строка будет отброшена вместе со всей записью"
      - text: "Возникнет ошибка чтения"
    explanation: |
      Список распознаваемых пропусков у pandas фиксирован и не включает всё
      многообразие того, что присылают источники. Задаётся через
      `na_values=[\"NULL\", \"NA\", \"-\", \"не указано\"]`.

  - id: pydata-nan-is-float
    kind: single
    prompt: |
      Колонка целых идентификаторов содержит пропуски. Почему в pandas
      значения выглядят как `1.0`, `2.0`?
    options:
      - text: "NaN — это число с плавающей точкой, поэтому колонка целых с пропусками становится вещественной; лечится типом Int64"
        correct: true
      - text: "pandas всегда хранит числа как float"
      - text: "Так отображается длинное целое"
      - text: "Это ошибка чтения CSV"
    explanation: |
      Практическая беда: такой идентификатор при выгрузке превращается в
      `1.0` и перестаёт соединяться с источником. Тип `Int64` (с большой
      буквы) умеет хранить пропуски и остаётся целым.

  - id: pydata-json-ensure-ascii
    kind: single
    prompt: |
      Зачем `json.dumps(data, ensure_ascii=False)` для русского текста?
    options:
      - text: "Иначе кириллица экранируется в последовательности \\uXXXX: JSON останется валидным, но нечитаемым"
        correct: true
      - text: "Иначе возникнет ошибка кодировки"
      - text: "Иначе текст обрежется"
      - text: "Это ускоряет сериализацию"
    explanation: |
      Файл при этом ещё и раздувается втрое. Ошибки не будет — будет лог, в
      котором ничего нельзя прочитать глазами.

  - id: pydata-jsonl
    kind: single
    prompt: |
      Чем JSON Lines удобнее одного большого JSON-массива для выгрузок?
    options:
      - text: "Его можно обрабатывать потоково: каждая строка — самостоятельный объект, файл не нужно разбирать целиком"
        correct: true
      - text: "Он занимает меньше места"
      - text: "Он поддерживает вложенность, а обычный JSON нет"
      - text: "Его быстрее читает pandas"
    explanation: |
      Массив требует прочитать и разобрать весь файл до первого полезного
      действия. Плюс к строкам можно дописывать, а в закрытый массив — нет.

  - id: pydata-json-normalize-explosion
    kind: single
    prompt: |
      `pd.json_normalize` развернул заказы с позициями: у заказа три позиции —
      три строки. Что нельзя делать дальше?
    options:
      - text: "Суммировать сумму заказа: она повторилась в каждой строке и задвоится"
        correct: true
      - text: "Группировать по идентификатору заказа"
      - text: "Считать число позиций"
      - text: "Соединять с другими таблицами"
    explanation: |
      Ровно та же ошибка, что задвоение при соединении «один ко многим».
      Суммировать надо меры того зерна, которое получилось: суммы позиций, а не
      шапки заказа.

  - id: pydata-object-dtype
    kind: single
    prompt: |
      В `df.info()` у текстовой колонки тип `object`. Что это значит?
    options:
      - text: "Значения хранятся как питоновские объекты: медленно и расходует много памяти, потому что каждое значение отдельный объект в куче"
        correct: true
      - text: "Колонка содержит смешанные типы и требует исправления"
      - text: "Колонка не проиндексирована"
      - text: "Значения хранятся сжатыми"
    explanation: |
      Для колонок с повторяющимися значениями — городов, статусов, категорий —
      тип `category` экономит память кратно, храня словарь значений и коды.

  - id: pydata-setting-with-copy
    kind: find-error
    prompt: |
      ```python
      df[df["amount"] > 0]["status"] = "ok"
      ```
      Почему pandas выдаёт SettingWithCopyWarning?
    options:
      - text: "Цепочка индексаций может вернуть копию, и запись уйдёт в неё, а не в исходный датафрейм; правильно — df.loc[условие, 'status'] = 'ok'"
        correct: true
      - text: "Нельзя присваивать строковое значение числовой колонке"
      - text: "Условие должно быть в скобках"
      - text: "Нужно использовать df.iloc вместо цепочки"
    explanation: |
      Предупреждение означает именно неопределённость: непонятно, меняешь ты
      оригинал или копию. `.loc` с указанием строк и колонки за одну операцию
      снимает вопрос.

  - id: pydata-apply-slow
    kind: single
    prompt: |
      Почему `df.apply(lambda r: r["price"] * r["qty"], axis=1)` медленнее, чем
      `df["price"] * df["qty"]`?
    options:
      - text: "apply вызывает питоновскую функцию для каждой строки, а векторная операция выполняется целиком в оптимизированном коде"
        correct: true
      - text: "apply создаёт копию датафрейма"
      - text: "apply не использует индекс"
      - text: "Разницы нет, это одно и то же"
    explanation: |
      Та же логика, что с UDF в Spark: сначала ищем встроенный способ. Разница
      обычно в десятки раз и растёт с объёмом.

  - id: pydata-pandas-limits
    kind: single
    prompt: |
      Данных 200 ГБ, они лежат в PostgreSQL, нужна агрегация по месяцам. Что
      делать?
    options:
      - text: "Агрегировать запросом в самой базе и забрать результат: не тащить данные к коду, если можно принести код к данным"
        correct: true
      - text: "Выгрузить всё в CSV и обработать pandas порциями"
      - text: "Увеличить память на машине и загрузить в pandas целиком"
      - text: "Прочитать в pandas с chunksize и склеить результаты"
    explanation: |
      Формулировка «принести код к данным» стоит того, чтобы произнести её на
      собеседовании: она показывает понимание, где выполняется работа и сколько
      стоит её перемещение.

  - id: pydata-chunk-average
    kind: single
    prompt: |
      Файл читается порциями по 100 000 строк, нужно среднее по колонке.
      Как считать?
    options:
      - text: "Накапливать сумму и количество, а делить в самом конце: среднее из средних неверно при разных размерах порций"
        correct: true
      - text: "Считать среднее в каждой порции и усреднить результаты"
      - text: "Взять среднее последней порции как приближение"
      - text: "Среднее по порциям посчитать нельзя"
    explanation: |
      Та же неаддитивность отношений, что в моделировании витрин: складывать
      можно числитель и знаменатель, а не готовые доли.

  - id: pydata-parquet-columns
    kind: single
    prompt: |
      Что даёт `pd.read_parquet(path, columns=["day", "amount"])`?
    options:
      - text: "Читаются только эти колонки — на широкой таблице разница в объёме чтения огромна"
        correct: true
      - text: "Результат фильтруется после полного чтения файла"
      - text: "Остальные колонки читаются, но не отображаются"
      - text: "Файл переписывается с этими колонками"
    explanation: |
      Это и есть проекция колонок — главное преимущество колоночного формата.
      В CSV такой возможности нет в принципе: чтобы получить две колонки,
      придётся прочитать весь файл.

  - id: pydata-parquet-schema
    kind: single
    prompt: |
      Чем Parquet удобнее CSV при передаче данных между шагами пайплайна?
    options:
      - text: "Схема хранится внутри файла: типы не теряются и не угадываются при каждом чтении"
        correct: true
      - text: "Он читается любым текстовым редактором"
      - text: "Он не требует библиотек для чтения"
      - text: "Он всегда меньше по размеру, независимо от данных"
    explanation: |
      Потеря типов между шагами — источник тихих ошибок: дата стала строкой,
      идентификатор числом с ведущими нулями. Parquet эту проблему убирает.

  - id: pydata-bad-rows-strategy
    kind: single
    prompt: |
      Разбор файла падает на одной битой строке из миллиона. Как правильно?
    options:
      - text: "Пропускать битые строки, СЧИТАТЬ их и сообщать: решение принимать по доле, а не молча глотать и не падать на первой"
        correct: true
      - text: "Падать на первой битой строке: данные должны быть чистыми"
      - text: "Пропускать битые строки молча"
      - text: "Заменять непонятные значения на нули"
    explanation: |
      Обработка, падающая на первой ошибке, бесполезна; молча глотающая —
      опасна. Единицы битых строк из миллиона это предупреждение, десять
      процентов — повод остановиться.

  - id: pydata-dictreader
    kind: single
    prompt: |
      Чем `csv.DictReader` лучше `csv.reader` при работе с чужими выгрузками?
    options:
      - text: "Он обращается к полям по имени из заголовка, поэтому перестановка колонок в источнике ничего не сломает"
        correct: true
      - text: "Он работает быстрее"
      - text: "Он сам определяет типы значений"
      - text: "Он умеет читать сжатые файлы"
    explanation: |
      Доступ по индексу (`row[3]`) ломается тихо: колонки поменялись местами, и
      в поле суммы оказалась дата. Доступ по имени даёт понятную ошибку сразу.

  - id: pydata-bom
    kind: single
    prompt: |
      Файл выгружен из Excel, и первая колонка получила имя с невидимым
      префиксом. Что это и как лечить?
    options:
      - text: "Метка порядка байтов (BOM) в начале файла; читать с encoding='utf-8-sig'"
        correct: true
      - text: "Пробел в заголовке, нужно вызвать strip()"
      - text: "Неверный разделитель"
      - text: "Повреждённый файл, нужна повторная выгрузка"
    explanation: |
      Симптом узнаваем: `df[\"id\"]` даёт KeyError, хотя колонка видна глазами.
      Кодировка utf-8-sig отбрасывает метку при чтении.

  - id: pydata-iterrows
    kind: single
    prompt: |
      Нужно обойти датафрейм построчно. Что выбрать?
    options:
      - text: "Лучше не обходить вовсе; если необходимо — itertuples, он заметно быстрее iterrows"
        correct: true
      - text: "iterrows: он удобнее и быстрее"
      - text: "apply с axis=1 — это и есть правильный обход"
      - text: "Преобразовать в список словарей и обойти его"
    explanation: |
      iterrows создаёт объект Series на каждую строку — отсюда и медленность.
      Но главный ответ прежний: почти любая построчная задача выражается
      векторной операцией или группировкой.

  - id: pydata-merge-validate
    kind: single
    prompt: |
      Как в pandas защититься от неожиданного размножения строк при merge?
    options:
      - text: "Параметр validate: например, validate='m:1' возбудит ошибку, если справа ключ окажется неуникальным"
        correct: true
      - text: "Добавить drop_duplicates после соединения"
      - text: "Использовать how='left' вместо how='inner'"
      - text: "Отсортировать обе таблицы по ключу"
    explanation: |
      drop_duplicates замаскировал бы проблему, а не выявил. `validate`
      выражает предположение о кратности связи явно — и ломается ровно тогда,
      когда оно перестало выполняться.
