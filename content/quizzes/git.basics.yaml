questions:
  - id: git-what-is-commit
    kind: single
    prompt: |
      Что физически представляет собой коммит в Git?
    options:
      - text: "Снимок всего дерева файлов плюс ссылка на родителя; разницу Git вычисляет при показе"
        correct: true
      - text: "Набор изменений относительно предыдущего коммита"
      - text: "Запись в журнале с описанием правок"
      - text: "Архив изменённых файлов"
    explanation: |
      Из этого следует, почему нельзя поменять старый коммит, не поменяв все
      последующие: идентификатор коммита — хеш его содержимого вместе со
      ссылкой на родителя.

  - id: git-what-is-branch
    kind: single
    prompt: |
      Что такое ветка в Git?
    options:
      - text: "Указатель на коммит — файл в несколько десятков байт"
        correct: true
      - text: "Копия репозитория на момент создания"
      - text: "Отдельный каталог с версией файлов"
      - text: "Последовательность коммитов, скопированная из основной ветки"
    explanation: |
      Именно поэтому ветки в Git дёшевы и их заводят свободно — под задачу, под
      эксперимент. В системах, где ветка была копией дерева, это было дорогой
      операцией.

  - id: git-three-areas
    kind: single
    prompt: |
      Зачем нужен индекс (staging), если можно коммитить сразу?
    options:
      - text: "Чтобы собрать коммит выборочно: сделал пять правок, а закоммитил две связанные между собой"
        correct: true
      - text: "Чтобы ускорить создание коммита"
      - text: "Чтобы Git успел проверить файлы на ошибки"
      - text: "Это техническое требование, смысла для пользователя нет"
    explanation: |
      `git add -p` позволяет добавлять по кускам внутри файла. Это и отличает
      аккуратную историю, по которой можно разбираться, от свалки коммитов
      «фиксы».

  - id: git-merge-vs-rebase
    kind: single
    prompt: |
      В чём главное отличие rebase от merge?
    options:
      - text: "Rebase создаёт НОВЫЕ коммиты поверх другого основания; merge сохраняет исходные коммиты и добавляет коммит слияния"
        correct: true
      - text: "Rebase быстрее, потому что не создаёт лишний коммит"
      - text: "Merge применим только к главной ветке"
      - text: "Rebase не может привести к конфликтам"
    explanation: |
      Ключевое слово — «новые»: у перебазированных коммитов другие хеши.
      Конфликты возможны в обоих случаях, причём при rebase они могут
      возникать на каждом переносимом коммите.

  - id: git-rebase-published
    kind: single
    prompt: |
      Почему нельзя делать rebase ветки, которую уже забрали коллеги?
    options:
      - text: "Коммиты заменяются новыми, и у всех, кто забрал прежние, история разойдётся — им придётся разбираться вручную"
        correct: true
      - text: "Git запретит выполнить такую команду"
      - text: "Пропадут все конфликты, которые уже были разрешены"
      - text: "Это допустимо, если сделать push --force"
    explanation: |
      Правило наизусть: не переписывай историю, которую уже видели другие. Своя
      ветка до пул-реквеста — переписывай сколько угодно; общая — только merge.

  - id: git-conflict-markers
    kind: single
    prompt: |
      В файле появились маркеры `<<<<<<< HEAD ... ======= ... >>>>>>> feature`.
      Что означает верхняя часть?
    options:
      - text: "Версию текущей ветки — той, в которую вливают"
        correct: true
      - text: "Версию приходящей ветки"
      - text: "Общего предка двух версий"
      - text: "Автоматически предложенный Git вариант"
    explanation: |
      Снизу — то, что приходит. Разрешение конфликта это не выбор одной из
      половин, а написание правильного итогового кода с последующим удалением
      маркеров и `git add`.

  - id: git-conflict-cause
    kind: single
    prompt: |
      Когда возникает конфликт слияния?
    options:
      - text: "Когда две ветки изменили одни и те же строки файла"
        correct: true
      - text: "Когда две ветки изменили один и тот же файл"
      - text: "Когда ветки разошлись больше чем на десять коммитов"
      - text: "Когда в ветках разные имена файлов"
    explanation: |
      Правки в разных местах одного файла Git сливает сам. Отсюда и главный
      способ борьбы с конфликтами — короткие ветки: ветка на два дня почти ни
      с чем не пересекается.

  - id: git-revert-vs-reset
    kind: single
    prompt: |
      Ты запушил в общую ветку коммит, который надо откатить. Что делать?
    options:
      - text: "git revert — он создаёт новый коммит, отменяющий изменения, и не переписывает историю"
        correct: true
      - text: "git reset --hard и push --force"
      - text: "git restore для затронутых файлов"
      - text: "Удалить ветку и создать заново"
    explanation: |
      Ответ «reset --hard и force push» на собеседовании считается тревожным
      признаком: он ломает историю у всех, кто её уже забрал. В общей ветке
      правильный способ ровно один — revert.

  - id: git-reset-modes
    kind: single
    prompt: |
      Чем `git reset --soft HEAD~1` отличается от `--hard`?
    options:
      - text: "soft отменяет коммит, оставляя изменения в индексе; hard уничтожает изменения вместе с коммитом"
        correct: true
      - text: "soft работает только с последним коммитом, hard — с любым"
      - text: "soft переписывает историю, hard нет"
      - text: "Разница только в скорости"
    explanation: |
      Промежуточный режим — mixed (по умолчанию): изменения остаются в рабочем
      каталоге, но не в индексе. `--hard` — единственный из трёх, который
      уничтожает работу безвозвратно.

  - id: git-restore-danger
    kind: single
    prompt: |
      `git restore файл.py` для файла с несохранёнными правками. Что
      произойдёт?
    options:
      - text: "Правки будут потеряны безвозвратно: Git их не видел, восстанавливать нечего"
        correct: true
      - text: "Правки уйдут в stash автоматически"
      - text: "Правки останутся, файл просто вернётся в индекс"
      - text: "Git попросит подтверждение"
    explanation: |
      Единственные по-настоящему уязвимые данные в Git — незакоммиченные.
      Отсюда привычка коммитить часто, а причёсывать историю потом.

  - id: git-reflog
    kind: single
    prompt: |
      Случайно сделал `git reset --hard` и потерял три коммита. Что делать?
    options:
      - text: "git reflog: он хранит журнал всех перемещений HEAD, по нему находится хеш нужного состояния"
        correct: true
      - text: "Ничего: коммиты удалены безвозвратно"
      - text: "Восстановить из удалённого репозитория, если успел запушить"
      - text: "git revert последнего действия"
    explanation: |
      Практический вывод: закоммиченное потерять почти невозможно. Reflog
      хранит записи неделями, и через него достаётся и потерянная ветка, и
      состояние до неудачного rebase.

  - id: git-stash
    kind: single
    prompt: |
      Для чего нужен `git stash`?
    options:
      - text: "Отложить незавершённую работу, чтобы переключиться на другую задачу, и вернуть её потом"
        correct: true
      - text: "Сохранить резервную копию репозитория"
      - text: "Отправить изменения на сервер без коммита"
      - text: "Отменить последний коммит"
    explanation: |
      Стоит помнить, что стеш легко забыть: работа лежит вне веток и не видна в
      обычном логе. Для чего-то дольше пары часов лучше временный коммит в
      отдельной ветке.

  - id: git-force-with-lease
    kind: single
    prompt: |
      Чем `--force-with-lease` лучше обычного `--force`?
    options:
      - text: "Он откажется затирать чужие изменения, появившиеся после твоего последнего fetch"
        correct: true
      - text: "Он работает быстрее"
      - text: "Он создаёт резервную копию ветки перед перезаписью"
      - text: "Он не переписывает историю вовсе"
    explanation: |
      Обычный `--force` затрёт чужую работу молча. Разница проявляется ровно в
      той ситуации, ради которой она и придумана: коллега запушил в ту же ветку,
      пока ты правил свои коммиты.

  - id: git-fetch-vs-pull
    kind: single
    prompt: |
      Чем `git fetch` отличается от `git pull`?
    options:
      - text: "Fetch только забирает изменения с сервера, не трогая рабочую ветку; pull дополнительно сливает их в неё"
        correct: true
      - text: "Fetch работает только с одной веткой"
      - text: "Pull не требует сети"
      - text: "Fetch создаёт коммит слияния"
    explanation: |
      Fetch безопасен всегда и полезен как привычка: сначала посмотреть, что
      пришло, потом решать, сливать или перебазировать.

  - id: git-gitignore-late
    kind: single
    prompt: |
      Файл с паролем уже закоммичен. Помогает ли добавление его в .gitignore?
    options:
      - text: "Нет: файл остаётся в истории. Первое действие — сменить сам пароль, а не чистить историю"
        correct: true
      - text: "Да, .gitignore убирает файл из всех коммитов"
      - text: "Да, если сделать git rm --cached"
      - text: "Да, после следующего push"
    explanation: |
      `git rm --cached` уберёт файл из будущих коммитов, но прошлые останутся.
      Секрет, попавший в репозиторий, надо считать скомпрометированным — отзыв
      и замена важнее и быстрее переписывания истории.

  - id: git-commit-message
    kind: single
    prompt: |
      Что важнее всего написать в теле сообщения коммита?
    options:
      - text: "ПОЧЕМУ сделано именно так: что сделано, видно из диффа, а причина нигде больше не сохраняется"
        correct: true
      - text: "Список изменённых файлов"
      - text: "Имя задачи из трекера и ничего больше"
      - text: "Подробное описание каждой изменённой строки"
    explanation: |
      Сообщение пишется для того, кто через год выясняет, почему здесь такое
      условие. Дифф ответит на «что», на «почему» — только сообщение.

  - id: git-conventional-commits
    kind: single
    prompt: |
      Зачем нужны префиксы вида `feat:`, `fix:`, `docs:`?
    options:
      - text: "По ним автоматически собирается список изменений и определяется, какую часть версии повышать"
        correct: true
      - text: "Они ускоряют поиск по истории"
      - text: "Они требуются самим Git"
      - text: "Они нужны только для красоты"
    explanation: |
      В этом репозитории соглашение проверяется хуком commitizen — то есть
      коммит с произвольным префиксом просто не пройдёт.

  - id: git-bisect
    kind: single
    prompt: |
      Поведение сломалось где-то за последние 200 коммитов. Что поможет найти
      виновника?
    options:
      - text: "git bisect: бинарный поиск по истории, примерно восемь проверок вместо двухсот"
        correct: true
      - text: "git blame по всем файлам"
      - text: "git log --grep по сообщениям"
      - text: "git diff между первым и последним коммитом"
    explanation: |
      Тот же приём, что и поиск дня, с которого поехали данные в пайплайне:
      сузить область делением пополам, а не читать всё подряд.

  - id: git-cherry-pick
    kind: single
    prompt: |
      Нужно перенести один конкретный коммит из другой ветки, не сливая её
      целиком. Что использовать?
    options:
      - text: "git cherry-pick с хешем этого коммита"
        correct: true
      - text: "git merge с указанием коммита"
      - text: "git rebase --onto"
      - text: "git stash apply"
    explanation: |
      Cherry-pick создаёт КОПИЮ коммита с новым хешем. Если потом слить ветку
      целиком, изменение окажется в истории дважды — обычно безболезненно, но
      знать об этом стоит.

  - id: git-short-branches
    kind: single
    prompt: |
      Какой приём сильнее всего снижает число конфликтов в команде?
    options:
      - text: "Короткие ветки: то, что живёт два дня, почти ни с чем не пересекается, а трёхнедельная ветка конфликтует со всем"
        correct: true
      - text: "Запрет на rebase"
      - text: "Более частые git fetch"
      - text: "Разделение файлов на более мелкие"
    explanation: |
      Конфликт — функция от времени расхождения веток. Все прочие приёмы лечат
      симптомы, а короткие ветки убирают причину.
