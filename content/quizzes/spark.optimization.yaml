questions:
  - id: skew-symptom
    kind: single
    prompt: |
      В стадии 200 задач: 199 закончились за 10 секунд, одна идёт 40 минут и
      падает с OutOfMemory. Диагноз?
    options:
      - text: "Перекос данных: по одному значению ключа строк на порядки больше, и все они попали в одну партицию"
        correct: true
      - text: "Не хватает исполнителей"
      - text: "Медленная сеть между узлами"
      - text: "Повреждён один из входных файлов"
    explanation: |
      Ключевой признак — именно разброс: медиана ничтожна, максимум огромен.
      Добавление исполнителей здесь не поможет, потому что узкое место — одна
      задача на одном ядре.

  - id: skew-more-executors
    kind: single
    prompt: |
      При перекосе добавили вдвое больше исполнителей. Что изменится?
    options:
      - text: "Практически ничего: горячая партиция по-прежнему обрабатывается одной задачей на одном ядре"
        correct: true
      - text: "Джоба ускорится примерно вдвое"
      - text: "Spark автоматически перераспределит горячий ключ"
      - text: "Ускорится, но только при включённом кешировании"
    explanation: |
      Это и делает перекос таким неприятным: он не лечится ресурсами. Пока
      данные одного ключа лежат в одной партиции, параллелизм на них равен
      единице.

  - id: skew-sources
    kind: multiple
    prompt: |
      Что типично порождает перекос при соединении?
    options:
      - text: "NULL в ключе соединения: все NULL попадают в одну партицию"
        correct: true
      - text: "Технический ключ-заглушка вроде -1 или 'UNKNOWN'"
        correct: true
      - text: "Реальный дисбаланс: один клиент даёт 80% событий"
        correct: true
      - text: "Использование Parquet вместо CSV"
    explanation: |
      Первые три — практически весь список причин. Формат хранения к
      распределению по ключу отношения не имеет.

  - id: skew-diagnose
    kind: single
    prompt: |
      Каким запросом быстрее всего подтвердить перекос по ключу соединения?
    options:
      - text: "df.groupBy(ключ).count().orderBy(desc('count')).show(20) — если первое значение на порядки больше двадцатого, перекос есть"
        correct: true
      - text: "df.count() — сравнить с ожидаемым числом строк"
      - text: "df.describe().show()"
      - text: "df.explain(True)"
    explanation: |
      Распределение по ключу — прямое измерение того, что вызывает перекос.
      План покажет наличие shuffle, но не скажет, что данные по нему легли
      неравномерно.

  - id: skew-aqe-first
    kind: single
    prompt: |
      Обнаружен перекос при join. С чего начать лечение?
    options:
      - text: "Включить AQE со skewJoin: он сам разобьёт крупную партицию на несколько, продублировав нужную часть второй стороны"
        correct: true
      - text: "Сразу применить соление ключа"
      - text: "Увеличить память исполнителей"
      - text: "Переписать join на RDD"
    explanation: |
      AQE ничего не стоит в коде и решает большинство случаев. Соление сложнее и
      дороже, поэтому оно последнее средство, а не первое.

  - id: skew-null-key
    kind: single
    prompt: |
      Перекос вызван тем, что у 40% строк `user_id IS NULL`. Эти строки в
      соединении не нужны. Лучшее решение?
    options:
      - text: "Отфильтровать NULL до соединения — это убирает причину, а не симптом, и дешевле всех остальных приёмов"
        correct: true
      - text: "Заменить NULL на случайные значения"
      - text: "Применить соление ключа"
      - text: "Увеличить spark.sql.shuffle.partitions"
    explanation: |
      Замена NULL на случайные значения породит соединения, которых не должно
      быть. Если строки с NULL всё же нужны, их обрабатывают отдельной ветвью
      без соединения.

  - id: skew-salting-cost
    kind: single
    prompt: |
      Что является ценой соления ключа (salting)?
    options:
      - text: "Вторая сторона соединения размножается в N раз, а код становится существенно сложнее"
        correct: true
      - text: "Результат соединения становится приблизительным"
      - text: "Теряется возможность использовать broadcast для других соединений"
      - text: "Ничего: соление бесплатно"
    explanation: |
      Ради разбиения горячего ключа на N частей маленькую сторону приходится
      размножить на те же N значений соли. Поэтому приём применяют, когда
      перекос настоящий и данные нужны целиком.

  - id: broadcast-what
    kind: single
    prompt: |
      Что происходит при broadcast join?
    options:
      - text: "Маленькая сторона рассылается целиком всем исполнителям, и большая таблица не тасуется вовсе"
        correct: true
      - text: "Обе стороны перераспределяются по хешу ключа"
      - text: "Соединение выполняется на драйвере"
      - text: "Большая таблица кешируется в памяти"
    explanation: |
      Именно отсутствие shuffle большой стороны и делает broadcast самым
      дешёвым способом соединения там, где он применим.

  - id: broadcast-limits
    kind: multiple
    prompt: |
      Когда broadcast join не сработает или навредит?
    options:
      - text: "Когда «маленькая» сторона на самом деле велика: она окажется в памяти каждого исполнителя, а сначала соберётся на драйвере"
        correct: true
      - text: "При full outer join"
        correct: true
      - text: "Когда размер стороны оценён неверно из-за отсутствия статистики"
        correct: true
      - text: "Когда соединение идёт по строковому ключу"
    explanation: |
      Тип ключа роли не играет. А вот сжатый Parquet в 8 МБ может развернуться в
      память заметно крупнее — оценка размера обманчива.

  - id: broadcast-hint-is-not-check
    kind: single
    prompt: |
      Вызвали `F.broadcast(df)` для таблицы в 3 ГБ. Что сделает Spark?
    options:
      - text: "Поверит подсказке и попытается разослать её: broadcast() — это указание, а не проверка размера"
        correct: true
      - text: "Проигнорирует подсказку, увидев размер"
      - text: "Автоматически переключится на SortMergeJoin"
      - text: "Выдаст предупреждение и продолжит без broadcast"
    explanation: |
      Именно поэтому расставлять broadcast «на всякий случай» опасно. Обычно всё
      кончается падением драйвера, который собирает эту сторону перед рассылкой.

  - id: broadcast-use-case
    kind: single
    prompt: |
      Для чего broadcast подходит лучше всего?
    options:
      - text: "Для соединения большой таблицы фактов со справочником или измерением"
        correct: true
      - text: "Для соединения двух таблиц фактов по миллиарду строк"
      - text: "Для группировки с агрегацией"
      - text: "Для глобальной сортировки результата"
    explanation: |
      Соединение двух фактовых таблиц broadcast не лечится — там работают
      уменьшение объёма до shuffle, бакетирование и AQE.

  - id: metrics-median-vs-max
    kind: single
    prompt: |
      В метриках стадии медиана времени задачи 8 с, максимум 22 мин. О чём это
      говорит?
    options:
      - text: "О перекосе: разброс между медианой и максимумом — его главный признак"
        correct: true
      - text: "О нехватке памяти на кластере"
      - text: "О слишком большом числе партиций"
      - text: "О медленном чтении из хранилища"
    explanation: |
      Смотреть надо именно на распределение, а не на среднее: среднее по 200
      задачам скроет одну аномальную.

  - id: metrics-all-slow
    kind: single
    prompt: |
      Все задачи стадии медленные примерно одинаково. Что это означает?
    options:
      - text: "Перекоса нет: либо мало ресурсов, либо партиции слишком крупные для доступной памяти"
        correct: true
      - text: "Перекос по ключу соединения"
      - text: "Слишком мелкие входные файлы"
      - text: "Неверный тип соединения"
    explanation: |
      Равномерная медленность — это вопрос объёма работы на задачу и доступных
      ресурсов, а не распределения данных.

  - id: metrics-spill
    kind: single
    prompt: |
      В метриках задач ненулевой Spill (memory и disk). Что это значит и чем
      лечится?
    options:
      - text: "Данные не поместились в памяти задачи и разлились на диск; лечится увеличением числа партиций, чтобы каждая стала меньше"
        correct: true
      - text: "Часть данных потеряна, результат неполон"
      - text: "Кеш вытеснен на диск, на скорость это не влияет"
      - text: "Лечится только увеличением памяти исполнителя"
    explanation: |
      Разлив коварен тем, что джоба не падает — она просто работает в разы
      медленнее, и это легко не заметить. Больше памяти тоже помогает, но
      уменьшение партиций обычно дешевле.

  - id: metrics-many-tiny-tasks
    kind: single
    prompt: |
      Задач в стадии в сто раз больше числа ядер, каждая выполняется 50 мс.
      Что не так?
    options:
      - text: "Слишком много партиций: накладные расходы на задачу превышают полезную работу"
        correct: true
      - text: "Перекос данных"
      - text: "Не хватает памяти"
      - text: "Всё в порядке: чем больше задач, тем лучше параллелизм"
    explanation: |
      Обратная сторона тюнинга партиций. Ориентир прежний: партиция в 128–256 МБ
      и число партиций кратно числу ядер.

  - id: oom-executor-vs-driver
    kind: single
    prompt: |
      OutOfMemoryError в логе ДРАЙВЕРА. Что искать в первую очередь?
    options:
      - text: "Сбор данных на драйвер: collect, toPandas, слишком большой broadcast"
        correct: true
      - text: "Слишком крупные партиции у исполнителей"
      - text: "Перекос по ключу соединения"
      - text: "Разлив на диск"
    explanation: |
      Различать, в чьём логе ошибка, — базовый навык. У исполнителя OOM
      означает слишком большую партицию, у драйвера — что данные стянули к нему.

  - id: oom-executor-fix
    kind: single
    prompt: |
      OutOfMemoryError у ИСПОЛНИТЕЛЯ. Что попробовать раньше, чем добавлять
      память?
    options:
      - text: "Увеличить число партиций, чтобы данных на задачу стало меньше, и снять лишний кеш"
        correct: true
      - text: "Сразу удвоить память исполнителя — это самое надёжное"
      - text: "Уменьшить число исполнителей"
      - text: "Отключить AQE"
    explanation: |
      Добавление памяти — самое дорогое решение и лечит до следующего роста
      данных. Кеш при этом живёт в той же памяти, что и вычисления, и лишний
      закешированный датафрейм вытесняет полезное.

  - id: reduce-shuffle-filter-early
    kind: single
    prompt: |
      Какой приём уменьшения shuffle даёт наибольшую отдачу при прочих равных?
    options:
      - text: "Фильтровать и отбрасывать ненужные колонки ДО соединения — тасуется меньше данных и меньшая ширина строки"
        correct: true
      - text: "Увеличить spark.sql.shuffle.partitions"
      - text: "Добавить repartition перед каждым join"
      - text: "Включить сжатие результата"
    explanation: |
      Дешевле всего не оптимизировать обмен, а сократить то, что через него
      едет. Catalyst часто делает это сам, но не всегда — например, при UDF в
      условии фильтра.

  - id: reduce-shuffle-order-by
    kind: single
    prompt: |
      В конце пайплайна стоит `orderBy("created_at")`, результат пишется в
      Parquet. Стоит ли его оставлять?
    options:
      - text: "Обычно нет: глобальная сортировка — это shuffle, а порядок строк в файлах сам по себе редко нужен"
        correct: true
      - text: "Да, всегда: отсортированные данные читаются быстрее"
      - text: "Да, иначе Parquet не сможет собрать статистику"
      - text: "Не имеет значения: orderBy не вызывает shuffle"
    explanation: |
      Оговорка: сортировка по колонке фильтрации помогает predicate pushdown при
      последующем чтении. Но тогда это осознанное решение с понятной выгодой, а
      не «пусть будет по порядку».

  - id: reduce-shuffle-bucketing
    kind: single
    prompt: |
      Две большие таблицы соединяются по одному и тому же ключу в десятке
      пайплайнов. Что даст наибольшую экономию?
    options:
      - text: "Записать их заранее распределёнными по этому ключу (бакетирование), чтобы соединение обходилось без shuffle"
        correct: true
      - text: "Кешировать обе таблицы"
      - text: "Применить broadcast к обеим"
      - text: "Увеличить число исполнителей"
    explanation: |
      Плата за shuffle переносится в момент записи и оплачивается один раз, а не
      в каждом из десяти пайплайнов. Условие — совпадение ключа и числа бакетов
      у обеих сторон.

  - id: debug-order
    kind: single
    prompt: |
      Джоба стала работать вдвое дольше. С чего начать разбор?
    options:
      - text: "С интерфейса Spark: найти самую долгую стадию и посмотреть распределение времени по её задачам"
        correct: true
      - text: "С увеличения памяти исполнителей"
      - text: "С чтения кода джобы сверху вниз"
      - text: "С включения кеширования на всех датафреймах"
    explanation: |
      Ответ «увеличил бы память» без предшествующего разбора — типичный признак
      того, что человек не работал с настоящими джобами. Разбор всегда начинается
      с самой долгой стадии: остальное на итог не влияет.

  - id: debug-input-files
    kind: single
    prompt: |
      Стадия чтения порождает 40 000 задач на 5 ГБ данных. Что проверить?
    options:
      - text: "Число и размер входных файлов: похоже на тысячи мелких файлов; помогает компакция источника и maxPartitionBytes при чтении"
        correct: true
      - text: "Число исполнителей"
      - text: "Перекос по ключу соединения"
      - text: "Настройку shuffle.partitions"
    explanation: |
      shuffle.partitions влияет на стадии ПОСЛЕ обмена, а не на чтение. Число
      задач чтения определяется тем, как нарезан вход.

  - id: no-speedup-after-scaling
    kind: single
    prompt: |
      Число исполнителей удвоили, время джобы не изменилось. Две наиболее
      вероятные причины?
    options:
      - text: "Перекос (узкое место — одна задача) или потеря параллелизма из-за coalesce(1) в цепочке"
        correct: true
      - text: "Недостаточный объём кеша и медленная сеть"
      - text: "Неверный формат хранения и отсутствие сжатия"
      - text: "Слишком большое число партиций и слабый драйвер"
    explanation: |
      Обе причины сводятся к одному: параллелизм на узком месте равен единице.
      Ресурсы, добавленные вокруг единственной работающей задачи, простаивают.

  - id: dynamic-allocation
    kind: single
    prompt: |
      Что делает динамическое выделение ресурсов (dynamicAllocation)?
    options:
      - text: "Добавляет и снимает исполнителей по фактической нагрузке; на общем кластере требует внешнего shuffle-сервиса"
        correct: true
      - text: "Автоматически подбирает число партиций"
      - text: "Переключает тип соединения по ходу выполнения"
      - text: "Перераспределяет перекошенные партиции"
    explanation: |
      Подбор партиций и переключение соединений — это AQE, другой механизм.
      Внешний shuffle-сервис нужен потому, что снятый исполнитель уносит с собой
      промежуточные файлы обмена.
