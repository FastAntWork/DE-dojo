questions:
  - id: dbt-what-it-does
    kind: single
    prompt: |
      Что dbt делает с файлом модели, содержащим один SELECT?
    options:
      - text: "Оборачивает его в DDL (CREATE TABLE AS / CREATE VIEW AS) и отдаёт базе; вычисляет всё сама база"
        correct: true
      - text: "Выполняет запрос своим движком и записывает результат в хранилище"
      - text: "Переводит SQL в Spark-джобу"
      - text: "Сохраняет запрос как хранимую процедуру"
    explanation: |
      Своего движка исполнения у dbt нет. Он генерирует SQL и выстраивает
      порядок, а всю работу делает хранилище. Отсюда и его требования к
      инфраструктуре: нужна база, которая тянет нагрузку.

  - id: dbt-elt-not-etl
    kind: single
    prompt: |
      Почему dbt называют инструментом слоя T в ELT, а не ETL-инструментом?
    options:
      - text: "Он преобразует данные, которые уже лежат в хранилище, и не занимается их извлечением и загрузкой"
        correct: true
      - text: "Потому что он написан на Python, а не на Java"
      - text: "Потому что он работает только с колоночными хранилищами"
      - text: "Потому что он не умеет писать таблицы, только представления"
    explanation: |
      За E и L отвечают другие инструменты: Airflow, Airbyte, коннекторы.
      Путать роли — типичная ошибка на собеседовании: у dbt нет ни коннекторов
      к источникам, ни механизма загрузки.

  - id: dbt-ref-purpose
    kind: multiple
    prompt: |
      Что даёт `{{ ref('stg_orders') }}` вместо написанного руками имени
      таблицы? Выбери всё верное.
    options:
      - text: "Подстановку полного имени с учётом окружения: в проде одна схема, в песочнице разработчика другая"
        correct: true
      - text: "Построение графа зависимостей, из которого берётся порядок выполнения"
        correct: true
      - text: "Возможность выбрать подграф: пересчитать модель и всё, что от неё зависит"
        correct: true
      - text: "Кеширование результата модели в памяти dbt"
    explanation: |
      Первые три пункта теряются все сразу, если написать имя таблицы строкой:
      порядок выполнения станет случайным, а окружения перестанут разделяться.
      Никакого кеша у dbt нет.

  - id: dbt-source-purpose
    kind: single
    prompt: |
      Для чего нужен `source()`, если можно просто написать имя внешней
      таблицы?
    options:
      - text: "Он обозначает явную границу проекта и даёт точку, где проверяется свежесть входящих данных"
        correct: true
      - text: "Он копирует внешнюю таблицу внутрь проекта dbt"
      - text: "Он создаёт представление над внешней таблицей"
      - text: "Он нужен только для документации и на поведение не влияет"
    explanation: |
      Через source описываются таблицы, которые dbt НЕ создаёт. К ним
      привязывается freshness — проверка `dbt source freshness` скажет, что
      данные перестали поступать, до того как это заметят по витринам.

  - id: dbt-materialization-view
    kind: single
    prompt: |
      Когда уместна материализация `view`?
    options:
      - text: "Лёгкие преобразования, где важна всегда актуальная картина, а стоимость чтения невелика"
        correct: true
      - text: "Тяжёлые агрегаты по сотням миллионов строк, читаемые десятки раз в день"
      - text: "Большие таблицы фактов, которые дороже пересчитывать целиком"
      - text: "Промежуточный шаг, который вообще не нужен снаружи"
    explanation: |
      View ничего не хранит: расчёт происходит при каждом чтении. Это дёшево
      при сборке и дорого при чтении — ровно наоборот, чем у table.

  - id: dbt-materialization-choice
    kind: single
    prompt: |
      Модель `table` собирается 40 минут, а данные растут. С чего начать?
    options:
      - text: "Перевести в incremental: пересчитывать только новые данные вместо полной перезаписи"
        correct: true
      - text: "Перевести в view — так сборка станет мгновенной"
      - text: "Перевести в ephemeral"
      - text: "Увеличить число threads в профиле"
    explanation: |
      View сделает мгновенной сборку и медленным каждое чтение — проблема
      переедет, а не решится. Инкрементальность — штатный ответ на «полный
      пересчёт стал дорогим». Threads распараллеливают разные модели, а не одну.

  - id: dbt-ephemeral
    kind: single
    prompt: |
      Что создаётся в базе для модели с материализацией `ephemeral`?
    options:
      - text: "Ничего: её код встраивается в потребителя как CTE"
        correct: true
      - text: "Временная таблица, удаляемая после прогона"
      - text: "Представление в служебной схеме"
      - text: "Материализованное представление"
    explanation: |
      Отсюда и минус: посмотреть такую модель в базе нельзя, отлаживать
      неудобно. Это плата за отсутствие лишней сущности в хранилище.

  - id: dbt-is-incremental
    kind: single
    prompt: |
      Когда `is_incremental()` возвращает истину?
    options:
      - text: "Когда таблица уже существует, материализация incremental и прогон идёт не с --full-refresh"
        correct: true
      - text: "Всегда, если материализация incremental"
      - text: "Только при первом запуске модели"
      - text: "Когда в источнике появились новые строки"
    explanation: |
      Именно поэтому фильтр по времени обёрнут в этот блок: при первой сборке
      ограничивать нечего — таблицы ещё нет, и модель должна построиться
      целиком.

  - id: dbt-this-variable
    kind: single
    prompt: |
      Что означает `{{ this }}` в инкрементальной модели?
    options:
      - text: "Саму строящуюся таблицу — через неё узнают, докуда дошла загрузка в прошлый раз"
        correct: true
      - text: "Текущую строку результата"
      - text: "Источник, из которого читает модель"
      - text: "Временную таблицу, куда dbt складывает новую порцию"
    explanation: |
      Типичный оборот `WHERE updated_at > (SELECT max(updated_at) FROM {{ this }})`
      читает границу из уже собранной части таблицы.

  - id: dbt-unique-key-missing
    kind: single
    prompt: |
      Инкрементальная модель без `unique_key`. Задача перезапустили за уже
      обработанный период. Что произойдёт?
    options:
      - text: "Строки задвоятся: без ключа модель умеет только добавлять, а не обновлять существующие"
        correct: true
      - text: "Ничего: dbt сам определит дубликаты по всем колонкам"
      - text: "Прогон упадёт с ошибкой нарушения уникальности"
      - text: "Таблица будет пересобрана целиком"
    explanation: |
      Это та же идемпотентность, что и в оркестрации: повторный запуск обязан
      давать тот же результат. `unique_key` включает MERGE вместо INSERT и
      делает модель идемпотентной.

  - id: dbt-late-arriving-data
    kind: single
    prompt: |
      Инкрементальная модель фильтрует `WHERE updated_at > (SELECT max(updated_at)
      FROM {{ this }})`. Запись пришла в источник с опозданием на сутки.
      Что с ней будет и как чинить?
    options:
      - text: "Она не попадёт в модель; лечится окном перекрытия (максимум минус несколько дней) вместе с unique_key, который снимет дубликаты"
        correct: true
      - text: "Она попадёт при следующем прогоне автоматически"
      - text: "Она попадёт, но продублируется"
      - text: "Прогон упадёт с ошибкой"
    explanation: |
      Граница по максимуму уже сдвинулась вперёд, и опоздавшая запись навсегда
      останется за ней. Окно перекрытия перечитывает последние дни, а unique_key
      делает повторное чтение безопасным.

  - id: dbt-logic-change-incremental
    kind: single
    prompt: |
      В инкрементальной модели поменяли формулу расчёта поля. Прогнали
      обычный `dbt run`. Что получится?
    options:
      - text: "Смесь двух версий: старые строки посчитаны прежней логикой, новые — новой. Нужен --full-refresh"
        correct: true
      - text: "Вся таблица пересчитается по новой формуле автоматически"
      - text: "Прогон упадёт, потому что схема изменилась"
      - text: "Старые строки будут удалены, останутся только новые"
    explanation: |
      Инкрементальная таблица хранит то, что посчитано прошлым кодом. dbt не
      знает, что смысл изменился. Правило: смысловая правка инкрементальной
      модели — повод для полного пересчёта.

  - id: dbt-incremental-strategy
    kind: single
    prompt: |
      Что задаёт `incremental_strategy`?
    options:
      - text: "Каким способом новая порция вливается в целевую таблицу: merge, append, delete+insert, insert_overwrite"
        correct: true
      - text: "Как часто запускать модель"
      - text: "Сколько строк читать за один проход"
      - text: "Какой процент таблицы пересчитывать"
    explanation: |
      dbt собирает результат SELECT во временную таблицу, а затем вливает её в
      целевую выбранной стратегией. Доступный набор зависит от базы.

  - id: dbt-test-definition
    kind: single
    prompt: |
      Что технически представляет собой тест в dbt?
    options:
      - text: "SELECT, возвращающий ПЛОХИЕ строки: пусто — тест прошёл"
        correct: true
      - text: "Assert-выражение на Python, выполняемое dbt"
      - text: "Сравнение контрольной суммы таблицы с эталонной"
      - text: "Проверка схемы таблицы на соответствие YAML"
    explanation: |
      Простая и удобная для пересказа идея: тест ищет нарушения, и его успех —
      это пустой результат. Поэтому свой тест написать тривиально — достаточно
      SQL, находящего плохие строки.

  - id: dbt-builtin-tests
    kind: multiple
    prompt: |
      Какие тесты встроены в dbt из коробки?
    options:
      - text: "unique — дубликаты ключа"
        correct: true
      - text: "not_null — пропуски там, где их быть не должно"
        correct: true
      - text: "accepted_values — значение вне допустимого набора"
        correct: true
      - text: "relationships — ссылка на несуществующую строку другой таблицы"
        correct: true
    explanation: |
      Все четыре встроены. Этой четвёрки хватает на большинство типовых порч:
      задвоение ключа, пропуски, новое значение статуса в источнике и битые
      ссылки.

  - id: dbt-test-severity
    kind: single
    prompt: |
      Для чего у теста параметр `severity: warn`?
    options:
      - text: "Чтобы нарушение сообщалось, но не останавливало прогон — например, для проверок, где редкие отклонения ожидаемы"
        correct: true
      - text: "Чтобы тест выполнялся только в проде"
      - text: "Чтобы тест выполнялся быстрее"
      - text: "Чтобы результат теста не попадал в логи"
    explanation: |
      Обратная сторона: warn легко превращается в шум, который перестают
      читать. Порог стоит выбирать осознанно, а не ставить warn всему подряд,
      чтобы не падало.

  - id: dbt-store-failures
    kind: single
    prompt: |
      Что даёт `--store-failures`?
    options:
      - text: "Складывает найденные плохие строки в таблицу, чтобы можно было посмотреть, ЧТО именно не сошлось"
        correct: true
      - text: "Повторяет упавшие тесты после прогона"
      - text: "Сохраняет логи прогона в отдельный файл"
      - text: "Продолжает прогон при падении теста"
    explanation: |
      Без этого «тест упал, 1523 строки» — загадка. С ним есть таблица, которую
      можно открыть и понять причину.

  - id: dbt-run-order
    kind: single
    prompt: |
      В каком порядке dbt выполняет модели?
    options:
      - text: "В топологическом порядке графа зависимостей из ref(); независимые модели — параллельно по числу threads"
        correct: true
      - text: "В алфавитном порядке имён файлов"
      - text: "В порядке, заданном списком в dbt_project.yml"
      - text: "В порядке изменения файлов в git"
    explanation: |
      Именно ради этого графа и нужен ref. Порядок нигде не задаётся руками —
      он выводится из зависимостей, и это одно из главных удобств dbt.

  - id: dbt-compiled-sql
    kind: single
    prompt: |
      Модель работает не так, как ожидалось. Куда смотреть в первую очередь?
    options:
      - text: "В target/compiled — там лежит итоговый SQL с развёрнутым Jinja и подставленными именами таблиц"
        correct: true
      - text: "В manifest.json"
      - text: "В логи базы данных"
      - text: "В исходный .sql файл модели — он и есть то, что выполнилось"
    explanation: |
      Исходник содержит Jinja, и что именно из него получилось — вопрос
      компиляции. Скомпилированный SQL можно скопировать и выполнить руками, что
      и есть самый быстрый способ отладки.

  - id: dbt-build-vs-run
    kind: single
    prompt: |
      Чем `dbt build` отличается от `dbt run`?
    options:
      - text: "build выполняет модели вместе с тестами в правильном порядке, останавливая ветку графа при падении теста"
        correct: true
      - text: "build собирает документацию, run выполняет модели"
      - text: "build пересобирает всё с нуля, run — инкрементально"
      - text: "Это синонимы"
    explanation: |
      Разница практическая: при `run` затем `test` испорченные данные успевают
      растечься по зависимым моделям до того, как тест сработает. `build`
      останавливает ветку сразу.

  - id: dbt-snapshot
    kind: single
    prompt: |
      Для чего нужен snapshot в dbt?
    options:
      - text: "Вести историю изменений строк источника — это встроенная реализация SCD типа 2 с dbt_valid_from и dbt_valid_to"
        correct: true
      - text: "Делать резервную копию хранилища"
      - text: "Сохранять состояние проекта dbt для отката"
      - text: "Кешировать результат тяжёлой модели"
    explanation: |
      Источник обычно хранит только текущее состояние строки. Snapshot
      периодически смотрит на него и записывает изменения, превращая
      «состояние сейчас» в историю.

  - id: dbt-snapshot-strategy
    kind: single
    prompt: |
      В источнике нет надёжной колонки времени изменения. Какую стратегию
      snapshot выбрать?
    options:
      - text: "check — сравнивать перечисленные колонки со значениями в снимке"
        correct: true
      - text: "timestamp — dbt проставит время сам"
      - text: "append — просто дописывать все строки каждый раз"
      - text: "merge по первичному ключу без указания стратегии"
    explanation: |
      timestamp дешевле, но требует доверия к колонке источника. check дороже
      (сравниваются значения), зато не зависит от дисциплины источника.

  - id: dbt-seed-purpose
    kind: single
    prompt: |
      Что уместно грузить через `dbt seed`?
    options:
      - text: "Небольшой справочник из репозитория: маппинг кодов, список исключений"
        correct: true
      - text: "Ежедневную выгрузку заказов из источника"
      - text: "Историю событий за три года"
      - text: "Результат тяжёлой модели, чтобы не пересчитывать"
    explanation: |
      Seed — это CSV в git. Для справочника это плюс: он версионируется вместе
      с кодом. Для данных это подмена хранилища системой контроля версий.
