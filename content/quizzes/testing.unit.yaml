questions:
  - id: testing-assert-on-mock
    kind: find-error
    prompt: |
      Тест зелёный, но ничего не проверяет. Что с ним не так?

          def test_saves_user(mocker):
              repo = mocker.Mock()
              service = UserService(repo)
              service.register("ivan@example.com")
              assert repo.save.called
    options:
      - text: "Проверяется факт вызова мока, а не результат: тест сломается при рефакторинге и не заметит неверных данных"
        correct: true
      - text: "Нужно заменить assert на assert_called_once"
      - text: "Мок нужно создавать через фикстуру, а не внутри теста"
      - text: "Не хватает вызова repo.reset_mock() в конце"
    explanation: |
      Тест закрепляет реализацию: «сервис дёргает save». Он останется зелёным,
      если в save уедет пустой объект или неверный email, и покраснеет при
      безобидном переименовании метода. Проверять надо наблюдаемый результат —
      что именно сохранили: repo.save.assert_called_once_with(User(email=...)),
      а ещё лучше — через тестовый репозиторий в памяти.

  - id: testing-fixture-scope
    kind: single
    prompt: |
      Чем рискован scope="session" у фикстуры, поднимающей контейнер с БД?
    options:
      - text: "Состояние протекает между тестами: данные одного теста влияют на другой, и порядок запуска начинает иметь значение"
        correct: true
      - text: "Такая фикстура не может использоваться в parametrize"
      - text: "pytest пересоздаёт её при каждом обращении, что медленно"
      - text: "session-фикстуры несовместимы с asyncio"
    explanation: |
      Ради скорости контейнер поднимают один раз на сессию — это нормально.
      Опасность в общем состоянии внутри него. Рабочая схема: контейнер на
      сессию, а данные — на функцию, через транзакцию с откатом или очистку
      таблиц перед каждым тестом.
    source: "pytest-docs:how-to/fixtures.html#scope-sharing-fixtures"

  - id: testing-parametrize-purpose
    kind: single
    prompt: |
      Зачем нужен @pytest.mark.parametrize вместо цикла с assert внутри одного теста?
    options:
      - text: "Каждый набор данных становится отдельным тестом: падение показывает конкретный кейс, а остальные продолжают проверяться"
        correct: true
      - text: "Он выполняет проверки параллельно"
      - text: "Он единственный способ передать данные в тест"
      - text: "Он отключает фикстуры для ускорения"
    explanation: |
      Цикл внутри теста падает на первом же несовпадении и скрывает остальные
      случаи, а имя упавшего теста ничего не говорит о данных. Parametrize даёт
      отдельный узел с читаемым идентификатором на каждый набор — это и
      диагностика, и честная статистика по количеству проверок.
