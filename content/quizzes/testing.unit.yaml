questions:
  - id: testing-assert-on-mock
    kind: find-error
    prompt: |
      Тест зелёный, но ничего не проверяет. Что с ним не так?

          def test_saves_user(mocker):
              repo = mocker.Mock()
              service = UserService(repo)
              service.register("ivan@example.com")
              assert repo.save.called
    options:
      - text: "Проверяется факт вызова мока, а не результат: тест сломается при рефакторинге и не заметит неверных данных"
        correct: true
      - text: "Нужно заменить assert на assert_called_once"
      - text: "Мок нужно создавать через фикстуру, а не внутри теста"
      - text: "Не хватает вызова repo.reset_mock() в конце"
    explanation: |
      Тест закрепляет реализацию: «сервис дёргает save». Он останется зелёным,
      если в save уедет пустой объект или неверный email, и покраснеет при
      безобидном переименовании метода. Проверять надо наблюдаемый результат —
      что именно сохранили: repo.save.assert_called_once_with(User(email=...)),
      а ещё лучше — через тестовый репозиторий в памяти.

  - id: testing-fixture-scope
    kind: single
    prompt: |
      Чем рискован scope="session" у фикстуры, поднимающей контейнер с БД?
    options:
      - text: "Состояние протекает между тестами: данные одного теста влияют на другой, и порядок запуска начинает иметь значение"
        correct: true
      - text: "Такая фикстура не может использоваться в parametrize"
      - text: "pytest пересоздаёт её при каждом обращении, что медленно"
      - text: "session-фикстуры несовместимы с asyncio"
    explanation: |
      Ради скорости контейнер поднимают один раз на сессию — это нормально.
      Опасность в общем состоянии внутри него. Рабочая схема: контейнер на
      сессию, а данные — на функцию, через транзакцию с откатом или очистку
      таблиц перед каждым тестом.
    source: "pytest-docs:how-to/fixtures.html#scope-sharing-fixtures"

  - id: testing-parametrize-purpose
    kind: single
    prompt: |
      Зачем нужен @pytest.mark.parametrize вместо цикла с assert внутри одного теста?
    options:
      - text: "Каждый набор данных становится отдельным тестом: падение показывает конкретный кейс, а остальные продолжают проверяться"
        correct: true
      - text: "Он выполняет проверки параллельно"
      - text: "Он единственный способ передать данные в тест"
      - text: "Он отключает фикстуры для ускорения"
    explanation: |
      Цикл внутри теста падает на первом же несовпадении и скрывает остальные
      случаи, а имя упавшего теста ничего не говорит о данных. Parametrize даёт
      отдельный узел с читаемым идентификатором на каждый набор — это и
      диагностика, и честная статистика по количеству проверок.

  - id: testing-what-to-assert
    kind: single
    prompt: |
      Что должен проверять хороший тест?
    options:
      - text: "Наблюдаемое поведение: что функция возвращает и как меняет состояние, а не то, какие внутренние методы она вызвала"
        correct: true
      - text: "Что все строки кода выполнились хотя бы раз"
      - text: "Что функция вызвала ожидаемые зависимости в заданном порядке"
      - text: "Что код не изменился с прошлого запуска"
    explanation: |
      Тест, привязанный к внутренностям, ломается при любом рефакторинге, не
      находя при этом ни одной настоящей ошибки. Такой тест мешает менять код
      — то есть работает против своей цели.

  - id: testing-arrange-act-assert
    kind: single
    prompt: |
      Что означает структура «подготовка — действие — проверка»?
    options:
      - text: "Тест делится на три явные части: создание условий, одно проверяемое действие, проверка результата"
        correct: true
      - text: "Тест выполняется трижды с разными данными"
      - text: "Три отдельных теста на каждую функцию"
      - text: "Порядок объявления фикстур в conftest"
    explanation: |
      Практическая польза — читаемость: по такому тесту видно, что именно
      проверяется. Тест, где действие размазано по десяти строкам вперемешку с
      проверками, разбирать при падении дорого.

  - id: testing-one-assert-rule
    kind: single
    prompt: |
      Почему стоит проверять в тесте одну мысль, а не десять?
    options:
      - text: "При падении сразу понятно, что именно сломалось; и первая же неудачная проверка скрывает все последующие"
        correct: true
      - text: "Так тесты выполняются быстрее"
      - text: "Так требует стандарт pytest"
      - text: "Больше одного assert в тесте запрещено"
    explanation: |
      Речь о мысли, а не буквально об одном assert: несколько проверок одного
      утверждения (поля результата) — нормально. Проверять же три независимых
      сценария в одном тесте не стоит.

  - id: testing-parametrize-vs-loop
    kind: single
    prompt: |
      Чем `@pytest.mark.parametrize` лучше цикла внутри теста?
    options:
      - text: "Каждый набор данных становится отдельным тестом: видно, какие именно случаи упали, и остальные всё равно выполняются"
        correct: true
      - text: "Он работает быстрее цикла"
      - text: "Он позволяет использовать фикстуры"
      - text: "Он автоматически подбирает данные"
    explanation: |
      В цикле первая же неудача прерывает тест, и остальные случаи не
      проверяются. Плюс из имени параметризованного теста сразу видно, на каком
      входе он упал.

  - id: testing-fixture-purpose
    kind: single
    prompt: |
      Для чего нужны фикстуры pytest?
    options:
      - text: "Готовить окружение теста и убирать за собой, отделяя подготовку от проверки"
        correct: true
      - text: "Заменять зависимости заглушками"
      - text: "Задавать наборы входных данных"
      - text: "Ускорять выполнение тестов"
    explanation: |
      Замена зависимостей — это моки, наборы данных — параметризация. Фикстура
      отвечает именно за ресурс: временный каталог, соединение, поднятый
      контейнер.

  - id: testing-fixture-yield
    kind: single
    prompt: |
      Что выполняется в фикстуре после `yield`?
    options:
      - text: "Уборка: код после yield выполняется по завершении теста независимо от того, прошёл он или упал"
        correct: true
      - text: "Ничего: код после yield недостижим"
      - text: "Подготовка следующего теста"
      - text: "Повторный запуск теста"
    explanation: |
      Аналог finally для ресурсов теста. Именно поэтому фикстура надёжнее
      уборки в конце самого теста: упавший тест до своей уборки не доходит.

  - id: testing-fixture-scope-cost
    kind: single
    prompt: |
      Фикстура поднимает контейнер с базой. Какой scope выбрать?
    options:
      - text: "module или session — старт контейнера стоит секунды, платить их на каждый тест незачем; изоляцию обеспечивают сбросом состояния"
        correct: true
      - text: "function: только так тесты будут независимы"
      - text: "class, всегда"
      - text: "scope не влияет на скорость"
    explanation: |
      Независимость обеспечивается не пересозданием контейнера, а очисткой
      схемы перед каждым тестом — это вдесятеро быстрее и даёт ту же гарантию.

  - id: testing-flaky-test
    kind: single
    prompt: |
      Тест падает примерно раз в двадцать запусков. Что делать?
    options:
      - text: "Найти причину недетерминированности: время, случайность, порядок выполнения, внешняя зависимость. Плавающий тест хуже отсутствующего — ему перестают верить"
        correct: true
      - text: "Пометить его как ожидаемо падающий"
      - text: "Настроить автоматический повтор до успеха"
      - text: "Удалить и написать новый"
    explanation: |
      Автоповтор прячет настоящую гонку, которая рано или поздно проявится в
      проде. Типичные источники: datetime.now(), неупорядоченное множество,
      общее состояние между тестами.

  - id: testing-test-independence
    kind: single
    prompt: |
      Тесты проходят по одному, но падают при запуске всем набором. О чём это
      говорит?
    options:
      - text: "О зависимости через общее состояние: один тест оставляет после себя данные, которые видит другой"
        correct: true
      - text: "О нехватке памяти"
      - text: "О неверном порядке фикстур"
      - text: "О том, что тесты надо запускать только по одному"
    explanation: |
      Каждый тест обязан быть самодостаточным. Проверить подозрение помогает
      запуск в случайном порядке — если падения меняются, зависимость есть.

  - id: testing-mock-boundary
    kind: single
    prompt: |
      Что уместно заменять заглушкой?
    options:
      - text: "Внешние границы: сеть, платный API, отправку писем, текущее время"
        correct: true
      - text: "Соседние функции того же модуля"
      - text: "Базу данных — всегда"
      - text: "Всё, что делает тест медленнее секунды"
    explanation: |
      Замена внутренних функций привязывает тест к устройству кода. База данных
      обычно НЕ заглушается: подмена SQL-движка мокой проверяет фантазию автора
      о базе, а не поведение базы — для этого есть контейнеры.

  - id: testing-freeze-time
    kind: single
    prompt: |
      Функция считает «данные за последние 7 дней» через datetime.now(). Как
      сделать тест устойчивым?
    options:
      - text: "Передавать текущее время параметром или подменять его в тесте — тогда результат перестанет зависеть от дня запуска"
        correct: true
      - text: "Запускать тесты только в будние дни"
      - text: "Округлять даты до месяца"
      - text: "Добавить допуск в проверку"
    explanation: |
      Явная передача времени лучше подмены: она делает зависимость видимой в
      сигнатуре. Это тот же принцип, что в оркестрации — брать границы периода
      из контекста, а не из текущего момента.

  - id: testing-coverage-meaning
    kind: single
    prompt: |
      Покрытие тестами 95%. Что это гарантирует?
    options:
      - text: "Только то, что эти строки выполнялись — не то, что их поведение проверено"
        correct: true
      - text: "Что 95% ошибок будут найдены"
      - text: "Что код корректен на 95%"
      - text: "Что все ветвления проверены"
    explanation: |
      Тест, вызывающий функцию без единой проверки результата, даёт полное
      покрытие и нулевую пользу. Покрытие полезно как индикатор непроверенных
      мест, а не как оценка качества.

  - id: testing-branch-coverage
    kind: single
    prompt: |
      Чем покрытие ветвлений полезнее покрытия строк?
    options:
      - text: "Оно требует проверить оба исхода условия, а не только тот, что случайно выполнился"
        correct: true
      - text: "Оно считается быстрее"
      - text: "Оно учитывает только изменённый код"
      - text: "Оно не зависит от структуры кода"
    explanation: |
      Строка `if x: do()` считается покрытой, даже если ветка «иначе» не
      проверялась ни разу — а именно там обычно и живут ошибки.

  - id: testing-regression-test
    kind: single
    prompt: |
      Нашли и починили ошибку. Что сделать до закрытия задачи?
    options:
      - text: "Написать тест, который падал БЫ до починки: иначе ошибка вернётся незамеченной"
        correct: true
      - text: "Описать ошибку в документации"
      - text: "Увеличить покрытие модуля"
      - text: "Добавить логирование в это место"
    explanation: |
      Важная деталь: тест надо убедиться увидеть красным. Тест, написанный
      после починки и сразу зелёный, мог не проверять вообще ничего.

  - id: testing-integration-vs-unit
    kind: single
    prompt: |
      Что проверяет интеграционный тест в отличие от модульного?
    options:
      - text: "Совместную работу с настоящими внешними системами: базой, очередью, файловой системой"
        correct: true
      - text: "Работу пользовательского интерфейса"
      - text: "Производительность под нагрузкой"
      - text: "Соответствие кода стилю"
    explanation: |
      Модульные тесты быстрые и их много, интеграционных меньше и они медленнее.
      Ошибки в SQL, миграциях и предположениях о поведении базы ловятся только
      вторыми.

  - id: testing-what-not-to-test
    kind: single
    prompt: |
      Что тестировать обычно не стоит?
    options:
      - text: "Чужие библиотеки и тривиальные геттеры: такие тесты стоят поддержки и не находят ошибок"
        correct: true
      - text: "Обработку ошибок"
      - text: "Граничные случаи"
      - text: "Функции с ветвлениями"
    explanation: |
      Тест должен окупать своё сопровождение. Проверять, что стандартная
      библиотека складывает числа, — трата времени; проверять свои
      предположения о её поведении иногда полезно.

  - id: testing-boundary-cases
    kind: multiple
    prompt: |
      Какие случаи стоит проверять для функции обработки списка записей?
    options:
      - text: "Пустой список"
        correct: true
      - text: "Один элемент"
        correct: true
      - text: "Дубликаты и записи с пропущенными полями"
        correct: true
      - text: "Список из ровно 1000 элементов"
    explanation: |
      Границы (пусто, один, много) и «грязные» данные дают почти все реальные
      ошибки. Конкретное круглое число само по себе ничем не примечательно,
      если в коде нет связанного с ним предела.
