questions:
  - id: python-mutable-default-arg
    kind: find-error
    prompt: |
      Второй вызов возвращает [1, 2] вместо [2]. Почему?

          def add(item, target=[]):
              target.append(item)
              return target

          add(1)   # [1]
          add(2)   # [1, 2]
    options:
      - text: "Значение по умолчанию вычисляется один раз при определении функции, и все вызовы делят один список"
        correct: true
      - text: "append изменяет список на месте, поэтому нужно использовать +"
      - text: "Списки в Python передаются по ссылке, а числа по значению"
      - text: "Не хватает global target"
    explanation: |
      Дефолты живут в объекте функции (__defaults__) и создаются один раз.
      Стандартное исправление: target=None и создание списка внутри тела.
      Та же ловушка со словарями, множествами и любыми изменяемыми объектами.
    source: "python-docs:tutorial/controlflow.html#default-argument-values"

  - id: python-generator-vs-list
    kind: single
    prompt: |
      Файл на 50 ГБ, нужно посчитать строки с ошибками. Почему
      `sum(1 for line in f if "ERROR" in line)` лучше, чем сборка списка?
    options:
      - text: "Генератор не материализует последовательность: в памяти одновременно живёт одна строка"
        correct: true
      - text: "Генератор читает файл параллельно в несколько потоков"
      - text: "Генераторы всегда быстрее списков по времени работы"
      - text: "Список не поддерживает строковые операции"
    explanation: |
      Разница в памяти, а не в скорости: по времени на одинаковом объёме они
      сопоставимы. Именно потребление памяти делает генераторы базовым приёмом в
      ETL, где данные заведомо больше RAM. Обратная сторона — генератор
      одноразовый: второй проход потребует перечитать источник.

  - id: python-bare-except
    kind: single
    prompt: |
      Чем плох `except:` без указания типа?
    options:
      - text: "Он ловит в том числе KeyboardInterrupt и SystemExit, из-за чего процесс перестаёт нормально останавливаться"
        correct: true
      - text: "Он работает медленнее, чем except с типом"
      - text: "Он не позволяет использовать finally"
      - text: "Он ловит только встроенные исключения, а пользовательские пропускает"
    explanation: |
      Голый except перехватывает BaseException целиком. Ctrl+C и штатное
      завершение превращаются в проглоченную ошибку, а настоящая причина сбоя
      теряется. Если действительно нужно «поймать всё» — except Exception,
      с логированием и повторным возбуждением.

  - id: python-is-vs-equals
    kind: single
    prompt: |
      В чём разница между `is` и `==`?
    options:
      - text: "is сравнивает тождество объектов (один ли это объект в памяти), == сравнивает значения"
        correct: true
      - text: "is сравнивает значения, == сравнивает типы"
      - text: "Разницы нет для неизменяемых типов"
      - text: "is работает только с числами"
    explanation: |
      Для None пишут `is None`, потому что None существует в единственном
      экземпляре. Совпадение is для маленьких чисел и коротких строк — деталь
      реализации, полагаться на неё нельзя.

  - id: python-shallow-copy
    kind: find-error
    prompt: |
      ```python
      rows = [[0] * 3] * 2
      rows[0][0] = 9
      print(rows)  # [[9, 0, 0], [9, 0, 0]]
      ```
      Почему изменились обе строки?
    options:
      - text: "Умножение списка копирует ССЫЛКИ: обе строки — один и тот же объект"
        correct: true
      - text: "Списки в Python всегда изменяются одновременно"
      - text: "Ошибка в индексации"
      - text: "Нужно было использовать кортежи"
    explanation: |
      Правильно — списковое включение: `[[0] * 3 for _ in range(2)]`, оно
      создаёт новый внутренний список на каждой итерации. Та же ловушка ждёт
      при copy.copy вложенных структур: нужен deepcopy.

  - id: python-dict-get-vs-brackets
    kind: single
    prompt: |
      Чем `d.get('key')` отличается от `d['key']`?
    options:
      - text: "get возвращает None (или заданное значение) при отсутствии ключа, а квадратные скобки возбуждают KeyError"
        correct: true
      - text: "get работает быстрее"
      - text: "get не учитывает регистр ключей"
      - text: "Разницы нет"
    explanation: |
      Выбор содержательный: если отсутствие ключа — ошибка данных, KeyError
      правильнее, потому что не даёт ей утечь дальше. Молчаливый None часто
      всплывает через три шага в виде непонятного TypeError.

  - id: python-defaultdict
    kind: single
    prompt: |
      Что делает `collections.defaultdict(list)`?
    options:
      - text: "Создаёт словарь, который при обращении к отсутствующему ключу автоматически заводит пустой список"
        correct: true
      - text: "Создаёт словарь только со значениями типа list"
      - text: "Создаёт копию словаря по умолчанию"
      - text: "Запрещает добавление новых ключей"
    explanation: |
      Удобно для группировки. Обратная сторона: обычное ЧТЕНИЕ отсутствующего
      ключа тоже создаёт запись, поэтому словарь незаметно растёт. Когда это
      нежелательно, лучше dict.setdefault.

  - id: python-comprehension-vs-loop
    kind: single
    prompt: |
      Когда списковое включение хуже обычного цикла?
    options:
      - text: "Когда оно становится многострочным с вложенными условиями: читаемость важнее краткости"
        correct: true
      - text: "Всегда: цикл быстрее"
      - text: "Когда обрабатывается больше тысячи элементов"
      - text: "Когда результат не нужен"
    explanation: |
      Последний случай тоже верен по-своему: включение ради побочного эффекта
      (когда результат отбрасывается) — злоупотребление, там нужен обычный цикл.

  - id: python-enumerate-zip
    kind: single
    prompt: |
      Что вернёт `zip([1, 2, 3], ['a', 'b'])`?
    options:
      - text: "Пары до конца КОРОТЧАЙШЕЙ последовательности: (1,'a'), (2,'b') — третий элемент молча потеряется"
        correct: true
      - text: "Три пары, где последняя дополнена None"
      - text: "Ошибку из-за разной длины"
      - text: "Список из пяти элементов"
    explanation: |
      Тихая потеря данных при рассинхронизации длин. В Python 3.10+ есть
      `zip(..., strict=True)`, возбуждающий ошибку при разной длине — для
      обработки данных это правильный выбор.

  - id: python-generator-exhausted
    kind: single
    prompt: |
      ```python
      gen = (x for x in range(3))
      print(list(gen))  # [0, 1, 2]
      print(list(gen))  # ?
      ```
      Что напечатает второй вызов?
    options:
      - text: "Пустой список: генератор одноразовый, после полного прохода он исчерпан"
        correct: true
      - text: "[0, 1, 2] — генератор перезапустится"
      - text: "Ошибку StopIteration"
      - text: "[0] — вернётся только первый элемент"
    explanation: |
      Частая причина «данные куда-то делись»: функция получила генератор,
      посчитала по нему количество, а потом попыталась его же обработать.
      Нужен повторный проход — перечитывай источник или сохраняй в список
      осознанно.

  - id: python-with-context-manager
    kind: single
    prompt: |
      Почему `with open(...)` предпочтительнее ручного close()?
    options:
      - text: "Файл закроется даже при исключении внутри блока — контекстный менеджер гарантирует освобождение ресурса"
        correct: true
      - text: "with работает быстрее"
      - text: "with автоматически читает файл целиком"
      - text: "Разницы нет, это синтаксический сахар"
    explanation: |
      То же относится к соединениям с базой и блокировкам. Если пишешь
      try/finally только ради освобождения ресурса — вероятно, нужен with.

  - id: python-exception-chaining
    kind: single
    prompt: |
      Что даёт `raise ValueError("плохая строка") from exc`?
    options:
      - text: "Сохраняет исходное исключение в цепочке, поэтому в трассировке видно, где всё началось"
        correct: true
      - text: "Подавляет исходное исключение"
      - text: "Повторяет исходное исключение без изменений"
      - text: "Преобразует тип исключения без потери сообщения"
    explanation: |
      Без `from exc` место возникновения теряется, и разбор превращается в
      гадание. Подавить цепочку намеренно можно через `from None` — это тоже
      осознанное решение, а не умолчание.

  - id: python-except-order
    kind: find-error
    prompt: |
      ```python
      try:
          value = data["key"]
      except Exception:
          value = None
      except KeyError:
          value = 0
      ```
      Что здесь не так?
    options:
      - text: "Общий except Exception стоит первым и перехватит всё, включая KeyError: вторая ветка недостижима"
        correct: true
      - text: "Нельзя использовать несколько except подряд"
      - text: "После except обязателен else"
      - text: "KeyError не является подклассом Exception"
    explanation: |
      Обработчики проверяются сверху вниз, поэтому конкретные исключения идут
      раньше общих. Ловля Exception ради подстановки значения по умолчанию
      скрывает и опечатки в коде, и ошибки данных.

  - id: python-finally-return
    kind: single
    prompt: |
      Выполнится ли блок `finally`, если в `try` был `return`?
    options:
      - text: "Да: finally выполняется всегда — при исключении, при return, при break"
        correct: true
      - text: "Нет: return прерывает выполнение функции"
      - text: "Только если не было исключения"
      - text: "Зависит от версии Python"
    explanation: |
      Более того, return внутри finally перекроет возвращаемое значение из try
      — и это почти всегда ошибка, поэтому так писать не стоит.

  - id: python-pathlib
    kind: single
    prompt: |
      Почему pathlib предпочтительнее склейки путей строками?
    options:
      - text: "Оператор / корректно работает на всех платформах и не порождает ошибок вроде двойных или пропущенных разделителей"
        correct: true
      - text: "pathlib работает быстрее os.path"
      - text: "pathlib умеет читать файлы, а os.path нет"
      - text: "Строковые пути запрещены в Python 3.12"
    explanation: |
      Для инженера данных это ещё и переносимость между Windows-разработкой и
      Linux-исполнением — типичная конфигурация, в которой ручная склейка путей
      ломается первой.

  - id: python-datetime-naive
    kind: single
    prompt: |
      Чем опасен `datetime.now()` без указания часового пояса?
    options:
      - text: "Получается наивное время без пояса: сравнение с данными в UTC даёт сдвиг, а на другой машине результат меняется"
        correct: true
      - text: "Он работает медленнее datetime.utcnow()"
      - text: "Он всегда возвращает UTC"
      - text: "Он не поддерживает арифметику дат"
    explanation: |
      В пайплайнах правило простое: внутри системы всё в UTC и с явным поясом,
      локальное время появляется только на выводе человеку.

  - id: python-typing-runtime
    kind: single
    prompt: |
      Проверяет ли Python аннотации типов во время выполнения?
    options:
      - text: "Нет: аннотации — подсказка для читателя и для статических анализаторов вроде mypy"
        correct: true
      - text: "Да, при несоответствии возникает TypeError"
      - text: "Да, но только для аргументов функций"
      - text: "Да, если включён строгий режим интерпретатора"
    explanation: |
      Проверку во время выполнения дают отдельные библиотеки — например,
      pydantic, где это основная задача. Сам интерпретатор аннотации не
      исполняет.

  - id: python-gil-io-vs-cpu
    kind: single
    prompt: |
      Задача упирается в ожидание ответов сети. Что даст выигрыш?
    options:
      - text: "Потоки или асинхронность: GIL освобождается на время ввода-вывода, поэтому ожидание распараллеливается"
        correct: true
      - text: "Ничего: GIL не даёт распараллелить любую задачу"
      - text: "Только процессы"
      - text: "Только переписывание на другой язык"
    explanation: |
      Обратный случай — вычислительная нагрузка: там потоки не помогут, нужны
      процессы. Различать эти два типа задач и есть содержание вопроса про GIL
      на собеседовании.

  - id: python-string-concat-loop
    kind: single
    prompt: |
      Почему `s += chunk` в цикле по миллиону элементов работает медленно?
    options:
      - text: "Строки неизменяемы: каждая операция создаёт новую строку и копирует накопленное, давая квадратичную сложность"
        correct: true
      - text: "Оператор += не оптимизирован для строк"
      - text: "Память под строки выделяется на диске"
      - text: "Это быстро, проблема надумана"
    explanation: |
      Правильно — накопить куски в список и один раз склеить через
      `"".join(parts)`. Тот же класс ошибок, что вставка в начало списка вместо
      deque.

  - id: python-set-membership
    kind: single
    prompt: |
      Цикл по миллиону элементов проверяет `if item in big_list` для списка из
      миллиона. Что изменится при замене списка на множество?
    options:
      - text: "Проверка станет константной вместо линейной: примерно триллион операций превратится в миллион"
        correct: true
      - text: "Ничего: in работает одинаково"
      - text: "Уменьшится расход памяти"
      - text: "Порядок элементов сохранится"
    explanation: |
      Первое, что стоит искать в медленном скрипте обработки данных. Множество
      расходует БОЛЬШЕ памяти, чем список, — это осознанный размен памяти на
      скорость.

  - id: python-dataclass-purpose
    kind: single
    prompt: |
      Что даёт декоратор `@dataclass`?
    options:
      - text: "Автоматически генерирует __init__, __repr__ и __eq__ по объявленным полям"
        correct: true
      - text: "Проверяет типы полей во время выполнения"
      - text: "Делает объект неизменяемым"
      - text: "Сериализует объект в JSON"
    explanation: |
      Неизменяемость даёт параметр `frozen=True`, а проверку типов —
      библиотеки вроде pydantic. Сам dataclass экономит шаблонный код и
      не более.
