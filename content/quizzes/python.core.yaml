questions:
  - id: python-mutable-default-arg
    kind: find-error
    prompt: |
      Второй вызов возвращает [1, 2] вместо [2]. Почему?

          def add(item, target=[]):
              target.append(item)
              return target

          add(1)   # [1]
          add(2)   # [1, 2]
    options:
      - text: "Значение по умолчанию вычисляется один раз при определении функции, и все вызовы делят один список"
        correct: true
      - text: "append изменяет список на месте, поэтому нужно использовать +"
      - text: "Списки в Python передаются по ссылке, а числа по значению"
      - text: "Не хватает global target"
    explanation: |
      Дефолты живут в объекте функции (__defaults__) и создаются один раз.
      Стандартное исправление: target=None и создание списка внутри тела.
      Та же ловушка со словарями, множествами и любыми изменяемыми объектами.
    source: "python-docs:tutorial/controlflow.html#default-argument-values"

  - id: python-generator-vs-list
    kind: single
    prompt: |
      Файл на 50 ГБ, нужно посчитать строки с ошибками. Почему
      `sum(1 for line in f if "ERROR" in line)` лучше, чем сборка списка?
    options:
      - text: "Генератор не материализует последовательность: в памяти одновременно живёт одна строка"
        correct: true
      - text: "Генератор читает файл параллельно в несколько потоков"
      - text: "Генераторы всегда быстрее списков по времени работы"
      - text: "Список не поддерживает строковые операции"
    explanation: |
      Разница в памяти, а не в скорости: по времени на одинаковом объёме они
      сопоставимы. Именно потребление памяти делает генераторы базовым приёмом в
      ETL, где данные заведомо больше RAM. Обратная сторона — генератор
      одноразовый: второй проход потребует перечитать источник.

  - id: python-bare-except
    kind: single
    prompt: |
      Чем плох `except:` без указания типа?
    options:
      - text: "Он ловит в том числе KeyboardInterrupt и SystemExit, из-за чего процесс перестаёт нормально останавливаться"
        correct: true
      - text: "Он работает медленнее, чем except с типом"
      - text: "Он не позволяет использовать finally"
      - text: "Он ловит только встроенные исключения, а пользовательские пропускает"
    explanation: |
      Голый except перехватывает BaseException целиком. Ctrl+C и штатное
      завершение превращаются в проглоченную ошибку, а настоящая причина сбоя
      теряется. Если действительно нужно «поймать всё» — except Exception,
      с логированием и повторным возбуждением.
