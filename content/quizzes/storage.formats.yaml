questions:
  - id: formats-why-columnar-faster
    kind: single
    prompt: |
      Таблица `events` из 40 колонок. Запрос: `SELECT sum(amount) FROM events`.
      Почему в Parquet он прочитает кратно меньше байт, чем в CSV?
    options:
      - text: "Читается только чанк колонки amount; остальные 39 колонок лежат в других местах файла и не трогаются"
        correct: true
      - text: "Parquet сжат, а CSV нет — дело только в сжатии"
      - text: "Parquet держит индекс по всем колонкам"
      - text: "CSV читается построчно, а Parquet целиком в память, поэтому быстрее"
    explanation: |
      Главный выигрыш — проекция колонок, а не сжатие. В строковом формате
      значения `amount` размазаны по всему файлу, между ними лежат остальные 39
      колонок, и пропустить их при чтении нельзя. Сжатие даёт дополнительный
      выигрыш, но вторым эффектом.

  - id: formats-columnar-loses
    kind: single
    prompt: |
      В каком сценарии колоночный формат проигрывает строковому?
    options:
      - text: "Достать одну запись целиком по ключу: строку придётся собирать из стольких мест, сколько в ней колонок"
        correct: true
      - text: "Посчитать агрегат по одной колонке"
      - text: "Отфильтровать по дате при отсортированных данных"
      - text: "Прочитать две колонки из пятидесяти"
    explanation: |
      Именно поэтому OLTP-базы строковые, а Parquet — формат аналитики. Ответ
      «Parquet быстрее» без этой оговорки считается неполным: быстрее он на
      сканировании немногих колонок по многим строкам, а не на точечном доступе.

  - id: formats-row-group
    kind: single
    prompt: |
      Что такое row group в Parquet?
    options:
      - text: "Горизонтальный срез файла: набор строк, внутри которого каждая колонка лежит своим непрерывным чанком"
        correct: true
      - text: "Группа файлов одной партиции"
      - text: "Индекс, отображающий значение колонки в номер строки"
      - text: "Буфер записи, который не сохраняется на диск"
    explanation: |
      Файл делится на группы строк (обычно ~128 МБ), внутри группы — чанки по
      одной на колонку, внутри чанка — страницы. Группа строк это единица
      параллелизма при чтении и единица, для которой хранится статистика.

  - id: formats-predicate-pushdown
    kind: single
    prompt: |
      Запрос фильтрует `WHERE event_date = '2025-03-01'`. У группы строк в
      статистике `min_date = 2025-01-05`, `max_date = 2025-02-28`.
      Что сделает читатель?
    options:
      - text: "Пропустит всю группу, не читая её данные: нужное значение заведомо вне диапазона"
        correct: true
      - text: "Прочитает группу и отфильтрует строки после чтения"
      - text: "Прочитает только первую страницу группы"
      - text: "Ничего: min/max в Parquet хранятся только для файла целиком"
    explanation: |
      Это predicate pushdown: условие передаётся на уровень чтения файла и
      отсекает целые группы по min/max. Статистика хранится и для групп строк, и
      для страниц, поэтому отсечение бывает ещё точнее.

  - id: formats-pushdown-needs-order
    kind: single
    prompt: |
      Данные записаны в случайном порядке. Насколько поможет predicate pushdown
      по колонке `city`?
    options:
      - text: "Почти никак: при случайном порядке у всех групп min/max покрывают весь диапазон, и пропустить нечего"
        correct: true
      - text: "Так же хорошо, как при отсортированных данных: статистика не зависит от порядка"
      - text: "Поможет только если включить словарное кодирование"
      - text: "Поможет, но лишь для числовых колонок"
    explanation: |
      Отсюда практический приём: сортировать данные при записи по колонке, по
      которой будут фильтровать. Статистика по min/max полезна ровно настолько,
      насколько данные упорядочены — на случайном порядке она бесполезна.

  - id: formats-dictionary-encoding
    kind: single
    prompt: |
      Колонка `status` принимает 5 разных значений на 10 млн строк. Какой
      механизм Parquet даст здесь наибольшую экономию?
    options:
      - text: "Словарное кодирование: значения заменяются номерами в словаре, дальше RLE и общее сжатие"
        correct: true
      - text: "Разбиение на группы строк"
      - text: "Хранение min/max по страницам"
      - text: "Partition pruning"
    explanation: |
      Низкая кардинальность — идеальный случай для словаря: 10 млн повторяющихся
      строк превращаются в 10 млн маленьких чисел плюс словарь из пяти значений.
      Дальше поверх работает RLE, потому что одинаковые номера идут подряд.

  - id: formats-compression-choice
    kind: single
    prompt: |
      Чем отличается выбор snappy от zstd при записи Parquet?
    options:
      - text: "Snappy быстрее сжимает и разжимает, zstd даёт меньший объём; выбор зависит от того, что дороже — процессор или хранилище"
        correct: true
      - text: "Snappy сохраняет схему, zstd нет"
      - text: "Zstd работает только с колоночными форматами, snappy — с любыми"
      - text: "Разницы нет, это синонимы одного алгоритма"
    explanation: |
      Оба алгоритма общего назначения и применяются поверх колоночного
      кодирования. Компромисс всегда один: время процессора против байт на диске
      и в сети.

  - id: formats-schema-in-file
    kind: single
    prompt: |
      Где хранится схема данных в Parquet?
    options:
      - text: "В самом файле, в футере: формат самоописателен, читателю не нужен внешний реестр схем"
        correct: true
      - text: "В отдельном файле _schema.json рядом с данными"
      - text: "В метасторе Hive, без него файл прочитать нельзя"
      - text: "Нигде: типы выводятся при чтении, как в CSV"
    explanation: |
      Отсюда следствие: положить в один датасет файлы с несовместимыми схемами
      можно, и обнаружится это только при чтении — ошибкой или тихо потерянной
      колонкой.

  - id: formats-partition-column-choice
    kind: single
    prompt: |
      Датасет заказов, 500 млн строк, фильтруют обычно по дате и иногда по
      `user_id` (30 млн уникальных). По чему партиционировать?
    options:
      - text: "По дате: низкая кардинальность и присутствует в фильтрах"
        correct: true
      - text: "По user_id: он даёт самое точное отсечение"
        correct: false
      - text: "По обеим колонкам сразу — так отсечение сработает в любом случае"
      - text: "Не партиционировать вовсе: статистики Parquet достаточно"
    explanation: |
      Партиционирование по user_id создало бы 30 млн каталогов по одному
      крошечному файлу. Перечисление таких каталогов дороже, чем чтение самих
      данных, а мелкие файлы убивают производительность отдельно. Правило:
      низкая кардинальность плюс присутствие в фильтрах.

  - id: formats-partition-pruning-vs-pushdown
    kind: single
    prompt: |
      Чем partition pruning отличается от predicate pushdown?
    options:
      - text: "Pruning отбрасывает каталоги по значению в пути, ещё не открывая файлы; pushdown отсекает группы строк внутри уже открытого файла по статистике"
        correct: true
      - text: "Это два названия одного механизма"
      - text: "Pruning работает только в Iceberg, pushdown — только в Parquet"
      - text: "Pruning применяется к числовым колонкам, pushdown — к строковым"
    explanation: |
      Pruning дешевле, потому что срабатывает раньше: движок даже не обращается
      к хранилищу за содержимым файла. Поэтому колонка партиционирования —
      первое, что стоит подобрать под типовые фильтры.

  - id: formats-partition-value-storage
    kind: single
    prompt: |
      Датасет лежит как `sales/dt=2025-03-01/part-0.parquet`. Где физически
      хранится значение `dt` для строк этого файла?
    options:
      - text: "В имени каталога; внутри файла этой колонки может не быть вовсе"
        correct: true
      - text: "В каждой строке файла, как обычная колонка"
      - text: "В футере файла, в отдельной секции партиций"
      - text: "В метаданных объектного хранилища"
    explanation: |
      Это и делает pruning дешёвым: значение читается из пути. Побочный эффект —
      при копировании файла в другой каталог его партиционное значение молча
      меняется.

  - id: formats-small-files-symptom
    kind: single
    prompt: |
      Запрос по 3 ГБ данных идёт 20 минут, в логах — 45 000 задач. Что
      проверить первым?
    options:
      - text: "Число файлов в датасете: похоже на десятки тысяч мелких файлов, где накладные расходы на файл превышают полезную работу"
        correct: true
      - text: "Не хватает памяти исполнителям"
      - text: "Отсутствует индекс по колонке фильтра"
      - text: "Слишком сильное сжатие, надо перейти на snappy"
    explanation: |
      Число задач примерно равно числу файлов (точнее, групп строк). 45 000 задач
      на 3 ГБ означают файлы по ~70 КБ. Каждый файл — отдельное обращение к
      хранилищу и чтение футера.

  - id: formats-small-files-cause
    kind: multiple
    prompt: |
      Что типично порождает проблему мелких файлов? Выбери все подходящие.
    options:
      - text: "Стриминг, пишущий микропакеты каждые несколько секунд"
        correct: true
      - text: "Ежечасная дозапись в партицию, разбитую по суткам"
        correct: true
      - text: "Запись с большим числом частей без коалесценции"
        correct: true
      - text: "Использование zstd вместо snappy"
    explanation: |
      Все три первых случая — запись многими мелкими порциями. Алгоритм сжатия к
      числу файлов отношения не имеет.

  - id: formats-small-files-fix
    kind: single
    prompt: |
      Какой размер файла считать целевым при компакции Parquet?
    options:
      - text: "Порядка 128–512 МБ — примерно одна группа строк или несколько"
        correct: true
      - text: "1–5 МБ: мелкие файлы лучше распараллеливаются"
      - text: "Как можно больше, десятки гигабайт одним файлом"
      - text: "Ровно столько, сколько строк пишет один поток за минуту"
    explanation: |
      Слишком мелкие файлы дают накладные расходы, слишком крупные мешают
      параллелизму и делают дозапись дорогой. Ориентир в сотни мегабайт —
      компромисс, совпадающий с типичным размером группы строк.

  - id: formats-s3-rename
    kind: single
    prompt: |
      Почему приём «записать во временный каталог и переименовать в целевой»
      плохо работает на S3?
    options:
      - text: "В объектном хранилище нет переименования: это копирование всех объектов плюс удаление, то есть время и деньги пропорционально объёму"
        correct: true
      - text: "S3 запрещает переименование объектов правами доступа"
      - text: "Переименование ломает статистику Parquet"
      - text: "Оно работает мгновенно, но теряет метаданные"
    explanation: |
      Приём пришёл из HDFS, где rename — атомарная операция над метаданными. В
      объектном хранилище каталогов нет вовсе, есть плоское пространство ключей,
      и «переименовать каталог» означает перезаписать каждый объект.

  - id: formats-s3-not-filesystem
    kind: multiple
    prompt: |
      Чем объектное хранилище отличается от файловой системы? Выбери всё верное.
    options:
      - text: "Каталогов нет: есть плоское пространство ключей, а «каталог» — общий префикс"
        correct: true
      - text: "Оплачиваются в том числе запросы, а не только объём хранения"
        correct: true
      - text: "Переименование не атомарно и стоит как копирование"
        correct: true
      - text: "Нельзя хранить файлы больше 128 МБ"
    explanation: |
      Первые три отличия и порождают почти все грабли озера: дорогие листинги,
      дорогие мелкие файлы, ненадёжные приёмы с переименованием.

  - id: formats-what-parquet-cannot
    kind: single
    prompt: |
      Чего Parquet сам по себе НЕ обеспечивает?
    options:
      - text: "Атомарности записи набора файлов: читатель может увидеть таблицу наполовину обновлённой"
        correct: true
      - text: "Сжатия колонок"
      - text: "Хранения схемы вместе с данными"
      - text: "Статистики min/max по группам строк"
    explanation: |
      Parquet — формат ОДНОГО файла. Он ничего не знает о том, что несколько
      файлов вместе составляют таблицу, и потому не даёт ни атомарности, ни
      истории версий, ни UPDATE/DELETE.

  - id: formats-table-format-value
    kind: multiple
    prompt: |
      Что добавляет табличный формат (Iceberg, Delta) поверх Parquet?
    options:
      - text: "Атомарные коммиты: читатель видит либо прежнюю версию таблицы, либо новую"
        correct: true
      - text: "Путешествие во времени — чтение состояния таблицы на момент в прошлом"
        correct: true
      - text: "MERGE INTO — обновление и удаление строк без полной перезаписи"
        correct: true
      - text: "Более сильное сжатие самих данных"
    explanation: |
      Табличный формат — это метаданные и журнал изменений поверх тех же файлов
      Parquet. Сжатие данных остаётся делом Parquet и не меняется. Формулировка
      для собеседования: Parquet отвечает за то, как лежат данные внутри файла,
      табличный формат — за то, какие файлы составляют таблицу прямо сейчас.

  - id: formats-hidden-partitioning
    kind: single
    prompt: |
      Что такое скрытое партиционирование в Iceberg?
    options:
      - text: "Пользователь фильтрует по обычной колонке, а соответствие фильтра физической раскладке партиций Iceberg выводит сам"
        correct: true
      - text: "Партиции, недоступные пользователю по правам доступа"
      - text: "Партиционирование, при котором файлы лежат в одном каталоге"
      - text: "Сжатие имён каталогов для экономии на листингах"
    explanation: |
      В Hive-раскладке фильтр обязан был упоминать именно колонку партиции,
      иначе pruning не срабатывал, а изменение схемы партиционирования ломало
      старые запросы. Iceberg разрывает эту связь: раскладку можно поменять, не
      трогая запросы.

  - id: formats-avro-vs-parquet
    kind: single
    prompt: |
      Для чего уместнее Avro, а не Parquet?
    options:
      - text: "Для потока сообщений, где каждую запись читают целиком и по одной"
        correct: true
      - text: "Для аналитических запросов по двум колонкам из пятидесяти"
      - text: "Для долгого хранения больших исторических выгрузок"
      - text: "Везде, где нужно сжатие: Avro сжимает лучше"
    explanation: |
      Avro строковый и со схемой — это его ниша: обмен сообщениями, где запись
      нужна целиком. Parquet колоночный — его ниша аналитическое чтение. Они не
      конкуренты, а дополнение друг друга.

  - id: formats-csv-why-not
    kind: multiple
    prompt: |
      Почему CSV плох как формат ХРАНЕНИЯ аналитических данных?
    options:
      - text: "Нет типов и схемы: всё строки, интерпретация зависит от читателя"
        correct: true
      - text: "Нет статистики, поэтому невозможно пропустить ненужные куски файла"
        correct: true
      - text: "Нельзя прочитать одну колонку, не прочитав весь файл"
        correct: true
      - text: "Его не поддерживает Spark"
    explanation: |
      Spark читает CSV прекрасно — проблема не в поддержке. Проблема в том, что
      каждое чтение стоит как полное сканирование, а типы приходится угадывать
      или задавать снаружи. Как формат обмена CSV годится, как формат хранения —
      нет.
