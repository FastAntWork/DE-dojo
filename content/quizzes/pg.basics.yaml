questions:
  - id: pg-timestamptz-vs-timestamp
    kind: single
    prompt: |
      Почему для отметки времени события обычно берут timestamptz, а не timestamp?
    options:
      - text: "timestamptz хранит момент времени в UTC и приводит его к часовому поясу сессии при чтении; timestamp хранит «стенные часы» без привязки"
        correct: true
      - text: "timestamptz занимает меньше места на диске"
      - text: "timestamp не поддерживает сравнение и сортировку"
      - text: "timestamptz хранит внутри название часового пояса вместе со значением"
    explanation: |
      Оба типа занимают 8 байт, и ни один не хранит имя пояса. Разница в семантике:
      timestamptz — это момент на оси времени, timestamp — показания часов без
      контекста. Смешение двух серверов в разных поясах на timestamp даёт данные,
      которые невозможно корректно сравнить задним числом.
    source: "postgres-docs:datatype-datetime.html"

  - id: pg-schema-vs-database
    kind: single
    prompt: |
      Чем схема отличается от базы данных в PostgreSQL?
    options:
      - text: "Схема — пространство имён внутри базы; объекты разных схем одной базы доступны в одном запросе, объекты разных баз — нет"
        correct: true
      - text: "Это синонимы, слово «схема» пришло из Oracle"
      - text: "База лежит внутри схемы, а не наоборот"
      - text: "Схема отличается только тем, что к ней нельзя выдать права"
    explanation: |
      Соединение открывается к конкретной базе, и запрос не может выйти за её
      пределы без внешних механизмов (dblink, postgres_fdw). Схемы же — просто
      каталоги имён внутри базы, и поиск по ним управляется search_path.

  - id: pg-stat-activity-purpose
    kind: single
    prompt: |
      Что показывает pg_stat_activity?
    options:
      - text: "По строке на каждый серверный процесс: текущий запрос, состояние, время начала и причину ожидания"
        correct: true
      - text: "Историю всех выполненных запросов с момента запуска сервера"
      - text: "Статистику по размерам таблиц и индексов"
      - text: "План последнего выполненного запроса"
    explanation: |
      Это срез «что происходит прямо сейчас», а не история — для истории нужен
      pg_stat_statements. Ключевые поля при разборе инцидента: state, wait_event_type
      и wait_event, xact_start и query. Долгий idle in transaction здесь же выдаёт
      забытый COMMIT, который блокирует VACUUM.
    source: "postgres-docs:monitoring-stats.html#MONITORING-PG-STAT-ACTIVITY-VIEW"

  - id: pg-mvcc-update-cost
    kind: single
    prompt: |
      Что физически происходит при `UPDATE` одной строки в PostgreSQL?
    options:
      - text: "Создаётся НОВАЯ версия строки, старая помечается устаревшей и остаётся в таблице до уборки"
        correct: true
      - text: "Значение перезаписывается на месте"
      - text: "Строка удаляется и вставляется заново пользователем"
      - text: "Изменение записывается только в журнал, таблица не трогается"
    explanation: |
      Из этого следует почти всё поведение PostgreSQL под нагрузкой: распухание
      таблиц после массовых обновлений, необходимость VACUUM, обязательное
      обновление всех индексов при изменении индексируемой колонки.

  - id: pg-vacuum-purpose
    kind: single
    prompt: |
      Зачем нужен VACUUM?
    options:
      - text: "Освобождать место, занятое мёртвыми версиями строк, и обновлять карту видимости"
        correct: true
      - text: "Пересобирать статистику для планировщика"
      - text: "Перестраивать индексы"
      - text: "Сжимать данные на диске"
    explanation: |
      Статистику собирает ANALYZE — это разные операции, хотя их часто
      выполняют вместе. Карта видимости, которую заполняет VACUUM, нужна для
      Index Only Scan.

  - id: pg-vacuum-full-difference
    kind: single
    prompt: |
      Чем `VACUUM FULL` отличается от обычного `VACUUM`?
    options:
      - text: "Он переписывает таблицу целиком и возвращает место операционной системе, но берёт исключительную блокировку — на боевой таблице это простой"
        correct: true
      - text: "Он работает быстрее обычного VACUUM"
      - text: "Он дополнительно обновляет статистику"
      - text: "Разницы нет, FULL — синоним"
    explanation: |
      Обычный VACUUM освобождает место для повторного использования внутри
      таблицы, не возвращая его системе, зато не мешает работе. VACUUM FULL на
      большой боевой таблице — событие, требующее окна обслуживания.

  - id: pg-autovacuum-disabled
    kind: single
    prompt: |
      На таблице отключена автоочистка, и по ней идут массовые обновления. Чем
      это грозит?
    options:
      - text: "Распуханием: живые строки размазываются среди мёртвых, и даже правильные планы читают всю таблицу"
        correct: true
      - text: "Ничем, пока хватает места на диске"
      - text: "Только ростом размера индексов"
      - text: "Потерей данных при перезапуске"
    explanation: |
      Ровно этот сценарий разбирается в лабе pg-slow-report: статистика после
      ANALYZE становится верной, план правильным, а страниц читается столько
      же — потому что живых строк мало, но лежат они везде.

  - id: pg-analyze-purpose
    kind: single
    prompt: |
      Что делает ANALYZE?
    options:
      - text: "Собирает статистику распределения значений по колонкам для планировщика"
        correct: true
      - text: "Освобождает место от мёртвых строк"
      - text: "Перестраивает индексы"
      - text: "Проверяет таблицу на повреждения"
    explanation: |
      Без актуальной статистики планировщик принимает решения по устаревшим
      предположениям — и выбирает неверный способ доступа и тип соединения.

  - id: pg-index-btree-default
    kind: single
    prompt: |
      Какой тип индекса создаётся по умолчанию и для чего он подходит?
    options:
      - text: "B-tree: равенство, диапазоны, сортировка, префиксный поиск по строке"
        correct: true
      - text: "Hash: только равенство"
      - text: "GIN: поиск внутри составных значений"
      - text: "BRIN: диапазоны по коррелированным данным"
    explanation: |
      Остальные типы решают задачи, недоступные B-tree: GIN для jsonb и
      полнотекстового поиска, GiST для геометрии, BRIN для огромных таблиц,
      физически упорядоченных по колонке.

  - id: pg-composite-index-order
    kind: single
    prompt: |
      Запросы фильтруют `WHERE tenant_id = ? AND created_at BETWEEN ? AND ?`.
      В каком порядке строить составной индекс?
    options:
      - text: "(tenant_id, created_at): колонка равенства первой, диапазона второй"
        correct: true
      - text: "(created_at, tenant_id): более селективная колонка первой"
      - text: "Порядок не важен"
      - text: "Нужны два отдельных индекса"
    explanation: |
      При обратном порядке пришлось бы просматривать весь диапазон дат, отбирая
      нужного арендатора уже после. Правило переносится и на другие СУБД:
      равенство раньше диапазона.

  - id: pg-index-write-cost
    kind: single
    prompt: |
      Чем плохо создать десять индексов «на всякий случай»?
    options:
      - text: "Каждая вставка и обновление обязаны обновить все индексы: запись замедляется, место расходуется"
        correct: true
      - text: "Планировщик начнёт выбирать неверный индекс"
      - text: "PostgreSQL ограничивает число индексов пятью"
      - text: "Индексы не влияют на запись"
    explanation: |
      Найти лишние помогает pg_stat_user_indexes: idx_scan = 0 за долгий период
      означает, что индекс никем не используется, но за него платят все
      операции записи.

  - id: pg-create-index-concurrently
    kind: single
    prompt: |
      Зачем нужен `CREATE INDEX CONCURRENTLY`?
    options:
      - text: "Чтобы не блокировать запись в таблицу на время построения индекса; платой служит более долгое построение и возможность остаться с невалидным индексом при сбое"
        correct: true
      - text: "Чтобы строить индекс в несколько потоков"
      - text: "Чтобы индекс сразу попал в кеш"
      - text: "Чтобы создать индекс без ANALYZE"
    explanation: |
      На боевой таблице обычный CREATE INDEX блокирует запись на всё время
      построения. При сбое CONCURRENTLY остаётся индекс, помеченный невалидным,
      — его надо удалить и создать заново.

  - id: pg-partial-index
    kind: single
    prompt: |
      Из миллиарда строк активны 0.1%, и запросы всегда фильтруют
      `WHERE is_active`. Что уместно?
    options:
      - text: "Частичный индекс: CREATE INDEX ... WHERE is_active — он в тысячу раз меньше и дешевле в поддержке"
        correct: true
      - text: "Обычный индекс по is_active"
      - text: "Индекс по всем колонкам таблицы"
      - text: "BRIN-индекс"
    explanation: |
      Индекс по булевой колонке с таким распределением почти бесполезен:
      значений всего два. Частичный индекс хранит только нужные строки, поэтому
      выигрывает и в размере, и в стоимости обновления.

  - id: pg-timestamptz-storage
    kind: single
    prompt: |
      Что на самом деле хранит тип `timestamptz`?
    options:
      - text: "Момент времени в UTC; часовой пояс применяется при выводе по настройке сеанса"
        correct: true
      - text: "Время вместе с указанным часовым поясом"
      - text: "Локальное время сервера"
      - text: "Строку с указанием смещения"
    explanation: |
      Название вводит в заблуждение: пояс не хранится. Именно поэтому
      timestamptz — правильный выбор для событий, а timestamp без пояса
      означает «время неизвестно где» и рано или поздно даёт расхождение суток.

  - id: pg-jsonb-vs-json
    kind: single
    prompt: |
      Чем `jsonb` отличается от `json` в PostgreSQL?
    options:
      - text: "jsonb хранится в разобранном двоичном виде: быстрее операции и возможны индексы GIN, но теряется исходное форматирование и порядок ключей"
        correct: true
      - text: "json поддерживает индексы, а jsonb нет"
      - text: "jsonb занимает меньше места"
      - text: "Разница только в названии"
    explanation: |
      Практически всегда нужен jsonb. Тип json оправдан лишь когда важно
      сохранить документ ровно в том виде, в каком он пришёл.

  - id: pg-jsonb-when-not
    kind: single
    prompt: |
      Когда jsonb — плохой выбор для хранения данных?
    options:
      - text: "Когда структура известна и стабильна: обычные колонки дают типы, ограничения, компактность и понятные планы"
        correct: true
      - text: "Когда данные приходят от внешнего API"
      - text: "Когда структура меняется от записи к записи"
      - text: "jsonb подходит всегда"
    explanation: |
      Соблазн «положим всё в jsonb, потом разберёмся» кончается таблицей без
      ограничений, где опечатка в имени ключа обнаруживается в отчёте. Это же
      нарушение первой нормальной формы.

  - id: pg-connection-cost
    kind: single
    prompt: |
      Почему приложение с сотнями соединений к PostgreSQL работает хуже, чем с
      десятками?
    options:
      - text: "Каждое соединение — отдельный процесс со своей памятью; сотни процессов конкурируют за ресурсы, поэтому нужен пул соединений"
        correct: true
      - text: "PostgreSQL ограничивает число соединений десятью"
      - text: "Соединения занимают место на диске"
      - text: "Каждое соединение создаёт копию данных"
    explanation: |
      Отсюда и роль pgbouncer в типовой архитектуре: он держит небольшой пул
      настоящих соединений и раздаёт их множеству клиентов.

  - id: pg-wal-purpose
    kind: single
    prompt: |
      Для чего нужен WAL (журнал предзаписи)?
    options:
      - text: "Изменения сначала записываются в журнал и только потом в файлы данных — это даёт восстановление после сбоя и основу для репликации"
        correct: true
      - text: "Для хранения статистики запросов"
      - text: "Для кеширования часто читаемых страниц"
      - text: "Для хранения плана выполнения запросов"
    explanation: |
      Из WAL вырастают и потоковая репликация, и восстановление на момент
      времени (PITR). Долговечность транзакции (D в ACID) обеспечивается именно
      записью в журнал, а не в файлы данных.

  - id: pg-truncate-vs-delete
    kind: single
    prompt: |
      Чем `TRUNCATE` отличается от `DELETE FROM t`?
    options:
      - text: "TRUNCATE не удаляет строки по одной, а освобождает файлы: быстрее и не оставляет мёртвых строк, но берёт исключительную блокировку"
        correct: true
      - text: "TRUNCATE нельзя откатить в транзакции"
      - text: "DELETE работает быстрее на больших таблицах"
      - text: "TRUNCATE не сбрасывает счётчики последовательностей — DELETE сбрасывает"
    explanation: |
      В PostgreSQL TRUNCATE транзакционен и откатывается — в отличие от многих
      других СУБД. Для очистки staging-таблиц он предпочтительнее DELETE именно
      потому, что не порождает работу для VACUUM.

  - id: pg-copy-vs-insert
    kind: single
    prompt: |
      Как быстрее всего загрузить в PostgreSQL миллион строк из файла?
    options:
      - text: "COPY: он разработан для массовой загрузки и на порядки быстрее построчных INSERT"
        correct: true
      - text: "Миллион отдельных INSERT в цикле"
      - text: "INSERT с подзапросом из временной таблицы"
      - text: "UPDATE с последующей вставкой недостающего"
    explanation: |
      Если COPY недоступен, следующий по эффективности вариант — многострочный
      INSERT пакетами в одной транзакции. Построчная вставка с автокоммитом
      медленнее в десятки раз.
