questions:
  - id: ci-why-needed
    kind: single
    prompt: |
      Тесты можно запускать локально. Зачем тогда CI?
    options:
      - text: "Локально их забывают запускать, а чистая машина показывает, что проект собирается на самом деле, а не «на машине автора»"
        correct: true
      - text: "CI выполняет тесты быстрее"
      - text: "CI находит ошибки, которые локальные тесты найти не могут"
      - text: "Так требуют системы контроля версий"
    explanation: |
      Третий довод не менее важен: workflow — это исполняемая документация о
      том, как собрать проект. В отличие от README, устареть незаметно она не
      может — устаревшая ломается.

  - id: ci-jobs-parallel
    kind: single
    prompt: |
      Два job без `needs` между ними. Как они выполняются?
    options:
      - text: "Параллельно, каждый на своей машине"
        correct: true
      - text: "Последовательно в порядке объявления"
      - text: "Параллельно, но на одной машине"
      - text: "Порядок случайный, но машина общая"
    explanation: |
      Из «своей машины» следует практическое: файл, созданный в одном job, во
      втором не появится. Передача — только через артефакты или кеш.

  - id: ci-steps-share-fs
    kind: single
    prompt: |
      Чем шаги (steps) отличаются от job в этом отношении?
    options:
      - text: "Шаги одного job выполняются последовательно на одной машине и делят файловую систему"
        correct: true
      - text: "Шаги тоже изолированы друг от друга"
      - text: "Шаги выполняются параллельно"
      - text: "Шаги не могут запускать команды оболочки"
    explanation: |
      Поэтому checkout делается один раз в начале job, а результаты сборки
      видны следующим шагам без дополнительных действий.

  - id: ci-feedback-time
    kind: single
    prompt: |
      Проверки на пул-реквест идут 40 минут. Чем это плохо?
    options:
      - text: "Обратная связь перестаёт влиять на решения: результат смотрят уже после слияния"
        correct: true
      - text: "GitHub Actions прерывает сборки дольше 30 минут"
      - text: "Растёт вероятность ложных падений"
      - text: "Ничем, если проверки полные"
    explanation: |
      Ориентир — минуты. Долгие проверки переносят в ночной прогон по
      расписанию, оставляя на пул-реквест быстрые.

  - id: ci-what-on-commit
    kind: multiple
    prompt: |
      Что разумно проверять на каждый коммит?
    options:
      - text: "Линтер и форматтер"
        correct: true
      - text: "Проверку типов"
        correct: true
      - text: "Модульные и быстрые интеграционные тесты"
        correct: true
      - text: "Полный набор сквозных тестов на всех поддерживаемых версиях ОС"
    explanation: |
      Последнее — типичный кандидат в ночной прогон: полезно, но слишком долго
      для обратной связи по пул-реквесту.

  - id: ci-scheduled-checks
    kind: multiple
    prompt: |
      Что уместно запускать по расписанию, а не на коммит?
    options:
      - text: "Медленные сквозные тесты"
        correct: true
      - text: "Проверку зависимостей на уязвимости"
        correct: true
      - text: "Пересборку с обновлёнными зависимостями"
        correct: true
      - text: "Линтер"
    explanation: |
      Ночная пересборка с обновлениями ловит поломки, которые приходят сами
      собой: вышла новая версия библиотеки, и проект перестал собираться, хотя
      никто ничего не менял.

  - id: ci-separate-lint-job
    kind: single
    prompt: |
      Зачем выносить линтер в отдельный job, а не делать шагом в тестовом?
    options:
      - text: "Результат приходит за секунды параллельно тестам, и опечатка не отнимает полный прогон"
        correct: true
      - text: "Линтер не может работать в одном job с тестами"
      - text: "Так экономится время выполнения в сумме"
      - text: "Так требует GitHub Actions"
    explanation: |
      Суммарное машинное время при этом даже растёт — выигрыш в человеческом:
      разработчик узнаёт об ошибке форматирования через двадцать секунд, а не
      через пять минут.

  - id: ci-content-validation
    kind: single
    prompt: |
      Какую проверку, специфичную для этого проекта, стоит держать в CI?
    options:
      - text: "Валидацию контента: битый prereq или лаба без check.py должны ронять сборку здесь, а не всплывать у пользователя посреди занятия"
        correct: true
      - text: "Проверку орфографии в теории"
      - text: "Замер скорости запуска приложения"
      - text: "Подсчёт числа строк кода"
    explanation: |
      Хорошая проверка в CI ловит именно тот класс ошибок, который иначе
      обнаруживается дорого и поздно. Для контентного проекта это целостность
      графа и наличие обязательных файлов.

  - id: ci-flaky-test
    kind: single
    prompt: |
      Тест в CI падает примерно раз в двадцать прогонов. Чем это опасно?
    options:
      - text: "Сборку начинают перезапускать не глядя, и вместе с плавающим падением игнорируют настоящее"
        correct: true
      - text: "Растёт расход машинного времени"
      - text: "GitHub блокирует репозиторий за нестабильные сборки"
      - text: "Ничем: достаточно перезапустить"
    explanation: |
      Плавающий тест хуже отсутствующего, потому что подрывает доверие ко всей
      системе проверок. Искать надо источник недетерминированности: время,
      случайность, порядок, внешнюю зависимость.

  - id: ci-test-isolation
    kind: single
    prompt: |
      Тесты проходят локально, но в CI падают при полном прогоне. Что
      проверить в первую очередь?
    options:
      - text: "Зависимость тестов друг от друга через общее состояние: один оставляет данные, которые видит другой"
        correct: true
      - text: "Версию Python на раннере"
      - text: "Скорость сети"
      - text: "Объём памяти раннера"
    explanation: |
      Локально порядок мог быть другим или база сохраняла состояние с прошлого
      запуска. Проверяется запуском в случайном порядке.

  - id: ci-services
    kind: single
    prompt: |
      Тестам нужна настоящая база PostgreSQL. Как правильно в GitHub Actions?
    options:
      - text: "Поднять её как сервис-контейнер рядом с job, с проверкой здоровья"
        correct: true
      - text: "Подменить базу заглушкой в тестах"
      - text: "Подключаться к общей тестовой базе на сервере команды"
      - text: "Устанавливать PostgreSQL на раннер пакетным менеджером"
    explanation: |
      Общая база вносит зависимость между сборками разных веток и делает тесты
      недетерминированными. Заглушка вместо базы проверяет фантазию автора о
      SQL, а не поведение SQL.

  - id: ci-cache-key
    kind: single
    prompt: |
      От чего должен зависеть ключ кеша зависимостей?
    options:
      - text: "От содержимого файла блокировки: изменился он — нужен новый кеш"
        correct: true
      - text: "От номера сборки"
      - text: "От имени ветки"
      - text: "От даты"
    explanation: |
      Ключ по дате даёт устаревший кеш в течение суток после смены
      зависимостей, ключ по номеру сборки — промах на каждом прогоне, то есть
      кеш без пользы.

  - id: ci-cache-too-broad
    kind: single
    prompt: |
      Ключ кеша задали константой `uv-cache`. Чем это опасно?
    options:
      - text: "После изменения зависимостей будет использоваться старый кеш: сборка либо упадёт непонятно, либо пройдёт на прежних версиях пакетов"
        correct: true
      - text: "Кеш будет промахиваться на каждом прогоне"
      - text: "GitHub удалит такой кеш"
      - text: "Ничем: постоянный ключ надёжнее"
    explanation: |
      Второй вариант — беда противоположного, слишком узкого ключа. Обе
      крайности плохи, и золотая середина — хеш файла, определяющего
      содержимое кеша.

  - id: ci-secrets-storage
    kind: single
    prompt: |
      Где хранить пароль к базе, нужный тестам в CI?
    options:
      - text: "В секретах репозитория, подставляя переменной окружения"
        correct: true
      - text: "В файле workflow — он и так виден только команде"
      - text: "В README, чтобы не потерялся"
      - text: "В переменной окружения раннера, заданной вручную"
    explanation: |
      Файл workflow лежит в git и виден всем, у кого есть доступ к
      репозиторию, а в публичном репозитории — вообще всем.

  - id: ci-secrets-masking
    kind: single
    prompt: |
      Секреты маскируются в логах звёздочками. Значит ли это, что можно
      запускать чужой код с доступом к ним?
    options:
      - text: "Нет: маскирование защищает от случайной публикации, а не от намеренного извлечения обходными путями"
        correct: true
      - text: "Да, маскирование надёжно скрывает значения"
      - text: "Да, если код запускается в отдельном job"
      - text: "Да, если секрет передан через env, а не через with"
    explanation: |
      Поэтому пул-реквесты из форков по умолчанию не получают секретов —
      иначе любой желающий отправил бы пул-реквест, выводящий их в
      закодированном виде.

  - id: ci-pin-actions
    kind: single
    prompt: |
      Почему в критичных местах версию стороннего действия фиксируют хешем
      коммита, а не тегом?
    options:
      - text: "Тег можно переместить: под ним завтра окажется другой код, который получит доступ к репозиторию и секретам"
        correct: true
      - text: "Хеш работает быстрее"
      - text: "Теги не поддерживаются GitHub Actions"
      - text: "Хеш обеспечивает кеширование действия"
    explanation: |
      `uses: some/action@v1` — это доверие чужому коду, выполняемому в вашем
      окружении. Компрометация популярного действия — реальный класс атак на
      цепочку поставок.

  - id: ci-local-vs-ci-file
    kind: single
    prompt: |
      Самая частая причина «локально работает, в CI падает»?
    options:
      - text: "Нужный файл есть локально, но не добавлен в git"
        correct: true
      - text: "Другая версия операционной системы"
      - text: "Медленная сеть на раннере"
      - text: "Нехватка памяти"
    explanation: |
      Проверяется в одно действие: клонировать репозиторий в чистый каталог и
      попробовать собрать. Если не собирается — файла нет в репозитории.

  - id: ci-case-sensitivity
    kind: single
    prompt: |
      Импорт `from Utils import x` работает на ноутбуке и падает в CI. Почему?
    options:
      - text: "Файловая система Linux различает регистр, а macOS и Windows по умолчанию нет: файл называется utils.py"
        correct: true
      - text: "В CI не установлен нужный пакет"
      - text: "Различаются версии Python"
      - text: "Не задана переменная PYTHONPATH"
    explanation: |
      Классика кроссплатформенной разработки. Ошибка обнаруживается только на
      Linux — то есть, как правило, впервые именно в CI или на проде.

  - id: ci-timezone
    kind: single
    prompt: |
      Тесты с датами проходят локально и падают в CI. Вероятная причина?
    options:
      - text: "Раннер работает в UTC, а ноутбук в местном часовом поясе — граница суток разъезжается"
        correct: true
      - text: "В CI отключён модуль datetime"
      - text: "Раннер имеет неверное системное время"
      - text: "Тесты выполняются слишком быстро"
    explanation: |
      Лечится тем же, чем в пайплайнах: явным поясом внутри системы и передачей
      текущего времени параметром, а не обращением к datetime.now() из логики.

  - id: ci-required-checks
    kind: single
    prompt: |
      Что делает проверки в CI по-настоящему обязательными?
    options:
      - text: "Защита ветки: слить пул-реквест нельзя, пока проверки красные"
        correct: true
      - text: "Уведомления в мессенджер о падении"
      - text: "Значок статуса в README"
      - text: "Договорённость внутри команды"
    explanation: |
      Без защиты ветки CI остаётся рекомендацией, а рекомендации в спешке
      игнорируются. Договорённость работает ровно до первого срочного релиза.

  - id: ci-artifacts
    kind: single
    prompt: |
      Зачем сохранять артефакты сборки — отчёты, логи, покрытие?
    options:
      - text: "Чтобы разбирать падение по файлам, а не по одному тексту лога"
        correct: true
      - text: "Чтобы ускорить следующую сборку"
      - text: "Чтобы соблюсти лимиты GitHub"
      - text: "Чтобы передать данные между шагами одного job"
    explanation: |
      Особенно полезно для отчётов тестов в формате JUnit и логов упавших
      контейнеров: без них разбор превращается в чтение простыни вывода.

  - id: ci-cd-difference
    kind: single
    prompt: |
      Чем CD отличается от CI?
    options:
      - text: "CI проверяет каждое изменение, CD автоматически доставляет проверенное до пользователя; второе без первого не имеет смысла"
        correct: true
      - text: "CD — это то же самое, другое название"
      - text: "CD запускает тесты, а CI собирает артефакты"
      - text: "CD применим только к мобильным приложениям"
    explanation: |
      Автоматическая доставка без надёжных проверок означает автоматическую
      доставку ошибок — то есть ускоряет ровно то, что хотелось бы замедлить.
