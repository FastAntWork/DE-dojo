questions:
  - id: inc-first-action
    kind: single
    prompt: |
      Аналитик пишет: «в отчёте неверные цифры за март». Загрузка идёт по
      расписанию каждый час. Что сделать ПЕРВЫМ?
    options:
      - text: "Уточнить, что именно расходится, и поставить загрузку на паузу — она продолжает разносить порчу"
        correct: true
      - text: "Открыть код пайплайна и искать ошибку"
        correct: false
      - text: "Пересчитать март"
      - text: "Написать разбор инцидента"
    explanation: |
      Инженер, который сразу лезет в код и через два часа находит причину, но
      всё это время пайплайн грузил порчу, сделал хуже того, кто за две минуты
      нажал паузу. Починка требует времени, распространение — нет.

  - id: inc-clarify
    kind: single
    prompt: |
      Почему уточнение «что именно расходится» стоит первым шагом?
    options:
      - text: "Часто расхождение мнимое: сравнивали разные периоды, разные фильтры или разные определения метрики"
        correct: true
      - text: "Чтобы формально зафиксировать обращение"
      - text: "Чтобы переложить ответственность на аналитика"
      - text: "Чтобы выиграть время на поиск причины"
    explanation: |
      «Неверные цифры» — не описание проблемы. Нужны витрина, период, метрика и
      то, с чем сравнивают. Изрядная доля обращений закрывается на этом шаге.

  - id: inc-scope-assessment
    kind: multiple
    prompt: |
      Что входит в оценку масштаба инцидента?
    options:
      - text: "Сколько периодов затронуто"
        correct: true
      - text: "Какие витрины ниже по графу зависимостей используют эти данные"
        correct: true
      - text: "Кто уже прочитал данные и ушли ли они наружу"
        correct: true
      - text: "Сколько строк кода в пайплайне"
    explanation: |
      Оценка масштаба определяет и объём восстановления, и то, кого надо
      предупредить. Именно этот шаг чаще всего пропускают, а он определяет, чем
      инцидент кончится.

  - id: inc-quarantine-what
    kind: single
    prompt: |
      Что такое карантин данных?
    options:
      - text: "Подозрительные строки откладываются в отдельную таблицу с причиной отбраковки, а остальные идут в витрину"
        correct: true
      - text: "Витрина закрывается для чтения до окончания разбора"
      - text: "Загрузка останавливается до ручного подтверждения"
      - text: "Данные копируются в резервное хранилище перед каждой загрузкой"
    explanation: |
      Это средний путь между «уронить всю загрузку» и «пропустить порчу
      дальше». Часто лучший, но с условием применимости.

  - id: inc-quarantine-when-not
    kind: single
    prompt: |
      Когда карантин НЕ годится?
    options:
      - text: "Когда витрина теряет смысл при неполных данных — например, в финансовой отчётности отчёт без 500 операций выглядит правильным и таковым не является"
        correct: true
      - text: "Когда подозрительных строк больше десяти"
      - text: "Когда пайплайн написан на dbt"
      - text: "Когда данные загружаются чаще раза в час"
    explanation: |
      Условие применимости карантина — витрина должна оставаться осмысленной
      при неполноте. Для оперативного дашборда это так, для расчёта денег — нет.

  - id: inc-quarantine-requirements
    kind: multiple
    prompt: |
      Что обязательно должно быть у карантина?
    options:
      - text: "Причина отбраковки рядом с каждой строкой, а не общий счётчик"
        correct: true
      - text: "Видимость: число строк в карантине как отслеживаемая метрика"
        correct: true
      - text: "Путь обратно: разобранные строки должны возвращаться в витрину"
        correct: true
      - text: "Автоматическое удаление строк старше суток"
    explanation: |
      Автоудаление превратило бы карантин в тихую потерю данных. Молчаливо
      растущий карантин — та же потеря, только аккуратная, поэтому его размер
      обязан быть виден.

  - id: inc-search-by-layers
    kind: single
    prompt: |
      Как искать причину расхождения?
    options:
      - text: "По слоям, отвечая на каждой границе «числа здесь уже неверные?»: отчёт → витрина → преобразования → сырой слой → источник"
        correct: true
      - text: "Читая код пайплайна сверху вниз"
      - text: "Начиная с источника и проверяя всё подряд"
      - text: "Сравнивая текущий код с версией месячной давности"
    explanation: |
      Движение по слоям превращает поиск в последовательность проверяемых
      ответов вместо угадывания. На каждой границе нужен один запрос.

  - id: inc-report-layer
    kind: single
    prompt: |
      Прямой запрос к витрине даёт верную сумму, а отчёт показывает другую. Где
      причина?
    options:
      - text: "В отчёте: фильтры, определение метрики, часовой пояс"
        correct: true
      - text: "В преобразованиях"
      - text: "В сыром слое"
      - text: "В источнике"
    explanation: |
      Удивительно частый случай. Разные определения «активного пользователя» или
      разные часовые пояса дают расхождение, которое выглядит как ошибка
      пайплайна.

  - id: inc-binary-search-time
    kind: single
    prompt: |
      Данные испорчены, но неясно, с какого момента. Какой приём сузит поиск
      быстрее всего?
    options:
      - text: "Бинарный поиск по времени: найти последний верный день и первый неверный, затем сопоставить границу с деплоями и изменениями источника"
        correct: true
      - text: "Полное чтение кода пайплайна"
      - text: "Пересчёт всей истории и сравнение результатов"
      - text: "Опрос всех потребителей витрины"
    explanation: |
      Граница по времени почти всегда совпадает с конкретным событием: выкатили
      изменение, источник поменял формат, была разовая загрузка. Это сужает
      область поиска быстрее чтения кода.

  - id: inc-downstream
    kind: single
    prompt: |
      Испорченную витрину починили и пересчитали. Три витрины ниже по графу
      строятся на её основе. Что с ними?
    options:
      - text: "Их тоже надо пересчитать в порядке графа: само не починится"
        correct: true
      - text: "Они обновятся автоматически при следующем запуске"
      - text: "Они не затронуты, так как читают витрину, а не источник"
      - text: "Достаточно очистить их кеш"
    explanation: |
      Зависимые витрины хранят результат, посчитанный по испорченным данным.
      Следующий регулярный запуск обычно обрабатывает только новый период и
      прошлое не трогает.

  - id: inc-external-consumers
    kind: single
    prompt: |
      Испорченные цифры успели уйти во внешнюю систему партнёра. Что это
      меняет?
    options:
      - text: "Пересчётом это не исправляется: нужен отдельный план с оповещением получателя"
        correct: true
      - text: "Ничего: партнёр получит исправленные данные при следующей выгрузке"
      - text: "Нужно просто увеличить частоту выгрузок"
      - text: "Достаточно записать факт в разбор инцидента"
    explanation: |
      Формулировка, которую стоит помнить: исправить данные — половина работы;
      вторая половина — сообщить тем, кто уже успел их использовать.

  - id: inc-people-consumers
    kind: single
    prompt: |
      По испорченным цифрам руководству отправили отчёт. Техническое
      исправление закрывает вопрос?
    options:
      - text: "Нет: об ошибке надо сообщить, и лучше сделать это самому и сразу"
        correct: true
      - text: "Да: после пересчёта цифры станут верными"
      - text: "Да, если расхождение меньше 5%"
      - text: "Достаточно упомянуть это в разборе инцидента"
    explanation: |
      Решение уже принято на неверных данных. Молчание превращает техническую
      ошибку в вопрос доверия, а его восстанавливать намного дольше.

  - id: inc-fix-before-recompute
    kind: single
    prompt: |
      Почему нельзя начинать пересчёт до починки причины?
    options:
      - text: "Пересчёт по неисправленному коду даст те же неверные цифры — работа будет проделана впустую"
        correct: true
      - text: "Пересчёт заблокирует таблицы"
      - text: "Оркестратор не позволит запустить backfill при активном инциденте"
      - text: "Это допустимо: пересчёт можно повторить"
    explanation: |
      Очевидно на словах и регулярно нарушается под давлением «сделайте
      быстрее». Пересчёт — последний шаг, а не первый.

  - id: inc-recompute-is-backfill
    kind: single
    prompt: |
      Пересчёт истории после инцидента — это по сути backfill. Что из этого
      следует?
    options:
      - text: "Применимо всё оттуда: границы периода из контекста, идемпотентность загрузки, ограничение параллелизма"
        correct: true
      - text: "Пересчёт можно запускать без ограничений, так как данных немного"
      - text: "Пересчёт всегда безопасен, потому что данные уже испорчены"
      - text: "Пересчёт не требует идемпотентности"
    explanation: |
      Неидемпотентный пересчёт превратит один инцидент в два: к неверным цифрам
      добавятся задвоенные. Сто интервалов разом положат хранилище.

  - id: inc-recompute-impossible
    kind: single
    prompt: |
      Источник хранит только текущее состояние без истории. Просят пересчитать
      прошлый квартал. Что делать?
    options:
      - text: "Сказать прямо, что честный пересчёт невозможен, и обсудить приближение, явно помеченное как приближение"
        correct: true
      - text: "Посчитать по текущему состоянию и выдать как исторические данные"
      - text: "Отказаться от пересчёта без объяснений"
      - text: "Восстановить историю из логов приложения-источника"
    explanation: |
      Молча посчитать по текущему состоянию — худшее из возможного: цифры будут
      выглядеть настоящими. Вывод на будущее: снимки источника или SCD-история
      это условие возможности разбирать инциденты.

  - id: inc-postmortem-key-metric
    kind: single
    prompt: |
      Какая цифра в хронологии инцидента самая ценная?
    options:
      - text: "Разрыв между «началось» и «заметили»: он показывает, чего не хватает в проверках"
        correct: true
      - text: "Общее время устранения"
      - text: "Число затронутых строк"
      - text: "Число участников разбора"
    explanation: |
      Главный вопрос разбора: почему мы узнали об этом от аналитика, а не от
      своей проверки. Разрыв между началом и обнаружением — прямая мера этого
      пробела.

  - id: inc-postmortem-blame
    kind: single
    prompt: |
      Как формулировать причину в разборе инцидента?
    options:
      - text: "Технически, без поиска виноватого: инцидент почти всегда результат отсутствующей проверки, а не чьей-то ошибки"
        correct: true
      - text: "С указанием автора изменения, чтобы он был внимательнее"
      - text: "Максимально обобщённо, чтобы никого не задеть"
      - text: "Причину указывать не обязательно, важнее список исправлений"
    explanation: |
      Разбор с поиском виноватого приводит к тому, что об инцидентах перестают
      сообщать. Без причины разбор бесполезен: из него не выводится, что менять.

  - id: inc-leaves-check
    kind: single
    prompt: |
      Чем должен закончиться разбор инцидента?
    options:
      - text: "Конкретными проверками и правками с ответственным и сроком — инцидент, не превратившийся в проверку, повторится"
        correct: true
      - text: "Документом в базе знаний"
      - text: "Извинениями перед потребителями данных"
      - text: "Увеличением частоты запуска пайплайна"
    explanation: |
      Тот же принцип, что регрессионный тест на исправленный баг. База знаний
      фиксирует знание, но не мешает повторению.

  - id: inc-cause-join-duplicate
    kind: single
    prompt: |
      После добавления соединения со справочником выручка в витрине выросла
      втрое. Наиболее вероятная причина?
    options:
      - text: "В справочнике ключ не уникален, и соединение размножило строки фактов"
        correct: true
      - text: "Изменился часовой пояс"
      - text: "Источник прислал данные дважды"
      - text: "Сменился тип колонки суммы"
    explanation: |
      Классика. Проверка uniqueness на ключе справочника поймала бы это до
      публикации — это первое, что стоит добавить после такого инцидента.

  - id: inc-cause-null-comparison
    kind: find-error
    prompt: |
      ```sql
      SELECT sum(amount) FROM orders
      WHERE status != 'cancelled'
      ```
      Часть заказов пропала из отчёта. Почему?
    options:
      - text: "Строки со status IS NULL отброшены: сравнение с NULL даёт неизвестность, а не истину"
        correct: true
      - text: "Оператор != не работает со строками"
      - text: "Нужен ORDER BY для корректной агрегации"
      - text: "sum игнорирует отрицательные значения"
    explanation: |
      Одна из самых частых причин тихой потери строк. Правильно —
      `WHERE status IS DISTINCT FROM 'cancelled'` или явная обработка NULL.

  - id: inc-cause-inner-join
    kind: single
    prompt: |
      В витрине стало меньше заказов после того, как добавили соединение с
      таблицей клиентов. Что проверить?
    options:
      - text: "Тип соединения: INNER JOIN отбрасывает заказы, для которых клиент не нашёлся"
        correct: true
      - text: "Индексы на таблице клиентов"
      - text: "Часовой пояс в фильтре по дате"
      - text: "Настройку идемпотентности загрузки"
    explanation: |
      Тихая потеря строк из-за INNER JOIN — вторая по частоте причина после
      задвоения. Проверка «число строк до и после соединения» ловит оба случая.

  - id: inc-cause-timezone
    kind: single
    prompt: |
      Суточные итоги расходятся с источником на несколько процентов, причём
      расхождение симметрично: у одного дня недостача, у соседнего избыток. О
      чём это говорит?
    options:
      - text: "О границе суток: скорее всего, разъехались часовые пояса при формировании дня"
        correct: true
      - text: "О задвоении при загрузке"
      - text: "О потере строк из-за INNER JOIN"
      - text: "О неидемпотентной загрузке"
    explanation: |
      Симметричность — характерный признак: строки не потерялись и не
      задвоились, а уехали в соседний день. Задвоение дало бы рост без парной
      недостачи.

  - id: inc-pause-schedule
    kind: single
    prompt: |
      Когда снимать паузу с расписания после инцидента?
    options:
      - text: "После починки причины, пересчёта затронутых периодов и сверки результата — последним шагом"
        correct: true
      - text: "Сразу после того, как найдена причина"
      - text: "Перед началом пересчёта, чтобы новые данные шли параллельно"
      - text: "Через сутки после починки, для надёжности"
    explanation: |
      Регулярный запуск во время пересчёта конфликтует с ним за те же таблицы и
      может наложиться на неполный результат. Снятие паузы — признак того, что
      восстановление завершено и проверено.
