questions:
  - id: api-retry-4xx
    kind: single
    prompt: |
      API вернул 401. Стоит ли повторять запрос?
    options:
      - text: "Нет: ошибка клиента, повтор даст тот же ответ. Чинить надо доступ"
        correct: true
      - text: "Да, с экспоненциальной задержкой"
      - text: "Да, но не больше трёх раз"
      - text: "Да, предварительно подождав минуту"
    explanation: |
      Слепой повтор всего подряд — распространённая ошибка: выгрузка с неверным
      ключом ломится в API десять раз, и в логах это выглядит как проблема
      сети, а не как неверный ключ.

  - id: api-retry-which
    kind: multiple
    prompt: |
      Какие ситуации имеет смысл повторять?
    options:
      - text: "503 Service Unavailable"
        correct: true
      - text: "Таймаут соединения"
        correct: true
      - text: "429 Too Many Requests"
        correct: true
      - text: "400 Bad Request"
    explanation: |
      Правило: 5xx и сетевые ошибки повторяем, 4xx нет — кроме 429, который
      прямо просит подождать и повторить.

  - id: api-backoff-why
    kind: single
    prompt: |
      Почему задержку между повторами делают растущей, а не фиксированной?
    options:
      - text: "Повторять раз в секунду упавший сервис — значит мешать ему подняться; растущая задержка снижает давление"
        correct: true
      - text: "Так меньше нагрузка на собственный процесс"
      - text: "Этого требует стандарт HTTP"
      - text: "Фиксированная задержка не работает с таймаутами"
    explanation: |
      Типичная последовательность 1, 2, 4, 8 секунд с потолком. Без потолка
      задержка вырастает до часов, и задача висит в оркестраторе, занимая слот.

  - id: api-jitter
    kind: single
    prompt: |
      Зачем к задержке повтора добавляют случайную составляющую (jitter)?
    options:
      - text: "Иначе все клиенты, упавшие одновременно, повторят запрос тоже одновременно и добьют сервис"
        correct: true
      - text: "Чтобы обойти ограничение частоты запросов"
      - text: "Чтобы усложнить анализ логов"
      - text: "Чтобы не превысить потолок задержки"
    explanation: |
      Эффект называется «громовое стадо». Разброс разводит клиентов во времени
      и превращает пик нагрузки в пологую волну.

  - id: api-retry-post
    kind: single
    prompt: |
      Запрос POST, создающий заказ, завершился таймаутом. Можно ли повторить?
    options:
      - text: "Опасно: заказ мог создаться, а ответ не дойти. Нужен ключ идемпотентности, по которому сервер распознает повтор"
        correct: true
      - text: "Да, POST всегда безопасно повторять"
      - text: "Да, если повторить в течение минуты"
      - text: "Нет, повторять POST нельзя никогда"
    explanation: |
      Тот же промежуток между «сделал» и «узнал, что сделал», что и в
      идемпотентности загрузок. Ключ идемпотентности — способ переложить
      распознавание повтора на сервер.

  - id: api-offset-pagination-problem
    kind: single
    prompt: |
      Выгрузка идёт по `?limit=100&offset=N`, и во время неё в источник
      добавляются записи. Что произойдёт?
    options:
      - text: "Данные разъедутся: часть записей вернётся дважды, часть будет пропущена"
        correct: true
      - text: "Новые записи просто не попадут в выгрузку"
      - text: "API вернёт ошибку рассинхронизации"
      - text: "Ничего: смещение считается на момент первого запроса"
    explanation: |
      Вставка сдвигает все последующие записи. Плюс к этому смещение дорого на
      глубине — сервер обязан отобрать и отбросить N записей, ровно как OFFSET
      в SQL.

  - id: api-cursor-pagination
    kind: single
    prompt: |
      Чем курсорная пагинация лучше пагинации по смещению?
    options:
      - text: "Она устойчива к вставкам во время выгрузки и не дорожает с глубиной"
        correct: true
      - text: "Она позволяет запрашивать страницы в произвольном порядке"
      - text: "Она возвращает больше записей за запрос"
      - text: "Она не требует авторизации"
    explanation: |
      Плата — невозможность прыгнуть на произвольную страницу и
      распараллелить по страницам: следующий курсор известен только после
      предыдущего ответа.

  - id: api-unstable-sort
    kind: single
    prompt: |
      Пагинация построена на `updated_after=<дата>`. У десяти записей
      одинаковое время обновления. Чем это грозит?
    options:
      - text: "Пропусками и дублями на границе страницы: сортировка неустойчива, нужен составной ключ «дата, идентификатор»"
        correct: true
      - text: "Ничем: одинаковые даты обрабатываются корректно"
      - text: "Ошибкой сервера"
      - text: "Записи вернутся в случайном порядке, но все"
    explanation: |
      Классическая тихая потеря данных: выгрузка проходит без единой ошибки, а
      часть записей не доехала. Обнаруживается сверкой количеств, если она есть.

  - id: api-infinite-loop
    kind: single
    prompt: |
      Какую защиту обязательно ставить в цикл выгрузки страниц?
    options:
      - text: "Ограничение числа итераций: ошибка в условии выхода превращает выгрузку в бесконечный цикл"
        correct: true
      - text: "Проверку доступной памяти"
      - text: "Логирование каждой страницы"
      - text: "Сортировку результата"
    explanation: |
      Бесконечный цикл обычно замечают по счёту за трафик или по блокировке
      ключа. Верхняя граница числа страниц стоит одной строки.

  - id: api-429-retry-after
    kind: single
    prompt: |
      Пришёл 429 с заголовком `Retry-After: 30`. Что делать?
    options:
      - text: "Подождать указанные 30 секунд: сервер прямо сообщает, когда можно, и угадывать задержку не нужно"
        correct: true
      - text: "Повторить сразу: заголовок носит рекомендательный характер"
      - text: "Применить свою экспоненциальную задержку, игнорируя заголовок"
      - text: "Прекратить выгрузку и сообщить об ошибке"
    explanation: |
      Игнорирование Retry-After — быстрый путь к блокировке. Если заголовка
      нет, тогда уже применяется собственная растущая задержка.

  - id: api-rate-limit-headers
    kind: single
    prompt: |
      Зачем читать заголовки `X-RateLimit-Remaining` и `X-RateLimit-Reset`?
    options:
      - text: "Чтобы притормозить заранее и не доводить до 429"
        correct: true
      - text: "Чтобы узнать размер страницы"
      - text: "Чтобы проверить срок действия токена"
      - text: "Чтобы определить часовой пояс сервера"
    explanation: |
      Реакция на 429 — это лечение по факту; отслеживание остатка лимита
      позволяет вообще до него не доходить, что и вежливее, и быстрее в сумме.

  - id: api-parallel-danger
    kind: single
    prompt: |
      Выгрузка идёт медленно, и её распараллелили в двадцать потоков. Чем
      рискуете?
    options:
      - text: "Блокировкой по адресу и разговором с владельцем API: превышение частоты обычно карается жёстче, чем медленная выгрузка"
        correct: true
      - text: "Только увеличением расхода памяти"
      - text: "Ничем, если каждый поток обрабатывает свою страницу"
      - text: "Потерей порядка записей"
    explanation: |
      Кроме того, курсорную пагинацию по страницам распараллелить нельзя в
      принципе. Параллелить можно по независимым диапазонам, если API это
      поддерживает.

  - id: api-timeout-required
    kind: single
    prompt: |
      Почему запрос без таймаута опасен в задаче оркестратора?
    options:
      - text: "Он может висеть неограниченно долго, а вместе с ним и задача, занимая слот исполнителя"
        correct: true
      - text: "Он потребляет больше памяти"
      - text: "Он не попадает в логи"
      - text: "Он не может быть повторён"
    explanation: |
      Таймаут задают отдельно на соединение и на чтение. Задача, висящая сутки
      вместо десяти минут, — типичная причина забитого пула воркеров.

  - id: api-raise-for-status
    kind: find-error
    prompt: |
      ```python
      response = requests.get(url)
      data = response.json()
      ```
      Что пропущено?
    options:
      - text: "Проверка статуса: requests не бросает исключение на 404 или 500 сам по себе, и страница ошибки будет разобрана как данные"
        correct: true
      - text: "Указание кодировки ответа"
      - text: "Закрытие соединения"
      - text: "Проверка размера ответа"
    explanation: |
      Отсюда загадочные KeyError глубоко в разборе: пришёл JSON с описанием
      ошибки, а код ждал список записей. `raise_for_status()` превращает это в
      понятное исключение сразу.

  - id: api-session-reuse
    kind: single
    prompt: |
      Зачем использовать сессию вместо отдельных вызовов requests.get?
    options:
      - text: "Соединение переиспользуется: экономится рукопожатие TLS на каждом запросе, что заметно на тысячах вызовов"
        correct: true
      - text: "Сессия автоматически повторяет упавшие запросы"
      - text: "Сессия обходит ограничение частоты"
      - text: "Без сессии нельзя передавать заголовки"
    explanation: |
      Плюс общие заголовки и параметры задаются один раз. На выгрузке в десять
      тысяч запросов разница во времени измеряется минутами.

  - id: api-stream-large-response
    kind: single
    prompt: |
      Ответ API — файл на 500 МБ. Как его забрать?
    options:
      - text: "Потоково, записывая по частям на диск, а не держа целиком в памяти"
        correct: true
      - text: "response.json() — библиотека сама разберётся"
      - text: "Разбить на страницы по 1 МБ"
      - text: "Увеличить память процесса"
    explanation: |
      Тот же принцип, что при чтении больших файлов: не загружать целиком то,
      что можно обработать порциями.

  - id: api-idempotent-extraction
    kind: single
    prompt: |
      Как сделать ежедневную выгрузку из API идемпотентной?
    options:
      - text: "Брать границы периода из контекста прогона и записывать порцию атомарно — подменой партиции или удалением и вставкой периода в одной транзакции"
        correct: true
      - text: "Добавить ретраи с экспоненциальной задержкой"
      - text: "Проверять перед вставкой, есть ли уже данные за день"
      - text: "Использовать курсорную пагинацию"
    explanation: |
      Ретраи и пагинация к идемпотентности отношения не имеют, а проверка перед
      вставкой — классическая гонка. Идемпотентность обеспечивается атомарной
      записью, а не проверками.

  - id: api-raw-response-storage
    kind: single
    prompt: |
      Зачем сохранять сырой ответ API, если данные всё равно разбираются и
      кладутся в таблицу?
    options:
      - text: "Чтобы при обнаружении ошибки в разборе пересчитать всё заново, не выкачивая повторно — источник может уже не отдать те данные"
        correct: true
      - text: "Чтобы ускорить повторные запросы"
      - text: "Чтобы соблюсти требования API"
      - text: "Чтобы уменьшить объём хранилища"
    explanation: |
      Это тот же сырой слой хранилища, только на уровне интеграции. Дешёвое
      решение, окупающееся при первой же ошибке в логике разбора.

  - id: api-updated-at-vs-created-at
    kind: single
    prompt: |
      Источник меняет записи задним числом. По какому полю строить
      инкрементальную выгрузку?
    options:
      - text: "По времени изменения, да ещё и с окном перекрытия — по времени создания изменения просто не приедут"
        correct: true
      - text: "По времени создания: оно стабильно"
      - text: "По возрастанию идентификатора"
      - text: "Всегда делать полную выгрузку"
    explanation: |
      Выгрузка по идентификатору или дате создания заберёт только новые
      записи. Изменённые останутся в приёмнике в старой версии — и расхождение
      обнаружится нескоро.

  - id: api-secret-in-url
    kind: single
    prompt: |
      Почему ключ доступа нельзя передавать параметром URL?
    options:
      - text: "Параметры запроса попадают в логи прокси и серверов, в историю и в метрики — то есть утекают многими путями сразу"
        correct: true
      - text: "URL имеет ограничение по длине"
      - text: "Так запрещено стандартом HTTP"
      - text: "Параметры URL не шифруются даже в HTTPS"
    explanation: |
      В HTTPS URL как раз шифруется при передаче — проблема не в канале, а в
      том, что он записывается на обоих концах и на промежуточных узлах.
      Место ключа — заголовок.

  - id: api-key-leak
    kind: single
    prompt: |
      Ключ API случайно попал в коммит. Первое действие?
    options:
      - text: "Отозвать и заменить ключ: он уже скомпрометирован, и чистка истории этого не отменит"
        correct: true
      - text: "Удалить коммит и сделать force push"
      - text: "Добавить файл в .gitignore"
      - text: "Сделать репозиторий приватным"
    explanation: |
      Ровно то же правило, что для секретов в git вообще. Чистка истории
      полезна, но она вторая по очереди — и она не возвращает контроль над
      ключом, который уже могли скопировать.

  - id: api-completeness-check
    kind: single
    prompt: |
      API отдаёт в ответе общее число записей. Как это использовать?
    options:
      - text: "Сверять с числом реально загруженных — дешёвая проверка, ловящая обрыв выгрузки на середине"
        correct: true
      - text: "Рассчитывать число страниц заранее и не читать курсор"
      - text: "Определять размер страницы"
      - text: "Никак: это справочная информация"
    explanation: |
      Выгрузка, оборвавшаяся на середине без ошибки, — самый неприятный случай:
      данные есть, они выглядят настоящими и неполны. Сверка количеств
      обнаруживает это сразу.

  - id: api-webhook-vs-polling
    kind: single
    prompt: |
      Чем вебхуки отличаются от опроса API и что они требуют?
    options:
      - text: "Данные приходят сразу, но нужен доступный извне приёмник, и обработчик обязан быть идемпотентным — доставка повторяется"
        correct: true
      - text: "Вебхуки надёжнее опроса во всех отношениях"
      - text: "Вебхуки не требуют аутентификации"
      - text: "Вебхуки гарантируют доставку ровно один раз"
    explanation: |
      Гарантия у вебхуков обычно at-least-once — то есть возможны повторы. Плюс
      пропущенное во время недоступности приёмника приходится добирать
      опросом, так что второй механизм всё равно нужен.
