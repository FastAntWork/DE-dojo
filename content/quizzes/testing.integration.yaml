questions:
  - id: it-what-unit-misses
    kind: multiple
    prompt: |
      Что модульные тесты не проверяют в принципе?
    options:
      - text: "Ошибки в SQL: неверное имя колонки, INNER вместо LEFT"
        correct: true
      - text: "Правильность миграций"
        correct: true
      - text: "Предположения о поведении базы: уникальные индексы, каскады, сравнение с NULL"
        correct: true
      - text: "Логику разбора строки в чистой функции"
    explanation: |
      Последнее — как раз работа модульного теста. Первые три живут на границе
      с чужой системой, и проект с идеальным покрытием может не работать ни
      одного дня, если SQL написан с ошибкой.

  - id: it-why-not-mock-db
    kind: single
    prompt: |
      Почему подмена базы заглушкой не заменяет интеграционный тест?
    options:
      - text: "Заглушка вернёт то, что в неё положили: тест проверит ваше представление о базе, а не поведение базы"
        correct: true
      - text: "Заглушки работают медленнее настоящей базы"
      - text: "Заглушки не поддерживают транзакции"
      - text: "Так требует pytest"
    explanation: |
      Ровно поэтому от таких тестов ускользают NOT IN со NULL, требования
      GROUP BY и прочие вещи, которые СУБД делает не так, как кажется автору.

  - id: it-what-to-mock
    kind: single
    prompt: |
      Что уместно заменять заглушкой в интеграционном тесте?
    options:
      - text: "То, чего у вас нет под контролем: платный внешний API, отправку писем, текущее время"
        correct: true
      - text: "Базу данных: она слишком медленная"
      - text: "Собственные функции соседнего модуля"
      - text: "Файловую систему"
    explanation: |
      Правило: границы, которые вы контролируете, тестируются по-настоящему.
      Заглушками закрывается то, что вам не принадлежит или стоит денег.

  - id: it-container-image
    kind: single
    prompt: |
      Почему для тестов берут тот же образ базы, что и в бою?
    options:
      - text: "Иначе не поймать зависимости вроде нужного расширения и различия в поведении между версиями"
        correct: true
      - text: "Другие образы не работают с testcontainers"
      - text: "Тот же образ быстрее скачивается"
      - text: "Это требование лицензии"
    explanation: |
      В этом проекте миграция требует pgvector: на голом postgres:16 тесты
      прошли бы, а выкатка упала. Совпадение мажорной версии тоже существенно —
      меняются и синтаксис, и планировщик.

  - id: it-fixture-scope
    kind: single
    prompt: |
      Какую область видимости выбрать фикстуре, поднимающей контейнер?
    options:
      - text: "module или session: старт стоит секунды, платить их на каждый тест бессмысленно"
        correct: true
      - text: "function: только так тесты будут независимы"
      - text: "class"
      - text: "Область не влияет на скорость"
    explanation: |
      Независимость обеспечивается не пересозданием контейнера, а сбросом
      состояния перед каждым тестом — это вдесятеро быстрее при той же
      гарантии.

  - id: it-isolation-schema-reset
    kind: single
    prompt: |
      Как дёшево вернуть базу в состояние «только что создана» перед каждым
      тестом?
    options:
      - text: "DROP SCHEMA public CASCADE и CREATE SCHEMA public, затем накатить миграции"
        correct: true
      - text: "Перезапустить контейнер"
      - text: "Удалить и создать базу целиком"
      - text: "Выполнить VACUUM FULL"
    explanation: |
      Именно так сделано в этом репозитории. Расширения тоже живут в public и
      пересоздаются миграцией, так что состояние получается действительно
      исходным.

  - id: it-isolation-transaction-limit
    kind: single
    prompt: |
      Изоляция через транзакцию с откатом — самая быстрая. В чём её
      ограничение?
    options:
      - text: "Она не годится, когда проверяемый код сам управляет транзакциями, — а в загрузках данных это обычное дело"
        correct: true
      - text: "Она не работает в PostgreSQL"
      - text: "Она требует отдельного соединения на каждый тест"
      - text: "Она не откатывает изменения схемы"
    explanation: |
      Код, делающий COMMIT внутри, разрывает объемлющую транзакцию, и откат
      уже ничего не вернёт. Тогда приходится переходить на сброс схемы.

  - id: it-isolation-truncate-risk
    kind: single
    prompt: |
      Чем рискованна изоляция через TRUNCATE перечисленных таблиц?
    options:
      - text: "Забытая новая таблица тихо ломает изоляцию: тесты начинают зависеть друг от друга без всякого сообщения"
        correct: true
      - text: "TRUNCATE не откатывается в PostgreSQL"
      - text: "TRUNCATE работает медленнее DELETE"
      - text: "TRUNCATE сбрасывает схему"
    explanation: |
      Список таблиц приходится поддерживать вручную, а забывают его при каждой
      новой миграции. Сброс схемы этого недостатка лишён.

  - id: it-separate-database
    kind: single
    prompt: |
      В каком случае оправдана отдельная база на каждый прогон, а не сброс
      схемы?
    options:
      - text: "Когда нужна полная независимость, включая права и расширения — например, для стенда лабы, который пользователь может испортить как угодно"
        correct: true
      - text: "Всегда: это самый быстрый способ"
      - text: "Когда тестов меньше десяти"
      - text: "Когда база работает не в контейнере"
    explanation: |
      В этом проекте так устроен стенд лабы: база пересоздаётся с нуля при
      каждом запуске варианта, потому что гарантировать исходное состояние
      после чужих действий можно только сборкой заново.

  - id: it-migrations-what-to-test
    kind: multiple
    prompt: |
      Что проверяют тесты миграций?
    options:
      - text: "Что все миграции накатываются на пустую базу по порядку"
        correct: true
      - text: "Что повторный прогон ничего не делает"
        correct: true
      - text: "Что уже применённая миграция не изменилась задним числом"
        correct: true
      - text: "Что данные в боевой базе не потеряются"
    explanation: |
      Последнее тестом не проверить — это вопрос ревью и резервных копий.
      Контрольные суммы применённых миграций ловят самый коварный случай:
      правку файла, который где-то уже накатан.

  - id: it-migrations-expected-from-disk
    kind: single
    prompt: |
      Почему список ожидаемых миграций в тесте лучше брать с диска, а не
      перечислять литералами?
    options:
      - text: "Иначе тест придётся править при каждой новой миграции — и однажды его поправят не глядя"
        correct: true
      - text: "Литералы работают медленнее"
      - text: "Список с диска точнее отражает порядок"
      - text: "Так требует pytest"
    explanation: |
      Тот же принцип, что с числом узлов графа: проверять надо утверждение
      («накатываются все, по порядку»), а не совпадение с записанным вчера
      числом.

  - id: it-migration-failure-timing
    kind: single
    prompt: |
      Когда обнаруживается ошибка в миграции, если её не проверяет тест?
    options:
      - text: "При выкатке на прод — то есть в наихудший момент"
        correct: true
      - text: "При следующем запуске приложения локально"
      - text: "При код-ревью"
      - text: "Она обнаруживается сама через логи"
    explanation: |
      Третьего не дано: либо тест за секунды, либо прод. Именно поэтому тест
      миграций обычно первый интеграционный тест, который пишут в проекте.

  - id: it-slow-tests-not-run
    kind: single
    prompt: |
      Чем плохи медленные интеграционные тесты?
    options:
      - text: "Их перестают запускать — а не запускаемый тест равен отсутствующему"
        correct: true
      - text: "Они потребляют много памяти"
      - text: "Они чаще дают ложные срабатывания"
      - text: "Ничем, если они запускаются в CI"
    explanation: |
      Даже в CI медленный набор вредит: обратная связь приходит поздно, и её
      перестают ждать перед слиянием.

  - id: it-parallel-tests
    kind: single
    prompt: |
      Интеграционные тесты запустили параллельно, и они начали падать
      случайным образом. Почему?
    options:
      - text: "Они работают с одной базой и мешают друг другу: при параллельном запуске каждому процессу нужна своя база или своя схема"
        correct: true
      - text: "Контейнер не выдерживает нескольких соединений"
      - text: "pytest не поддерживает параллельный запуск"
      - text: "Не хватает памяти раннеру"
    explanation: |
      Изоляция, работавшая последовательно, при параллелизме перестаёт
      работать: один тест сбрасывает схему, пока другой в ней работает.

  - id: it-marker-selection
    kind: single
    prompt: |
      Как совместить быструю обратную связь при разработке и полноту проверок?
    options:
      - text: "Пометить интеграционные тесты маркером: во время работы гонять быстрые, полный набор — перед отправкой и в CI"
        correct: true
      - text: "Отключить интеграционные тесты и запускать их вручную раз в неделю"
      - text: "Перенести все проверки в CI и не запускать локально"
      - text: "Сократить число интеграционных тестов до трёх"
    explanation: |
      В этом проекте так и сделано: маркер integration объявлен в конфигурации,
      и `pytest -m \"not integration\"` даёт быстрый прогон.

  - id: it-data-volume
    kind: single
    prompt: |
      Тест наполняет таблицу миллионом строк ради проверки одного условия.
      Что не так?
    options:
      - text: "Данных должно быть ровно столько, сколько нужно проверке: лишний объём превращается в минуты на каждом прогоне"
        correct: true
      - text: "Миллион строк не поместится в контейнер"
      - text: "Такой тест перестанет быть детерминированным"
      - text: "Ничего: чем больше данных, тем лучше проверка"
    explanation: |
      Исключение — когда проверяется именно поведение на объёме: в лабе этого
      проекта двести тысяч строк засеиваются намеренно, иначе планировщик
      выбрал бы другой план и проверка потеряла бы смысл.

  - id: it-levels-boundary
    kind: single
    prompt: |
      Ошибку можно поймать и модульным, и интеграционным тестом. Какой писать?
    options:
      - text: "Модульный: он быстрее и точнее указывает на причину; интеграционный расточителен там, где хватает модульного"
        correct: true
      - text: "Интеграционный: он ближе к реальности"
      - text: "Оба, для надёжности"
      - text: "Сквозной, он покрывает оба уровня"
    explanation: |
      Общее правило: чем ниже уровень, тем больше тестов. Дублирование одной
      проверки на двух уровнях — это двойная стоимость поддержки при той же
      пользе.

  - id: it-pipeline-proportion
    kind: single
    prompt: |
      Почему в проекте пайплайна данных интеграционных тестов честно больше,
      чем в обычном приложении?
    options:
      - text: "Логики в чистом виде мало, а взаимодействия с внешними системами много — именно там и живут ошибки"
        correct: true
      - text: "Потому что данные всегда грязные"
      - text: "Потому что модульные тесты для SQL писать нельзя"
      - text: "Потому что так принято в отрасли"
    explanation: |
      Пирамида тестов не догма, а следствие того, где сосредоточен риск. Для
      ETL он смещён к границам с базами и файлами.

  - id: it-idempotency-test
    kind: single
    prompt: |
      Какой интеграционный тест обязательно писать для загрузки данных?
    options:
      - text: "Что два прогона за один период дают тот же результат, что один"
        correct: true
      - text: "Что загрузка выполняется быстрее минуты"
      - text: "Что все колонки имеют комментарии"
      - text: "Что данные соответствуют третьей нормальной форме"
    explanation: |
      Неидемпотентность обнаруживается либо этим тестом, либо в проде после
      первого ретрая — и там уже в виде задвоенной выручки.

  - id: it-check-the-checks
    kind: single
    prompt: |
      Как убедиться, что проверка качества данных действительно работает?
    options:
      - text: "Намеренно испортить данные в тесте и убедиться, что проверка сработала: тихая проверка неотличима от сломанной"
        correct: true
      - text: "Посмотреть, что она не падает на правильных данных"
      - text: "Убедиться, что она есть в коде"
      - text: "Проверить, что она выполняется быстро"
    explanation: |
      Это тот же принцип, что «убедиться увидеть тест красным»: проверка,
      которая никогда не срабатывала, могла всё это время сравнивать пустое с
      пустым.

  - id: it-unavailable-dependency
    kind: single
    prompt: |
      Что стоит проверить интеграционным тестом про недоступную базу?
    options:
      - text: "Что приложение отвечает внятной ошибкой и остаётся управляемым, а не падает с трассировкой"
        correct: true
      - text: "Что оно переключается на резервную базу"
      - text: "Что оно повторяет запросы бесконечно"
      - text: "Ничего: недоступная база — не наш случай"
    explanation: |
      В этом проекте есть ровно такой тест: проба готовности краснеет, а
      проба живости остаётся зелёной — потому что перезапуск процесса
      недоступную базу не лечит.
