questions:
  - id: joins-left-becomes-inner
    kind: find-error
    prompt: |
      Задача: вывести всех клиентов и их заказы за 2024 год, включая клиентов
      без заказов. Клиенты без заказов в результат не попадают. Почему?

          SELECT c.id, o.total
          FROM customers c
          LEFT JOIN orders o ON o.customer_id = c.id
          WHERE o.created_at >= '2024-01-01';
    options:
      - text: "Условие на правую таблицу в WHERE отбрасывает строки с NULL и превращает LEFT JOIN в INNER"
        correct: true
      - text: "LEFT JOIN требует, чтобы обе таблицы были отсортированы по ключу соединения"
      - text: "Нужно писать RIGHT JOIN, потому что фильтр стоит по правой таблице"
      - text: "Сравнение даты со строкой неявно отбрасывает NULL-строки"
    explanation: |
      Для клиента без заказов LEFT JOIN подставляет NULL во все колонки orders.
      Дальше WHERE проверяет NULL >= '2024-01-01' → UNKNOWN → строка выбрасывается.
      Фильтр по «необязательной» стороне нужно переносить в ON:
      LEFT JOIN orders o ON o.customer_id = c.id AND o.created_at >= '2024-01-01'.

  - id: joins-not-in-null
    kind: single
    prompt: |
      В orders.customer_id есть NULL. Что вернёт запрос?

          SELECT * FROM customers
          WHERE id NOT IN (SELECT customer_id FROM orders);
    options:
      - text: "Пустой результат"
        correct: true
      - text: "Всех клиентов без заказов"
      - text: "Всех клиентов"
      - text: "Ошибку: подзапрос вернул NULL"
    explanation: |
      NOT IN разворачивается в id <> v1 AND id <> v2 AND ... AND id <> NULL.
      Последнее слагаемое — UNKNOWN, а AND с UNKNOWN никогда не даст TRUE.
      Результат всегда пуст. NOT EXISTS такой проблемы не имеет и обычно ещё и
      лучше планируется — поэтому anti-join пишут через него.

  - id: joins-many-to-many-explosion
    kind: single
    prompt: |
      У клиента 3 заказа и 4 обращения в поддержку. Сколько строк вернёт
      соединение customers → orders → tickets по customer_id для этого клиента?
    options:
      - text: "12"
        correct: true
      - text: "7"
      - text: "4"
      - text: "3"
    explanation: |
      Два независимых соединения «один-ко-многим» от одной таблицы дают
      декартово произведение веток: 3 × 4 = 12. Классическая причина, по которой
      SUM(orders.total) внезапно оказывается вчетверо больше правды. Лечится
      агрегацией каждой ветки отдельно до соединения или подзапросами.

  - id: joins-inner-loses-rows
    kind: single
    prompt: |
      После добавления соединения со справочником клиентов число заказов в
      витрине уменьшилось. Что проверить первым?
    options:
      - text: "Тип соединения: INNER JOIN отбрасывает заказы, для которых клиента не нашлось"
        correct: true
      - text: "Индексы на таблице клиентов"
      - text: "Порядок таблиц в FROM"
      - text: "Наличие ORDER BY"
    explanation: |
      Тихая потеря строк — вторая по частоте беда соединений после задвоения.
      Проверка «число строк до и после соединения» ловит оба случая и стоит
      одного запроса.

  - id: joins-right-join-usage
    kind: single
    prompt: |
      Почему RIGHT JOIN встречается редко?
    options:
      - text: "Он всегда переписывается в LEFT JOIN перестановкой таблиц, а читать запрос слева направо привычнее"
        correct: true
      - text: "Он медленнее LEFT JOIN"
      - text: "Он не поддерживается в PostgreSQL"
      - text: "Он не работает с более чем двумя таблицами"
    explanation: |
      Разница чисто стилистическая, но в цепочке из пяти соединений
      направление «сохраняем строки из того, что уже накопили» читается
      однозначно, а смесь LEFT и RIGHT — нет.

  - id: joins-full-outer-purpose
    kind: single
    prompt: |
      Для чего обычно нужен FULL OUTER JOIN?
    options:
      - text: "Для сверки двух наборов: увидеть и то, что есть только слева, и то, что только справа"
        correct: true
      - text: "Для ускорения соединения больших таблиц"
      - text: "Для соединения более двух таблиц одновременно"
      - text: "Для удаления дубликатов при соединении"
    explanation: |
      Типичный сценарий — сравнение источника и приёмника после загрузки:
      строки с NULL слева это потери, с NULL справа — лишнее.

  - id: joins-cross-join-accidental
    kind: find-error
    prompt: |
      ```sql
      SELECT o.id, c.name
      FROM orders o, customers c
      WHERE o.amount > 100
      ```
      Результат содержит миллионы лишних строк. Почему?
    options:
      - text: "Забыто условие связи между таблицами: запятая в FROM даёт декартово произведение"
        correct: true
      - text: "Условие amount > 100 применяется после соединения"
      - text: "Нужен DISTINCT"
      - text: "orders и customers нельзя соединять через запятую"
    explanation: |
      Именно поэтому явный синтаксис JOIN ... ON лучше запятой: пропущенное
      условие связи становится синтаксически заметным, а не превращается в
      тихое декартово произведение.

  - id: joins-self-join
    kind: single
    prompt: |
      Для чего применяют соединение таблицы с самой собой?
    options:
      - text: "Для сравнения строк одной таблицы между собой: иерархии, соседние периоды, поиск пар"
        correct: true
      - text: "Для ускорения агрегации"
      - text: "Для устранения дубликатов"
      - text: "Такое соединение не имеет смысла"
    explanation: |
      Для соседних периодов чаще выгоднее оконные функции (LAG/LEAD): они
      делают то же самое одним проходом, без второго чтения таблицы.

  - id: joins-key-not-unique
    kind: single
    prompt: |
      Соединение с справочником увеличило число строк втрое. Какова причина?
    options:
      - text: "В справочнике ключ соединения не уникален — на одну строку факта нашлось несколько соответствий"
        correct: true
      - text: "В таблице фактов есть дубликаты"
      - text: "Использован LEFT JOIN вместо INNER"
      - text: "Не хватает индекса по ключу"
    explanation: |
      Проверка uniqueness на ключе справочника ловит это до публикации.
      Дубликаты в справочнике часто появляются из-за SCD-истории, где забыли
      отфильтровать неактуальные версии строк.

  - id: joins-scd-current-filter
    kind: single
    prompt: |
      Измерение ведётся как SCD типа 2 (несколько версий строки с интервалами
      действия). Что нужно при соединении, чтобы не задвоить факты?
    options:
      - text: "Фильтр по актуальной версии или соединение по попаданию даты факта в интервал действия версии"
        correct: true
      - text: "DISTINCT в списке выбора"
      - text: "Использование LEFT JOIN вместо INNER"
      - text: "Группировка по ключу измерения"
    explanation: |
      Выбор между «текущая версия» и «версия на момент события» — это выбор
      бизнес-смысла: показывать регион клиента сегодня или регион на момент
      покупки. DISTINCT здесь замаскировал бы ошибку.

  - id: joins-order-does-not-matter
    kind: single
    prompt: |
      Влияет ли порядок таблиц в INNER JOIN на результат и на скорость?
    options:
      - text: "На результат не влияет, на скорость — обычно нет: планировщик сам выбирает порядок соединения по статистике"
        correct: true
      - text: "Влияет и на результат, и на скорость"
      - text: "Влияет на результат, но не на скорость"
      - text: "Порядок жёстко определяет план выполнения"
    explanation: |
      Для внешних соединений это уже неверно: LEFT JOIN не коммутативен, и
      порядок меняет смысл. Именно поэтому цепочки из LEFT JOIN требуют
      внимания к тому, что считается «левой» стороной.

  - id: joins-nested-loop-when
    kind: single
    prompt: |
      Когда Nested Loop — хороший выбор соединения?
    options:
      - text: "Когда одна сторона очень мала, а по второй есть индекс по ключу соединения"
        correct: true
      - text: "Когда обе таблицы велики и не отсортированы"
      - text: "Когда обе таблицы отсортированы по ключу"
      - text: "Всегда: это самый быстрый способ"
    explanation: |
      Для двух больших таблиц Nested Loop катастрофичен: он выполняет поиск
      для каждой строки внешней стороны. Там уместны Hash Join или Merge Join.

  - id: joins-hash-join-when
    kind: single
    prompt: |
      Когда планировщик выбирает Hash Join?
    options:
      - text: "Когда обе стороны велики, соединение по равенству, и меньшая сторона помещается в память под хеш-таблицу"
        correct: true
      - text: "Когда обе стороны отсортированы по ключу"
      - text: "Когда соединение идёт по неравенству"
      - text: "Когда одна из сторон содержит одну строку"
    explanation: |
      Ограничение по равенству существенно: Hash Join невозможен для условий
      вроде `a.x BETWEEN b.lo AND b.hi` — там остаётся Nested Loop или Merge.

  - id: joins-merge-join-when
    kind: single
    prompt: |
      Что характерно для Merge Join?
    options:
      - text: "Обе стороны должны быть отсортированы по ключу соединения; если сортировка уже есть — это дёшево, иначе за неё придётся платить"
        correct: true
      - text: "Требует, чтобы одна сторона помещалась в память"
      - text: "Работает только с одной строкой во внешней стороне"
      - text: "Применяется только к соединениям по неравенству"
    explanation: |
      Отсюда наблюдение: индекс по ключу соединения делает Merge Join дешевле,
      потому что данные уже приходят упорядоченными.

  - id: joins-anti-join
    kind: single
    prompt: |
      Как найти заказы, у которых нет ни одного платежа?
    options:
      - text: "LEFT JOIN payments и WHERE payments.id IS NULL, либо NOT EXISTS — оба выражают антисоединение"
        correct: true
      - text: "INNER JOIN payments с условием payments.id IS NULL"
      - text: "FULL OUTER JOIN с DISTINCT"
      - text: "CROSS JOIN с фильтром"
    explanation: |
      Приём с LEFT JOIN и проверкой на NULL — классический антисоединительный
      шаблон. NOT EXISTS обычно читается лучше и не страдает от NULL-семантики,
      в отличие от NOT IN.

  - id: joins-semi-join
    kind: single
    prompt: |
      Чем полусоединение (EXISTS) отличается от обычного соединения?
    options:
      - text: "Оно не размножает строки левой таблицы: достаточно факта существования хотя бы одного соответствия"
        correct: true
      - text: "Оно возвращает колонки обеих таблиц"
      - text: "Оно всегда медленнее обычного соединения"
      - text: "Оно работает только с подзапросами по первичному ключу"
    explanation: |
      Именно поэтому EXISTS часто правильный ответ там, где соединение
      задваивает: если из правой таблицы не нужны колонки, размножать строки
      незачем.

  - id: joins-using-vs-on
    kind: single
    prompt: |
      Что делает `JOIN customers USING (customer_id)`?
    options:
      - text: "Соединяет по одноимённой колонке и оставляет её в результате в единственном экземпляре"
        correct: true
      - text: "То же, что ON, но работает только для первичных ключей"
      - text: "Соединяет по всем одноимённым колонкам обеих таблиц"
      - text: "Создаёт декартово произведение с последующей фильтрацией"
    explanation: |
      Соединение по всем одноимённым колонкам — это NATURAL JOIN, и он опасен:
      добавление колонки с совпавшим именем молча меняет условие соединения.
      USING перечисляет колонки явно.

  - id: joins-natural-join-danger
    kind: single
    prompt: |
      Почему NATURAL JOIN не рекомендуют использовать?
    options:
      - text: "Условие соединения выводится из совпадающих имён колонок, поэтому добавление колонки в любую из таблиц молча меняет смысл запроса"
        correct: true
      - text: "Он медленнее обычного JOIN"
      - text: "Он не поддерживается PostgreSQL"
      - text: "Он всегда порождает декартово произведение"
    explanation: |
      Колонки вроде created_at или updated_at есть почти везде — и попадание
      такой пары в условие соединения даёт пустой результат, причём без
      всякого сообщения об ошибке.

  - id: joins-count-before-after
    kind: single
    prompt: |
      Какая проверка ловит и задвоение, и потерю строк при соединении?
    options:
      - text: "Сравнение числа строк до и после соединения с ожидаемым: при соединении «многие к одному» оно меняться не должно"
        correct: true
      - text: "Проверка на NULL в ключе соединения"
      - text: "Проверка типов колонок"
      - text: "Проверка наличия индексов"
    explanation: |
      Простейшая и самая полезная проверка в трансформациях. Рост означает
      неуникальный ключ справа, падение — INNER вместо LEFT или NULL в ключе.

  - id: joins-null-in-key
    kind: single
    prompt: |
      Что произойдёт со строками, у которых ключ соединения равен NULL, при
      INNER JOIN?
    options:
      - text: "Они выпадут: NULL не равен ничему, включая другой NULL"
        correct: true
      - text: "Они соединятся между собой, так как NULL = NULL"
      - text: "Они попадут в результат с NULL в колонках правой таблицы"
      - text: "Запрос завершится ошибкой"
    explanation: |
      Отсюда и перекос в распределённых системах, где все NULL летят в одну
      партицию, и тихая потеря строк в обычной базе. Ключ соединения — первый
      кандидат на ограничение NOT NULL.
