questions:
  - id: idem-definition
    kind: single
    prompt: |
      Какое определение идемпотентности пайплайна точнее?
    options:
      - text: "Повторный запуск с теми же параметрами оставляет систему в том же состоянии, что и один запуск"
        correct: true
      - text: "Задача всегда возвращает одно и то же значение"
        correct: false
      - text: "Задача никогда не запускается дважды"
      - text: "Задача выполняется в транзакции"
    explanation: |
      Важно именно СОСТОЯНИЕ системы, а не возвращаемое значение. Функция,
      дважды возвращающая одинаковый результат, но дважды дописывающая строки в
      таблицу, неидемпотентна.

  - id: idem-quick-check
    kind: single
    prompt: |
      Каким одним вопросом быстрее всего проверить задачу на идемпотентность?
    options:
      - text: "Что будет, если запустить её дважды подряд?"
        correct: true
      - text: "Сколько времени она выполняется?"
      - text: "Использует ли она транзакции?"
      - text: "Есть ли у неё ретраи?"
    explanation: |
      Если ответ «данные задвоятся» — задача неидемпотентна. И это не
      теоретическая опасность: дважды она будет запущена обязательно.

  - id: idem-why-twice
    kind: multiple
    prompt: |
      По каким причинам задача оказывается запущенной дважды? Выбери все
      реальные.
    options:
      - text: "Ретрай после сетевой ошибки"
        correct: true
      - text: "Ручной перезапуск после разбора инцидента"
        correct: true
      - text: "Backfill за прошлый период"
        correct: true
      - text: "Сбой ПОСЛЕ записи данных, но ДО фиксации статуса успеха"
        correct: true
    explanation: |
      Последний случай особенно поучителен: ошибки в коде нет вовсе. Задача
      записала данные и умерла до отметки, оркестратор считает её упавшей и
      запускает снова.

  - id: idem-delete-insert
    kind: single
    prompt: |
      Загрузку `INSERT INTO orders_daily ...` переписали на
      `DELETE WHERE day = ...; INSERT ...`. Чего не хватает?
    options:
      - text: "Обе операции должны идти в одной транзакции: падение между ними оставит витрину без периода"
        correct: true
      - text: "Ничего: этого достаточно"
      - text: "Нужно добавить ORDER BY во вставку"
      - text: "Нужно выполнять DELETE после INSERT"
    explanation: |
      Без транзакции появляется состояние хуже исходного: данные не задвоены, а
      попросту отсутствуют, и заметить это можно позже, чем задвоение.

  - id: idem-delete-boundaries
    kind: single
    prompt: |
      В идемпотентной загрузке `DELETE` ограничивают периодом. Откуда брать
      границы?
    options:
      - text: "Из контекста прогона: data_interval_start и data_interval_end"
        correct: true
      - text: "Из datetime.now() минус сутки"
      - text: "Из максимума даты в целевой таблице"
      - text: "Из переменной окружения, задаваемой при деплое"
    explanation: |
      now() ломает и повторный запуск, и backfill: прогон за 1 марта удалит и
      перезапишет данные за сегодня. Максимум по целевой таблице тоже не годится
      — при backfill он указывает не туда.

  - id: idem-insert-overwrite
    kind: single
    prompt: |
      Таблица секционирована по суткам, прогон обрабатывает ровно сутки. Какой
      способ идемпотентности лучший?
    options:
      - text: "Перезапись партиции целиком: операция атомарна, дешева и не оставляет мёртвых строк"
        correct: true
      - text: "DELETE + INSERT в транзакции"
      - text: "MERGE по всем колонкам"
      - text: "Проверка наличия данных перед вставкой"
    explanation: |
      Условие применимости — совпадение гранулярности партиций с гранулярностью
      прогона. Когда оно выполняется, подмена партиции выигрывает у
      delete-insert и по стоимости, и по надёжности.

  - id: idem-merge-needs-key
    kind: single
    prompt: |
      Что необходимо, чтобы сделать загрузку идемпотентной через MERGE/upsert?
    options:
      - text: "Естественный ключ строки, по которому можно однозначно опознать уже загруженную запись"
        correct: true
      - text: "Секционирование целевой таблицы"
      - text: "Отключённые ретраи"
      - text: "Колонка со временем загрузки"
    explanation: |
      Без ключа MERGE не к чему привязать «ту же самую строку». Именно эту роль
      играет unique_key в инкрементальной модели dbt.

  - id: idem-check-before-insert
    kind: single
    prompt: |
      Задача перед вставкой проверяет: «а нет ли уже данных за этот день?»
      Достаточно ли этого?
    options:
      - text: "Нет: между проверкой и вставкой другой процесс успевает записать — это гонка, лечится атомарной операцией, а не проверкой"
        correct: true
      - text: "Да, если проверка выполняется непосредственно перед вставкой"
      - text: "Да, если задача выполняется в одном потоке"
      - text: "Да, если у DAG стоит max_active_runs=1"
    explanation: |
      Классическая ошибка «проверить и сделать». Надёжны только атомарные
      конструкции: транзакция, подмена партиции, ограничение уникальности в
      базе, ON CONFLICT.

  - id: idem-retries-danger
    kind: single
    prompt: |
      Неидемпотентной задаче настроили `retries=3`. Чем это опасно?
    options:
      - text: "Разовый сетевой сбой превращается в четырёхкратно задвоенные данные, причём в логах прогон выглядит успешным"
        correct: true
      - text: "Ничем: ретраи всегда безопасны"
      - text: "Задача будет выполняться в четыре раза дольше"
      - text: "Airflow пометит DAG как нездоровый"
    explanation: |
      Последняя попытка ведь прошла — значит, статус зелёный. Правильный
      порядок: сначала сделать задачу идемпотентной, потом включать ретраи.

  - id: idem-timeout
    kind: single
    prompt: |
      Задачу оборвали по таймауту на середине записи. Что это значит для
      повторного запуска?
    options:
      - text: "Если запись не атомарна, повтор наложится на уже записанную половину"
        correct: true
      - text: "Ничего: прерванная задача не оставляет следов"
      - text: "Airflow сам откатит записанное"
      - text: "Повтор невозможен до ручной очистки"
    explanation: |
      Оркестратор не умеет откатывать чужие записи — транзакциями управляет
      база или формат хранения. Отсюда требование атомарности записи, а не
      только корректности логики.

  - id: idem-backfill-now
    kind: single
    prompt: |
      Backfill за март выдал одинаковые числа во всех днях. Наиболее вероятная
      причина?
    options:
      - text: "В логике используется datetime.now(), поэтому каждый прогон обработал сегодняшние данные"
        correct: true
      - text: "Слишком большой max_active_runs"
      - text: "Не хватило ретраев"
      - text: "Источник вернул пустой результат"
    explanation: |
      Самая частая причина мусорного backfill. Прогон за 1 марта обязан
      обрабатывать 1 марта, и взять эту дату можно только из контекста прогона.

  - id: idem-backfill-impossible
    kind: single
    prompt: |
      Источник — таблица, хранящая только ТЕКУЩЕЕ состояние клиентов, без
      истории. Заказчик просит пересчитать витрину за прошлый год. Что
      ответить?
    options:
      - text: "Честно пересчитать нельзя: данных того периода уже не существует. Это свойство источника, и его надо назвать, а не имитировать пересчёт"
        correct: true
      - text: "Пересчитать, взяв текущее состояние клиентов — это допустимое приближение"
      - text: "Пересчитать после включения depends_on_past"
      - text: "Пересчитать, увеличив max_active_runs"
    explanation: |
      Пересчёт по текущему состоянию даст цифры, которые выглядят настоящими и
      настоящими не являются. Правильный ответ — назвать ограничение, а на
      будущее завести снимки или SCD-историю.

  - id: idem-depends-on-past
    kind: single
    prompt: |
      Прогон за день читает результат предыдущего дня. Что нужно при backfill?
    options:
      - text: "Запретить параллельный прогон интервалов: depends_on_past и ограничение одновременных запусков"
        correct: true
      - text: "Наоборот, увеличить параллелизм, чтобы догнать быстрее"
      - text: "Отключить ретраи"
      - text: "Ничего: Airflow сам определит порядок по датам"
    explanation: |
      Зависимость от предыдущего интервала не выражается графом задач внутри
      одного прогона. Без явного запрета интервалы поедут параллельно и прочтут
      незаполненные данные.

  - id: idem-side-effects
    kind: single
    prompt: |
      Задача, помимо расчёта, отправляет письмо клиентам. Что произойдёт при
      backfill за год?
    options:
      - text: "Клиенты получат 365 писем; внешние эффекты должны быть отделены от расчёта"
        correct: true
      - text: "Ничего: Airflow подавляет внешние вызовы при backfill"
      - text: "Письма уйдут одно, за последний интервал"
      - text: "Задача упадёт на первом же интервале"
    explanation: |
      Никакого «режима backfill» у внешнего мира нет. Отправку уведомлений
      выносят в отдельную задачу или DAG, который при пересчёте истории не
      запускают.

  - id: idem-backfill-load
    kind: single
    prompt: |
      Что ограничивает нагрузку на хранилище при backfill за длинный период?
    options:
      - text: "Ограничение числа одновременных прогонов DAG и размер обрабатываемой порции"
        correct: true
      - text: "Число ретраев"
      - text: "Таймаут задачи"
      - text: "trigger_rule"
    explanation: |
      Сто интервалов, стартовавших разом, кладут хранилище — и вместе с ним всё
      остальное, что в него ходит. Backfill почти всегда надо пускать
      порционально.

  - id: idem-exactly-once
    kind: single
    prompt: |
      Как честно ответить на вопрос «как обеспечить exactly-once доставку»?
    options:
      - text: "В общем случае никак: выбирают at-least-once и делают приёмник идемпотентным, тогда дубликаты приходят, но не оставляют следа"
        correct: true
      - text: "Включить транзакции на стороне продюсера — этого достаточно"
      - text: "Использовать очередь с гарантией exactly-once, такие существуют"
      - text: "Отключить ретраи, тогда повторов не будет"
    explanation: |
      Между «записать» и «отметить, что записал» всегда есть промежуток для
      сбоя. Системы, обещающие exactly-once, обеспечивают не отсутствие
      повторов, а их безвредность. Отключение ретраев даёт at-most-once, то есть
      потерю данных.

  - id: idem-at-least-once
    kind: single
    prompt: |
      Что означает гарантия at-least-once?
    options:
      - text: "Сообщение будет доставлено хотя бы раз, но возможны дубликаты"
        correct: true
      - text: "Сообщение будет доставлено ровно один раз"
      - text: "Сообщение может быть потеряно, но не продублировано"
      - text: "Сообщение доставляется в порядке отправки"
    explanation: |
      Парная ей at-most-once не повторяет и потому теряет. Практика почти всегда
      выбирает at-least-once, потому что потерю данных исправить нельзя, а
      дубликаты — можно.

  - id: idem-dedup-mechanisms
    kind: multiple
    prompt: |
      Какие механизмы дедупликации на приёмнике реально работают?
    options:
      - text: "Естественный ключ и MERGE"
        correct: true
      - text: "Идентификатор события и ON CONFLICT DO NOTHING"
        correct: true
      - text: "Окно дедупликации по ключу и времени для потоков"
        correct: true
      - text: "Сравнение количества строк источника и приёмника после загрузки"
    explanation: |
      Последний пункт — это проверка постфактум, а не дедупликация: он способен
      обнаружить расхождение, но не предотвратить его и не сказать, какие именно
      строки лишние.

  - id: idem-file-partial-write
    kind: single
    prompt: |
      Задача пишет партицию напрямую в `s3://data/dt=2025-03-01/` и падает на
      середине. Чем это опасно?
    options:
      - text: "Останется частичный набор файлов, и читатель не отличит его от полного"
        correct: true
      - text: "Объектное хранилище откатит незавершённую запись"
      - text: "Файлы будут повреждены и не прочитаются вовсе"
      - text: "Ничем: следующий прогон перезапишет их"
    explanation: |
      Самое неприятное в этом сценарии — тишина. Данные читаются, выглядят
      настоящими и просто неполны. Лечится атомарной подменой, табличным
      форматом или хотя бы маркером _SUCCESS.

  - id: idem-success-marker
    kind: single
    prompt: |
      Насколько надёжен приём с файлом-маркером `_SUCCESS`?
    options:
      - text: "Слабо: маркер и данные не связаны транзакцией, но это лучше, чем ничего"
        correct: true
      - text: "Полностью надёжен: маркер гарантирует целостность партиции"
      - text: "Бесполезен, применять не стоит"
      - text: "Надёжен только в объектных хранилищах"
    explanation: |
      Между записью данных и записью маркера тоже есть промежуток. Приём старый
      и работает как соглашение, а не как гарантия. Табличные форматы решают ту
      же задачу настоящим атомарным коммитом.

  - id: idem-dbt-connection
    kind: single
    prompt: |
      Как идемпотентность связана с `unique_key` в инкрементальной модели dbt?
    options:
      - text: "unique_key включает MERGE вместо простой вставки и делает повторный прогон за уже обработанный период безопасным"
        correct: true
      - text: "unique_key ускоряет модель за счёт индекса"
      - text: "unique_key нужен только для тестов уникальности"
      - text: "Связи нет: dbt идемпотентен по устройству"
    explanation: |
      dbt идемпотентен для материализаций table и view, потому что они
      пересоздают объект целиком. Инкрементальная модель — исключение: она
      дописывает, и без ключа повтор задваивает.

  - id: idem-atomic-commit
    kind: single
    prompt: |
      Какая конструкция даёт самую сильную гарантию против «записал, но не
      отметил»?
    options:
      - text: "Запись результата и отметки о нём одним коммитом в одну транзакцию"
        correct: true
      - text: "Запись результата, затем отметка отдельным запросом сразу после"
      - text: "Отметка перед записью, чтобы точно не потерялась"
      - text: "Повторная проверка отметки через минуту после записи"
    explanation: |
      Всё остальное оставляет промежуток. Отметка перед записью даёт худший из
      вариантов: пропуск данных, который выглядит как успешная обработка.
