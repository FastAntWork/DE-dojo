questions:
  - id: ch-mergetree-insert
    kind: single
    prompt: |
      Что происходит при вставке данных в таблицу MergeTree?
    options:
      - text: "Создаётся новый кусок данных, отсортированный по ключу сортировки; существующие куски не меняются"
        correct: true
      - text: "Строки дописываются в конец существующего файла"
      - text: "Данные вставляются в нужное место согласно сортировке"
      - text: "Строки попадают в буфер и записываются раз в минуту"
    explanation: |
      Отсюда и название движка: куски потом сливаются в фоне. Именно поэтому
      вставка не блокирует чтение и работает быстро — она ничего не
      перестраивает.

  - id: ch-too-many-parts
    kind: single
    prompt: |
      Приложение вставляет строки по одной, и ClickHouse начал отвечать ошибкой
      `Too many parts`. Что происходит?
    options:
      - text: "Каждая вставка создаёт кусок, фоновое слияние не успевает, и число кусков вышло за предел"
        correct: true
      - text: "Закончилось место на диске"
      - text: "Превышено число одновременных соединений"
      - text: "Таблица требует ручного слияния через OPTIMIZE"
    explanation: |
      Лечится на стороне загрузки: пакеты по десятки тысяч строк, не чаще
      нескольких раз в секунду. OPTIMIZE вручную — лечение симптома, а не
      причины.

  - id: ch-order-by-role
    kind: single
    prompt: |
      Что задаёт `ORDER BY` в определении таблицы MergeTree?
    options:
      - text: "Физический порядок строк внутри куска — это раскладка данных, а не индекс в привычном смысле"
        correct: true
      - text: "Порядок вывода строк в результате запроса"
      - text: "Ключ уникальности строк"
      - text: "Порядок слияния кусков"
    explanation: |
      Именно поэтому его выбор — главное решение при проектировании таблицы:
      поменять раскладку потом означает переписать данные.

  - id: ch-sparse-index
    kind: single
    prompt: |
      Чем первичный индекс ClickHouse отличается от индекса PostgreSQL?
    options:
      - text: "Он разреженный: одна метка на ~8192 строки, поэтому крошечный и целиком в памяти, но даёт диапазон гранул, а не строку"
        correct: true
      - text: "Он хранит ссылку на каждую строку, как B-tree"
      - text: "Он строится только по одной колонке"
      - text: "Он обновляется вручную командой OPTIMIZE"
    explanation: |
      Из разреженности следует, что минимальная единица чтения — гранула в
      8192 строки. Точечный поиск одной строки поэтому дороже, чем в OLTP-базе.

  - id: ch-primary-key-uniqueness
    kind: single
    prompt: |
      Гарантирует ли `PRIMARY KEY` в ClickHouse уникальность строк?
    options:
      - text: "Нет: это префикс ключа сортировки, никаких ограничений уникальности он не обеспечивает"
        correct: true
      - text: "Да, как и в PostgreSQL"
      - text: "Да, но только внутри одного куска"
      - text: "Да, если движок ReplacingMergeTree"
    explanation: |
      Один из самых частых вопросов на собеседовании. Ограничений целостности в
      ClickHouse нет вовсе — ни уникальности, ни внешних ключей.

  - id: ch-order-by-column-order
    kind: single
    prompt: |
      Запросы почти всегда фильтруют по `tenant_id` и диапазону дат. Какой
      ORDER BY выбрать?
    options:
      - text: "(tenant_id, created_at): колонка равенства и меньшей кардинальности первой"
        correct: true
      - text: "(created_at, tenant_id)"
      - text: "(payload, tenant_id, created_at)"
      - text: "Порядок не важен, индекс разреженный"
    explanation: |
      Логика та же, что у составного индекса в PostgreSQL. Фильтр не по первой
      колонке ключа заставит прочитать почти всё.

  - id: ch-partition-vs-order
    kind: single
    prompt: |
      Чем `PARTITION BY` отличается от `ORDER BY`?
    options:
      - text: "PARTITION BY определяет, какие данные лежат отдельно; ORDER BY — в каком порядке они лежат внутри"
        correct: true
      - text: "Это два способа задать одно и то же"
      - text: "PARTITION BY задаёт порядок, а ORDER BY — распределение по дискам"
      - text: "PARTITION BY нужен только для реплицированных таблиц"
    explanation: |
      Формулировку стоит запомнить дословно: путаница между этими двумя
      ключами — источник и плохой производительности, и невозможности удалять
      старые данные.

  - id: ch-partition-granularity
    kind: single
    prompt: |
      По чему обычно партиционируют таблицу событий в ClickHouse?
    options:
      - text: "По месяцу: toYYYYMM(created_at)"
        correct: true
      - text: "По идентификатору пользователя"
      - text: "По часу"
      - text: "По типу события"
    explanation: |
      Партиционирование по дню при долгой истории даёт слишком много кусков, а
      по колонке высокой кардинальности — катастрофу с числом партиций.

  - id: ch-drop-partition
    kind: single
    prompt: |
      Как в ClickHouse дёшево удалить данные за старый месяц?
    options:
      - text: "ALTER TABLE ... DROP PARTITION — операция над метаданными, мгновенная"
        correct: true
      - text: "DELETE WHERE created_at < ..."
      - text: "TRUNCATE с условием"
      - text: "OPTIMIZE TABLE FINAL"
    explanation: |
      DELETE в ClickHouse — это мутация, переписывающая куски целиком. Для
      применения политики хранения используют именно удаление партиции.

  - id: ch-mutations
    kind: single
    prompt: |
      Что такое `ALTER TABLE ... UPDATE` в ClickHouse?
    options:
      - text: "Мутация: асинхронная операция, переписывающая целые куски данных — дорогая и не мгновенная"
        correct: true
      - text: "Обычный UPDATE с другим синтаксисом"
      - text: "Изменение схемы таблицы"
      - text: "Пометка строк как устаревших без физического изменения"
    explanation: |
      Модель ClickHouse — «данные пишутся один раз». Если обновления частые,
      выбран не тот инструмент: сама форма записи через ALTER намекает, что это
      не рядовая операция.

  - id: ch-no-transactions
    kind: single
    prompt: |
      Какие транзакционные гарантии даёт ClickHouse?
    options:
      - text: "Вставка атомарна в пределах одного пакета в одну таблицу; многошаговых транзакций с откатом нет"
        correct: true
      - text: "Полный ACID, как в PostgreSQL"
      - text: "Никаких: вставка может записаться частично"
      - text: "Транзакции есть, но только на уровне партиции"
    explanation: |
      Это надо учитывать при проектировании загрузки: согласованность между
      несколькими таблицами обеспечивается на стороне пайплайна, а не базой.

  - id: ch-joins-weak
    kind: single
    prompt: |
      Почему в ClickHouse избегают соединения двух больших таблиц?
    options:
      - text: "Правая таблица соединения по умолчанию помещается в память целиком: на больших объёмах это упирается в лимит памяти"
        correct: true
      - text: "ClickHouse не поддерживает JOIN"
      - text: "Соединения не используют ключ сортировки"
      - text: "JOIN требует ручного указания порядка таблиц"
    explanation: |
      Отсюда практика: данные денормализуют заранее, а справочники подключают
      словарями, которые держатся в памяти и подставляются функцией.

  - id: ch-dictionaries
    kind: single
    prompt: |
      Зачем в ClickHouse словари (dictionaries)?
    options:
      - text: "Держать справочники в памяти и подставлять значения функцией — это дешевле соединения"
        correct: true
      - text: "Сжимать строковые колонки"
      - text: "Хранить схему таблиц"
      - text: "Кешировать результаты запросов"
    explanation: |
      Сжатие строковых колонок с малым числом значений — это
      LowCardinality, другой механизм. Словари решают именно задачу
      обогащения без соединения.

  - id: ch-lowcardinality
    kind: single
    prompt: |
      Для какой колонки уместен тип `LowCardinality(String)`?
    options:
      - text: "Статус или код региона — десятки различных значений на миллиарды строк"
        correct: true
      - text: "Идентификатор пользователя"
      - text: "Текст сообщения об ошибке"
      - text: "UUID запроса"
    explanation: |
      Это словарное кодирование: значения заменяются номерами. На колонке с
      высокой кардинальностью словарь получится больше самих данных, и выигрыша
      не будет.

  - id: ch-nullable-cost
    kind: single
    prompt: |
      Почему не стоит объявлять колонки `Nullable` без необходимости?
    options:
      - text: "Nullable добавляет отдельную колонку с признаками пропуска — это лишний объём и лишнее чтение"
        correct: true
      - text: "Nullable запрещён в ключе сортировки"
      - text: "Nullable отключает сжатие"
      - text: "Nullable мешает слиянию кусков"
    explanation: |
      Мелочь, дающая заметную экономию на широких таблицах в миллиарды строк —
      как и точные размеры числовых типов вместо Int64 везде.

  - id: ch-mat-view-trigger
    kind: single
    prompt: |
      Что представляет собой материализованное представление в ClickHouse?
    options:
      - text: "Триггер на вставку: при записи в исходную таблицу оно считает выражение от вставляемого пакета и кладёт результат в целевую таблицу"
        correct: true
      - text: "Кешированный результат запроса, обновляемый по расписанию"
      - text: "Обычное представление с сохранением плана"
      - text: "Копию исходной таблицы с другим ключом сортировки"
    explanation: |
      Отличие от PostgreSQL принципиальное: там материализованное
      представление обновляется командой REFRESH, здесь оно срабатывает на
      каждой вставке.

  - id: ch-mat-view-history
    kind: single
    prompt: |
      Материализованное представление создали над таблицей, где уже есть год
      данных. Что попадёт в целевую таблицу?
    options:
      - text: "Только данные, вставленные ПОСЛЕ создания: историю надо заполнять отдельно"
        correct: true
      - text: "Все данные исходной таблицы будут пересчитаны автоматически"
      - text: "Данные за последний месяц"
      - text: "Ничего, пока не выполнить REFRESH"
    explanation: |
      Частая причина «в витрине нет старых данных». Историю досыпают обычным
      INSERT SELECT в целевую таблицу.

  - id: ch-mat-view-partial-aggregates
    kind: single
    prompt: |
      Материализованное представление считает `count() GROUP BY day`. Почему в
      целевой таблице несколько строк на один день?
    options:
      - text: "Оно считает от каждого вставляемого пакета отдельно, поэтому в целевой таблице лежат частичные агрегаты — их надо досуммировать при чтении"
        correct: true
      - text: "Ошибка в определении представления"
      - text: "Не выполнено слияние кусков"
      - text: "Разные строки относятся к разным партициям"
    explanation: |
      Отсюда SummingMergeTree или AggregatingMergeTree для целевой таблицы — и
      всё равно sum() с GROUP BY в самом запросе. Забыть об этом — типичная
      ошибка: цифры выглядят почти правильными.

  - id: ch-replacing-not-unique
    kind: single
    prompt: |
      ReplacingMergeTree оставляет одну строку на ключ сортировки. Гарантирует
      ли обычный SELECT отсутствие дублей?
    options:
      - text: "Нет: схлопывание происходит ПРИ СЛИЯНИИ, которое асинхронно; до него в таблице лежат обе версии"
        correct: true
      - text: "Да, движок обеспечивает уникальность при чтении"
      - text: "Да, если в таблице одна партиция"
      - text: "Да, начиная с последних версий ClickHouse"
    explanation: |
      Гарантию даёт модификатор FINAL (дорогой) или агрегация в самом запросе.
      Формулировка «ReplacingMergeTree обеспечивает уникальность» неверна, и
      это любят проверять.

  - id: ch-summing-mergetree
    kind: single
    prompt: |
      Что делает SummingMergeTree?
    options:
      - text: "При слиянии складывает числовые колонки строк с одинаковым ключом сортировки"
        correct: true
      - text: "Считает сумму при каждом запросе автоматически"
      - text: "Хранит только суммы, отбрасывая исходные строки при вставке"
      - text: "Суммирует значения между партициями"
    explanation: |
      Та же оговорка, что у ReplacingMergeTree: «при слиянии». В запросе всё
      равно нужен sum() с группировкой, иначе можно увидеть несхлопнутые
      строки.

  - id: ch-aggregating-mergetree
    kind: single
    prompt: |
      Зачем AggregatingMergeTree, если есть SummingMergeTree?
    options:
      - text: "Он хранит промежуточные состояния агрегатов (uniqState, sumState), поэтому позволяет считать, например, уникальных за произвольный период из предагрегированных данных"
        correct: true
      - text: "Он работает быстрее при суммировании"
      - text: "Он поддерживает больше типов данных"
      - text: "Он не требует ключа сортировки"
    explanation: |
      Уникальных нельзя складывать: сумма уникальных за два дня не равна
      уникальным за два дня. Состояния агрегатов решают ровно эту проблему.

  - id: ch-when-not-clickhouse
    kind: single
    prompt: |
      Для какой задачи ClickHouse — неподходящий выбор?
    options:
      - text: "Оперативная обработка транзакций с частыми точечными обновлениями и требованием целостности"
        correct: true
      - text: "Агрегация миллиардов событий по нескольким колонкам"
      - text: "Хранение логов и метрик"
      - text: "Аналитика по кликам и телеметрии"
    explanation: |
      Уметь назвать, где инструмент НЕ подходит, ценится не меньше знания его
      сильных сторон: нет транзакций, нет ограничений целостности, обновления
      дорогие.

  - id: ch-system-tables
    kind: single
    prompt: |
      Где посмотреть, сколько кусков в партициях и какие запросы были
      медленными?
    options:
      - text: "В системных таблицах: system.parts и system.query_log, доступных обычным SQL"
        correct: true
      - text: "В логах сервера на диске"
      - text: "В отдельном веб-интерфейсе мониторинга"
      - text: "Через команду SHOW STATUS"
    explanation: |
      Системные таблицы — сильная сторона ClickHouse: почти всё о состоянии
      сервера доступно запросом, включая историю запросов с потреблением памяти
      и числом прочитанных строк.

  - id: ch-memory-limit
    kind: single
    prompt: |
      Запрос падает с `Memory limit exceeded`. Наиболее вероятные причины?
    options:
      - text: "Соединение с большой правой таблицей или GROUP BY по колонке очень высокой кардинальности"
        correct: true
      - text: "Слишком много кусков в партиции"
      - text: "Отсутствие ключа партиционирования"
      - text: "Неверный тип колонки"
    explanation: |
      Обе причины сводятся к тому, что промежуточная структура не помещается в
      память. Лечится сужением выборки, приближёнными функциями вроде uniqCombined
      или переносом соединения в словарь.
