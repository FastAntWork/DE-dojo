questions:
  - id: plans-estimate-vs-actual
    kind: single
    prompt: |
      В плане видно:
      `Seq Scan on events  (cost=0.00..18334.00 rows=100 width=42)
       (actual time=0.02..842.11 rows=1200000 loops=1)`
      О чём в первую очередь говорит это расхождение?
    options:
      - text: "Статистика устарела или условие сложное для оценки: планировщик ждал 100 строк, а получил 1.2 млн, и выбрал план под неверное предположение"
        correct: true
      - text: "Запросу не хватило work_mem"
      - text: "Индекс повреждён и его нужно переиндексировать"
      - text: "Это нормально: cost и actual измеряются в разных единицах, сравнивать их нельзя"
    explanation: |
      Единицы у cost и actual time действительно разные, но rows у оценки и факта
      сравнимы напрямую — и именно это расхождение решающее. Ошибка в оценке на
      четыре порядка означает, что все решения выше по плану (тип соединения,
      порядок) приняты неправильно. Первое действие — ANALYZE, дальше смотреть на
      статистику по колонке и на коррелированные предикаты.
    source: "postgres-docs:using-explain.html"

  - id: plans-seq-scan-not-always-bad
    kind: single
    prompt: |
      Когда Seq Scan по таблице предпочтительнее Index Scan?
    options:
      - text: "Когда запрос отбирает заметную долю таблицы: случайный доступ по индексу дороже последовательного чтения всех страниц"
        correct: true
      - text: "Никогда: Index Scan всегда быстрее, если индекс существует"
      - text: "Только если таблица не проанализирована"
      - text: "Только на таблицах без первичного ключа"
    explanation: |
      Index Scan читает строки в случайном порядке через обращения к heap. Начиная
      с некоторой доли выборки (обычно единицы-десятки процентов) последовательное
      чтение выигрывает. Поэтому «добавить индекс» — не универсальный ответ, а
      гипотеза, которую проверяют планом.

  - id: plans-join-strategies
    kind: single
    prompt: |
      Соединяются таблица на 10 строк и таблица на 10 млн строк по
      проиндексированному ключу. Какой способ соединения ожидаем?
    options:
      - text: "Nested Loop с Index Scan по большой таблице"
        correct: true
      - text: "Hash Join с построением хеша по большой таблице"
      - text: "Merge Join с предварительной сортировкой обеих таблиц"
      - text: "Любой из трёх с одинаковой стоимостью"
    explanation: |
      Nested Loop выгоден, когда внешняя сторона мала, а по внутренней есть индекс:
      10 обращений по индексу дешевле, чем хеширование или сортировка миллионов
      строк. Hash Join выигрывает на сопоставимых объёмах без индекса, Merge Join —
      когда обе стороны уже отсортированы по ключу соединения.

  - id: plans-explain-vs-analyze
    kind: single
    prompt: |
      Чем `EXPLAIN` отличается от `EXPLAIN ANALYZE`?
    options:
      - text: "EXPLAIN показывает предполагаемый план, EXPLAIN ANALYZE ВЫПОЛНЯЕТ запрос и добавляет фактические времена и число строк"
        correct: true
      - text: "EXPLAIN ANALYZE обновляет статистику таблицы"
      - text: "Разница только в формате вывода"
      - text: "EXPLAIN ANALYZE работает только на SELECT"
    explanation: |
      Из этого следует важное предупреждение: EXPLAIN ANALYZE на UPDATE или
      DELETE действительно изменит данные. Чтобы посмотреть план без
      последствий, такой запрос оборачивают в транзакцию с откатом.

  - id: plans-read-direction
    kind: single
    prompt: |
      В каком порядке читается план запроса PostgreSQL?
    options:
      - text: "Снизу вверх и изнутри наружу: самые вложенные узлы выполняются первыми"
        correct: true
      - text: "Сверху вниз, как читается текст"
      - text: "Слева направо по строкам"
      - text: "Порядок узлов не связан с порядком выполнения"
    explanation: |
      Верхний узел — это то, что отдаётся клиенту. Разбор всегда начинают с
      самых глубоких узлов: там читаются таблицы, и там обычно находится
      причина.

  - id: plans-cost-units
    kind: single
    prompt: |
      Что означает `cost=0.00..18334.00` в узле плана?
    options:
      - text: "Оценку стоимости в условных единицах: до первой строки и до последней; сравнивать её можно только с другими планами того же сервера"
        correct: true
      - text: "Время выполнения в миллисекундах"
      - text: "Число прочитанных страниц"
      - text: "Объём памяти в килобайтах"
    explanation: |
      Единицы условны и калибруются параметрами вроде seq_page_cost. Сравнивать
      cost с actual time бессмысленно — а вот rows у оценки и факта сравнимы
      напрямую, и это главный диагностический признак.

  - id: plans-buffers-meaning
    kind: single
    prompt: |
      Что показывает `Buffers: shared hit=2559 read=120`?
    options:
      - text: "Сколько страниц по 8 КБ запрос взял из кеша и сколько прочитал с диска — прямая мера проделанной работы"
        correct: true
      - text: "Сколько строк обработано"
      - text: "Сколько памяти заняла сортировка"
      - text: "Сколько соединений открыл запрос"
    explanation: |
      Буферы полезнее времени: они не зависят от нагрузки на сервер и от того,
      прогрет ли кеш. Два запуска одного запроса дадут разное время, но
      одинаковое число буферов.

  - id: plans-rows-removed-by-filter
    kind: single
    prompt: |
      В плане `rows=510`, но `Rows Removed by Filter: 20102`. О чём это
      говорит?
    options:
      - text: "Способ доступа неселективен: прочитано двадцать тысяч строк ради пятисот — вероятно, индекс не по тем колонкам"
        correct: true
      - text: "В запросе есть ошибка в условии"
      - text: "Не хватает work_mem"
      - text: "Это нормальный показатель для любого фильтра"
    explanation: |
      Строка Rows Removed by Filter — один из самых полезных индикаторов в
      плане. Большое значение означает, что данные читаются и тут же
      выбрасываются, то есть работа делается впустую.

  - id: plans-index-only-scan
    kind: single
    prompt: |
      Что такое Index Only Scan и при каком условии он возможен?
    options:
      - text: "Чтение только из индекса без обращения к таблице; возможно, когда все нужные колонки есть в индексе и карта видимости говорит, что страницы видны всем — её заполняет VACUUM"
        correct: true
      - text: "Чтение индекса вместо таблицы, доступное всегда при наличии индекса"
      - text: "Сканирование индекса без использования условия"
      - text: "Чтение таблицы в порядке индекса"
    explanation: |
      Про роль VACUUM спрашивают особенно часто: без него в плане будет
      Heap Fetches с большим числом, и выигрыш исчезнет. Колонки для покрытия
      добавляют через INCLUDE.

  - id: plans-bitmap-scan
    kind: single
    prompt: |
      Когда PostgreSQL выбирает Bitmap Heap Scan вместо обычного Index Scan?
    options:
      - text: "Когда строк много: он сначала собирает битовую карту нужных страниц, а затем читает их по порядку, превращая случайный доступ в последовательный"
        correct: true
      - text: "Когда индекс повреждён"
      - text: "Когда таблица меньше страницы"
      - text: "Когда в запросе нет условия WHERE"
    explanation: |
      Промежуточный вариант между точечным Index Scan и полным Seq Scan.
      Появление битовой карты в плане — признак того, что выборка средней
      селективности.

  - id: plans-analyze-fixes-estimate
    kind: single
    prompt: |
      Оценка в плане расходится с фактом в тысячу раз. Первое действие?
    options:
      - text: "Выполнить ANALYZE: скорее всего, статистика устарела, и все решения выше по плану приняты по неверному предположению"
        correct: true
      - text: "Добавить индекс"
      - text: "Увеличить work_mem"
      - text: "Переписать запрос"
    explanation: |
      Ошибка в оценке на порядки означает, что и тип соединения, и порядок
      таблиц выбраны неправильно. Чинить надо причину — статистику, — а не
      следствие.

  - id: plans-correlated-columns
    kind: single
    prompt: |
      Условие `WHERE city = 'Москва' AND region = 'Московская область'`
      оценивается сильно неточно. Почему и что делать?
    options:
      - text: "Планировщик считает колонки независимыми и перемножает селективности; помогает расширенная статистика CREATE STATISTICS по этим колонкам"
        correct: true
      - text: "Нужен составной индекс — этого достаточно"
      - text: "Нужно увеличить default_statistics_target до максимума"
      - text: "Нужно переписать условие через IN"
    explanation: |
      Классический случай коррелированных предикатов: город почти однозначно
      определяет регион, а планировщик считает совпадение обоих условий
      маловероятным и недооценивает число строк.

  - id: plans-work-mem-spill
    kind: single
    prompt: |
      В плане `Sort Method: external merge  Disk: 240MB`. Что это значит?
    options:
      - text: "Сортировка не поместилась в work_mem и ушла на диск; увеличение work_mem или уменьшение объёма сортировки ускорит запрос"
        correct: true
      - text: "Данные отсортированы с использованием индекса"
      - text: "Запрос использовал параллельную сортировку"
      - text: "Результат сохранён во временную таблицу"
    explanation: |
      Слово external в методе сортировки — прямое указание на разлив.
      Осторожно с work_mem: он выделяется на каждую операцию сортировки в
      каждом соединении, поэтому глобальное увеличение опасно.

  - id: plans-limit-changes-plan
    kind: single
    prompt: |
      Почему добавление `LIMIT 10` может полностью изменить план запроса?
    options:
      - text: "Планировщик оптимизирует стоимость получения первых строк, а не всех: становится выгоден Index Scan, отдающий строки по порядку без полной сортировки"
        correct: true
      - text: "LIMIT отключает использование индексов"
      - text: "LIMIT применяется до соединений"
      - text: "План не меняется, LIMIT лишь обрезает результат"
    explanation: |
      Обратная сторона: если планировщик ошибся в оценке селективности, запрос
      с LIMIT может искать нужные строки бесконечно, перебирая индекс. Это
      частая причина «запрос без LIMIT быстрее, чем с ним».

  - id: plans-cte-inlining
    kind: single
    prompt: |
      В PostgreSQL 12+ CTE, использованный один раз, обычно:
    options:
      - text: "Встраивается в основной запрос, и условия могут быть протолкнуты внутрь него"
        correct: true
      - text: "Всегда материализуется, как в старых версиях"
      - text: "Вычисляется повторно при каждом обращении"
      - text: "Преобразуется во временную таблицу"
    explanation: |
      До версии 12 CTE был безусловным барьером оптимизации — этим свойством
      даже пользовались, чтобы «зафиксировать» план. Сейчас для такого
      поведения есть явное MATERIALIZED.

  - id: plans-loops-multiplier
    kind: single
    prompt: |
      В узле плана `(actual time=0.02..0.05 rows=3 loops=15000)`. Как понять
      реальную стоимость узла?
    options:
      - text: "Умножить на число циклов: время и строки показаны В СРЕДНЕМ на один цикл, то есть суммарно это 45 000 строк"
        correct: true
      - text: "Значения уже суммарные, умножать не нужно"
      - text: "Число циклов не влияет на стоимость"
      - text: "Нужно разделить время на число циклов"
    explanation: |
      Ловушка, из-за которой дорогой узел выглядит дешёвым. Nested Loop с
      пятнадцатью тысячами повторов и «0.05 мс» на самом деле стоит секунды.

  - id: plans-parallel-workers
    kind: single
    prompt: |
      В плане `Workers Planned: 2`, а в фактическом выполнении
      `Workers Launched: 0`. Что произошло?
    options:
      - text: "Параллельных воркеров не хватило: они ограничены глобально, и при занятости сервера запрос выполняется последовательно"
        correct: true
      - text: "Параллелизм отключён для этого типа запроса"
      - text: "Воркеры завершились с ошибкой"
      - text: "Это нормально: воркеры не запускаются для SELECT"
    explanation: |
      Отсюда плавающее время выполнения одного и того же запроса: под нагрузкой
      он теряет параллелизм и идёт втрое дольше. Ограничение задаётся
      max_parallel_workers и max_parallel_workers_per_gather.

  - id: plans-index-not-used-function
    kind: find-error
    prompt: |
      ```sql
      -- есть индекс по created_at
      SELECT * FROM events WHERE date(created_at) = '2025-03-01'
      ```
      Индекс не используется. Почему?
    options:
      - text: "Функция применена к колонке, поэтому обычный индекс по ней неприменим; нужно переписать условие диапазоном или создать индекс по выражению"
        correct: true
      - text: "Индекс по timestamptz не поддерживает сравнение с датой"
      - text: "Нужно добавить ORDER BY created_at"
      - text: "Требуется ANALYZE"
    explanation: |
      Правило: колонка в условии должна стоять «голой». Переписывается это как
      `created_at >= '2025-03-01' AND created_at < '2025-03-02'` — такой
      диапазон индекс использует.

  - id: plans-explain-buffers-why
    kind: single
    prompt: |
      Почему при разборе медленного запроса просят именно
      `EXPLAIN (ANALYZE, BUFFERS)`, а не просто EXPLAIN?
    options:
      - text: "Только фактические значения и буферы показывают, СКОЛЬКО работы реально сделано; оценка может быть далека от истины"
        correct: true
      - text: "BUFFERS ускоряет выполнение запроса"
      - text: "Без BUFFERS не отображается тип соединения"
      - text: "EXPLAIN без ANALYZE не показывает индексы"
    explanation: |
      Расхождение оценки и факта — главный диагностический признак, а получить
      его можно только выполнив запрос. Буферы добавляют меру работы, не
      зависящую от нагрузки на сервер.

  - id: plans-fix-not-always-index
    kind: single
    prompt: |
      План показывает Seq Scan по таблице в 200 000 строк, запрос возвращает
      180 000 из них. Стоит ли добавлять индекс?
    options:
      - text: "Нет: при такой доле выборки последовательное чтение дешевле, планировщик прав — искать надо, зачем запросу столько строк"
        correct: true
      - text: "Да, индекс всегда ускоряет фильтрацию"
      - text: "Да, но только покрывающий"
      - text: "Да, и дополнительно выполнить ANALYZE"
    explanation: |
      «Добавить индекс» — гипотеза, а не диагноз. Когда запрос честно читает
      90% таблицы, ускорять надо не доступ, а сам запрос: возможно, лишние
      строки отсекаются уже в приложении.
