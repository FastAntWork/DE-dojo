questions:
  - id: plans-estimate-vs-actual
    kind: single
    prompt: |
      В плане видно:
      `Seq Scan on events  (cost=0.00..18334.00 rows=100 width=42)
       (actual time=0.02..842.11 rows=1200000 loops=1)`
      О чём в первую очередь говорит это расхождение?
    options:
      - text: "Статистика устарела или условие сложное для оценки: планировщик ждал 100 строк, а получил 1.2 млн, и выбрал план под неверное предположение"
        correct: true
      - text: "Запросу не хватило work_mem"
      - text: "Индекс повреждён и его нужно переиндексировать"
      - text: "Это нормально: cost и actual измеряются в разных единицах, сравнивать их нельзя"
    explanation: |
      Единицы у cost и actual time действительно разные, но rows у оценки и факта
      сравнимы напрямую — и именно это расхождение решающее. Ошибка в оценке на
      четыре порядка означает, что все решения выше по плану (тип соединения,
      порядок) приняты неправильно. Первое действие — ANALYZE, дальше смотреть на
      статистику по колонке и на коррелированные предикаты.
    source: "postgres-docs:using-explain.html"

  - id: plans-seq-scan-not-always-bad
    kind: single
    prompt: |
      Когда Seq Scan по таблице предпочтительнее Index Scan?
    options:
      - text: "Когда запрос отбирает заметную долю таблицы: случайный доступ по индексу дороже последовательного чтения всех страниц"
        correct: true
      - text: "Никогда: Index Scan всегда быстрее, если индекс существует"
      - text: "Только если таблица не проанализирована"
      - text: "Только на таблицах без первичного ключа"
    explanation: |
      Index Scan читает строки в случайном порядке через обращения к heap. Начиная
      с некоторой доли выборки (обычно единицы-десятки процентов) последовательное
      чтение выигрывает. Поэтому «добавить индекс» — не универсальный ответ, а
      гипотеза, которую проверяют планом.

  - id: plans-join-strategies
    kind: single
    prompt: |
      Соединяются таблица на 10 строк и таблица на 10 млн строк по
      проиндексированному ключу. Какой способ соединения ожидаем?
    options:
      - text: "Nested Loop с Index Scan по большой таблице"
        correct: true
      - text: "Hash Join с построением хеша по большой таблице"
      - text: "Merge Join с предварительной сортировкой обеих таблиц"
      - text: "Любой из трёх с одинаковой стоимостью"
    explanation: |
      Nested Loop выгоден, когда внешняя сторона мала, а по внутренней есть индекс:
      10 обращений по индексу дешевле, чем хеширование или сортировка миллионов
      строк. Hash Join выигрывает на сопоставимых объёмах без индекса, Merge Join —
      когда обе стороны уже отсортированы по ключу соединения.
