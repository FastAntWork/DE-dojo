questions:
  - id: airflow-role
    kind: single
    prompt: |
      Как правильнее всего описать роль Airflow?
    options:
      - text: "Оркестратор: запускает задачи в нужном порядке в нужное время и следит за результатом, а обработку отдаёт туда, где есть ресурсы"
        correct: true
      - text: "Движок распределённой обработки данных, аналог Spark"
      - text: "Хранилище данных с расписанием обновления витрин"
      - text: "Инструмент трансформации SQL, аналог dbt"
    explanation: |
      Формулировка для собеседования: Airflow дирижёр, а не оркестр. Если
      задача сама читает гигабайты в память воркера, оркестратор превращается в
      место обработки данных и падает от нагрузки, для которой не предназначен.

  - id: airflow-top-level-code
    kind: find-error
    prompt: |
      ```python
      import pandas as pd

      conn = create_engine(DSN)
      df = pd.read_sql("SELECT * FROM huge_table", conn)

      @dag(schedule="@daily", start_date=...)
      def my_dag():
          @task
          def process():
              return df.groupby("city").size()
      ```
      Что здесь главная ошибка?
    options:
      - text: "Чтение таблицы на верхнем уровне модуля: файл DAG разбирается планировщиком много раз в минуту, и запрос выполняется при каждом разборе"
        correct: true
      - text: "Отсутствует catchup=False"
      - text: "pandas нельзя использовать в Airflow"
      - text: "Функция process ничего не записывает"
    explanation: |
      Парсер исполняет файл целиком, чтобы получить объект графа, — и делает это
      постоянно. Всё тяжёлое (импорты, запросы, обращения к API) должно жить
      внутри функций задач. Это самая частая причина жалоб «Airflow тормозит».

  - id: airflow-parse-vs-run
    kind: single
    prompt: |
      Что делает парсер DAG с файлом из каталога dags?
    options:
      - text: "Исполняет его как обычный Python, чтобы получить объект графа; задачи при этом не запускаются"
        correct: true
      - text: "Читает его как конфигурацию, не исполняя код"
      - text: "Запускает все задачи, описанные в файле"
      - text: "Компилирует его в SQL"
    explanation: |
      Отсюда и вытекает правило про верхний уровень модуля: код исполняется, а
      значит, всё написанное вне функций работает на каждом разборе.

  - id: airflow-logical-date
    kind: single
    prompt: |
      DAG с расписанием `@daily` отвечает за сутки 1 марта. Когда он
      фактически стартует и почему?
    options:
      - text: "После окончания интервала, то есть 2 марта: раньше данных за 1 марта попросту не существует"
        correct: true
      - text: "В начале 1 марта, чтобы обработать данные по мере поступления"
      - text: "В середине 1 марта"
      - text: "Момент запуска не связан с интервалом и задаётся отдельно"
    explanation: |
      Это не задержка и не ошибка конфигурации, а следствие смысла интервала.
      Путаница между логической датой и фактическим временем запуска — самый
      частый источник ошибок в этой теме.

  - id: airflow-now-vs-context
    kind: single
    prompt: |
      Задача считает витрину за день и берёт дату через `datetime.now().date()`.
      Чем это плохо?
    options:
      - text: "Повторный запуск за прошлый день обработает сегодняшние данные, а backfill станет бессмысленным"
        correct: true
      - text: "datetime.now() работает медленно"
      - text: "Ничем: now() и логическая дата всегда совпадают"
      - text: "Airflow запрещает импорт datetime в задачах"
    explanation: |
      Границы обрабатываемого периода надо брать из контекста прогона
      (logical_date, data_interval_start/end). Только тогда прогон за прошлое
      число обработает именно прошлое число.

  - id: airflow-catchup
    kind: single
    prompt: |
      DAG создан сегодня, `start_date` указан год назад, `catchup=True`,
      расписание `@daily`. Что произойдёт?
    options:
      - text: "Airflow попытается выполнить все пропущенные интервалы — около 365 прогонов подряд"
        correct: true
      - text: "Запустится только один прогон за сегодня"
      - text: "DAG не запустится, пока не наступит новая дата"
      - text: "Airflow выдаст ошибку конфигурации"
    explanation: |
      Ровно так свежепоставленный Airflow ложится в первый же день. Поэтому в
      проектах по умолчанию ставят catchup=False и запускают историю осознанно,
      контролируя параллелизм.

  - id: airflow-max-active-runs
    kind: single
    prompt: |
      Зачем ставить `max_active_runs=1`?
    options:
      - text: "Чтобы прогоны одного DAG не шли внахлёст — это важно, когда они пишут в одну таблицу"
        correct: true
      - text: "Чтобы ограничить число задач внутри одного прогона"
      - text: "Чтобы уменьшить потребление памяти планировщиком"
      - text: "Чтобы задачи выполнялись строго по одной"
    explanation: |
      Ограничение именно на число ОДНОВРЕМЕННЫХ прогонов DAG. Особенно нужно при
      backfill: иначе десяток исторических прогонов одновременно пишет в одну
      целевую таблицу.

  - id: airflow-xcom-purpose
    kind: single
    prompt: |
      Для чего предназначен XCom?
    options:
      - text: "Для обмена небольшими значениями между задачами — путями, идентификаторами, счётчиками — через базу метаданных"
        correct: true
      - text: "Для передачи датафреймов между задачами"
      - text: "Для кеширования результатов задач на диске воркера"
      - text: "Для хранения секретов подключения"
    explanation: |
      Всё, что уходит в XCom, сериализуется и складывается в служебную базу.
      Датафрейм там — это раздутая метабаза и медленный интерфейс.

  - id: airflow-pass-data
    kind: single
    prompt: |
      Задача A формирует 4 ГБ данных, задача B их обрабатывает. Как передать?
    options:
      - text: "A записывает результат в объектное хранилище или таблицу и возвращает ПУТЬ; B читает по пути"
        correct: true
      - text: "Через XCom, предварительно сжав данные"
      - text: "Через глобальную переменную модуля"
      - text: "Через файл в /tmp воркера"
    explanation: |
      Задачи выполняются в разных процессах, а часто и на разных машинах: ни
      общей памяти, ни общего /tmp у них нет. Передавать надо ссылку, а не
      содержимое.

  - id: airflow-global-state
    kind: single
    prompt: |
      Почему нельзя накапливать состояние в глобальной переменной модуля между
      задачами?
    options:
      - text: "Задачи выполняются в разных процессах и часто на разных машинах — каждая видит свою копию модуля"
        correct: true
      - text: "Airflow очищает глобальные переменные после каждой задачи"
      - text: "Глобальные переменные попадают в XCom и раздувают метабазу"
      - text: "Это допустимо, если исполнитель Local"
    explanation: |
      Даже с LocalExecutor задача обычно запускается отдельным процессом.
      Каждая задача обязана быть самодостаточной: получить вход, отработать,
      сохранить результат.

  - id: airflow-sensor-slot
    kind: single
    prompt: |
      Десять сенсоров ждут появления файлов по шесть часов. Пул забит,
      остальные задачи стоят. В чём дело и как чинить?
    options:
      - text: "Сенсор в обычном режиме занимает слот воркера всё время ожидания; помогает mode='reschedule' или отложенные операторы"
        correct: true
      - text: "Сенсоры несовместимы с пулами, их надо вынести в отдельный DAG"
      - text: "Надо увеличить retry_delay у сенсоров"
      - text: "Сенсоры надо заменить на BashOperator с sleep"
    explanation: |
      В режиме reschedule сенсор освобождает слот между проверками, а
      отложенные (deferrable) операторы уходят в триггерер и не занимают воркер
      вовсе.

  - id: airflow-upstream-failed
    kind: single
    prompt: |
      Задача в состоянии `upstream_failed`. Где искать причину?
    options:
      - text: "Выше по графу: сама задача не запускалась, её логов не существует"
        correct: true
      - text: "В логах этой задачи"
      - text: "В логах планировщика"
      - text: "В настройках пула"
    explanation: |
      Состояние означает «зависимость упала, поэтому я даже не стартовала».
      Открывать её логи бессмысленно — их нет.

  - id: airflow-queued-long
    kind: single
    prompt: |
      Задача висит в состоянии `queued` полчаса. Что проверять?
    options:
      - text: "Ресурсы исполнения: свободные слоты, лимиты пула, parallelism, живость воркеров — дело не в самой задаче"
        correct: true
      - text: "Логи задачи: скорее всего, она зациклилась"
      - text: "Расписание DAG"
      - text: "Число ретраев"
    explanation: |
      queued означает «поставлена в очередь, но никто не взял». Причина всегда
      в исполнении: не хватает слотов, упёрлись в лимит параллелизма или воркеры
      не работают.

  - id: airflow-trigger-rule
    kind: single
    prompt: |
      Нужна задача оповещения, срабатывающая независимо от того, упали
      предыдущие задачи или нет. Что задать?
    options:
      - text: "trigger_rule='all_done' — выполняться, когда все предки завершились в любом состоянии"
        correct: true
      - text: "trigger_rule='all_success' — значение по умолчанию и так подходит"
      - text: "retries=0"
      - text: "depends_on_past=True"
    explanation: |
      По умолчанию действует all_success, и при падении предка задача уйдёт в
      upstream_failed — то есть оповещение не придёт именно тогда, когда оно
      нужнее всего.

  - id: airflow-dag-id-rename
    kind: single
    prompt: |
      Что произойдёт, если переименовать `task_id` существующей задачи?
    options:
      - text: "История запусков останется у старого идентификатора, а задача появится как новая сущность без истории"
        correct: true
      - text: "История автоматически перенесётся на новое имя"
      - text: "DAG перестанет разбираться до перезапуска планировщика"
      - text: "Ничего не изменится: имена задач нигде не хранятся"
    explanation: |
      dag_id и task_id — ключи, по которым в базе метаданных живут состояния,
      логи и статистика. Переименование эквивалентно созданию новой задачи.

  - id: airflow-retries
    kind: single
    prompt: |
      Задача обращается к внешнему API, который изредка отвечает 503. Что
      настроить в первую очередь?
    options:
      - text: "retries с retry_delay: сетевая ошибка часто проходит сама, и повтор дешевле ручного вмешательства"
        correct: true
      - text: "trigger_rule='one_failed'"
      - text: "max_active_runs=1"
      - text: "Отключить catchup"
    explanation: |
      Важная оговорка: повторять безопасно только идемпотентную задачу. Если
      повтор дописывает строки заново, ретраи превратят разовый сбой в
      задвоенные данные.

  - id: airflow-secrets
    kind: single
    prompt: |
      Где хранить пароль к базе, к которой ходит задача?
    options:
      - text: "В Connections Airflow, а лучше во внешнем хранилище секретов, подключённом бэкендом"
        correct: true
      - text: "В коде DAG рядом с задачей — так нагляднее"
      - text: "В XCom, чтобы задачи могли им обмениваться"
      - text: "В имени задачи"
    explanation: |
      Код DAG лежит в git и виден всем, у кого есть доступ к репозиторию, а
      также отображается в интерфейсе. XCom хранится в метабазе открытым
      текстом и попадает в логи.

  - id: airflow-task-granularity
    kind: single
    prompt: |
      Одна задача выполняется час и делает всё: выгрузку, преобразование,
      загрузку. Чем это плохо?
    options:
      - text: "Падение на последнем шаге означает повтор всего часа; дробить стоит по границам, где результат уже сохранён"
        correct: true
      - text: "Airflow ограничивает время выполнения задачи 15 минутами"
      - text: "Длинные задачи нельзя ретраить"
      - text: "Ничем: чем меньше задач, тем меньше накладных расходов"
    explanation: |
      Гранулярность задач — это в первую очередь вопрос стоимости повтора.
      Разумная граница там, где промежуточный результат уже лежит в хранилище и
      следующий шаг может начать с него.

  - id: airflow-data-driven-schedule
    kind: single
    prompt: |
      DAG B должен запускаться после того, как DAG A обновил таблицу. Какой
      способ надёжнее?
    options:
      - text: "Расписание по данным: B срабатывает на обновление объявленного набора данных, который производит A"
        correct: true
      - text: "Поставить B на час позже A по cron и понадеяться, что A успеет"
      - text: "Запускать B каждые пять минут и проверять таблицу самому"
      - text: "Объединить A и B в один DAG на 10 часов работы"
    explanation: |
      Конструкция «поставим на час позже» ломается ровно в тот день, когда A
      отработает дольше обычного. Расписание по данным (Dataset/Asset) выражает
      настоящую зависимость, а не догадку о времени.

  - id: airflow-executor
    kind: single
    prompt: |
      За что отвечает исполнитель (Executor)?
    options:
      - text: "За то, где и как физически запускаются задачи: локально, на воркерах Celery или в подах Kubernetes"
        correct: true
      - text: "За разбор файлов DAG"
      - text: "За определение того, какие интервалы пора запускать"
      - text: "За хранение логов задач"
    explanation: |
      Разбор файлов делает парсер, решение о запуске интервалов — планировщик.
      Исполнитель забирает задачи из очереди и обеспечивает их выполнение.

  - id: airflow-operator-vs-instance
    kind: single
    prompt: |
      Чем task instance отличается от task?
    options:
      - text: "Task — задача в описании DAG; task instance — эта задача в конкретном прогоне, именно у него есть состояние и логи"
        correct: true
      - text: "Это одно и то же, разница только в терминологии интерфейса"
      - text: "Task instance — это оператор, а task — его параметры"
      - text: "Task instance существует только у сенсоров"
    explanation: |
      Различение важно на практике: «задача упала» всегда означает конкретный
      экземпляр за конкретный интервал, и перезапускать надо именно его.

  - id: airflow-processing-in-worker
    kind: single
    prompt: |
      Задача читает 50 млн строк в pandas на воркере Airflow и агрегирует их.
      Что предложить?
    options:
      - text: "Отдать агрегацию туда, где лежат данные: выполнить её запросом в хранилище или джобой Spark, а задаче оставить запуск и контроль"
        correct: true
      - text: "Увеличить память воркеров и оставить как есть"
      - text: "Разбить чтение на чанки по 1 млн строк в той же задаче"
      - text: "Перенести обработку в XCom"
    explanation: |
      Увеличение памяти лечит симптом до следующего роста данных. Правильный
      ответ на собеседовании — вернуть Airflow роль оркестратора, а вычисления
      отдать хранилищу или движку обработки.
