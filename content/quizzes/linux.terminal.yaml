questions:
  - id: linux-pipe-idea
    kind: single
    prompt: |
      На чём основана возможность соединять команды конвейером?
    options:
      - text: "Все команды читают из стандартного ввода и пишут в стандартный вывод, поэтому вывод одной можно подать на вход другой"
        correct: true
      - text: "На общем формате данных, принятом в Linux"
      - text: "На временных файлах, которые создаёт оболочка"
      - text: "На специальной поддержке в каждой команде"
    explanation: |
      Единый интерфейс из трёх потоков и есть то, что делает набор мелких
      программ пригодным для сборки конвейеров под конкретную задачу.

  - id: linux-redirect-order
    kind: single
    prompt: |
      Чем `command > out.txt 2>&1` отличается от `command 2>&1 > out.txt`?
    options:
      - text: "В первом случае оба потока идут в файл; во втором ошибки уходят на экран, потому что 2>&1 сработало до перенаправления вывода"
        correct: true
      - text: "Разницы нет, порядок не важен"
      - text: "Во втором случае файл будет перезаписан дважды"
      - text: "Второй вариант вызовет ошибку синтаксиса"
    explanation: |
      `2>&1` означает «направить ошибки туда же, куда сейчас направлен вывод».
      Порядок поэтому решает всё — классический вопрос с подвохом.

  - id: linux-grep-invert
    kind: single
    prompt: |
      Что делает `grep -v DEBUG app.log`?
    options:
      - text: "Выводит все строки, КРОМЕ содержащих DEBUG"
        correct: true
      - text: "Выводит строки с DEBUG подробно"
      - text: "Ищет без учёта регистра"
      - text: "Выводит номера строк с DEBUG"
    explanation: |
      Один из самых полезных флагов при разборе логов: отсеять шум, а не искать
      известное. Регистр — это -i, номера строк — -n.

  - id: linux-grep-context
    kind: single
    prompt: |
      Нужно увидеть, что происходило вокруг каждой ошибки. Какой флаг grep?
    options:
      - text: "-A и -B (или -C): строки после и до совпадения"
        correct: true
      - text: "-c: контекст совпадения"
      - text: "-r: рекурсивный поиск"
      - text: "-o: только совпавшая часть"
    explanation: |
      Ошибка без контекста обычно ничего не объясняет: причина видна в строках
      до неё, а последствия — в строках после. -c это количество, а не контекст.

  - id: linux-big-file
    kind: single
    prompt: |
      Как посмотреть содержимое лога на 20 ГБ?
    options:
      - text: "less, head, tail или grep — они читают файл по частям, не загружая целиком"
        correct: true
      - text: "cat в редактор"
      - text: "Скачать на локальную машину и открыть текстовым редактором"
      - text: "Разбить файл на части командой split"
    explanation: |
      Редактор попытается прочитать файл в память и положит машину. `tail -f`
      к тому же показывает дописываемые строки в реальном времени — основной
      способ смотреть, что происходит прямо сейчас.

  - id: linux-zcat
    kind: single
    prompt: |
      Логи заархивированы в .gz. Как найти в них ошибки, не распаковывая?
    options:
      - text: "zcat archive.log.gz | grep ERROR — распаковка идёт на лету в память"
        correct: true
      - text: "grep умеет читать .gz напрямую без дополнительных команд"
      - text: "Никак: сначала обязательно gunzip"
      - text: "tar -x с фильтром по образцу"
    explanation: |
      Есть и готовый zgrep. Важно, что распакованный файл на диск не пишется —
      при 20 ГБ архивов это разница между «сработало» и «кончилось место».

  - id: linux-sort-uniq
    kind: single
    prompt: |
      Почему `uniq -c` почти всегда пишут после `sort`?
    options:
      - text: "uniq схлопывает только СОСЕДНИЕ одинаковые строки, поэтому без сортировки посчитает неверно"
        correct: true
      - text: "sort ускоряет работу uniq"
      - text: "uniq не умеет считать без предварительной сортировки"
      - text: "Это просто традиция"
    explanation: |
      Конвейер `sort | uniq -c | sort -rn | head` стоит запомнить целиком: он
      отвечает на вопрос «что встречается чаще всего» и решает половину задач
      разбора логов.

  - id: linux-awk-sum
    kind: single
    prompt: |
      Что делает `awk '{sum += $2} END {print sum}' data.txt`?
    options:
      - text: "Складывает значения второй колонки по всем строкам и печатает итог"
        correct: true
      - text: "Печатает вторую колонку каждой строки"
      - text: "Считает число строк, где вторая колонка не пуста"
      - text: "Сортирует файл по второй колонке"
    explanation: |
      Блок END выполняется после обработки всех строк — этим awk и удобен для
      быстрых агрегатов прямо в терминале, без выгрузки в базу.

  - id: linux-df-du-mismatch
    kind: single
    prompt: |
      `df` показывает 100% занятого места, а `du` не находит крупных файлов.
      В чём чаще всего дело?
    options:
      - text: "Файл удалён, но процесс держит его открытым: место не освобождается, пока процесс жив"
        correct: true
      - text: "du считает только текущий каталог, надо запустить от корня"
      - text: "Файловая система повреждена"
      - text: "df показывает неверные данные из-за кеша"
    explanation: |
      Ищется через `lsof | grep deleted`. Лечится перезапуском процесса, а не
      удалением файлов — удалять уже нечего.

  - id: linux-permissions-read
    kind: single
    prompt: |
      Что означают права `-rw-r--r--`?
    options:
      - text: "Обычный файл: владелец читает и пишет, группа и остальные только читают"
        correct: true
      - text: "Каталог с полным доступом для владельца"
      - text: "Файл, доступный на запись всем"
      - text: "Исполняемый файл для владельца"
    explanation: |
      Первый символ — тип: дефис для обычного файла, d для каталога. Дальше три
      группы по три символа: владелец, группа, остальные.

  - id: linux-dir-execute-bit
    kind: single
    prompt: |
      Что означает право `x` на КАТАЛОГЕ?
    options:
      - text: "Возможность войти внутрь и обратиться к файлу по имени; без него каталог не открыть, даже зная имя файла"
        correct: true
      - text: "Возможность запускать файлы внутри каталога"
      - text: "Возможность создавать файлы"
      - text: "Ничего: для каталогов бит x не используется"
    explanation: |
      Частая причина загадочного «нет доступа»: права на сам файл верные, а на
      промежуточный каталог нет x. Создание файлов — это w.

  - id: linux-chmod-777
    kind: single
    prompt: |
      Скрипт не может прочитать файл, и коллега советует `chmod 777`. Что не
      так?
    options:
      - text: "Это не починка, а выдача всем прав на всё; настоящая причина обычно в отсутствии x на каталоге или в неверном владельце"
        correct: true
      - text: "Ничего: 777 — стандартное решение проблем доступа"
      - text: "777 слишком мало прав, нужно 755"
      - text: "chmod не действует на файлы данных"
    explanation: |
      Права 777 на файле с данными означают, что его может переписать любой
      процесс на машине. На собеседовании такой ответ читается однозначно.

  - id: linux-kill-vs-kill9
    kind: single
    prompt: |
      Чем `kill <pid>` отличается от `kill -9 <pid>`?
    options:
      - text: "Обычный kill посылает сигнал, который программа может перехватить и корректно закрыть файлы и соединения; -9 не перехватывается вовсе"
        correct: true
      - text: "kill -9 работает быстрее"
      - text: "kill останавливает процесс, -9 перезапускает"
      - text: "Разницы нет"
    explanation: |
      Начинают всегда с обычного kill. `-9` для процесса, пишущего в базу или
      файл, означает недописанные данные и незакрытые транзакции.

  - id: linux-load-average
    kind: single
    prompt: |
      load average равен 4.0. Это много?
    options:
      - text: "Зависит от числа ядер: на четырёхъядерной машине это полная загрузка, на одноядерной — четырёхкратная перегрузка"
        correct: true
      - text: "Да, значение больше 1 всегда означает перегрузку"
      - text: "Нет, критичным считается значение выше 100"
      - text: "Это процент загрузки процессора, то есть 4%"
    explanation: |
      Load average — среднее число процессов в очереди, а не проценты.
      Сравнивать его нужно с числом ядер, иначе цифра ничего не значит.

  - id: linux-iowait
    kind: single
    prompt: |
      В top высокий `wa` (iowait) при низком проценте процессора. О чём это
      говорит?
    options:
      - text: "Система ждёт диск: узкое место в вводе-выводе, а не в вычислениях"
        correct: true
      - text: "Не хватает оперативной памяти"
      - text: "Процессор перегружен"
      - text: "Проблема в сети"
    explanation: |
      Практический вывод для пайплайна: добавление ядер не поможет. Смотреть
      надо на диск, объём читаемых данных и, возможно, на своп.

  - id: linux-find-port
    kind: single
    prompt: |
      Сервис не стартует: порт занят. Как найти, кем?
    options:
      - text: "ss -ltnp | grep <порт> или lsof -i :<порт>"
        correct: true
      - text: "ps aux | grep <порт>"
      - text: "netstat без параметров"
      - text: "df -h"
    explanation: |
      Ровно эта задача возникает, когда одновременно работают два docker-демона
      и оба пытаются занять 5432. Номер порта в командной строке процесса
      обычно не виден, поэтому ps не поможет.

  - id: linux-export
    kind: single
    prompt: |
      В скрипте объявили `API_URL=http://x`, но запускаемая программа её не
      видит. Почему?
    options:
      - text: "Без export переменная остаётся в текущей оболочке и не передаётся дочерним процессам"
        correct: true
      - text: "Нужны кавычки вокруг значения"
      - text: "Имя переменной должно быть в нижнем регистре"
      - text: "Переменные окружения задаются только в файле конфигурации"
    explanation: |
      Разница между переменной оболочки и переменной окружения — постоянный
      источник загадок в скриптах загрузки.

  - id: linux-path
    kind: single
    prompt: |
      Программа установлена, но выдаётся «command not found». Что проверить?
    options:
      - text: "PATH: каталога с программой нет в списке поиска команд. Проверяется через command -v или which"
        correct: true
      - text: "Права 777 на файл программы"
      - text: "Свободное место на диске"
      - text: "Переменную HOME"
    explanation: |
      Та же ошибка возникает в git-хуках и cron: у них PATH урезан по
      сравнению с интерактивной оболочкой, и работавшая в терминале команда
      внезапно не находится.

  - id: linux-set-euo
    kind: multiple
    prompt: |
      Что дают флаги в `set -euo pipefail`?
    options:
      - text: "-e прерывает скрипт при первой же ошибке команды"
        correct: true
      - text: "-u делает ошибкой обращение к необъявленной переменной"
        correct: true
      - text: "-o pipefail считает конвейер упавшим, если упало любое звено, а не только последнее"
        correct: true
      - text: "-e включает подробный вывод выполняемых команд"
    explanation: |
      Подробный вывод — это -x. Без -e скрипт продолжит после падения команды, и
      загрузка «успешно» завершится на пустых данных: худший из возможных
      исходов, потому что он тихий.

  - id: linux-quotes-variables
    kind: find-error
    prompt: |
      ```bash
      DIR=/data/my reports
      rm -rf $DIR/*
      ```
      Чем это опасно?
    options:
      - text: "Без кавычек путь с пробелом разъедется на два аргумента, а при пустом DIR команда превратится в удаление от корня"
        correct: true
      - text: "rm -rf не работает с переменными"
      - text: "Нужно указать полный путь к rm"
      - text: "Ничем: оболочка подставит значение корректно"
    explanation: |
      Отсюда два правила: всегда кавычки вокруг переменных и всегда `set -u`,
      чтобы пустая переменная роняла скрипт, а не удаляла файловую систему.

  - id: linux-tmux
    kind: single
    prompt: |
      Загрузка данных идёт три часа по ssh. Как не потерять её при обрыве
      связи?
    options:
      - text: "Запускать внутри tmux или screen — сессия переживает разрыв соединения"
        correct: true
      - text: "Увеличить таймаут ssh"
      - text: "Запускать с sudo"
      - text: "Перенаправить вывод в файл"
    explanation: |
      Перенаправление вывода сохранит логи, но сам процесс всё равно получит
      сигнал при обрыве. Вариант попроще — nohup, но tmux даёт ещё и
      возможность вернуться и посмотреть, что происходит.
