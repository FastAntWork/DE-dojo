[project]
name = "de-dojo"
version = "0.0.0"
description = "Локальный тренажёр хард-скиллов Data Engineer"
requires-python = ">=3.12,<3.13"

# Корень зависит от своих же пакетов намеренно. Без этого обычный `uv sync`
# ставит только зависимости корня, скрипт `dojo` в окружение не попадает, и
# `uv run dojo` падает с «program not found» — работает лишь длинная форма
# `uv run --package dojo-cli dojo`. Требовать её от человека при каждом
# запуске нельзя, поэтому членство в workspace объявлено явной зависимостью.
dependencies = ["dojo", "dojo-cli"]

[tool.uv]
package = false

[tool.uv.sources]
dojo = { workspace = true }
dojo-cli = { workspace = true }

[tool.uv.workspace]
members = ["apps/api", "apps/cli", "apps/runner"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    # asyncpg поставляется без py.typed, а mypy strict с disallow_any_unimported
    # превращает любой Connection в Any и роняет проверку.
    "asyncpg-stubs>=0.29",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "testcontainers[postgres,redis]>=4.8",
    # starlette.testclient с некоторых пор требует именно httpx2 и ругается
    # StarletteDeprecationWarning на обычный httpx.
    "httpx2>=0.28",
    "types-PyYAML>=6.0",
    "types-psutil>=6.0",
    "types-jsonschema>=4.23",
    "pre-commit>=3.8",
]

# ─────────────────────────────────────────────────────────────────────────────
# ruff — линтер и форматтер. Конфиг общий на весь монорепо.
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "apps/cli/src", "apps/runner/src", "tools", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # shadowing builtins
    "C4",        # comprehensions
    "DTZ",       # naive datetime — в проекте с расписаниями это источник багов
    "T20",       # print вне CLI
    "SIM",       # упрощения
    "PTH",       # pathlib вместо os.path
    "RUF",
    "ASYNC",     # блокирующие вызовы в async-коде
    "S",         # bandit
]
ignore = [
    "S101",      # assert — нормально в тестах
    "B008",      # Depends() в дефолтах аргументов — идиома FastAPI
    # RUF001-003 ищут кириллические буквы, похожие на латинские. Правило
    # защищает от омоглифов в ASCII-проектах; здесь вся документация и
    # сообщения об ошибках по-русски, поэтому оно даёт только шум.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**"          = ["S", "T20"]
"tools/**"          = ["T20"]
"apps/cli/**"       = ["T20"]   # CLI обязан печатать
"content/katas/**"  = ["ALL"]   # это учебный материал, а не код проекта

[tool.ruff.lint.isort]
known-first-party = ["dojo", "dojo_cli", "runner", "tools"]

[tool.ruff.format]
docstring-code-format = true

# ─────────────────────────────────────────────────────────────────────────────
# mypy — strict. Пользователь будет читать этот код как эталон.
# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
show_error_codes = true
pretty = true
mypy_path = ["apps/api/src", "apps/cli/src", "apps/runner/src"]
files = ["apps", "tests", "tools"]
exclude = "^content/katas/"

[[tool.mypy.overrides]]
# Учебные решения ката не обязаны проходить strict — они пишутся пользователем.
module = "content.katas.*"
ignore_errors = true

# ─────────────────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
# Корень репозитория в sys.path: тесты импортируют tools.content_validate,
# который живёт вне пакетов workspace.
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: требует поднятых контейнеров (testcontainers)",
    "e2e: сквозной сценарий через браузер",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["apps/api/src/dojo", "apps/cli/src/dojo_cli", "apps/runner/src/runner"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
