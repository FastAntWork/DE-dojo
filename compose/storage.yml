# Профиль storage — артефакты решений и сырьё вакансий.
#     docker compose --profile storage up -d    (или make up PROFILE=storage)
#
# MinIO хранит транскрипты интервью и присланные решения: класть их в Postgres
# значило бы раздувать бэкап состояния бинарными данными.
# MongoDB держит сырые вакансии со всеми версиями — заодно это учебный кейс
# для трека nosql, а не отдельная база «просто чтобы была».

services:
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: dojo-minio
    profiles: [storage]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      # 9000 занят нативным портом ClickHouse, поэтому API MinIO выведен на 9010.
      - "127.0.0.1:${MINIO_API_PORT:-9010}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-dojo}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-dojo_local_dev}
      MINIO_UPDATE: "off"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: ${MEM_MINIO:-512m}
    cpus: 1.0
    networks: [dojo]

  mongodb:
    image: mongo:7.0
    container_name: dojo-mongodb
    profiles: [storage]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-dojo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-dojo_local_dev}
      MONGO_INITDB_DATABASE: dojo
    volumes:
      - mongo-data:/data/db
    command:
      # WiredTiger по умолчанию забирает половину RAM хоста под кеш. В WSL с
      # десятью гигабайтами на весь стек это недопустимо.
      - --wiredTigerCacheSizeGB
      - "0.25"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: ${MEM_MONGO:-640m}
    cpus: 1.0
    networks: [dojo]

volumes:
  minio-data:
  mongo-data:

networks:
  dojo:
    name: dojo
    driver: bridge
