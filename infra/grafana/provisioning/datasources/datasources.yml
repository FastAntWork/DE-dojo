apiVersion: 1

# Источники данных заводятся кодом, а не руками в UI: иначе после
# `docker compose down -v` дашборды придётся настраивать заново.

datasources:
  - name: Prometheus
    type: prometheus
    uid: dojo-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # ClickHouse требует плагин grafana-clickhouse-datasource, который тянется
  # из интернета при первом старте (переменная GRAFANA_PLUGINS в .env).
  # Пока плагин не установлен, этот источник закомментирован — иначе Grafana
  # пишет ошибку провижининга на каждом запуске.
  #
  # - name: ClickHouse
  #   type: grafana-clickhouse-datasource
  #   uid: dojo-clickhouse
  #   access: proxy
  #   jsonData:
  #     host: clickhouse
  #     port: 9000
  #     protocol: native
  #     username: dojo
  #   secureJsonData:
  #     password: dojo_local_dev
  #   editable: false
