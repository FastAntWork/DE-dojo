[project]
name = "dojo-runner"
version = "0.0.0"
description = "Изолированный исполнитель пользовательского кода и стендов лаб"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    # Runner — единственный компонент, которому доступен docker.sock.
    # Внутрь пользовательского контейнера сокет не пробрасывается никогда.
    "docker>=7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runner"]
