[project]
name = "dojo"
version = "0.0.0"
description = "DE Dojo API — модульный монолит: content, scheduler, ai, analytics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # asyncpg напрямую, без ORM: SQL в этом проекте — предмет изучения,
    # прятать его за ORM означало бы спрятать половину учебного материала.
    "asyncpg>=0.29",
    "redis>=5.1",
    "structlog>=24.4",
    "orjson>=3.10",
    "PyYAML>=6.0",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dojo"]
