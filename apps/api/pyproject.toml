[project]
name = "dojo"
version = "0.0.0"
description = "DE Dojo API — модульный монолит: content, scheduler, ai, analytics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # asyncpg напрямую, без ORM: SQL в этом проекте — предмет изучения,
    # прятать его за ORM означало бы спрятать половину учебного материала.
    "asyncpg>=0.29",
    "redis>=5.1",
    "structlog>=24.4",
    "orjson>=3.10",
    "PyYAML>=6.0",
    "jsonschema>=4.23",
    # Шаблоны интерфейса и рендер теории. Оба чистые python-пакеты, никакого
    # Node и шага сборки — см. docs/adr/0005.
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    # Разбор данных формы: без него request.form() в FastAPI не работает.
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dojo"]
