<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DE Dojo{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  {# Всё локальное: ни одного обращения к внешнему хосту, приложение обязано
     работать без интернета. #}
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">DE <span>Dojo</span></a>
      <nav>
        <a href="/">Граф</a>
        <a href="/progress">Прогресс</a>
        <a href="/docs">API</a>
      </nav>
    </div>
  </header>

  {% block main %}
  <main>{% block content %}{% endblock %}</main>
  {% endblock %}
</body>
</html>
